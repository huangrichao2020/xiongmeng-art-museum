    if(this.pianoBuf||this._pianoLoading)return;
    this._pianoLoading=true;
    this.loadSample('./audio/piano.wav',b=>{if(b){this.pianoBuf=b;this.pianoReady=true;}}).finally(()=>{this._pianoLoading=false;});
  },
  loadHarp(){
    if(this.harpBuf||this._harpLoading)return;
    this._harpLoading=true;
    this.loadSample('./audio/harp.wav',b=>{if(b){this.harpBuf=b;this.harpReady=true;}}).finally(()=>{this._harpLoading=false;});
  },
  /* dur 是音符的真实时长（秒）。采样不能一律播满整段：
     乐句是 120BPM、八分音符 0.25 秒，如果每个音都响满 1.5 秒，
     稳态会压着三四个钢琴音叠着，音符之间一点缝都没有 ——
     听起来就是一串"叮咚"从头连到尾，比合成音还吵。
     现在按真实时值收尾（时值 + 一点余音），恢复真钢琴的句法。 */
  playPiano(midi,t,dur,vel=.13,pan=.08){
    if(!this.pianoReady||!this.pianoBuf||this.PIANO_MAP[midi]===undefined){
      this.playLead(midi,t,dur,vel*.5,pan);return;
    }
    const playDur=Math.min(this.PIANO_SEG,dur+Math.min(.30,dur*.9));
    this.playBufSample(this.pianoBuf,this.PIANO_MAP[midi],1,t,playDur,vel,pan);
  },
  /* 装饰颤音：主音与上方半音快速交替 —— 钟琴/八音盒的标志性手法，
     用在乐谱标了 trill 的音上，是"圣诞味"最直接的来源。
     每个颤音音只播 0.09 秒、间隔 0.062 秒，闪而不糊。 */
  playPianoTrill(midi,t,dur,vel=.11,pan=.08){
    const up=midi+1;
    if(!this.pianoReady||!this.pianoBuf||this.PIANO_MAP[midi]===undefined
       ||this.PIANO_MAP[up]===undefined){
      this.playPiano(midi,t,dur,vel,pan);return;
    }
    const step=.062,n=Math.max(2,Math.round(dur/step));
    for(let k=0;k<n;k++){
      const m=(k%2)?up:midi;
      this.playBufSample(this.pianoBuf,this.PIANO_MAP[m],1,t+k*step,.09,vel*(k%2?.60:1),pan);
    }
  },
  // 极轻柔圣诞雪橇铃（每八拍温柔点缀一次）
  /* 原来频率 3150/4180 Hz、每 4 拍一次、全曲不停 —— 3~4kHz 的金属高频
     在加色混合下穿透力极强，听着就是"有人一直在敲三角铁"，是 BGM 里最吵的一层。
     现在：频率降到 2350/3050 Hz，音量砍掉近一半，每 8 拍才响一次。 */
  playSleighBell(t,accent){
    const c=this.ctx;
    const freqs=accent?[2350,3050]:[2600];
    const amp=accent?.0042:.0022;
    for(const fr of freqs){
      const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(fr,t);
      const g=c.createGain();
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+.16);
      o.connect(g);g.connect(this.musicBus);
      o.start(t);o.stop(t+.18);
    }
  },
  /* ══ 合成圣诞乐器 BGM 调度器
     这套乐器（暖钢琴 + 原声贝斯 + 弦乐长音 + 竖琴琶音 + 雪橇铃 + 圣诞大厅混响）
     早就写好了，但之前只有 schedNote/playLead 这些"发声函数"，没有任何定时器去驱动它们，
     所以页面一直在播那三条 mp3。现在把它接上，做成真正的主 BGM：
     音色是合成出来的，音量、节奏、混响都能精确控制，不会像成品 mp3 那样又满又吵。 */
  synth:{timer:null,step:0,nextT:0,gain:.0,beatAcc:0,barIdx:0},
  STEP_DUR:.21,                        // 一个拍单位 = 0.21 秒（轻快治愈的休闲游戏节奏）
  startSynthBgm(){
    const c=this.ctx;
    if(!c||this.synth.timer)return;
    this.synth.step=0;this.synth.beatAcc=0;this.synth.barIdx=0;this.synth.nextT=c.currentTime+.18;
    this.synth.timer=setInterval(()=>{
      if(!this.on||!this.ctx){this.stopSynthBgm();return;}
      const now=this.ctx.currentTime;
      while(this.synth.nextT<now+.45){
        const row=this.SONG[this.synth.step];
        if(!row){this.synth.step=0;this.synth.beatAcc=0;this.synth.barIdx=0;continue;}
        this.playStep(this.synth.nextT,this.synth.step);
        this.synth.nextT+=Math.max(.12,row[1]*this.STEP_DUR);
        this.synth.step=(this.synth.step+1)%this.SONG.length;
        if(this.synth.step===0){this.synth.beatAcc=0;this.synth.barIdx=0;}
      }
    },60);
  },
  stopSynthBgm(){
    if(this.synth.timer){clearInterval(this.synth.timer);this.synth.timer=null;}
  },
  playStep(t,i){
    const row=this.SONG[i];
    if(!row)return;
    const midi=row[0],beats=row[1];
    const dur=Math.max(.12,beats*this.STEP_DUR);
    /* 主旋律：真实 Salamander 三角钢琴采样 */
    if(midi>0){
      this.playPiano(midi,t,dur,.14,.06);
    }
    const chord=this.CHORDS[this.synth.barIdx%this.CHORDS.length];
    /* 每小节第 0 拍：竖琴轻盈琶音 + 根音木贝斯 */
    if(this.synth.beatAcc===0){
      this.curChord=chord;
      this.playArp(chord,t);
      this.playBass(chord[0],t,.75);
    }else if(this.synth.beatAcc===4){
      /* 每小节第 4 拍（半小节）：轻点五音贝斯，形成动森/星露谷式的轻松蹦跳律动 */
      this.playBass(chord[0]+7,t,.55);
    }
    this.synth.beatAcc+=beats;
    if(this.synth.beatAcc>=8){
      this.synth.beatAcc-=8;
      this.synth.barIdx=(this.synth.barIdx+1)%this.CHORDS.length;
      if(this.synth.barIdx%2===0)this.playSleighBell(t,this.synth.barIdx%4===0);
    }
  },
  bgmTracks:null,
  initBgmTracks(){
    if(this.bgmTracks)return;
    const c=this.ctx;
    if(!c)return;
    /* 三条 mp3 已全部停用 —— 这就是那个"一直循环播放圣诞旋律、像弦乐、
       而且比主奏钢琴还抢耳"的东西：
         museum_piano.mp3  99 秒完整圣诞旋律，loop 播放
         park_wonderland.mp3 另一首循环曲（马戏/铜管风）
         rock_festival.mp3  失真摇滚，4k+ 高频贯穿整首，loop 接缝落差 78dB
       它们是"两条同时循环的完整旋律"，而且直连 master、不过合成乐器的
       音量控制（musicBus），所以存在感比主奏钢琴还强 —— 听起来就是一直很吵。
       现在主 BGM 完全由真实钢琴 + 真实竖琴采样承担，这三条只当远景垫，
       反而成了噪音源。音频文件还留在服务器上，想恢复把下面三行加回去即可。 */
    this.bgmTracks={v:{}};
  },
  updateBgmMix(dt){
    if(!this.on)return;
    const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
    const inMus=cx>-10.5&&cx<12.5&&cz>-12.0&&cz<8.5&&cy<9.5;
    /* 合成圣诞乐器 BGM 音量：馆内更饱满，户外收小当远景音乐。
       之前 mp3 垫底占掉了一部分听感份额，现在主 BGM 独自承担，略提一档。 */
    const tSyn=inMus?.52:.30;
    if(this.musicBus){
      this.synth.gain+=(tSyn-this.synth.gain)*Math.min(1,dt*1.5);
      this.musicBus.gain.value=this.synth.gain;
    }
  },
  pump(){},
  setRain(){},
  setHum(){},
  setOn(on){
    this.on=on;
    if(on){
      /* 顺序要紧：先 boot 出 AudioContext / master，再建 BGM 通道
         （createMediaElementSource 必须挂在已建好的 context 上） */
      this.boot();
      if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
      if(this.master&&this.ctx)this.master.gain.setTargetAtTime(.85,this.ctx.currentTime,.20);
      this.initBgmTracks();
      this.startSynthBgm();          // 合成圣诞乐器 BGM（主）
      this.loadPiano();               // 真实钢琴采样（异步预载，没好就先用合成音）
      this.loadHarp();                // 真实竖琴采样（同上）
    }else{
      if(this.master&&this.ctx)this.master.gain.setTargetAtTime(0,this.ctx.currentTime,.20);
      this.stopSynthBgm();

    }
  },
  blip(f,dur,vol){
    if(!this.ctx||!this.on)return;
    const c=this.ctx,t=c.currentTime,d=dur||.12,v=(vol||.085)*.55,freq=f||740;
    const o1=c.createOscillator();o1.type='sine';o1.frequency.setValueAtTime(freq,t);
    const g1=c.createGain();
    g1.gain.setValueAtTime(0,t);g1.gain.linearRampToValueAtTime(v,t+.012);g1.gain.exponentialRampToValueAtTime(.0001,t+d);
    o1.connect(g1);g1.connect(this.master);
    o1.start(t);o1.stop(t+d+.04);
  },
  carPass(){
    if(!this.ctx||!this.on||!this.noiseBuf)return;
    const c=this.ctx,t=c.currentTime,dir=Math.random()>.5?1:-1;
    const src=c.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.4;
    bp.frequency.setValueAtTime(340,t);bp.frequency.exponentialRampToValueAtTime(120,t+2.8);
    const g=c.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.032,t+.6);g.gain.exponentialRampToValueAtTime(.0004,t+3.1);
    src.connect(bp);bp.connect(g);
    const out=c.createStereoPanner?c.createStereoPanner():null;
    if(out){out.pan.setValueAtTime(-.85*dir,t);out.pan.linearRampToValueAtTime(.85*dir,t+3.1);g.connect(out);out.connect(this.master);}
    else g.connect(this.master);
    src.start(t);src.stop(t+3.2);
  },
  horn(){
    if(!this.ctx||!this.on)return;
    const c=this.ctx,t=c.currentTime;
    for(const f of [392,494]){
      const o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f,t);
      const g=c.createGain();
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.015);
      g.gain.setValueAtTime(.045,t+.12);g.gain.exponentialRampToValueAtTime(.0003,t+.24);
      o.connect(g);g.connect(this.master);
      o.start(t);o.stop(t+.26);
    }
  }
};

const PUFF_N=96;
const _puffMesh=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.082,0),M(0xf2f7fc,{roughness:.88}),PUFF_N);
_puffMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
_puffMesh.frustumCulled=false;_puffMesh.castShadow=false;_puffMesh.receiveShadow=false;
scene.add(_puffMesh);
const _pData=Array.from({length:PUFF_N},()=>({alive:false,life:0,max:1,x:0,y:-20,z:0,vx:0,vy:0,vz:0,sc:1}));
let _pCursor=0;
function spawnSnowPuff(x,y,z,vx,vy,vz,sc=.9,life=.62){
  const p=_pData[_pCursor];_pCursor=(_pCursor+1)%PUFF_N;
  p.alive=true;p.life=0;p.max=life;
  p.x=x;p.y=y;p.z=z;p.vx=vx;p.vy=vy;p.vz=vz;p.sc=sc;
}
function updateSnowPuffs(dt){
  const m=_rMat,s=_rScale;
  for(let i=0;i<PUFF_N;i++){
    const p=_pData[i];
    if(!p.alive){m.makeTranslation(0,-40,0);s.set(.001,.001,.001);m.scale(s);_puffMesh.setMatrixAt(i,m);continue;}
    p.life+=dt;
    if(p.life>=p.max){p.alive=false;m.makeTranslation(0,-40,0);s.set(.001,.001,.001);m.scale(s);_puffMesh.setMatrixAt(i,m);continue;}
    p.vy-=6.8*dt;p.vx*=.95;p.vz*=.95;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.y<.02){p.y=.02;p.vy*=-.28;p.vx*=.7;p.vz*=.7;}
    const k=1-p.life/p.max, sz=Math.max(.02,p.sc*k);
    m.makeTranslation(p.x,p.y,p.z);s.set(sz,sz,sz);m.scale(s);
    _puffMesh.setMatrixAt(i,m);
  }
  _puffMesh.instanceMatrix.needsUpdate=true;
}

function pickTag(){
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){
    let o=h.object;
    while(o){
      if(o.userData&&o.userData.tag)return o.userData.tag;
      o=o.parent;
    }
  }
  return null;
}
function pickPhys(){
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){
    let o=h.object;
    while(o){
      if(o.userData&&o.userData.physObj)return{phys:o.userData.physObj,pt:h.point};
      o=o.parent;
    }
  }
  return null;
}
function triggerPhys(hit){
  if(!hit||!hit.phys)return false;
  const {type,ref}=hit.phys;
  if(type==='npc'){
    ref.vy=3.8;ref.squash=-.24;ref.happyT=1.4;
    if(!ref.indoor){
      for(let k=0;k<6;k++){const a=k*1.05;spawnSnowPuff(ref.p.position.x,ref.baseY+.12,ref.p.position.z,Math.cos(a)*1.4,R(1.2,2.2),Math.sin(a)*1.4,1.0);}
    }
    sfx.blip(880,.13,.09);
    return true;
  }
  if(type==='animal'){
    ref.vy=3.5;ref.squash=-.26;ref.excited=2.2;
    const da=R(0,6.28);ref.vx+=Math.cos(da)*1.5;ref.vz+=Math.sin(da)*1.5;
    for(let k=0;k<5;k++){const a=k*1.25;spawnSnowPuff(ref.x,.1,ref.z,Math.cos(a)*1.3,R(1.1,2.0),Math.sin(a)*1.3,.85);}
    sfx.blip(1046,.11,.08);
    return true;
  }
  if(type==='car'){
    ref.heaveV=-.68;ref.pitchV+=1.2;ref.boostT=1.8;
    sfx.horn();
    return true;
  }
  if(type==='snowman'){
    ref.vrx+=(Math.random()>.5?1:-1)*R(1.8,3.2);ref.vrz+=(Math.random()>.5?1:-1)*R(1.8,3.2);ref.vby=2.4;
    const wp=new THREE.Vector3();ref.g.getWorldPosition(wp);
    for(let k=0;k<7;k++){const a=k*.9;spawnSnowPuff(wp.x,wp.y+.8,wp.z,Math.cos(a)*1.5,R(1.2,2.4),Math.sin(a)*1.5,1.05);}
    sfx.blip(660,.12,.07);
    return true;
  }
  if(type==='tree'){
    ref.vrx+=(Math.random()>.5?1:-1)*R(1.2,2.2);ref.vrz+=(Math.random()>.5?1:-1)*R(1.2,2.2);
    const wp=new THREE.Vector3();ref.g.getWorldPosition(wp);
    for(let k=0;k<10;k++){
      const a=R(0,6.28), rr=R(.3,1.2)*ref.sc;
      spawnSnowPuff(wp.x+Math.cos(a)*rr,wp.y+R(1.2,3.2)*ref.sc,wp.z+Math.sin(a)*rr,Math.cos(a)*.8,R(-.3,.9),Math.sin(a)*.8,.95,.9);
    }
    sfx.blip(587,.14,.065);
    return true;
  }
  if(type==='guestbook'){
    openGuestbook();
    sfx.blip(880,.1,.07);
    return true;
  }
  if(type==='giftbox'){
    openBlindBox(ref);
    return true;
  }
  if(type==='train'||type==='station'){
    toggleRideTrain(type==='station'?ref:null);
    return true;
  }
  if(type==='wheel'){
    toggleRideWheel(ref);
    return true;
  }
  if(type==='ride'){
    toggleRideFacility(ref);
    return true;
  }
  if(type==='launch'){
    startLaunchRide();
    return true;
  }
  return false;
}

function applyTime(h){

  const elev=Math.sin(((h-6)/12)*Math.PI);

  const az=((h-6)/12)*Math.PI;
  const dawn=h>=5.3&&h<8.5;
  const sunset=h>=16.3&&h<=19.2;
  if(day){
    const warm=1-Math.abs(elev)*.55;
    key.color.setHSL(sunset?.06:dawn?.04:(.09-warm*.04), (sunset||dawn)?.72:.45, (sunset||dawn)?.60:(.60+elev*.14));

    moon.intensity=0;
    ambient.color.setHex(sunset?0xb998a8:dawn?0xb8a4ba:0xb5cde3);ambient.intensity=(sunset||dawn)?.78:.88;
    hemi.color.setHex(sunset?0xe8a088:dawn?0xdfa8b0:0xafd0f0);

    scene.userData.baseFogD=slot.fogD;scene.userData.baseFogCol=slot.fog;
    skylineMats.forEach(m=>{m.emissiveIntensity=(sunset||dawn)?.35:.08;});
  }else{
    key.color.setHex(0xa8ccf0);key.intensity=.38;
    key.position.set(-Math.cos(az)*36,40,-18);
    moon.intensity=.24;moon.color.setHex(0x88b4e6);
    ambient.color.setHex(0x324864);ambient.intensity=.54;

  state.envDirty=true;
  updateBrand();
}

function introUpdate(dt){
  if(!intro.active)return;
  intro.t+=dt;
  const k=Math.min(1,intro.t/intro.dur);
  if(!fp.on){                       // 沉浸模式由第一人称接管镜头
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(intro.p0,HOME.pos,e);
    controls.target.lerpVectors(intro.t0,HOME.tgt,e);

const fp={on:false,locked:false,yaw:0,pitch:0,vx:0,vz:0,x:0,z:0,y:0,jumpY:0,jumpVy:0,stepCd:0,keys:{},wasAuto:false};
const FP_EYE=1.62;
const STAIR={x0:9.55,x1:11.9,zBot:5.05,zTop:-0.35,y0:0.5,y1:4.7};
const STAIR2={x0:9.85,x1:11.85,zBot:-4.9,zTop:0.3,y0:4.7,y1:8.95};
function stairY(z){
  const t=Math.max(0,Math.min(1,(STAIR.zBot-z)/(STAIR.zBot-STAIR.zTop)));
  return STAIR.y0+t*(STAIR.y1-STAIR.y0);
}
function stair2Y(z){
  const t=Math.max(0,Math.min(1,(z-STAIR2.zBot)/(STAIR2.zTop-STAIR2.zBot)));
  return STAIR2.y0+t*(STAIR2.y1-STAIR2.y0);
}
/* 挡路的展品（圆） */
const BLK1=[[-4.9,.4,1.5],[4.6,-.6,1.5],[-5.4,-10.15,1.45],[-2.7,-10.15,1.45],[0,-10.15,1.45],
  [-8.7,5.15,1.2],[-7.0,5.0,1.2],[-4.25,5.25,1.35],[6.2,-2.4,1.0],[9.4,-9.0,1.6],[2.8,-9.6,1.0],[10.55,-2.8,1.5],[7.8,-5.8,.85]];
const BLK2=[[-5.6,4.1,1.8],[-7.5,-6.2,.95],[-4.8,-6.4,.9],[-7.5,-2.2,.95],[-4.6,-2.0,.9],[-3.6,1.4,.9],[6.8,-6.4,.95],
  [-7.8,-10.5,1.2],[-5.95,-10.5,1.2],[-4.1,-10.5,1.2],[-2.25,-10.5,1.2],[5.4,-10.3,1.5],
  [2.4,-3.4,1.1],[4.9,-1.5,1.1],[1.5,2.4,1.2],[-.6,4.5,.85],[-1.0,-3.4,1.45],[4.2,4.8,.85]];
function hitBlock(x,z,list){
  for(let i=0;i<list.length;i++){
    const b=list[i],dx=x-b[0],dz=z-b[1];
    if(dx*dx+dz*dz<b[2]*b[2])return true;
  }
  return false;
}
/* 室外地面高度：人行道 / 停车场出口道 / 闭合环路 / 停车场 / 空地 */
function groundY(x,z){
  if(x>-16.0&&x<-11.2&&z>7.6&&z<11.9)return .02;  // 停车场驶出坡道
  if(z>8.2&&z<11.9&&Math.abs(x)<43.5)return .26;    // 前门人行道
  if(LOOP.distToCenter(x,z)<LOOP.halfW)return .02;  // 闭合环路沥青面
  if(x>-17.4&&x<-9.8&&z>-7.8&&z<8.2)return .02;     // 西侧停车场
  return 0;
}
/* 站在某点会落到哪个高度；ok=0 表示走不过去 */
function fpFloorAt(x,z,curY){
  const roof=curY>6.9;
  const up=curY>2.7&&curY<=6.9;
  // 1F <-> 2F 钢梯（大幅放宽下口迎坡漏斗与高度容差，上下极顺滑）
  if(x>STAIR.x0-.25&&x<STAIR.x1+.15&&z>=STAIR.zTop-.35&&z<=STAIR.zBot+.65&&curY<=5.8){
    const sy=stairY(z);
    if(Math.abs(curY-sy)<1.65)return{y:sy,stair:1};
    if(!up&&sy>1.15)return{ok:0};
  }
  // 2F <-> 屋顶露台钢梯
  if(x>STAIR2.x0-.12&&x<STAIR2.x1+.12&&z>STAIR2.zBot-.35&&z<STAIR2.zTop+.35&&curY>3.6){
    const sy2=stair2Y(z);
    if(Math.abs(curY-sy2)<1.55)return{y:sy2,stair:2};
    if(up&&sy2>STAIR2.y0+1.15)return{ok:0};
  }
  if(x>-9.35&&x<11.85&&z>-11.35&&z<7.35){
    if(roof){
      if(x>9.65&&x<11.95&&z>-5.25&&z<0.35)return{ok:0};     // 二楼到天台楼梯洞
      return{y:8.95};
    }
    if(up){
      if(x>9.40&&x<12.0&&z>-0.50&&z<5.20)return{ok:0};       // 一楼到二楼楼梯洞
      if(hitBlock(x,z,BLK2))return{ok:0};
      return{y:4.7};
    }
    if(hitBlock(x,z,BLK1))return{ok:0};
    return{y:.5};
  }
  if(Math.abs(x)<1.85&&z>=7.20&&z<=9.35)return{y:.5};        // 门洞完全敞开直入一楼大厅
  if(x>-9.7&&x<12.2&&z>-11.7&&z<7.8)return{ok:0};           // 玻璃幕墙走不穿
  if(x>-76&&x<76&&z>-42&&z<72){
    if(hitBlock(x,z,OUTDOOR_OBS))return{ok:0};
    // 碰碰车围栏矩形阻挡 (中心7,45 尺寸24x16；外围栏已拆除，游乐园四周彻底畅通无阻)
    if(x>-5.3&&x<19.3&&z>36.7&&z<53.3)return{ok:0};
    // 左侧圣诞教堂 (-49,36) 敞开大门中央红毯通道允许走进观礼，两侧墙与圣坛保留碰撞
    if(x>-50.0&&x<-48.0&&z>=26.0&&z<=39.8)return{y:.68};
    if(x>-55.2&&x<-42.8&&z>27.5&&z<44.5)return{ok:0};
    if(x>48.4&&x<62.6&&z>27.5&&z<44.0)return{ok:0};
    return{y:groundY(x,z)};       // 室外随便走（含外环小火车站台）
  }
  return{ok:0};
}

function fpExit(){

const _physV=new THREE.Vector3();
function inIceRink(x,z){
  const rk=amusement&&amusement.rink;
  if(!rk)return false;
  const nx=(x-rk.x)/rk.rx, nz=(z-rk.z)/rk.rz;
  return (nx*nx+nz*nz)<=1.02;
}
function fpUpdate(dt){
  const onIce=inIceRink(fp.x,fp.z);
  let sp=onIce
    ?((fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?9.2:5.8)
    :((fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?6.4:3.2);
  let f=0,s=0;
  if(fp.keys['KeyW']||fp.keys['ArrowUp'])f+=1;
  if(fp.keys['KeyS']||fp.keys['ArrowDown'])f-=1;
  if(fp.keys['KeyA']||fp.keys['ArrowLeft'])s-=1;
  if(fp.keys['KeyD']||fp.keys['ArrowRight'])s+=1;
  // 虚拟摇杆：上推前进、右推横移，力度越大越快
  if(joy.mag>0.02){
    f+=-joy.dy*1.15;s+=joy.dx*1.15;
    sp=onIce?(joy.mag>.78?9.0:5.8):(joy.mag>.78?6.4:3.4);
  }
  const fx=-Math.sin(fp.yaw),fz=-Math.cos(fp.yaw),rx=Math.cos(fp.yaw),rz=-Math.sin(fp.yaw);
  let dx=fx*f+rx*s,dz=fz*f+rz*s;
  const l=Math.hypot(dx,dz);
  if(l>0){dx/=l;dz/=l;}
  // 溜冰模式：超低冰面阻尼，松开按键后保持丝滑长距离惯性滑行；普通陆地保持高响应止动
  const acc=onIce?Math.min(1,dt*(l>0?3.4:0.75)):Math.min(1,dt*12);
  fp.vx+=(dx*sp*Math.min(1,l)-fp.vx)*acc;
  fp.vz+=(dz*sp*Math.min(1,l)-fp.vz)*acc;
  fpStep(fp.vx*dt,fp.vz*dt);
  // 步入/离开溜冰场 HUD 状态切换提示
  if(onIce!==!!fp._wasOnIce){
    fp._wasOnIce=onIce;
    if(onIce&&!trainSys.riding&&!wheelSys.riding&&!launchSys.active){
      trainHud.classList.add('show');
      trainMsgEl.textContent='⛸️ 已进入星夜溜冰场 · 溜冰模式开启（冰面惯性滑行 · 空格键 360° 花样旋转跳 · Shift 极速冲刺）';
      trainBtnEl.textContent='花样旋转跳 (Space)';
      trainBtnEl.onclick=()=>{if(fp.jumpY<=0.001){fp.jumpVy=5.8;fp.skateSpin=Math.PI*2;}};
    }else if(!onIce&&!trainSys.riding&&!wheelSys.riding&&!launchSys.active){
      trainHud.classList.remove('show');
    }
  }
  // 第一人称轻跳跃物理（冰面起跳触发 360° 阿克塞尔花样旋转跳！）
  if(fp.keys['Space']&&fp.jumpY<=0.001){
    fp.jumpVy=onIce?5.8:4.6;
    if(onIce)fp.skateSpin=Math.PI*2;
    sfx.blip(onIce?660:520,.08,.04);
  }
  if(fp.skateSpin>0){
    const dSpin=Math.min(fp.skateSpin,dt*9.5);
    fp.yaw+=dSpin;
    fp.skateSpin-=dSpin;
  }
  if(fp.jumpY>0||fp.jumpVy!==0){
    fp.jumpVy-=13.8*dt;fp.jumpY+=fp.jumpVy*dt;
    if(fp.jumpY<=0){
      if(fp.jumpVy<-1.5&&!inBuildingXZ(fp.x,fp.z)){
        for(let k=0;k<5;k++){const a=k*1.25;spawnSnowPuff(fp.x,fp.y+.06,fp.z,Math.cos(a)*1.2,R(.7,1.4),Math.sin(a)*1.2,.75);}
      }
      fp.jumpY=0;fp.jumpVy=0;
    }
  }
  const fpSpd=Math.hypot(fp.vx,fp.vz);
  if(fpSpd>1.2&&fp.jumpY<=0.01&&!inBuildingXZ(fp.x,fp.z)){
    fp.stepCd-=dt*fpSpd;
    if(fp.stepCd<=0){
      fp.stepCd=1.35;
      spawnSnowPuff(fp.x+R(-.16,.16),fp.y+.05,fp.z+R(-.16,.16),-fp.vx*.18,R(.5,.95),-fp.vz*.18,.68,.48);
    }
  }
  // 与不倒翁雪人 / 圣诞树近距离物理推挤反馈（兼容任意层级父节点）
  if(fp.y<1.2){
    for(const ps of physSnowmen){
      ps.g.getWorldPosition(_physV);
      const ddx=fp.x-_physV.x,ddz=fp.z-_physV.z,dd=Math.hypot(ddx,ddz);
      if(dd<1.15&&dd>0.01&&Math.abs(fp.y-_physV.y)<1.4){ps.vrx-=(ddz/dd)*2.4*dt*8;ps.vrz+=(ddx/dd)*2.4*dt*8;}
    }
    for(const pt of physTrees){
      pt.g.getWorldPosition(_physV);
      const ddx=fp.x-_physV.x,ddz=fp.z-_physV.z,dd=Math.hypot(ddx,ddz);
      if(dd<1.35*pt.sc&&dd>0.01&&Math.abs(fp.y-_physV.y)<1.6){pt.vrx-=(ddz/dd)*1.2*dt*8;pt.vrz+=(ddx/dd)*1.2*dt*8;}
    }
  }
  // 触屏双指推动的前后位移
  if(fp.touchFwd){
    const d=Math.max(-70,Math.min(70,fp.touchFwd))*.024;
    fp.touchFwd=0;
    const fx=-Math.sin(fp.yaw),fz=-Math.cos(fp.yaw);
    fpStep(fx*d,fz*d);
  }
  const headBob=(fpSpd>0.5&&fp.jumpY<=0.01)?Math.sin(t*fpSpd*2.3)*.032*Math.min(1,fpSpd/4):0;
  camera.position.set(fp.x,fp.y+FP_EYE+fp.jumpY+headBob,fp.z);
  camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
}
function fpStep(dx,dz){
  const nx=fp.x+dx,nz=fp.z+dz;
  let r=fpFloorAt(nx,nz,fp.y);
  if(r.ok!==0){fp.x=nx;fp.z=nz;fp.y=r.y;return;}
  r=fpFloorAt(nx,fp.z,fp.y);
  if(r.ok!==0){fp.x=nx;fp.vz*=.2;return;}
  r=fpFloorAt(fp.x,nz,fp.y);
  if(r.ok!==0){fp.z=nz;fp.vx*=.2;return;}
  // 若当前位置意外卡在障碍物内，允许迈出脱困
  if(fpFloorAt(fp.x,fp.z,fp.y).ok===0){fp.x=nx;fp.z=nz;return;}
  fp.vx*=.05;fp.vz*=.05;
}

/* ── 虚拟摇杆（左手移动）──
   统一只用 pointer 事件：触屏上浏览器本来就会派发 pointer 事件，
   再额外挂一套 touch 会让 touchmove 和 pointermove 轮流写同一个值，摇杆会自己抖回中间。 */
const joy={active:false,cx:0,cy:0,dx:0,dy:0,mag:0};
const joyEl=document.getElementById('joystick'),stickEl=document.getElementById('stick');
function joyApply(x,y){
  const R=joyEl.getBoundingClientRect().width/2-16;
  let dx=x-joy.cx,dy=y-joy.cy;
  const len=Math.hypot(dx,dy);
  if(len>R){dx=dx/len*R;dy=dy/len*R;}
  joy.dx=dx/R;joy.dy=dy/R;joy.mag=Math.min(1,len/R);
  stickEl.style.transform='translate('+dx+'px,'+dy+'px)';
}
function joyReset(){joy.active=false;joy.dx=joy.dy=joy.mag=0;stickEl.style.transform='translate(0,0)';}
joyEl.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=joyEl.getBoundingClientRect();
  joy.active=true;joy.cx=r.x+r.width/2;joy.cy=r.y+r.height/2;
  joyApply(e.clientX,e.clientY);
  // 指针已释放时 setPointerCapture 会抛，包一层别把手势打断
  try{joyEl.setPointerCapture&&joyEl.setPointerCapture(e.pointerId);}catch(err){}
});
joyEl.addEventListener('pointermove',e=>{
  if(!joy.active)return;
  e.preventDefault();
  joyApply(e.clientX,e.clientY);
});
joyEl.addEventListener('pointerup',joyReset);
joyEl.addEventListener('pointercancel',joyReset);
joyEl.addEventListener('pointerleave',joyReset);

/* 触屏手势：每根手指按 pointerId 单独记账
   —— 摇杆那根手指按在 #joystick 上，不进画面的手势表，
      所以「左手推摇杆走路 + 右手拖画面转头」可以同时进行。
   —— 画面上一根手指 = 纯转视角；两根手指 = 纵向推拉前进（此时不转视角）。
   鼠标另走 document 的 mousemove（按住左键拖），两边互不重复。 */
const lookPts=new Map();          // pointerId -> {x,y,resync}
let pinchBaseY=null, pinchBaseD=0;
/* 触屏沙盒自管轨道相机：yaw 方位 / pitch 俯仰 / rad 半径 */
const touchCam={yaw:0,pitch:0.55,rad:40};
function touchCamSync(){
  // 从当前相机位置反推出轨道参数（进入沙盒时对齐一次）
  const rx=camera.position.x-controls.target.x;
  const ry=camera.position.y-controls.target.y;
  const rz=camera.position.z-controls.target.z;
  touchCam.rad=Math.max(11,Math.hypot(rx,ry,rz));
  touchCam.yaw=Math.atan2(rx,rz);
  touchCam.pitch=Math.asin(Math.max(-1,Math.min(1,ry/touchCam.rad)));
}
function touchCamApply(){
  const cp=Math.cos(touchCam.pitch),sp=Math.sin(touchCam.pitch);
  camera.position.set(
    controls.target.x+Math.sin(touchCam.yaw)*cp*touchCam.rad,
    controls.target.y+sp*touchCam.rad,
    controls.target.z+Math.cos(touchCam.yaw)*cp*touchCam.rad);
  camera.lookAt(controls.target);
}
function lookMidY(){
  let sy=0,n=0;
  lookPts.forEach(p=>{sy+=p.y;n++;});
  return n?sy/n:null;
}
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;   // 鼠标交给 document 的 mousemove
  // 触屏沙盒：相机旋转由 fp.yaw/pitch 接管，挡住 OrbitControls 的 pointerdown，
  // 否则两者同时转 → 视角乱跳。缩放仍交给 controls。
  lookPts.set(e.pointerId,{x:e.clientX,y:e.clientY,resync:false});
  if(lookPts.size===2){pinchBaseY=lookMidY();
    const ps=Array.from(lookPts.values());
    pinchBaseD=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);}
  // 单指旋转由 fp.yaw/pitch 接管（OrbitControls 的单指旋转已在触屏端关闭，
  // 这里额外在捕获阶段挡一道，避免它仍收到 pointer 事件）
},{passive:true});
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse')return;
  const p=lookPts.get(e.pointerId);if(!p)return;
  if(p.resync){p.x=e.clientX;p.y=e.clientY;p.resync=false;return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(lookPts.size===1){
    fp.yaw-=dx*.0045;fp.pitch-=dy*.0045;
    fp.pitch=Math.max(-1.4,Math.min(1.4,fp.pitch));
    // 触屏沙盒：沉浸之外，单指拖动改为绕沙盘 target 转镜头
    if(!fp.on&&IS_TOUCH_DEV){
      touchCam.yaw-=dx*.0045;
      touchCam.pitch=Math.max(-0.35,Math.min(1.45,touchCam.pitch+dy*.005));
      touchCamApply();
    }
  }else if(lookPts.size===2){
    const my=lookMidY();
    if(pinchBaseY!==null&&my!==null){fp.touchFwd=(fp.touchFwd||0)+(pinchBaseY-my);pinchBaseY=my;}
    // 触屏沙盒：双指 pinch 缩放（OrbitControls 已关闭，这里自己算）
    if(IS_TOUCH_DEV&&!fp.on){
      const pts=Array.from(lookPts.values());
      if(pts.length===2){
        const dNow=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
        if(pinchBaseD>0){
          const k=pinchBaseD/Math.max(1,dNow);
          touchCam.rad=Math.max(11,Math.min(95,touchCam.rad*k));
          touchCamApply();
        }
        pinchBaseD=dNow;
      }
    }
  }
},{passive:true});
function lookEnd(e){
  if(!lookPts.has(e.pointerId))return;
  lookPts.delete(e.pointerId);
  if(lookPts.size<2)pinchBaseY=null;
  lookPts.forEach(p=>{p.resync=true;});   // 剩下的手指先同步坐标再继续，避免跳一下
}
renderer.domElement.addEventListener('pointerup',lookEnd);
renderer.domElement.addEventListener('pointercancel',lookEnd);

function keyToCode(e){
  if(e.code)return e.code;

  return k==='w'?'KeyW':k==='s'?'KeyS':k==='a'?'KeyA':k==='d'?'KeyD':'';
}

  if(code)fp.keys[code]=true;

});

/* ── 以玩家视角为核心：空气透视 + 光雾（Volumetric Light Haze） + 前中后景分明系统 ── */
const aerialHaze=(()=>{
  const grp=new THREE.Group();scene.add(grp);
  // 1. 前景随行轮廓暖光（仅在低空/第一人称靠近地面时柔和照亮玩家前方 18m，拉开前景与中后景对比度）
  const playerFill=new THREE.PointLight(0xffdfb0,.55,20,1.6);
  playerFill.position.set(0,2.4,0);
  scene.add(playerFill);
  const _fwd=new THREE.Vector3();

  // 2. 极柔和径向渐变薄雾贴图（低空空气透视薄雾层）
  const mistCanvas=document.createElement('canvas');mistCanvas.width=256;mistCanvas.height=256;
  const mx=mistCanvas.getContext('2d');
  const mg=mx.createRadialGradient(128,128,4,128,128,126);
  mg.addColorStop(0,'rgba(255,255,255,1)');
  mg.addColorStop(.38,'rgba(255,255,255,.45)');
  mg.addColorStop(.72,'rgba(255,255,255,.12)');
  mg.addColorStop(1,'rgba(255,255,255,0)');
  mx.fillStyle=mg;mx.fillRect(0,0,256,256);
  const mistTex=new THREE.CanvasTexture(mistCanvas);mistTex.colorSpace=THREE.SRGBColorSpace;

  // 布置 8 处《光遇》风格视觉中心体积光雾（AdditiveBlending 自发光柔光团，聚焦地标视觉中心，绝不产生灰霾）
  const mists=[];
  const mistRing=[
    [-41.8, 5.2,  1.4, 15, 0xffca68, .12], // 1. 西广场巨型圣诞树暖金光雾中心
    [-24.4, 3.2,  0.2, 12, 0x78c8ff, .08], // 2. 西侧许愿喷泉星光蓝光雾
    [-49.0, 9.2, 34.0, 22, 0xffbe64, .11], // 3. 哥特婚礼大教堂玫瑰窗神圣金光雾中心
    [  4.0, 4.5, 30.0, 17, 0xffc870, .11], // 4. 游乐园中心旋转木马暖金光雾中心
    [-18.0, 3.8, 38.6, 19, 0x6ac4ff, .09], // 5. 星夜皇家花样溜冰场光遇冰蓝光雾中心
    [ 27.0, 9.5, 36.0, 22, 0xffba66, .11], // 6. 摩天轮与高空跳伞塔暖琥珀光雾中心
    [ 26.5, 4.8, -2.0, 18, 0xffcf7a, .10], // 7. 东侧动漫雪园核心雕塑群暖金光雾
    [ 55.5, 7.5, 36.0, 20, 0xffaa58, .10]  // 8. 百老汇大剧院穹顶暖金光雾
  ];
  for(const [x,y,z,sz,col,baseOp] of mistRing){
    const mat=new THREE.SpriteMaterial({
      map:mistTex,color:col,transparent:true,opacity:baseOp,
      depthWrite:false,blending:THREE.AdditiveBlending,fog:false
    });
    const sp=new THREE.Sprite(mat);
    sp.position.set(x,y,z);
    sp.scale.set(sz*1.45,sz*.75,1);
    grp.add(sp);
    mists.push({sp,mat,x,y,z,baseOp,phase:x*.13+z*.07});
  }

  return{playerFill,_fwd,mists};
})();

/* ── 最外侧城市大道：InstancedMesh 极速车水马龙(28辆) + 人来人往(90人)，总共仅 7 次 Draw Call ── */
const outerCrowd=(()=>{
  const grp=new THREE.Group();scene.add(grp);
  const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _p=new THREE.Vector3(), _s=new THREE.Vector3();
  const _yAxis=new THREE.Vector3(0,1,0);

  // 1. 72 辆外侧大道双向巡航车辆（内外两圈外环大道共 4 条车道，仅占 4 次 Draw Call）
  const CAR_N=72;
  const bodyMesh=new THREE.InstancedMesh(BX(1.85,.72,3.9),M(0xffffff,{roughness:.42,metalness:.35}),CAR_N);
  const cabMesh=new THREE.InstancedMesh(BX(1.56,.52,2.05),M(0x1b2634,{roughness:.2,metalness:.5}),CAR_N);
  const headMesh=new THREE.InstancedMesh(BX(1.52,.18,.12),new THREE.MeshBasicMaterial({color:0xfff2cc}),CAR_N);
  const tailMesh=new THREE.InstancedMesh(BX(1.52,.16,.12),new THREE.MeshBasicMaterial({color:0xff3b30}),CAR_N);
  for(const im of [bodyMesh,cabMesh,headMesh,tailMesh]){
    im.castShadow=false;im.receiveShadow=false;im.frustumCulled=false;im.raycast=()=>{};grp.add(im);
  }
  const carCols=[0xd63838,0x2f6ba8,0xf2c94c,0xeef2f6,0x2c3540,0x2d8a68,0xd97724,0x7c3aed];
  const _c=new THREE.Color();
  const cars=[];
  // 4 条外环矩形车道采样：lane 0/1 为第一外环 (x=±80, z=-46/75)，lane 2/3 为第二外环 (x=±124, z=-84/114)
  function sampleOuterRoad(lane,u){
    const xM=lane===0?82:lane===1?78:lane===2?126:122;
    const zN=lane===0?-48:lane===1?-44:lane===2?-86:-82;
    const zS=lane===0?77:lane===1?73:lane===2?116:112;
    const w=xM*2, h=zS-zN, per=2*(w+h);
    let s=((u%1)+1)%1*per;
    const rev=(lane%2===1);
    if(rev)s=per-s;
    const dir=rev?-1:1;
    if(s<w)return{x:-xM+s,z:zN,yaw:dir>0?Math.PI/2:-Math.PI/2};
    s-=w;
    if(s<h)return{x:xM,z:zN+s,yaw:dir>0?0:Math.PI};
    s-=h;
    if(s<w)return{x:xM-s,z:zS,yaw:dir>0?-Math.PI/2:Math.PI/2};
    s-=w;
    return{x:-xM,z:zS-s,yaw:dir>0?Math.PI:0};
  }
  for(let i=0;i<CAR_N;i++){
    const lane=i%4, idx=Math.floor(i/4);
    const u=idx/(CAR_N/4)+(lane*.025);
    const spd=(lane<2?.023:.018)+((i%3)*.0018);
    _c.setHex(carCols[i%carCols.length]);
    bodyMesh.setColorAt(i,_c);
    cars.push({lane,u,spd});
  }
  if(bodyMesh.instanceColor)bodyMesh.instanceColor.needsUpdate=true;

  // 2. 240 位外侧全路网人行道小熊行人（仅占 3 次 Draw Call）
  const PED_N=240;
  const pBody=new THREE.InstancedMesh(new THREE.CylinderGeometry(.17,.22,.68,8),M(0xffffff,{roughness:.78}),PED_N);
  const pHead=new THREE.InstancedMesh(new THREE.SphereGeometry(.19,8,6),M(0xe8cba0,{roughness:.8}),PED_N);
  const pEarGeo=(()=>{
    const g1=new THREE.SphereGeometry(.07,6,5);g1.translate(-.14,.15,0);
    const g2=new THREE.SphereGeometry(.07,6,5);g2.translate(.14,.15,0);
    return mergeGeos([g1,g2]);
  })();
  const pEars=new THREE.InstancedMesh(pEarGeo,M(0xdca86c,{roughness:.82}),PED_N);
  for(const im of [pBody,pHead,pEars]){
    im.castShadow=false;im.receiveShadow=false;im.frustumCulled=false;im.raycast=()=>{};grp.add(im);
  }
  const pedCols=[0xd23b32,0x2f8f6b,0x3f6ba8,0xe8c24a,0x8f3a68,0xc99456,0xd07a9a,0x4a7068];
  const peds=[];
  const walks=[
    {ax:'x',fix:-51.2,min:-176,max:176},{ax:'x',fix:-40.8,min:-176,max:176},
    {ax:'x',fix:80.2,min:-176,max:176},{ax:'x',fix:69.8,min:-176,max:176},
    {ax:'x',fix:-89.2,min:-176,max:176},{ax:'x',fix:-78.8,min:-176,max:176},
    {ax:'x',fix:-129.2,min:-176,max:176},{ax:'x',fix:119.2,min:-176,max:176},
    {ax:'z',fix:-85.2,min:-176,max:176},{ax:'z',fix:-74.8,min:-176,max:176},
    {ax:'z',fix:85.2,min:-176,max:176},{ax:'z',fix:74.8,min:-176,max:176},
    {ax:'z',fix:-129.0,min:-176,max:176},{ax:'z',fix:129.0,min:-176,max:176}
  ];
  for(let i=0;i<PED_N;i++){
    const w=walks[i%walks.length];
    const t0=((i*0.6180339887)%1);
    const dir=(i%2===0)?1:-1;
    const spd=1.4+(i%5)*.22;
    _c.setHex(pedCols[i%pedCols.length]);
    pBody.setColorAt(i,_c);
    peds.push({w,pos:w.min+(w.max-w.min)*t0,dir,spd,phase:i*1.3});
  }
  if(pBody.instanceColor)pBody.instanceColor.needsUpdate=true;

  return{CAR_N,bodyMesh,cabMesh,headMesh,tailMesh,cars,sampleOuterRoad,PED_N,pBody,pHead,pEars,peds,_m,_q,_p,_s,_yAxis};
})();

function updateOuterCrowd(dt,t){
  const oc=outerCrowd, {_m,_q,_p,_s,_yAxis}=oc;
  // 更新 28 辆外侧大道车流
  for(let i=0;i<oc.CAR_N;i++){
    const c=oc.cars[i];
    c.u=(c.u+c.spd*dt)%1;
    const pt=oc.sampleOuterRoad(c.lane,c.u);
    _q.setFromAxisAngle(_yAxis,pt.yaw);
    const sinY=Math.sin(pt.yaw), cosY=Math.cos(pt.yaw);
    _p.set(pt.x,.42,pt.z);_s.set(1,1,1);_m.compose(_p,_q,_s);oc.bodyMesh.setMatrixAt(i,_m);
    _p.set(pt.x-sinY*.15,.98,pt.z-cosY*.15);_m.compose(_p,_q,_s);oc.cabMesh.setMatrixAt(i,_m);
    _p.set(pt.x+sinY*1.96,.44,pt.z+cosY*1.96);_m.compose(_p,_q,_s);oc.headMesh.setMatrixAt(i,_m);
    _p.set(pt.x-sinY*1.96,.46,pt.z-cosY*1.96);_m.compose(_p,_q,_s);oc.tailMesh.setMatrixAt(i,_m);
  }
  oc.bodyMesh.instanceMatrix.needsUpdate=true;
  oc.cabMesh.instanceMatrix.needsUpdate=true;
  oc.headMesh.instanceMatrix.needsUpdate=true;
  oc.tailMesh.instanceMatrix.needsUpdate=true;

  // 更新 90 位外侧人行道小熊行人
  for(let i=0;i<oc.PED_N;i++){
    const p=oc.peds[i], w=p.w;
    p.pos+=p.dir*p.spd*dt;
    if(p.pos>w.max){p.pos=w.max;p.dir=-1;}
    else if(p.pos<w.min){p.pos=w.min;p.dir=1;}
    const x=w.ax==='x'?p.pos:w.fix, z=w.ax==='z'?p.pos:w.fix;
    const yaw=w.ax==='x'?(p.dir>0?Math.PI/2:-Math.PI/2):(p.dir>0?0:Math.PI);
    const bounce=Math.abs(Math.sin(t*6.5+p.phase))*.06;
    _q.setFromAxisAngle(_yAxis,yaw);_s.set(1,1,1);
    _p.set(x,.47+bounce,z);_m.compose(_p,_q,_s);oc.pBody.setMatrixAt(i,_m);
    _p.set(x,.96+bounce,z);_m.compose(_p,_q,_s);oc.pHead.setMatrixAt(i,_m);
    _p.set(x,.96+bounce,z);_m.compose(_p,_q,_s);oc.pEars.setMatrixAt(i,_m);
  }
  oc.pBody.instanceMatrix.needsUpdate=true;
  oc.pHead.instanceMatrix.needsUpdate=true;
  oc.pEars.instanceMatrix.needsUpdate=true;
}

function updateAerialHaze(dt,t){
  const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
  // A. UE5 级前中后景空气透视纵深：平地漫步时远雾更有空间层次(0.0036)，乘坐云霄飞车高空俯瞰时自动适度减薄保持通透明亮
  const baseD=scene.userData.baseFogD!==undefined?scene.userData.baseFogD:0.0036;
  const onCoaster=!!(wheelSys.riding&&wheelSys.kind==='coaster');
  const heightFactor=THREE.MathUtils.clamp(1.0-(cy-6.0)/38.0, 0.48, 0.96)*(onCoaster?0.72:1.0);
  scene.fog.density=baseD*heightFactor;

  // B. 玩家前景随行轮廓暖光：在低空/乘坐过山车时紧贴前方 4.2m 柔和照亮前景
  camera.getWorldDirection(aerialHaze._fwd);
  aerialHaze.playerFill.position.set(cx+aerialHaze._fwd.x*4.2, Math.max(1.8,cy+.3), cz+aerialHaze._fwd.z*4.2);
  const nearGround=THREE.MathUtils.clamp(1.0-(cy-4.0)/16.0, 0.35, 1);
  aerialHaze.playerFill.intensity=0.52*nearGround;

  // C. 《光遇》风格视觉中心体积光雾：前景 (<14m) 完全退散保持极致清晰，中远景在地标中心绽放柔和呼吸光晕
  const mistHeightAtten=THREE.MathUtils.clamp(1.10-(cy-6.0)/48.0, .42, 1.0);
  for(const m of aerialHaze.mists){
    const d=Math.hypot(m.x-cx, m.z-cz);
    const fgClear=THREE.MathUtils.smoothstep(d,12,28);
    const farFade=1.0-THREE.MathUtils.smoothstep(d,135,220);
    const pulse=0.92+0.08*Math.sin(t*1.1+m.phase);
    m.sp.position.y=m.y+Math.sin(t*.45+m.phase)*.22;
    m.mat.opacity=m.baseOp*fgClear*farFade*mistHeightAtten*pulse;
    m.sp.visible=m.mat.opacity>.004;
  }
}

function animate(){
  requestAnimationFrame(animate);
  renderer.info.reset();
  const dt=Math.min(clock.getDelta(),.05);
  t+=dt;

  /* 环城车流物理模拟（安全跟车制动 / 行人礼让鸣笛 / 过弯离心侧倾 / 刹车点头悬架 / 车轮滚转与轮胎扬雪） */
  for(const tr of traffic){
    if(tr.honkCd>0)tr.honkCd-=dt;
    if(tr.boostT>0)tr.boostT-=dt;
    if(tr.puffCd>0)tr.puffCd-=dt;
    let tgtSpd=tr.baseSpeed*(tr.boostT>0?1.36:1.0);
    // 1. 同向车道安全跟车距离控制
    for(const o of traffic){
      if(o===tr||o.dir!==tr.dir||Math.abs(o.laneOff-tr.laneOff)>1.35)continue;
      const ds=((o.s-tr.s)*tr.dir+LOOP.totalLen)%LOOP.totalLen;
      if(ds>.1&&ds<11.5){
        tgtSpd=Math.min(tgtSpd,Math.max(0,(ds-5.6)/5.9)*tr.baseSpeed);
      }
    }
    const cyaw=tr.c.rotation.y, fwdX=Math.sin(cyaw), fwdZ=Math.cos(cyaw);
    // 2. 第一人称玩家横穿马路时急刹礼让 + 双音鸣笛
    if(fp.on&&fp.y<.75){
      const fx=fp.x-tr.c.position.x, fz=fp.z-tr.c.position.z;
      const ahead=fx*fwdX+fz*fwdZ, lat=Math.abs(fx*fwdZ-fz*fwdX);
      if(ahead>-1.0&&ahead<9.8&&lat<2.3){
        tgtSpd=Math.min(tgtSpd,Math.max(0,(ahead-3.6)*.85));
        if(ahead>1.0&&ahead<7.5&&tr.honkCd<=0&&tr.curSpd>1.6){sfx.horn();tr.honkCd=4.2;}
      }
    }
    // 3. 室外萌宠 / 小熊靠近路面时减速避让
    for(const a of liveAnimals){
      const ax=a.x-tr.c.position.x, az=a.z-tr.c.position.z;
      const ahead=ax*fwdX+az*fwdZ, lat=Math.abs(ax*fwdZ-az*fwdX);
      if(ahead>.4&&ahead<5.5&&lat<1.9)tgtSpd=Math.min(tgtSpd,1.4);
    }
    const dv=tgtSpd-tr.curSpd;
    const maxRate=dv>=0?5.2:14.5;
    tr.accel=Math.max(-maxRate,Math.min(maxRate,dv/Math.max(.005,dt)));
    tr.curSpd=Math.max(0,tr.curSpd+tr.accel*dt);

    tr.s=(tr.s+tr.curSpd*dt*tr.dir+LOOP.totalLen)%LOOP.totalLen;
    const p=LOOP.sample(tr.s,tr.laneOff);
    tr.c.position.set(p.x,0,p.z);
    const newYaw=Math.atan2(p.tx*tr.dir,p.tz*tr.dir);
    let dyaw=newYaw-tr.yawPrev;
    while(dyaw>Math.PI)dyaw-=Math.PI*2;
    while(dyaw<-Math.PI)dyaw+=Math.PI*2;
    tr.yawPrev=newYaw;
    const omega=dyaw/Math.max(.005,dt);
    tr.c.rotation.y=newYaw;

    // 悬架弹簧动力学：制动点头 + 加速仰头 + 过弯离心侧倾 + 路面起伏
    const pitchTgt=Math.max(-.046,Math.min(.046,-tr.accel*.0038));
    const rollTgt=Math.max(-.065,Math.min(.065,omega*tr.curSpd*.014));
    const roadBump=Math.sin(tr.s*.55)*.005*Math.min(1,tr.curSpd/5.5);
    tr.pitchV+=(pitchTgt-tr.pitch)*92*dt-tr.pitchV*11*dt;tr.pitch+=tr.pitchV*dt;
    tr.rollV+=(rollTgt-tr.roll)*88*dt-tr.rollV*10*dt;tr.roll+=tr.rollV*dt;
    tr.heaveV+=(roadBump-tr.heave)*125*dt-tr.heaveV*12*dt;tr.heave+=tr.heaveV*dt;
    if(tr.c.userData.chassis){
      const ch=tr.c.userData.chassis;
      ch.position.y=tr.heave;ch.rotation.x=tr.pitch;ch.rotation.z=tr.roll;
    }
    // 车轮随实测线速度真实转动 + 前轮随转向角真实偏转 + 刹车尾灯增亮
    tr.wheelAng+=(tr.curSpd*dt)/.33;
    if(tr.c.userData.wheels){
      for(const w of tr.c.userData.wheels)w.rotation.x=tr.wheelAng;
    }
    if(tr.c.userData.steerPivots){
      const steer=Math.max(-.32,Math.min(.32,omega*.34));
      for(const sp of tr.c.userData.steerPivots)sp.rotation.y+=(steer-sp.rotation.y)*Math.min(1,dt*12);
    }
    const wantBrake=(tr.accel<-1.6||tr.curSpd<.4)?1:0;
    tr.brakeAmt+=(wantBrake-tr.brakeAmt)*Math.min(1,dt*10);
    if(tr.c.userData.tlMat)tr.c.userData.tlMat.color.setHex(tr.brakeAmt>.25?0xff5c3d:0xd62418);
    tr.tl.scale.setScalar(1+tr.brakeAmt*.75);
    tr.tl.material.opacity=.40+tr.brakeAmt*.48;
    tr.pool.material.opacity=.24+Math.sin(t*3+tr.s)*.05;
    // 后轮甩雪花效果（高速或过弯更明显）
    if(tr.curSpd>4.5&&tr.puffCd<=0){
      tr.puffCd=.095/Math.max(1,tr.curSpd/7.5);
      for(const s of [-.75,.75]){
        const rx=p.x-fwdX*1.35+fwdZ*s, rz=p.z-fwdZ*1.35-fwdX*s;
        spawnSnowPuff(rx,.08,rz,-fwdX*1.6+R(-.4,.4),R(.55,1.25),-fwdZ*1.6+R(-.4,.4),.75,.45);
      }
    }
  }

  /* 双层圣诞飘雪 */
  if(snow&&snow.visible){
    const p=snow.geometry.attributes.position.array;
    for(let i=0;i<p.length/3;i++){
      p[i*3+1]-=snowSpd[i]*dt;
      p[i*3]+=Math.sin(t*.7+i)*.48*dt+dt*.32;
      if(p[i*3+1]<1.6||insideBuilding(p[i*3],p[i*3+2],p[i*3+1])){
        let dx,dz;
        do{dx=Math.random()*130-65;dz=Math.random()*80-40;}while(inBuildingXZ(dx,dz));
        p[i*3]=dx;p[i*3+1]=32+Math.random()*5;p[i*3+2]=dz;
      }
    }
    snow.geometry.attributes.position.needsUpdate=true;
  }
  if(snowFar&&snowFar.visible){
    const p=snowFar.geometry.attributes.position.array;
    for(let i=0;i<p.length/3;i++){
      p[i*3+1]-=snowFarSpd[i]*dt;
      p[i*3]+=Math.cos(t*.5+i)*.32*dt+dt*.22;
      if(p[i*3+1]<1.6||insideBuilding(p[i*3],p[i*3+2],p[i*3+1])){
        let dx,dz;
        do{dx=Math.random()*140-70;dz=Math.random()*90-45;}while(inBuildingXZ(dx,dz));
        p[i*3]=dx;p[i*3+1]=34+Math.random()*5;p[i*3+2]=dz;
      }
    }
    snowFar.geometry.attributes.position.needsUpdate=true;
  }
  /* 持续绚丽流星雨（夜幕 / 晓暮均流畅绽放） */
  starMat.uniforms.uTime.value=t;
  const nightNow=Math.sin(((state.hour-6)/12)*Math.PI)<=0.03;
  const twilight=!nightNow&&(state.hour>=16.8||state.hour<=7.2);
  const starOn=(nightNow||twilight)&&state.stars;
  if(starOn)updateMeteors(dt);
  starMat.uniforms.uOpacity.value=nightNow?.88:.42;
  if(meteors.length){const _mop=nightNow?1.0:.62;for(let i=0;i<meteors.length;i++){const _mm=meteors[i];_mm.u.uOpacity.value=_mop;_mm.pts.visible=starOn&&_mm.state!==0;}}
  stars.visible=starOn;

  /* 空中巡游圣诞老人驯鹿雪橇 + 魔法星尘拖尾 */
  {
    const a=t*.16;
    const nx=Math.cos(a)*29, nz=Math.sin(a)*16-2, ny=16.5+Math.sin(t*.85)*1.15;
    const vx=-Math.sin(a)*29, vz=Math.cos(a)*16;
    flyingSleigh.position.set(nx,ny,nz);
    flyingSleigh.rotation.y=Math.atan2(vx,vz);
    flyingSleigh.rotation.z=-Math.sin(a*2)*.10;
    for(const fr of flyReindeers){
      const gp=Math.sin(t*7.5+fr.phase)*.58;
      fr.deer.userData.legs[0].rotation.x=gp;
      fr.deer.userData.legs[1].rotation.x=gp*.85;
      fr.deer.userData.legs[2].rotation.x=-gp;
      fr.deer.userData.legs[3].rotation.x=-gp*.85;
    }
    if(sleighDustMesh){
      const m=_rMat,sc=_rScale;
      for(let i=0;i<sleighDustN;i++){
        const d=sleighDust[i];
        d.life+=dt*.55;
        if(d.life>=1){
          d.life=0;
          d.x=nx-vx*.06+R(-.9,.9);d.y=ny+R(-.3,.6);d.z=nz-vz*.06+R(-.9,.9);
        }
        d.y+=d.vy*dt;
        const s=Math.max(0.01,(1-d.life)*1.4);
        m.makeTranslation(d.x,d.y,d.z);sc.set(s,s,s);m.scale(sc);
        sleighDustMesh.setMatrixAt(i,m);
      }
      sleighDustMesh.instanceMatrix.needsUpdate=true;
    }
  }
  /* 共享圣诞彩灯材质池高速律动 + 树顶金星自转 */
  {
    const lOn=state.lights?1.0:0.12;
    const glowScale=(nightNow?1.0:(state.timeKey==='dusk'||state.timeKey==='dawn'?.78:.44))*lOn;
    for(let i=0;i<xmasBulbPool.length;i++){
      const p=xmasBulbPool[i];
      const pulse=(.64+.36*Math.sin(t*3.2+p.phase))*glowScale;
      p.mat.color.copy(p.base).multiplyScalar(pulse);
    }
    for(let i=0;i<xmasStars.length;i++){
      xmasStars[i].rotation.y=t*.9+i;
    }
  }

  /* 西侧花坛动态喷泉水珠 + 水波纹 + 夜间圣诞金星流萤 */
  if(fountainDrops){
    const m=_rMat,sc=_rScale;
    for(let i=0;i<fountainDropData.length;i++){
      const d=fountainDropData[i];
      d.p+=dt*d.spd;if(d.p>1)d.p-=1;
      const u=d.p, r=d.r0+(d.r1-d.r0)*u;
      const y=d.y0+(d.y1-d.y0)*u+Math.sin(u*Math.PI)*d.h;
      const sz=.75+.55*Math.sin(u*Math.PI);
      m.makeTranslation(-24.4+Math.cos(d.ang)*r,y,0.2+Math.sin(d.ang)*r);
      sc.set(sz,sz,sz);m.scale(sc);
      fountainDrops.setMatrixAt(i,m);
    }
    fountainDrops.instanceMatrix.needsUpdate=true;
  }
  for(const fr of fountainRings){
    fr.userData.phase=(fr.userData.phase+dt*.55)%1;
    const u=fr.userData.phase;
    fr.scale.setScalar(1+u*4.2);
    fr.material.opacity=(1-u)*.55;
  }
  if(fireflyMat){
    fireflyMat.uniforms.uTime.value=t;
    const dusk=(state.hour>=16.8||state.hour<=7.2);
    fireflyMat.uniforms.uOpacity.value=dusk?1:0;
  }

  /* 雪地狐狸、名犬与小花猫物理转向引擎（个体分离防重叠、躲避行人车辆、弹性跳跃、脚步踩雪溅尘） */
  for(let i=0;i<liveAnimals.length;i++){
    const a=liveAnimals[i], u=a.m.userData;
    if(a.excited>0)a.excited-=dt;
    if(a.puffCd>0)a.puffCd-=dt;
    let gx=a.cx, gz=a.cz;
    if(a.roam){
      const ang=t*a.spd+a.ph;
      gx=a.cx+Math.cos(ang)*a.rx; gz=a.cz+Math.sin(ang)*a.rz;
    }
    let fx=(gx-a.x)*5.2, fz=(gz-a.z)*5.2;
    // 同伴软排斥力：避免彼此穿模
    for(let j=0;j<liveAnimals.length;j++){
      if(i===j)continue;
      const o=liveAnimals[j], dx=a.x-o.x, dz=a.z-o.z, d=Math.hypot(dx,dz);
      if(d<.92&&d>.001){const push=(.92-d)/.92*8.5;fx+=dx/d*push;fz+=dz/d*push;}
    }
    // 第一人称走近时好奇回头 / 近身轻跳让行
    let nearPlayer=false;
    if(fp.on&&fp.y<.9){
      const px=a.x-fp.x, pz=a.z-fp.z, pd=Math.hypot(px,pz);
      if(pd<4.5)nearPlayer=true;
      if(pd<1.38&&pd>.001){
        const push=(1.38-pd)*12.0;fx+=px/pd*push;fz+=pz/pd*push;
        if(a.jumpY<=.01){a.vy=2.55;a.squash=-.20;a.excited=1.5;}
      }
    }
    a.vx+=(fx-a.vx*4.2)*dt; a.vz+=(fz-a.vz*4.2)*dt;
    const sp=Math.hypot(a.vx,a.vz);
    if(sp>3.6){a.vx=a.vx/sp*3.6;a.vz=a.vz/sp*3.6;}
    a.x+=a.vx*dt; a.z+=a.vz*dt;

    // 跳跃重力与落地软萌回弹形变
    if(a.jumpY>0||a.vy!==0){
      a.vy-=13.5*dt;a.jumpY+=a.vy*dt;
      if(a.jumpY<=0){
        if(a.vy<-1.0){
          a.squash=.24;
          spawnSnowPuff(a.x,.06,a.z,R(-.6,.6),.75,R(-.6,.6),.78,.42);
        }
        a.jumpY=0;a.vy=0;
      }
    }
    a.squashV+=(0-a.squash)*115*dt-a.squashV*10*dt;a.squash+=a.squashV*dt;
    const sy=a.baseSc*(1-a.squash), sxz=a.baseSc*(1+a.squash*.52);
    a.m.scale.set(sxz,sy,sxz);

    if(sp>.18){
      const wantYaw=Math.atan2(a.vx,a.vz);
      let dy=wantYaw-a.rotY;
      while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
      a.rotY+=dy*Math.min(1,dt*8.5);
      a.stepPh+=sp*dt*5.8;
      if(a.jumpY<=.02&&sp>1.1&&a.puffCd<=0){
        a.puffCd=.24;
        spawnSnowPuff(a.x+R(-.12,.12),.04,a.z+R(-.12,.12),-a.vx*.22,R(.45,.85),-a.vz*.22,.52,.38);
      }
    }else if(!a.roam){
      const wantYaw=nearPlayer?Math.atan2(fp.x-a.x,fp.z-a.z):a.ry;
      let dy=wantYaw-a.rotY;
      while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
      a.rotY+=dy*Math.min(1,dt*3.5);
    }
    const gaitMag=Math.min(.42,sp*.26);
    const sw=Math.sin(a.stepPh)*gaitMag;
    const bob=a.roam?Math.abs(Math.sin(a.stepPh))*Math.min(.032,sp*.018):Math.abs(Math.sin(t*2.4+a.ph))*.016;
    a.m.position.set(a.x,bob+a.jumpY,a.z);
    a.m.rotation.y=a.rotY;
    u.legs[0].rotation.x=sw; u.legs[1].rotation.x=-sw;
    u.legs[2].rotation.x=-sw*.85; u.legs[3].rotation.x=sw*.85;
    const wagBoost=a.excited>0?2.1:(nearPlayer?1.5:1.0);
    u.tailG.rotation.y=Math.sin(t*7.8*wagBoost+a.ph)*(a.roam?.34:.42);
    u.headG.rotation.y=Math.sin(t*1.6+a.ph)*.18;
    u.headG.rotation.z=Math.sin(t*1.3+a.ph)*(a.excited>0?.16:.07);
  }

  /* 全地图不倒翁雪人 / 弹性风吹圣诞树 / 室内悬吊装饰物理弹簧模拟 */
  for(const ps of physSnowmen){
    if(ps.baseY===undefined)ps.baseY=ps.g.position.y;
    ps.vrx+=(-ps.rx*74-ps.vrx*5.2)*dt;ps.rx+=ps.vrx*dt;
    ps.vrz+=(-ps.rz*74-ps.vrz*5.2)*dt;ps.rz+=ps.vrz*dt;
    if(ps.by>0||ps.vby!==0){
      ps.vby-=14*dt;ps.by+=ps.vby*dt;
      if(ps.by<=0){ps.by=0;ps.vby=-ps.vby*.32;if(Math.abs(ps.vby)<.15)ps.vby=0;}
    }
    ps.g.rotation.x=ps.rx;ps.g.rotation.z=ps.rz;
    ps.g.position.y=ps.baseY+ps.by*ps.sc*.22;
  }
  for(const pt of physTrees){
    const gust=Math.sin(t*.9+pt.ph)*.012+Math.sin(t*2.1+pt.ph*1.7)*.005;
    pt.vrx+=(gust-pt.rx)*52*dt-pt.vrx*4.8*dt;pt.rx+=pt.vrx*dt;
    pt.vrz+=(-gust*.7-pt.rz)*52*dt-pt.vrz*4.8*dt;pt.rz+=pt.vrz*dt;
    pt.g.rotation.x=pt.rx;pt.g.rotation.z=pt.rz;
  }
  updateSnowPuffs(dt);
  updateSaltlinePhysics(dt);

  /* 远方驶过车辆环境音效调度 */
  // 已移除随机 carPass 白噪音扫频，避免干扰背景音乐
  /* 云漂移 */
  clouds.forEach((c,i)=>{c.position.x+=dt*(.35+i*.08);if(c.position.x>130)c.position.x=-130;});

  /* 店内灯 / 圣诞灯 / 路灯（默认全开） */
  const night=Math.sin(((state.hour-6)/12)*Math.PI)<=0.03;
  const lampK=state.lights?(night?1:.32):0;
  shopLights.forEach(s=>{
    let k=s.street?(state.lights?(night?1:.18):0):lampK;
    if(intro.active&&!s.street)k*=Math.max(0,Math.min(1,(intro.t-s.delay)/.9));
    s.l.intensity=s.base*k;
  });
  signMat.emissiveIntensity=(state.lights?(night?1.55:.42):.08)*(intro.active?Math.max(0,Math.min(1,(intro.t-1.9)/1.2)):1);
  winGlow.material.opacity=state.lights?(night?.07:.02):0;

  /* 展品微动：悬挂雕塑轻摆 + 云朵浮动 */
  rigs.forEach((r,i)=>{
    r.mob.rotation.y=Math.sin(t*.32+i*1.7)*.55;
    r.mob.rotation.z=Math.sin(t*.26+i)*.14;
    r.hang.rotation.z=Math.sin(t*.21+i*2.1)*.05;
  });
  cloudArt.position.y=D.f1top+2.15+Math.sin(t*.6)*.09;
  cloudArt.rotation.y=t*.12;
  if(cloudArt.userData.core)cloudArt.userData.core.material.opacity=.32+.22*Math.sin(t*1.6);
  if(_shopFan)_shopFan.rotation.y+=dt*7;
  // 绿植轻摆
  plants.forEach(p=>{p.leaf.rotation.z=Math.sin(t*.7+p.ph)*.05;});
  // 店内吊灯摇曳
  lampShades.forEach((s,i)=>{s.rotation.z=Math.sin(t*.6+i)*.035;});
  // 一楼咖啡吧台旁两位喝咖啡畅谈的小熊动态交互（抬杯抿饮 + 点头聊天手势 + 咖啡热气袅袅）
  for(const cb of coffeeBears){
    const sip=Math.max(0,Math.sin(t*.85+cb.sipBias));
    const sipLift=Math.pow(sip,4);
    cb.armR.rotation.x=-.18-sipLift*.52;
    cb.armR.rotation.z=sipLift*.12;
    cb.headG.rotation.y=Math.sin(t*1.6+cb.ph)*.18;
    cb.headG.rotation.x=Math.sin(t*3.2+cb.ph)*.08-sipLift*.16;
    cb.headG.rotation.z=Math.sin(t*1.1+cb.ph)*.06;
    cb.armL.rotation.x=-.25-Math.abs(Math.sin(t*2.4+cb.ph))*.35;
    cb.armL.rotation.z=Math.sin(t*2.0+cb.ph)*.14;
  }
  for(const sw of steamWisps){
    const u=((t*.42+sw.ph)%1);
    sw.m.position.set(sw.x0+Math.sin(t*2.2+sw.ph*3)*.06,.92+u*.42,sw.z0+Math.cos(t*1.8+sw.ph)*.04);
    sw.m.scale.setScalar((.45+u*.85)*(1-u*.7));
  }
  // 艺术馆楼顶烧热水般翻滚升腾的浓密白蒸汽云团
  if(window._roofSteamPuffs){
    for(let i=0;i<window._roofSteamPuffs.length;i++){
      const p=window._roofSteamPuffs[i];
      const u=((t*p.spd+p.ph)%1);

  /* NPC 维尼小熊群物理运动引擎（视距+室内外剔除、避障分离、礼让玩家与车流、弹性跳跃） */

    car.position.set(nx,.12,nz);
    car.rotation.y=Math.atan2(vx,vz);
  }
  /* 镜头飞行 */
  if(camTween){
    camTween.t+=dt;
    const k=Math.min(1,camTween.t/camTween.dur);
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
    if(k>=1)camTween=null;
  }

  if(intro.active)introUpdate(dt);
  updateSnowballFight(dt);
  updateGiftMountain(dt);
  if(fpvSys.active){
    updateFpvDrone(dt);
  }else if(fp.on){
    if(!trainSys.riding&&!wheelSys.riding&&!launchSys.active)fpUpdate(dt);
  }else{
    let f=0,s=0;
    if(fp.keys['KeyW']||fp.keys['ArrowUp'])f+=1;
    if(fp.keys['KeyS']||fp.keys['ArrowDown'])f-=1;
    if(fp.keys['KeyA']||fp.keys['ArrowLeft'])s-=1;
    if(fp.keys['KeyD']||fp.keys['ArrowRight'])s+=1;
    // 触屏沙盒：虚拟摇杆也能平移沙盘视角（上推前进 / 右推横移）
    if(joy.mag>0.02){f+=-joy.dy*1.15;s+=joy.dx*1.15;}
    if(f||s){
      intro.active=false;camTween=null;
      const fwd=new THREE.Vector3();
      camera.getWorldDirection(fwd);fwd.y=0;
      if(fwd.lengthSq()>1e-6)fwd.normalize();else fwd.set(0,0,-1);
      const right=new THREE.Vector3(-fwd.z,0,fwd.x);
      const move=new THREE.Vector3().addScaledVector(fwd,f).addScaledVector(right,s);
      if(move.lengthSq()>0){
        const spd=(fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?28:14;
        move.normalize().multiplyScalar(spd*dt);
        if(IS_TOUCH_DEV){
          // 触屏沙盒：平移 orbit 中心，再重新贴回相机
          controls.target.add(move);
          touchCamApply();
        }else{
          controls.enabled=true;
          camera.position.add(move);
          controls.target.add(move);
        }
      }
    }
    if(IS_TOUCH_DEV){ if(!fp.on)touchCamApply(); }
    else controls.update();
  }
  updateTrain(dt);
  updateWheelRide(dt);
  updateLaunchRide(dt);
  updateHelis(dt);
  updateFireworks(dt);
  updateAerialHaze(dt,t);
  const ridingFast=fpvSys.active||(wheelSys.riding&&wheelSys.kind==='coaster')||trainSys.riding;
  if(!ridingFast||(_reflTick&1)===0)updateOuterCrowd(ridingFast?dt*2:dt,t);
  _reflTick++;
  // 乘车高速俯瞰时冻结阴影重绘避免瞬时卡顿，平地走动时每 36 帧轻刷一次
  if(!ridingFast&&(_reflTick%36)===0)renderer.shadowMap.needsUpdate=true;
  // 乘车期间或高空远景稳定隐藏 1F 室内细碎展品，避免俯冲穿过 9.5m 临界高度时反复切换引发帧率抖动
  const hide1F=fpvSys.active||(wheelSys.riding&&wheelSys.kind==='coaster')||(camera.position.z>22&&camera.position.y>14&&!inBuildingXZ(camera.position.x,camera.position.z));
  if(typeof shop1!=='undefined')shop1.visible=!hide1F;

  composer.render();

  /* FPS + 全局自适应 DPR 稳帧控制器（任意视角掉帧自动降像素比保流畅，回稳后自动恢复高清） */
  fpsFrames++;
  const nowMs=performance.now();
  if(nowMs-fpsT0>500){
    const f=Math.round(fpsFrames*1000/(nowMs-fpsT0));
    fpsEl.textContent=f+' FPS';
    if(!ridingFast&&!state.quality){
      if(f<36){
        window._lowFpsStreak=(window._lowFpsStreak||0)+1;window._hiFpsStreak=0;
        if(window._lowFpsStreak>=3&&renderer.getPixelRatio()>LO_DPR+.05){
          renderer.setPixelRatio(LO_DPR);composer.setPixelRatio(LO_DPR);
        }
      }
    }
    fpsFrames=0;fpsT0=nowMs;
  }
}

/* ══ 全场 NPC 打雪仗系统（超过一半 NPC 自动结对互丢雪球，被砸中蹦跳欢呼） ══ */
const npcSnowballs=[];
const npcSbGeo=new THREE.SphereGeometry(.11,8,6);
const npcSbMat=new THREE.MeshBasicMaterial({color:0xf4f9ff});
for(let i=0;i<npcs.length;i++){
  if(i%4===0){ // 25% 室外 NPC 参与打雪仗（平衡气氛与 CPU/粒子开销）
    npcs[i].snowFight=true;
    npcs[i].throwCd=R(.8,3.6);
  }
}
function updateSnowballFight(dt){
  for(let i=0;i<npcs.length;i++){
    const n=npcs[i];
    if(!n.snowFight)continue;
    n.throwCd-=dt;
    if(n.throwCd<=0){
      n.throwCd=R(2.2,4.2);
      if(npcSnowballs.length>=10)continue;
      // 找附近 16m 内的其他室外 NPC 作为目标
      let tgt=null,bestD=16;
      const nx=n.p.position.x,nz=n.p.position.z;
      for(let j=0;j<npcs.length;j++){
        if(j===i||npcs[j].indoor)continue;
        const d=Math.hypot(npcs[j].p.position.x-nx,npcs[j].p.position.z-nz);
        if(d>2.2&&d<bestD){bestD=d;tgt=npcs[j];}
      }
      if(!tgt||n.indoor)continue;
      const tx=tgt.p.position.x,tz=tgt.p.position.z;
      n.p.rotation.y=Math.atan2(tx-nx,tz-nz);
      const flightT=Math.max(.35,bestD/12.5);
      const vx=(tx-nx)/flightT, vz=(tz-nz)/flightT;
      const vy=(tgt.baseY+.8-(n.baseY+.95))/flightT+0.5*9.8*flightT;
      const sb=new THREE.Mesh(npcSbGeo,npcSbMat);
      sb.position.set(nx,n.baseY+.95,nz);
      scene.add(sb);
      npcSnowballs.push({m:sb,vx,vy,vz,life:flightT+.35,owner:n});
    }
  }
  for(let i=npcSnowballs.length-1;i>=0;i--){
    const b=npcSnowballs[i];
    b.life-=dt;b.vy-=9.8*dt;
    b.m.position.x+=b.vx*dt;b.m.position.y+=b.vy*dt;b.m.position.z+=b.vz*dt;
    let hit=false;
    for(const n of npcs){
      if(n===b.owner||n.indoor)continue;
      const dx=b.m.position.x-n.p.position.x,dy=b.m.position.y-(n.baseY+.7),dz=b.m.position.z-n.p.position.z;
      if(dx*dx+dy*dy+dz*dz<.52){
        hit=true;n.vy=2.5;n.squash=-.20;n.happyT=.9;
        for(let k=0;k<5;k++){const a=k*1.25;spawnSnowPuff(n.p.position.x,n.baseY+.75,n.p.position.z,Math.cos(a)*1.3,R(.8,1.8),Math.sin(a)*1.3,.85,.45);}
        break;
      }
    }
    if(hit||b.m.position.y<=.05||b.life<=0){
      if(!hit&&b.m.position.y<=.05){
        for(let k=0;k<3;k++){const a=k*2.1;spawnSnowPuff(b.m.position.x,.08,b.m.position.z,Math.cos(a)*.9,R(.5,1.1),Math.sin(a)*.9,.65,.35);}
      }
      scene.remove(b.m);npcSnowballs.splice(i,1);
    }
  }
}

    launchSys.timer-=dt;
    const shk=Math.sin(t*55)*.035;
    camera.position.set(launchSys.x+shk,launchSys.y+FP_EYE+shk*.5,launchSys.z);
    camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
    trainHud.classList.add('show');
    trainMsgEl.textContent='蓄力准备弹射升空…（'+Math.max(0,launchSys.timer).toFixed(1)+'s）';
    trainBtnEl.textContent='取消';
    trainBtnEl.onclick=stopLaunchRide;
    if(launchSys.timer<=0){
      launchSys.stage='launch';
      launchSys.vy=32.5; // 直冲 ~51m 高空，稳稳高于 21.5~25m 巡逻直升机
      sfx.blip(1046,.22,.11);
    }
    return;
  }
  if(launchSys.stage==='launch'){
    launchSys.vy-=10.4*dt;
    launchSys.y+=launchSys.vy*dt;
    camera.position.set(launchSys.x,launchSys.y+FP_EYE,launchSys.z);
    camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
    trainHud.classList.add('show');
    trainMsgEl.textContent='🚀 高空弹射升空中！（高度 '+launchSys.y.toFixed(1)+'m · 即将开伞）';
    trainBtnEl.textContent='直接落地';
    trainBtnEl.onclick=stopLaunchRide;
    if(launchSys.vy<=0.5){
      launchSys.stage='chute';
      launchSys.vy=-1.2;
      chuteGrp.visible=true;
      sfx.blip(880,.18,.09);
    }
    return;
  }
  // 降落伞可控滑翔降落阶段
  let f=0,s=0;
  if(fp.keys['KeyW']||fp.keys['ArrowUp'])f+=1;
  if(fp.keys['KeyS']||fp.keys['ArrowDown'])f-=1;
  if(fp.keys['KeyA']||fp.keys['ArrowLeft'])s-=1;
  if(fp.keys['KeyD']||fp.keys['ArrowRight'])s+=1;
  const sinY=Math.sin(fp.yaw), cosY=Math.cos(fp.yaw);
  const fwdX=-sinY, fwdZ=-cosY, rgtX=cosY, rgtZ=-sinY;
  const maxGlide=(fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?18.5:13.5;
  let tx=fwdX*f+rgtX*s, tz=fwdZ*f+rgtZ*s;
  const tLen=Math.hypot(tx,tz);
  if(tLen>0.01){tx=tx/tLen*maxGlide;tz=tz/tLen*maxGlide;}
  launchSys.vx+=(tx-launchSys.vx)*Math.min(1,dt*3.8);
  launchSys.vz+=(tz-launchSys.vz)*Math.min(1,dt*3.8);
  const tgtVy=(fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?-5.6:-3.4;
  launchSys.vy+=(tgtVy-launchSys.vy)*Math.min(1,dt*4.5);

  launchSys.x=Math.max(-72,Math.min(72,launchSys.x+launchSys.vx*dt));
  launchSys.z=Math.max(-38,Math.min(68,launchSys.z+launchSys.vz*dt));
  launchSys.y+=launchSys.vy*dt;

  // 降落伞展开与随滑翔方向轻柔倾转
  launchSys.openK=Math.min(1,launchSys.openK+dt*2.8);
  const easeK=1-Math.pow(1-launchSys.openK,3);
  chuteGrp.scale.set(easeK,0.4+0.6*easeK,easeK);
  chuteGrp.position.set(launchSys.x,launchSys.y+FP_EYE+2.65,launchSys.z);
  chuteGrp.rotation.y=fp.yaw;
  chuteGrp.rotation.x=-launchSys.vz*.014;
  chuteGrp.rotation.z=launchSys.vx*.014;

  fp.x=launchSys.x;fp.y=launchSys.y;fp.z=launchSys.z;
  camera.position.set(launchSys.x,launchSys.y+FP_EYE,launchSys.z);
  camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');

  trainHud.classList.add('show');
  trainMsgEl.textContent='🪂 降落伞滑翔中（高度 '+launchSys.y.toFixed(1)+'m · WASD 控制飞行方向 · 拖动环顾全城）';
  trainBtnEl.textContent='收伞落地';
  trainBtnEl.onclick=stopLaunchRide;

  const floorY=groundY(launchSys.x,launchSys.z);
  if(launchSys.y<=floorY+0.05){
    stopLaunchRide();
    sfx.blip(520,.1,.06);
  }
}

    if(wheelSys.riding)stopFacilityRide();

function updateFpvDrone(dt){
  const s=fpvSys;
  // W/S 或 Shift 控制穿越机油门推力，A/D 控制手动副翼横滚
  const shiftBoost=!!(fp.keys['ShiftLeft']||fp.keys['ShiftRight']||s.boost);
  let throttle=shiftBoost?1.48:1.0;
  if(fp.keys['KeyW']||fp.keys['ArrowUp'])throttle*=1.28;
  if(fp.keys['KeyS']||fp.keys['ArrowDown'])throttle*=0.65;

  // 先取当前高度计算重力俯冲加成（下坡更快、爬坡略收，更具真实穿越机动力感）
  s.curve.getPointAt(s.u,s.p);
  s.curve.getTangentAt(s.u,s.t1);
  const diveBoost=clamp(1.0-s.t1.y*0.32,0.75,1.42);
  const prevU=s.u;
  s.u=(s.u+s.baseSpd*throttle*diveBoost*dt)%1;

  // 检查是否经过自动特技桶滚触发点
  for(let i=0;i<s.AUTO_TRICKS.length;i++){
    const tk=s.AUTO_TRICKS[i];
    if(prevU<tk.u&&s.u>=tk.u&&Math.abs(s.rollVel)<0.1){
      triggerFpvBarrelRoll(tk.dir,tk.name);
    }
  }

  // 长跨度前瞻切线采样 (du=0.018) 解算稳定大弯道离心压弯角，消除短距离拐点抖动
  const du=0.018;
  s.curve.getPointAt(s.u,s.p);
  s.curve.getPointAt((s.u+0.012)%1,s.pLook); // 真实飞手前瞻视线点（提前盯住门洞与弯心）
  s.curve.getTangentAt((s.u-du+1)%1,s.t0);
  s.curve.getTangentAt(s.u,s.t1);
  s.curve.getTangentAt((s.u+du)%1,s.t2);
  const turnRate=(s.t0.z*s.t2.x-s.t0.x*s.t2.z)*18.0;
  const tgtBank=clamp(turnRate,-0.95,0.95); // 稳定顺滑的电影级压弯侧倾（最高 ~54°）
  s.bank+=(tgtBank-s.bank)*Math.min(1,dt*4.2);

  // 手动 A/D 横滚叠加
  let mRollInput=0;
  if(fp.keys['KeyA']||fp.keys['ArrowLeft'])mRollInput-=1;
  if(fp.keys['KeyD']||fp.keys['ArrowRight'])mRollInput+=1;
  if(joy.mag>0.05)mRollInput+=joy.dx;
  s.manualRoll+=(mRollInput*0.85-s.manualRoll)*Math.min(1,dt*7);

  // 360° 极速桶滚角积分
  if(Math.abs(s.rollVel)>0.01){
    const step=s.rollVel*dt*1.55;
    s.rollExtra+=step;
    if(Math.abs(s.rollExtra)>=Math.PI*2){
      s.rollExtra=0;s.rollVel=0;
    }
  }
  if(s.trickBannerT>0){
    s.trickBannerT-=dt;
    if(s.trickBannerT<=0){
      const trEl=document.getElementById('fpv-trick');
      if(trEl)trEl.textContent='🚁 FPV 穿越机特技巡航';
    }
  }

  // 动态广角 FOV（随空速与特技桶滚自动在 78°~90° 间呼吸伸缩）
  const tgtFov=78+(throttle*diveBoost-1)*14+(Math.abs(s.rollVel)>0.1?6:0);
  s.fov+=(clamp(tgtFov,75,92)-s.fov)*Math.min(1,dt*5);
  if(Math.abs(camera.fov-s.fov)>0.08){
    camera.fov=s.fov;
    camera.updateProjectionMatrix();
  }

  // 无万向锁 6-DOF 相机姿态：围绕前瞻视线方向 lookDir 旋转 (稳定压弯角 + 手动横滚 + 360° 桶滚)
  s.lookDir.subVectors(s.pLook,s.p).normalize();
  const totalRoll=s.bank+s.manualRoll+s.rollExtra;
  s.up.set(0,1,0);
  s.right.crossVectors(s.lookDir,s.up);
  if(s.right.lengthSq()<1e-5)s.right.set(1,0,0);else s.right.normalize();
  s.up.crossVectors(s.right,s.lookDir).normalize();
  s.up.applyAxisAngle(s.lookDir,totalRoll);

  camera.position.copy(s.p);
  camera.up.copy(s.up);
  camera.lookAt(s.pLook);

  // 更新 FPV OSD 眼镜遥测数据与人工地平线
  if((_reflTick&1)===0){
    const kmh=Math.round(74*throttle*diveBoost);
    const rollDeg=Math.round((totalRoll*180/Math.PI)%360);
    const pitchDeg=Math.round(Math.asin(clamp(s.t1.y,-1,1))*180/Math.PI);
    const spdEl=document.getElementById('fpv-spd');
    const altEl=document.getElementById('fpv-alt');
    const attEl=document.getElementById('fpv-att');
    const stgEl=document.getElementById('fpv-stage');
    const hbar=document.getElementById('fpv-hbar');
    if(spdEl)spdEl.textContent='SPD '+kmh+' KM/H'+(shiftBoost?' [BOOST]':'');
    if(altEl)altEl.textContent='ALT '+s.p.y.toFixed(1)+' M';
    if(attEl)attEl.textContent='ROLL '+(rollDeg>=0?'+':'')+rollDeg+'° · PITCH '+(pitchDeg>=0?'+':'')+pitchDeg+'°';
    if(hbar)hbar.style.transform='rotate('+(-totalRoll*180/Math.PI).toFixed(1)+'deg) translateY('+(pitchDeg*0.45).toFixed(1)+'px)';
    if(stgEl){
      let curStage=s.STAGES[0][1];
      for(let i=0;i<s.STAGES.length;i++){
        if(s.u>=s.STAGES[i][0])curStage=s.STAGES[i][1];
      }
      stgEl.textContent=curStage;
    }
  }
}

function updateWheelRide(dt){
  if(wheelSys.riding&&fp.on){
    const wp=new THREE.Vector3();
    if(wheelSys.kind==='wheel'&&wheelSys.cab){
      wheelSys.cab.getWorldPosition(wp);
      wp.y-=.52;wp.z+=.12;
    }else if(wheelSys.kind==='carousel'&&amusement.horses&&amusement.horses.length){
      wp.set(0,.98,.05).applyMatrix4(amusement.horses[0].g.matrixWorld);
    }else if(wheelSys.kind==='ship'&&amusement.ship){
      wp.set(2.1,-3.65,0).applyMatrix4(amusement.ship.matrixWorld);
    }else if(wheelSys.kind==='coaster'&&amusement.coaster){
      const co=amusement.coaster, car0=co.cars[0];
      if(!co._camL){co._camL=new THREE.Vector3();co._camU=new THREE.Vector3();co._camDir=new THREE.Vector3();co._camDirS=null;}
      // 车厢矩阵本帧刚更新过位置：先同步 matrixWorld，避免相机用上一帧矩阵导致俯冲高速段一帧滞后抖动
      car0.updateMatrixWorld(true);
      wp.set(0,.70,.24).applyMatrix4(car0.matrixWorld);
      fp.x=wp.x;fp.z=wp.z;fp.y=wp.y-FP_EYE;
      camera.position.copy(wp);
      co._camL.set(0,.56,8.0).applyMatrix4(car0.matrixWorld);
      // 视线方向做指数平滑：过顶转俯冲时不再瞬间折角“顿一下”
      co._camDir.subVectors(co._camL,wp).normalize();
      if(!co._camDirS)co._camDirS=co._camDir.clone();
      co._camDirS.lerp(co._camDir,1-Math.exp(-dt*9)).normalize();
      co.sampleTrackUp(co.t%1,co._camU);
      camera.up.copy(co._camU);
      camera.lookAt(co._camL.copy(wp).addScaledVector(co._camDirS,8));
      trainHud.classList.add('show');
      trainMsgEl.textContent='正在乘坐 '+wheelSys.label+'（车头锁定第一视角 · 高度 '+wp.y.toFixed(1)+'m）';
      trainBtnEl.textContent='下来 (E)';
      trainBtnEl.onclick=stopFacilityRide;
      return;
    }else if(wheelSys.kind==='bumper'&&(wheelSys.car||amusement.bumper.length)){
      const car=wheelSys.car||amusement.bumper[0];
      wp.set(0,1.55,-.15).applyMatrix4(car.matrixWorld);
    }else if(wheelSys.kind==='sleigh'){
      // 坐在圣诞老人后面的高处礼物堆上：居高临下俯瞰圣诞老人背影、三只驯鹿与雪夜全城
      wp.set(0,2.05,-2.65).applyMatrix4(flyingSleigh.matrixWorld);
    }else if(wheelSys.kind==='heli'&&wheelSys.heli){
      wp.set(0,.18,1.95).applyMatrix4(wheelSys.heli.g.matrixWorld);
    }
    fp.x=wp.x;fp.z=wp.z;fp.y=wp.y-FP_EYE;
    camera.position.copy(wp);
    camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
    trainHud.classList.add('show');
    trainMsgEl.textContent='正在体验 '+wheelSys.label+'（高度 '+wp.y.toFixed(1)+'m · 拖动鼠标 360° 看风景）';
    trainBtnEl.textContent='下来 (E)';
    trainBtnEl.onclick=stopFacilityRide;
    return;
  }
  trainBtnEl.onclick=()=>toggleRideTrain(null);
  if(!trainSys.riding&&!launchSys.active&&fp.on){
    const dw=Math.hypot(fp.x-27,fp.z-36);
    if(dw<10.5){
      trainHud.classList.add('show');
      trainMsgEl.textContent='敞篷观景摩天轮 · 按 E 或点击坐上吊篮';
      trainBtnEl.textContent='坐摩天轮 (E)';
      trainBtnEl.onclick=()=>toggleRideWheel(null);
    }
  }
}
trainBtnEl.onclick=()=>toggleRideTrain();
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(e.code==='KeyK'){
    toggleRideFacility({kind:'sleigh',label:'空中圣诞驯鹿雪橇'});
    return;
  }
  if(e.code==='KeyE'){

    if(trainSys.riding){toggleRideTrain();return;}
    if(fp.on&&Math.hypot(fp.x-27,fp.z-36)<10.5){toggleRideWheel(null);return;}
    if(fp.on&&trainCars.some(c=>Math.hypot(fp.x-c.position.x,fp.z-c.position.z)<9.5)){toggleRideTrain();return;}
  }
});

function updateTrain(dt){
  // 全程不停站连续高速巡航
  trainSys.atStation=null;
  trainSys.speed=trainSys.maxSpeed;
  trainSys.u=(trainSys.u+(trainSys.speed*dt)/TRAIN_LEN)%1;

  // 更新 6 节加长重型列车编组位姿（双转向架弦线对齐，过弯平滑零脱轨）+ 防止玩家穿模
  const bogieHalf=2.05/TRAIN_LEN;
  for(let i=0;i<trainCars.length;i++){
    const distBack=i===0?0:(6.45+(i-1)*6.52);
    const cu=(trainSys.u-distBack/TRAIN_LEN+1)%1;
    const pF=TRAIN_CURVE.getPointAt((cu+bogieHalf)%1);
    const pR=TRAIN_CURVE.getPointAt((cu-bogieHalf+1)%1);
    const px=(pF.x+pR.x)*.5, pz=(pF.z+pR.z)*.5;
    trainCars[i].position.set(px,0,pz);
    trainCars[i].rotation.y=Math.atan2(pF.x-pR.x,pF.z-pR.z);
    if(!trainSys.riding&&!launchSys.active&&fp.on){
      const dx=fp.x-px,dz=fp.z-pz,d=Math.hypot(dx,dz);
      if(d<2.45&&d>.01){fp.x=px+(dx/d)*2.45;fp.z=pz+(dz/d)*2.45;}
    }
  }

  // 车头大烟囱迎风向后翻滚浓密蒸汽云团 + 前侧双蒸汽气缸泄压白雾
  const loco=trainCars[0];
  loco.updateMatrixWorld();
  const locoTg=TRAIN_CURVE.getTangentAt(trainSys.u);
  const backX=-locoTg.x, backZ=-locoTg.z;
  const rightX=-locoTg.z, rightZ=locoTg.x;

  trainSys.steamCd-=dt;
  if(trainSys.steamCd<=0){
    trainSys.steamCd=.038;
    const noz=new THREE.Vector3(R(-.10,.10),3.22,1.95).applyMatrix4(loco.matrixWorld);
    const pf=trainSteamPuffs[trainSteamCursor];
    trainSteamCursor=(trainSteamCursor+1)%trainSteamPuffs.length;
    pf.alive=true;pf.life=0;pf.max=R(1.45,2.05);
    pf.x=noz.x;pf.y=noz.y;pf.z=noz.z;
    // 迎风强力后掠：初速度猛烈朝列车正后方喷卷，并带向上热浮力与横向湍流
    const backSpd=R(5.8,9.2), sideJit=R(-.75,.75);
    pf.vx=backX*backSpd+rightX*sideJit;
    pf.vy=R(2.8,4.1);
    pf.vz=backZ*backSpd+rightZ*sideJit;
    pf.bx=backX;pf.bz=backZ;
    pf.sc0=R(.82,1.12);pf.sc1=R(3.1,4.4);
  }
  trainSys.pistonCd-=dt;
  if(trainSys.pistonCd<=0){
    trainSys.pistonCd=.11;
    for(const s of [-1,1]){
      const cp=new THREE.Vector3(s*1.32,.56,2.15).applyMatrix4(loco.matrixWorld);
      spawnSnowPuff(cp.x,cp.y,cp.z,backX*3.5+rightX*s*1.8,R(.9,1.6),backZ*3.5+rightZ*s*1.8,.85,.45);
    }
  }

  // 更新迎风后掠蒸汽云团（先向上喷涌再被迎面风压弯向后上方拉出 15m+ 翻滚长烟带）
  for(let i=0;i<trainSteamPuffs.length;i++){
    const pf=trainSteamPuffs[i];
    if(!pf.alive)continue;
    pf.life+=dt;
    if(pf.life>=pf.max){
      pf.alive=false;pf.mat.opacity=0;pf.sp.position.set(0,-40,0);continue;
    }
    const u=pf.life/pf.max;
    // 迎风空气阻力持续把烟团往后推，同时上升速度随高度逐渐放缓平流
    pf.vx+=pf.bx*3.6*dt;
    pf.vz+=pf.bz*3.6*dt;
    pf.vy=Math.max(.55,pf.vy-1.35*dt);
    const curl=Math.sin(pf.life*5.2+pf.wob)*.85;
    pf.x+=(pf.vx-pf.bz*curl)*dt;
    pf.y+=pf.vy*dt;
    pf.z+=(pf.vz+pf.bx*curl)*dt;
    pf.sp.position.set(pf.x,pf.y,pf.z);
    const sc=pf.sc0+(pf.sc1-pf.sc0)*Math.pow(u,.68);
    pf.sp.scale.set(sc,sc*.88,1);
    const fadeIn=Math.min(1,u*6.5);
    const fadeOut=Math.pow(1-u,1.25);
    pf.mat.opacity=.78*fadeIn*fadeOut;
  }

  // 玩家乘车视角跟随（锁定在最后一节加长车厢最后一排，面向正后方观景）
  if(trainSys.riding&&fp.on){
    const caboose=trainCars[trainCars.length-1];
    if(!caboose.userData._camS){caboose.userData._camS=new THREE.Vector3();caboose.userData._camL=new THREE.Vector3();}
    const seat=caboose.userData._camS.set(0,1.56,-2.28).applyMatrix4(caboose.matrixWorld);
    const lookBack=caboose.userData._camL.set(0,1.40,-16.0).applyMatrix4(caboose.matrixWorld);
    fp.x=seat.x;fp.z=seat.z;fp.y=seat.y-FP_EYE;
    camera.position.copy(seat);
    camera.up.set(0,1,0);
    camera.lookAt(lookBack);
    trainHud.classList.add('show');
    trainMsgEl.textContent='🚂 皇家冬夜加长特快巡航中 · 6节重型编组尾车观景（按 E 随时下车）';
    trainBtnEl.textContent='下车 (E)';
  }else if(fp.on){
    const nearCar=trainCars.some(c=>Math.hypot(fp.x-c.position.x,fp.z-c.position.z)<9.5);
    if(nearCar){
      trainHud.classList.add('show');
      trainMsgEl.textContent='🚂 皇家冬夜加长特快经过身旁 · 点击车厢或按 E 随时上车';
      trainBtnEl.textContent='上车 (E)';
    }else{
      trainHud.classList.remove('show');
    }
  }else{
    trainHud.classList.remove('show');
  }
}

/* ══ Saltline 级真实法线贴图（NormalMap）+ 粗糙度贴图 + 材质对比度调优 ══ */
(function initSaltlinePBR(){
  function makeNormalAndRough(mode){
    const S=256,c=document.createElement('canvas');c.width=S;c.height=S;
    const x=c.getContext('2d'),img=x.createImageData(S,S),d=img.data;
    const rc=document.createElement('canvas');rc.width=S;rc.height=S;
    const rx=rc.getContext('2d'),rimg=rx.createImageData(S,S),rd=rimg.data;
    const h=(ix,iy)=>{const n=Math.sin((((ix%S)+S)%S)*127.1+(((iy%S)+S)%S)*311.7)*43758.5453;return n-Math.floor(n);};
    const vnoise=(px,py)=>{
      const ix=Math.floor(px),iy=Math.floor(py),fx=px-ix,fy=py-iy;
      const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
      const a=h(ix,iy),b=h(ix+1,iy),c2=h(ix,iy+1),d2=h(ix+1,iy+1);
      return a+(b-a)*ux+(c2-a)*uy+(a-b-c2+d2)*ux*uy;
    };
    const heightAt=(xx,yy)=>{
      if(mode==='snow')return vnoise(xx*.07,yy*.07)*.65+vnoise(xx*.16,yy*.16)*.35;
      if(mode==='wood'){const ring=Math.sin((xx*.14+vnoise(xx*.03,yy*.02)*3.5)*3.14)*.5+.5;return ring*.72+vnoise(xx*.18,yy*.04)*.28;}
      return vnoise(xx*.12,yy*.12)*.65+vnoise(xx*.28,yy*.28)*.35;
    };
    const strength=mode==='wood'?0.95:mode==='snow'?0.45:0.65;
    for(let y=0;y<S;y++)for(let xx=0;xx<S;xx++){
      const dx=(heightAt(xx+1,y)-heightAt(xx-1,y))*strength;
      const dy=(heightAt(xx,y+1)-heightAt(xx,y-1))*strength;
      let nx=-dx,ny=-dy,nz=1;const il=1/Math.hypot(nx,ny,nz);
      nx*=il;ny*=il;nz*=il;
      const p=(y*S+xx)*4;
      d[p]=Math.round((nx*.5+.5)*255);d[p+1]=Math.round((ny*.5+.5)*255);d[p+2]=Math.round((nz*.5+.5)*255);d[p+3]=255;
      const rv=Math.max(110,Math.min(255,Math.round((0.55+heightAt(xx,y)*0.45)*255)));
      rd[p]=rd[p+1]=rd[p+2]=rv;rd[p+3]=255;
    }
    x.putImageData(img,0,0);rx.putImageData(rimg,0,0);
    const ntx=new THREE.CanvasTexture(c);ntx.wrapS=ntx.wrapT=THREE.RepeatWrapping;ntx.repeat.set(mode==='wood'?2:6,mode==='wood'?2:6);ntx.anisotropy=4;
    const rtx=new THREE.CanvasTexture(rc);rtx.wrapS=rtx.wrapT=THREE.RepeatWrapping;rtx.repeat.set(mode==='wood'?2:6,mode==='wood'?2:6);rtx.anisotropy=4;
    return {ntx,rtx};
  }
  const snowPBR=makeNormalAndRough('snow'), woodPBR=makeNormalAndRough('wood'), stonePBR=makeNormalAndRough('stone');
  // 艺术馆内部 (shop / shop1 / shop2，不含天台室外展区 roofExpo) 独占写实 PBR 微缩沙盘光影（克隆共享材质并标记 noToon）
  const museumPbrClones=new Map();
  shop.traverse(o=>{
    if(o===roofExpo)return;
    let p=o.parent;while(p){if(p===roofExpo)return;p=p.parent;}
    if(!o.isMesh||!o.material)return;
    const cloneMat=m=>{
      if(!m)return m;
      if(m.userData&&m.userData.isMuseumPBR)return m;
      if(!museumPbrClones.has(m)){
        const cm=m.clone();
        cm.userData=Object.assign({},m.userData,{noToon:true,isMuseumPBR:true});
        museumPbrClones.set(m,cm);
      }
      return museumPbrClones.get(m);
    };
    o.material=Array.isArray(o.material)?o.material.map(cloneMat):cloneMat(o.material);
  });
  const seen=new Set();
  scene.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    for(const m of mats){
      if(!m||seen.has(m))continue;seen.add(m);
      if(m.isMeshStandardMaterial||m.isMeshPhysicalMaterial){
        const isMP=!!(m.userData&&m.userData.isMuseumPBR);
        if(m.metalness>=.45||m.roughness<=.42){
          m.envMapIntensity=Math.max(m.envMapIntensity||1,1.55);m.needsUpdate=true;continue;
        }
        if(m.normalMap||m.bumpMap||m.map)continue;
        const c=m.color;if(!c)continue;
        const lum=c.r*.3+c.g*.59+c.b*.11;
        if(lum>.78&&m.roughness>=.86){
          m.normalMap=snowPBR.ntx;m.normalScale=new THREE.Vector2(isMP?.42:.14,isMP?.42:.14);
          m.roughnessMap=snowPBR.rtx;m.needsUpdate=true;
        }else if(c.r>c.b*1.25&&m.roughness>=.70&&lum<.55){
          m.normalMap=woodPBR.ntx;m.normalScale=new THREE.Vector2(isMP?.52:.20,isMP?.52:.20);
          m.roughnessMap=woodPBR.rtx;m.needsUpdate=true;
        }else if(m.roughness>=.80){
          m.normalMap=stonePBR.ntx;m.normalScale=new THREE.Vector2(isMP?.36:.14,isMP?.36:.14);
          m.roughnessMap=stonePBR.rtx;m.needsUpdate=true;
        }
      }
    }
  });
})();

/* ══ 日系二次元电影感三渲二全局着色器增强（Cel Ramp + 冷青紫暗部 + 动漫 Rim 轮廓光） ══ */
(function initAnimeNPR(){
  function applyAnimeToon(m){
    if(!m||m.userData._animePatched||m.userData.noToon||m.transparent)return;
    if(!(m.isMeshStandardMaterial||m.isMeshPhysicalMaterial))return;
    if(m.metalness>=.72&&m.roughness<=.25)return;
    m.userData._animePatched=true;
    const prevCompile=m.onBeforeCompile;
    m.customProgramCacheKey=()=>'anime_npr_v1';
    m.onBeforeCompile=(shader,r)=>{
      if(prevCompile)prevCompile(shader,r);
      shader.fragmentShader=shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `
        {
          float _lum=dot(gl_FragColor.rgb,vec3(0.299,0.587,0.114));
          // 锐利两阶半日系赛璐璐明暗切分，保留贴图纹理细节的同时增强动画块面感
          float _cel=smoothstep(0.14,0.20,_lum)*0.42+smoothstep(0.46,0.53,_lum)*0.58;
          vec3 _celCol=gl_FragColor.rgb*clamp(_cel/max(_lum,0.012),0.55,1.42);
          // 暗部向新海诚雪夜冷青紫偏移，告别脏灰黑影
          vec3 _shadowCold=gl_FragColor.rgb*vec3(0.76,0.85,1.12)+vec3(0.018,0.026,0.062);
          float _darkMask=1.0-smoothstep(0.05,0.32,_lum);
          vec3 _styled=mix(_celCol,_shadowCold,_darkMask*0.48);
          // 强烈日系二次元边缘轮廓光 (Anime Rim Light，使用 Three.js 标准视图空间法线 normal)
          float _rim=pow(1.0-clamp(abs(dot(normalize(normal),normalize(vViewPosition))),0.0,1.0),3.2);
          _styled+=vec3(0.56,0.80,1.0)*_rim*0.20*(1.0-smoothstep(0.42,0.92,_lum));
          gl_FragColor.rgb=mix(gl_FragColor.rgb,_styled,0.52);
        }
        #include <dithering_fragment>
        `
      );
    };
    m.needsUpdate=true;
  }
  window._applyAnimeToon=applyAnimeToon;
  scene.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(applyAnimeToon);
  });
})();
