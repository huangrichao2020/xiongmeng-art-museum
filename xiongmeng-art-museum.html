/* ══ 喷泉雪地写实流线动物雕刻系统：连续曲面放样身躯 + 收腹弓背 + 飞节弯折四肢 + 顶点毛色渐变（狐狸 / 名犬 / 小花猫） ══ */
const liveAnimals=[];
const _vc=new THREE.Color();

// 核心 1：沿脊柱从后(-Z)到前(+Z)放样连续解剖躯干/头颅（支持上下不对称 ryTop / ryBot 刻画深胸收腹与鼻梁止部）
function loftProfile(rings,segs,colFn,matOpts={}){
  const pos=[],col=[],idx=[],stride=segs+1;
  for(let i=0;i<rings.length;i++){
    const r=rings[i], u=i/(rings.length-1);
    for(let j=0;j<=segs;j++){
      const th=(j/segs)*Math.PI*2, sx=Math.sin(th), cy=Math.cos(th);
      const x=sx*r.rx;
      const y=r.y+(cy>=0?cy*r.ryTop:cy*r.ryBot);
      const z=r.z+(r.tiltY?cy*r.tiltY:0);
      pos.push(x,y,z);
      _vc.setHex(colFn(u,th,x,y,z,r));
      col.push(_vc.r,_vc.g,_vc.b);
    }
  }
  for(let i=0;i<rings.length-1;i++){
    for(let j=0;j<segs;j++){
      const a=i*stride+j,b=(i+1)*stride+j,c=i*stride+j+1,d=(i+1)*stride+j+1;
      idx.push(a,b,c, b,d,c);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial(Object.assign({vertexColors:true,roughness:.84,metalness:.02,flatShading:false},matOpts));
  const m=new THREE.Mesh(geo,mat);
  m.castShadow=true;m.receiveShadow=true;
  return m;
}

// 核心 2：沿真实四足骨骼弯折关节从上(+Y)向下(0)放样修长四肢（含肘部与后腿飞节弯角 + 掌垫落地）
function loftLimb(nodes,segs,colFn){
  const pos=[],col=[],idx=[],stride=segs+1;
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i], u=i/(nodes.length-1);
    for(let j=0;j<=segs;j++){
      const th=(j/segs)*Math.PI*2;
      const x=n[0]+Math.cos(th)*n[3];
      const y=n[1];
      const z=n[2]+Math.sin(th)*n[4];
      pos.push(x,y,z);
      _vc.setHex(colFn(u,th,x,y,z));
      col.push(_vc.r,_vc.g,_vc.b);
    }
  }
  for(let i=0;i<nodes.length-1;i++){
    for(let j=0;j<segs;j++){
      const a=i*stride+j,b=(i+1)*stride+j,c=i*stride+j+1,d=(i+1)*stride+j+1;
      idx.push(a,c,b, c,d,b); // (-Y)x(+Z)=+X -> (a,c,b) 严格朝外
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,metalness:.02,flatShading:false}));
  m.castShadow=true;m.receiveShadow=true;
  return m;
}

// 核心 3：内凹曲面立体耳廓（前凹耳窝、后凸耳背，告别纸锥感）
function sculptEar(w,h,outCol,inCol){
  const pos=[],col=[],idx=[];
  const rows=6, cols=8, stride=cols+1;
  for(let i=0;i<=rows;i++){
    const v=i/rows, width=w*Math.sin((1-v*.86)*Math.PI*.5)*(v<.15?.7+v*2:1);
    const zCurve=-Math.pow(v,1.6)*w*.28;
    for(let j=0;j<=cols;j++){
      const u=j/cols, a=u*Math.PI*2;
      const sx=Math.cos(a)*width*.5;
      const front=Math.sin(a)>0;
      const sz=zCurve+Math.sin(a)*width*(front?.12:.36)-(front?width*.14*(1-v):0);
      pos.push(sx,v*h,sz);
      _vc.setHex(front&&v>.08&&v<.88?inCol:outCol);
      col.push(_vc.r,_vc.g,_vc.b);
    }
  }
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
    const a=i*stride+j,b=(i+1)*stride+j,c=i*stride+j+1,d=(i+1)*stride+j+1;
    idx.push(a,c,b, c,d,b);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.86,side:THREE.DoubleSide,flatShading:false}));
}

// 核心 4：沿自然样条曲线放样渐细蓬松尾巴（支持白尾尖/斑纹着色）
function loftTail(pts,rads,segs,colFn){
  const curve=new THREE.CatmullRomCurve3(pts);
  const frames=curve.computeFrenetFrames(12,false);
  const pos=[],col=[],idx=[],steps=12,stride=segs+1;
  for(let i=0;i<=steps;i++){
    const u=i/steps, p=curve.getPointAt(u), N=frames.normals[i], B=frames.binormals[i];
    const rad=rads(u);
    for(let j=0;j<=segs;j++){
      const th=(j/segs)*Math.PI*2, c=Math.cos(th), s=Math.sin(th);
      const vx=p.x+(N.x*c+B.x*s)*rad, vy=p.y+(N.y*c+B.y*s)*rad, vz=p.z+(N.z*c+B.z*s)*rad;
      pos.push(vx,vy,vz);
      _vc.setHex(colFn(u,th,vx,vy,vz));
      col.push(_vc.r,_vc.g,_vc.b);
    }
  }
  for(let i=0;i<steps;i++)for(let j=0;j<segs;j++){
    const a=i*stride+j,b=(i+1)*stride+j,c=i*stride+j+1,d=(i+1)*stride+j+1;
    idx.push(a,c,b, c,d,b);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.88,flatShading:false}));
  m.castShadow=true;return m;
}

// 通用安装斜嵌入杏仁眼眸（内嵌眶位不突兀）

/* 1. 雕刻级流线狐狸（赤狐 / 北极白狐 / 银狐） */
function buildFox(breed='red'){
  const g=new THREE.Group();
  const pal={
    red:   {coat:0xd4561e,belly:0xf5ece0,dark:0x1f1916,earIn:0xf0dcc8,eye:0xb86f18,tip:0xf9fafc},

    silver:{coat:0x545e6b,belly:0xe4ddd4,dark:0x181b21,eye:0xc48b2c,tip:0xf4f6f9}
  }[breed]||{coat:0xd4561e,belly:0xf5ece0,dark:0x1f1916,earIn:0xf0dcc8,eye:0xb86f18,tip:0xf9fafc};

  const hipY=.405;
  // 连续放样躯干：臀部 -> 紧致高收腰 -> 深胸骨 -> 流线前倾纤颈
  g.add(loftProfile([
    {z:-.27,y:.41, rx:.004,ryTop:.004,ryBot:.004},
    {z:-.23,y:.41, rx:.072,ryTop:.074,ryBot:.072},
    {z:-.14,y:.425,rx:.092,ryTop:.094,ryBot:.082}, // 饱满后胯股（包裹后腿根）
    {z:-.03,y:.435,rx:.070,ryTop:.078,ryBot:.054}, // 明显敏捷收腹腰线
    {z:+.11,y:.415,rx:.094,ryTop:.094,ryBot:.118}, // 深胸肋骨（包裹前肩关节）
    {z:+.21,y:.445,rx:.078,ryTop:.082,ryBot:.095}, // 胸前围脖蓬毛
    {z:+.26,y:.51, rx:.058,ryTop:.060,ryBot:.065}, // 颈根
    {z:+.29,y:.575,rx:.046,ryTop:.048,ryBot:.048}  // 颈上端
  ],18,(u,th,x,y,z)=>{
    const cy=Math.cos(th);
    if(cy<-.25||(u>.66&&cy<.18))return pal.belly;
    return pal.coat;
  }));

  // 连续放样狐狸头颅与尖细口鼻止部（无球拼管！）
  const headG=new THREE.Group();headG.position.set(0,.575,.285);g.add(headG);
  headG.add(loftProfile([
    {z:-.07,y:-.01,rx:.044,ryTop:.048,ryBot:.044},
    {z:-.02,y:.015,rx:.084,ryTop:.078,ryBot:.056}, // 饱满腮颊后颅
    {z:+.04,y:.022,rx:.082,ryTop:.074,ryBot:.048}, // 眉弓眼框区
    {z:+.085,y:.005,rx:.052,ryTop:.046,ryBot:.036}, // 鼻梁止部坡降
    {z:+.145,y:-.006,rx:.034,ryTop:.030,ryBot:.026}, // 尖长吻部
    {z:+.200,y:-.012,rx:.020,ryTop:.018,ryBot:.016}, // 鼻端
    {z:+.214,y:-.014,rx:.003,ryTop:.003,ryBot:.003}
  ],18,(u,th,x,y,z)=>{
    const cy=Math.cos(th);
    if(u>.85)return 0x161414; // 黑亮鼻尖
    if(u>.58&&cy<.08)return pal.belly; // 白吻下颌
    if(u>.25&&cy<-.15)return pal.belly; // 白颊
    return pal.coat;
  }));
  attachEyes(headG,.050,.034,.064,.42,pal.eye,0x0b0b0d,.015);
  for(const s of [-1,1]){
    const ear=sculptEar(.072,.135,pal.dark,pal.earIn);
    ear.position.set(s*.054,.072,-.008);ear.rotation.set(.18,s*.22,-s*.24);headG.add(ear);
  }

  // 四条真实骨骼屈节细腿：枢轴深植躯干肌群内部 + 无缝封顶肩股关节 + 精确落地 y=0
  const legCol=(u,th,x,y)=>u>.52?pal.dark:pal.coat;
  const scH=hipY/.355;
  const legs=[];
  for(const [lx,lz,f] of [[.046,.14,1],[-.046,.14,1],[.050,-.14,0],[-.050,-.14,0]]){
    const sgn=lx>0?1:-1;
    // 躯干肩/臀外扩肌垫，与躯干浑然一体
    add(g,new THREE.SphereGeometry(.054,12,10),M(pal.coat,{roughness:.85}),lx*.72,hipY,lz).scale.set(.78,1.22,1.35);
    const fNodes=[
      [-sgn*.018,.025,0,.003,.003],[-sgn*.010,.010,0,.042,.058],[0,-.045,-.006,.038,.050],
      [0,-.15*scH,-.024,.024,.030],[0,-.28*scH,-.008,.018,.020],
      [0,-.33*scH,.018,.018,.022],[0,-.346*scH,.040,.024,.034],[-.001,-.355*scH,.038,.003,.003]
    ];
    const hNodes=[
      [-sgn*.018,.025,.006,.003,.003],[-sgn*.010,.010,.010,.048,.072],[0,-.045,.012,.044,.062],
      [0,-.14*scH,.034,.032,.042],[0,-.24*scH,-.040,.020,.024],
      [0,-.33*scH,-.018,.017,.020],[0,-.346*scH,.010,.024,.034],[0,-.355*scH,.008,.003,.003]
    ];
    const lg=new THREE.Group();lg.position.set(lx,hipY,lz);g.add(lg);
    lg.add(loftLimb(f?fNodes:hNodes,12,legCol));
    legs.push(lg);
  }

  // 飘逸 S 曲线蓬松狐尾（渐变白尾尖）
  const tailG=new THREE.Group();tailG.position.set(0,.415,-.22);g.add(tailG);
  tailG.add(loftTail([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,-.04,-.13),
    new THREE.Vector3(0,-.02,-.27),
    new THREE.Vector3(0,.05,-.40)
  ],u=>Math.sin(u*Math.PI)*.062+.018*(1-u),12,(u)=>u>.68?pal.tip:pal.coat));

  g.userData={headG,tailG,legs};
  return g;
}

    husky:  {coat:0x5f6b78,belly:0xf6f8fb,earOut:0x4e5864,earIn:0xe8dde0,eye:0x4cc4ff,len:.42,rx:.092,legH:.39,ear:[.068,.115],tail:'curl', mask:1},
    samoyed:{coat:0xf7f9fc,belly:0xffffff,earOut:0xf4f7fb,earIn:0xf2d9dc,eye:0x171414,len:.39,rx:.096,legH:.36,ear:[.068,.108],tail:'curl', mask:0}
  }[breed]||{coat:0x5f6b78,belly:0xf6f8fb,earOut:0x4e5864,earIn:0xe8dde0,eye:0x4cc4ff,len:.42,rx:.092,legH:.39,ear:[.068,.115],tail:'curl',mask:1};

  const L=sp.len, by=sp.legH+.07, hipY=by-.005;
  // 连续放样强健流线躯干（深胸、明显腰部收腹、厚实肩胯肌群包容四肢）
  g.add(loftProfile([
    {z:-L*.68,y:by,     rx:.004,    ryTop:.004,    ryBot:.004},
    {z:-L*.60,y:by,     rx:sp.rx*.78,ryTop:sp.rx*.82,ryBot:sp.rx*.78},
    {z:-L*.38,y:by+.005,rx:sp.rx*1.02,ryTop:sp.rx*1.0,ryBot:sp.rx*.88}, // 臀胯（稳固接纳后腿）
    {z:-L*.06,y:by+.022,rx:sp.rx*.80,ryTop:sp.rx*.84,ryBot:sp.rx*.62}, // 收腹细腰
    {z:+L*.28,y:by,     rx:sp.rx*1.04,ryTop:sp.rx*1.02,ryBot:sp.rx*1.26}, // 深胸廓（接纳前肩）
    {z:+L*.52,y:by+.03, rx:sp.rx*.86,ryTop:sp.rx*.90,ryBot:sp.rx*1.06}, // 厚实前胸
    {z:+L*.64,y:by+.10, rx:sp.rx*.64,ryTop:sp.rx*.68,ryBot:sp.rx*.72},
    {z:+L*.70,y:by+.175,rx:sp.rx*.54,ryTop:sp.rx*.56,ryBot:sp.rx*.54}
  ],18,(u,th)=>{
    const cy=Math.cos(th);
    if(cy<-.18||(sp.mask&&u>.56&&cy<.32))return sp.belly;
    return sp.coat;
  }));

  // 雕刻头颅（含止部额坡 + 对称脸谱斑纹 + 方圆吻部 + 湿黑鼻）
  const headG=new THREE.Group();headG.position.set(0,by+.175,L*.70);g.add(headG);
  headG.add(loftProfile([
    {z:-.075,y:-.01, rx:.056,ryTop:.058,ryBot:.050},
    {z:-.015,y:.020, rx:.096,ryTop:.090,ryBot:.068},
    {z:+.048,y:.028, rx:.090,ryTop:.082,ryBot:.058}, // 额骨眼区
    {z:+.092,y:.004, rx:.058,ryTop:.046,ryBot:.044}, // 止部
    {z:+.155,y:-.006,rx:.042,ryTop:.034,ryBot:.034}, // 吻部
    {z:+.192,y:-.010,rx:.024,ryTop:.020,ryBot:.018},
    {z:+.206,y:-.012,rx:.004,ryTop:.004,ryBot:.004}
  ],18,(u,th,x,y)=>{
    const cy=Math.cos(th);
    if(u>.86)return 0x161414;
    if(sp.mask&&u>.52&&cy<.18)return sp.belly;
    if(sp.mask&&u>.22&&Math.abs(x)<.024&&cy>.45)return sp.belly; // 白鼻梁通天星
    if(sp.mask&&u>.20&&cy<-.12)return sp.belly;
    return sp.coat;
  }));
  attachEyes(headG,.056,.038,.066,.38,sp.eye,0x0b0b0d,.0165);
  for(const s of [-1,1]){
    if(breed==='golden'){
      const ear=sculptEar(.075,.125,sp.earOut,sp.earIn);
      ear.position.set(s*.082,.042,.005);ear.rotation.set(.25,s*.35,s*2.45);headG.add(ear); // 金毛垂耳
    }else{
      const ear=sculptEar(sp.ear[0],sp.ear[1],sp.earOut,sp.earIn);
      ear.position.set(s*.058,.082,-.006);ear.rotation.set(.15,s*.18,-s*.24);headG.add(ear);
    }
  }

  // 四条骨骼屈节真实腿型：肩股关节内嵌躯干 + 外肌包覆 + 等比接地 y=0
  const scH=hipY/.355;
  const legs=[];
  for(const [lx,lz,f] of [[sp.rx*.54,L*.34,1],[-sp.rx*.54,L*.34,1],[sp.rx*.58,-L*.36,0],[-sp.rx*.58,-L*.36,0]]){
    const sgn=lx>0?1:-1;
    // 躯干肩/股肌肉融接垫，消除任何悬空缝隙
    add(g,new THREE.SphereGeometry(sp.rx*.58,12,10),M(sp.coat,{roughness:.85}),lx*.72,hipY,lz).scale.set(.82,1.18,1.32);
    const fNodes=[
      [-sgn*.018,.025,0,.003,.003],[-sgn*.010,.010,0,.042,.056],[0,-.045*scH,-.004,.038,.048],
      [0,-.15*scH,-.024,.026,.032],[0,-.28*scH,-.006,.020,.022],
      [0,-.325*scH,.016,.020,.024],[0,-.344*scH,.038,.026,.036],[0,-.355*scH,.036,.003,.003]
    ];
    const hNodes=[
      [-sgn*.018,.025,.006,.003,.003],[-sgn*.010,.010,.010,.048,.070],[0,-.045*scH,.012,.044,.062],
      [0,-.14*scH,.032,.034,.044],[0,-.24*scH,-.038,.022,.026],
      [0,-.325*scH,-.018,.019,.022],[0,-.344*scH,.010,.026,.036],[0,-.355*scH,.008,.003,.003]
    ];
    const lg=new THREE.Group();lg.position.set(lx,hipY,lz);g.add(lg);
    lg.add(loftLimb(f?fNodes:hNodes,12,(u)=>u>.52&&sp.mask?sp.belly:sp.coat));
    legs.push(lg);
  }

  // 雕刻尾巴
  const tailG=new THREE.Group();tailG.position.set(0,by+.02,-L*.58);g.add(tailG);
  if(sp.tail==='bob'){
    tailG.add(loftTail([new THREE.Vector3(0,0,0),new THREE.Vector3(0,.03,-.07)],u=>.045*(1-u*.45),10,()=>sp.belly));
  }else if(sp.tail==='curl'){
    tailG.add(loftTail([
      new THREE.Vector3(0,0,0),new THREE.Vector3(0,.11,-.07),
      new THREE.Vector3(.02,.20,.02),new THREE.Vector3(.01,.15,.11)
    ],u=>.042*Math.sin((1-u*.65)*Math.PI*.5),10,()=>sp.coat));
  }else{
    tailG.add(loftTail([
      new THREE.Vector3(0,0,0),new THREE.Vector3(0,-.02,-.14),new THREE.Vector3(0,.06,-.29)
    ],u=>Math.sin(u*Math.PI)*.038+.016,10,()=>sp.coat));
  }

  g.userData={headG,tailG,legs};
  return g;
}

/* 3. 雕刻级灵动小花猫（三花 calico / 奶牛 tuxedo / 橘白斑 tabby / 重点色布偶 siamese） */
function buildCat(breed='calico'){
  const g=new THREE.Group();
  const pal={
    calico: {base:0xf7f4ee,p1:0xe0782c,p2:0x222126,earIn:0xf5bcc6,eye:0x48b862},
    tuxedo: {base:0xf8f9fb,p1:0x1b1d22,p2:0x1b1d22,earIn:0xf0b8c4,eye:0x52c872},
    tabby:  {base:0xf7efe4,p1:0xe88632,p2:0xba5e18,earIn:0xf5bcc6,eye:0xd48e28},
    siamese:{base:0xf4ecdf,p1:0x4a3a32,p2:0x382c26,earIn:0x886c64,eye:0x5bc8ff}
  }[breed]||{base:0xf7f4ee,p1:0xe0782c,p2:0x222126,earIn:0xf5bcc6,eye:0x48b862};

  // 有机顶点斑纹着色函数（平滑无缝自然花纹，告别贴圆球补丁！）
  function catColor(u,th,x,y,z){
    const cy=Math.cos(th);
    if(breed==='calico'){
      if(cy<-.25)return pal.base;
      const w=Math.sin(z*13+x*16+1.1)+Math.cos(z*9-x*12)*.6;
      if(w>.48)return pal.p1;
      if(w<-.45)return pal.p2;
      return pal.base;
    }
    if(breed==='tuxedo'){
      if(cy<-.12||(u>.65&&cy<.3))return pal.base;
      return pal.p1;
    }
    if(breed==='tabby'){
      if(cy<-.20)return pal.base;
      return Math.sin(z*36+Math.abs(x)*14)>.45?pal.p2:pal.p1;
    }
    // siamese: 深色面具与肢端
    if(u>.82)return pal.p1;
    return pal.base;
  }

  const legH=.24, by=.29, hipY=by-.005;
  // 极轻盈柔美猫躯：饱满后股 + 优雅微弓背 + 修颈（充分包容猫腿肩股枢轴）
  g.add(loftProfile([
    {z:-.22,y:by,     rx:.003,ryTop:.003,ryBot:.003},
    {z:-.18,y:by+.01, rx:.058,ryTop:.064,ryBot:.058},
    {z:-.10,y:by+.015,rx:.070,ryTop:.076,ryBot:.062}, // 后胯包裹大腿
    {z:+.01,y:by+.025,rx:.058,ryTop:.064,ryBot:.046}, // 敏捷细腰
    {z:+.12,y:by+.010,rx:.070,ryTop:.072,ryBot:.078}, // 胸肩包裹前腿
    {z:+.19,y:by+.045,rx: .056,ryTop:.056,ryBot:.062},
    {z:+.23,y:by+.105,rx:.042,ryTop:.044,ryBot:.044}
  ],18,(u,th,x,y,z)=>catColor(u,th,x,y,z)));

  // 甜美精致猫首 + 短翘吻垫 + 粉鼻尖 + 花斑尖耳 + 细须
  const headG=new THREE.Group();headG.position.set(0,by+.12,.22);g.add(headG);
  headG.add(loftProfile([
    {z:-.06,y:-.01, rx:.042,ryTop:.044,ryBot:.040},
    {z:-.005,y:.016,rx:.084,ryTop:.074,ryBot:.062}, // 圆润双颊
    {z:+.048,y:.018,rx:.076,ryTop:.066,ryBot:.052},
    {z:+.082,y:-.002,rx:.042,ryTop:.030,ryBot:.032}, // 短俏猫鼻吻
    {z:+.105,y:-.008,rx:.022,ryTop:.018,ryBot:.016},
    {z:+.112,y:-.010,rx:.003,ryTop:.003,ryBot:.003}
  ],18,(u,th,x,y,z)=>{
    if(u>.86)return 0xf2829a; // 粉嫩小鼻尖
    if(breed==='calico'&&u>.25&&Math.cos(th)>.28)return x>0?pal.p1:pal.p2; // 头顶经典对称双色开脸！
    if(breed==='tuxedo'&&Math.cos(th)>-.05&&Math.abs(x)>.018)return pal.p1;
    if(breed==='siamese'&&u>.55)return pal.p1;
    if(breed==='tabby'&&Math.cos(th)>.25)return Math.sin(x*50)>.2?pal.p2:pal.p1;
    return pal.base;
  }));
  attachEyes(headG,.042,.024,.062,.36,pal.eye,0x0b0b0e,.0175);
  const wht=M(0xffffff,{roughness:.1});
  for(const s of [-1,1]){
    const eCol=breed==='calico'?(s>0?pal.p1:pal.p2):(breed==='tabby'?pal.p1:pal.p1);
    const ear=sculptEar(.058,.092,eCol,pal.earIn);
    ear.position.set(s*.054,.064,.002);ear.rotation.set(.12,s*.16,-s*.26);headG.add(ear);
    for(let w=-1;w<=1;w++) addNS(headG,BX(.075,.003,.003),wht,s*.060,-.016+w*.010,.076).rotation.z=s*w*.16;
  }

  // 纤细优雅猫腿：肩股深入躯干内部 + 肌群包覆融合 + 完整封顶防离体
  const scH=hipY/.355;
  const legs=[];
  for(const [lx,lz,f] of [[.038,.115,1],[-.038,.115,1],[.042,-.115,0],[-.042,-.115,0]]){
    const sgn=lx>0?1:-1;
    const shCol=breed==='tuxedo'?pal.p1:(breed==='calico'?(f?(lx>0?pal.p1:pal.base):(lx>0?pal.p2:pal.p1)):(breed==='tabby'?pal.p1:pal.base));
    add(g,new THREE.SphereGeometry(.044,10,8),M(shCol,{roughness:.85}),lx*.72,hipY,lz).scale.set(.8,1.18,1.3);
    const fNodes=[
      [-sgn*.014,.020,0,.003,.003],[-sgn*.008,.008,0,.034,.044],[0,-.040*scH,-.004,.030,.038],
      [0,-.14*scH,-.018,.020,.024],[0,-.27*scH,-.004,.016,.018],
      [0,-.33*scH,.014,.017,.020],[0,-.346*scH,.030,.022,.030],[0,-.355*scH,.028,.002,.002]
    ];
    const hNodes=[
      [-sgn*.014,.020,.005,.003,.003],[-sgn*.008,.008,.008,.038,.054],[0,-.040*scH,.010,.034,.046],
      [0,-.13*scH,.026,.024,.032],[0,-.23*scH,-.030,.017,.020],
      [0,-.33*scH,-.014,.016,.018],[0,-.346*scH,.008,.022,.030],[0,-.355*scH,.006,.002,.002]
    ];
    const lg=new THREE.Group();lg.position.set(lx,hipY,lz);g.add(lg);
    lg.add(loftLimb(f?fNodes:hNodes,10,(u)=>u>.68?(breed==='siamese'?pal.p1:pal.base):(breed==='tuxedo'?pal.p1:breed==='tabby'?pal.p1:pal.base)));
    legs.push(lg);
  }

  // S 形修长灵动猫尾
  const tailG=new THREE.Group();tailG.position.set(0,by+.01,-.18);g.add(tailG);
  tailG.add(loftTail([
    new THREE.Vector3(0,0,0),new THREE.Vector3(0,.09,-.10),
    new THREE.Vector3(0,.22,-.06),new THREE.Vector3(0,.32,-.13)
  ],u=>.022*(1-u*.38),10,(u)=>{
    if(breed==='calico')return u>.55?pal.p2:(u>.25?pal.p1:pal.base);
    if(breed==='tabby')return Math.sin(u*24)>0?pal.p2:pal.p1;
    return pal.p1;
  }));

  g.userData={headG,tailG,legs};
  return g;
}

/* ════════════════════════════════════════════════════════════
   9. 背景：城市天际线 + 雪山群峰 + 云 + 空中圣诞老人雪橇队
   ════════════════════════════════════════════════════════════ */
/* 校区自发光材质登记表：白天压到很暗（不然满墙橙色窗户像办公楼），
   夜里再点亮。applyTime 里按昼夜统一改。 */
const GZU_EMI=[];
const skyline=new THREE.Group();scene.add(skyline);
const skylineMats=[];
{
  // ══ 0. 写实砖石建筑立面贴图 + 凹凸法线（消除平滑塑料积木感） ══
  const facadeSpecs=[
    {wall:'#623930',brick:'#4a2821',trim:'#9a8372',wins:['#ffe3a3','#ffd074','#fff4d6']}, // 暖红砖商业楼
    {wall:'#5a626d',brick:'#484f59',trim:'#9aa2ad',wins:['#ffe6b3','#d8ecff','#ffcf78']}, // 暖灰石材街区楼
    {wall:'#314152',brick:'#253240',trim:'#708296',wins:['#ffd98a','#cde6ff','#fde68a']}  // 深蓝灰欧式精品楼
  ];
  for(let p=0;p<3;p++){
    const sp=facadeSpecs[p];
    const c=document.createElement('canvas');c.width=512;c.height=512;
    const x=c.getContext('2d');
    const b=document.createElement('canvas');b.width=512;b.height=512;
    const bx=b.getContext('2d');
    x.fillStyle=sp.wall;x.fillRect(0,0,512,512);
    bx.fillStyle='#888';bx.fillRect(0,0,512,512);
    // 真实交错砖缝与随机明暗肌理
    for(let row=0;row<32;row++){
      const yy=row*16, off=(row%2)*16;
      x.fillStyle=sp.brick;x.fillRect(0,yy,512,2);
      bx.fillStyle='#444';bx.fillRect(0,yy,512,2);
      for(let col=0;col<16;col++){
        const xx=(col*32+off)%512;
        if(rng()<.35){
          x.fillStyle=rng()<.5?'rgba(255,255,255,.04)':'rgba(0,0,0,.06)';
          x.fillRect(xx+2,yy+2,28,12);
        }
        x.fillStyle=sp.brick;x.fillRect(xx,yy,2,16);
        bx.fillStyle='#555';bx.fillRect(xx,yy,2,16);
      }
    }
    const cols=4, rows=4, cw=512/cols, rh=512/rows;
    for(let r=0;r<rows;r++){
      x.fillStyle=sp.trim;x.fillRect(0,r*rh,512,6);
      bx.fillStyle='#d8d8d8';bx.fillRect(0,r*rh,512,6);
      for(let col=0;col<cols;col++){
        const wx=col*cw+26, wy=r*rh+22, ww=cw-52, wh=rh-44;
        // 外框与深凹阴影
        x.fillStyle=sp.trim;x.fillRect(wx-6,wy-6,ww+12,wh+12);
        x.fillStyle='#192028';x.fillRect(wx-2,wy-2,ww+4,wh+4);
        bx.fillStyle='#ececec';bx.fillRect(wx-6,wy-6,ww+12,wh+12);
        bx.fillStyle='#1f1f1f';bx.fillRect(wx,wy,ww,wh);
        if(rng()<.68){
          /* 夜景城市不能是一格一格一模一样的暖黄矩阵 ——
             色温（白炽黄 / 暖白 / 荧光冷白 / 绿白）随机，
             明度随机（有的全亮、有的半亮），再随机来一扇「只亮一半」的窗，
             一栋楼里才像真有人住，而不是贴了一张 Excel 表格。 */
          const wcol=['#ffd27a','#ffe9b8','#ffe0a0','#cfe0ff','#d8f0ff','#e2ffd6'][Math.floor(rng()*6)];
          const g=x.createLinearGradient(wx,wy,wx,wy+wh);
          g.addColorStop(0,'#2e3540');
          g.addColorStop(.32,sp.wins[Math.floor(rng()*sp.wins.length)]);
          g.addColorStop(1,wcol);
          x.fillStyle=g;
          x.globalAlpha=.34+rng()*.64;
          x.fillRect(wx,wy,ww,wh);
          if(rng()<.30){                       // 只亮一半（像拉着半边窗帘）
            x.globalAlpha=.16+rng()*.22;

  // 根据建筑真实尺寸（米）缩放 BoxGeometry UV，确保每层高 3.2m、每开间 3.0m
  const makeScaledBox=(w,h,d,tileW=12.0,tileH=12.8)=>{
    const g=new THREE.BoxGeometry(w,h,d);

  // ══ 2. 写实立体街区建筑群（立体壁柱、挑檐、门头灯箱、阳台、烟囱与坡屋顶，告别积木感） ══

       长轴（南北）330m、短轴（东西）300m，屋面最高 69m 在南北两端、东西侧约 50m，

  const rE=v=>curveAt([[0,1],[0.32,0.945],[0.64,0.820],[1,0.400]],v);

  const ellipseBand=(aIn,bIn,aOut,bOut,seg)=>{

  const nestSteelM=M(0x8d96a2,{roughness:.42,metalness:.58});

  const nestFilmM=new THREE.MeshStandardMaterial({

  {
    const NU=112,NV=24,pos=[],uv=[],idx=[];

     远看是连续网面、近看是实打实的杆件 —— 贴图网面完全出不来这个效果。
     这里用 InstancedMesh：一根 BoxGeometry 缩放成千上万根梁，1 个 draw call。 */
  const NL=12, NC=104;

     之前这里写成 NL*NC*2 + NL*RING_PER + 24 = 2538，实际放进 2832 根 ——

  const ROD_N=NL*NC*2 + NL*RING_PER*8 + 24*8;
  const nestRod=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),nestSteelM,ROD_N);
  {
    const d=new THREE.Object3D(),p=new THREE.Vector3(),q=new THREE.Vector3();
    const dir=new THREE.Vector3(),AX=new THREE.Vector3(0,0,1),qq=new THREE.Quaternion();
    let k=0;
    /* 注意：不能用 d.lookAt(p2)。
       Object3D.lookAt 内部把目标当「世界坐标」处理，而这里的 p2 是鸟巢局部坐标
       （组在 z=-100），算出来的朝向会整体偏掉 —— 旧鸟巢的钢杆方向就是这么歪的。
       直接用四元数把局部 +Z 轴对齐方向向量，结果与坐标系无关。 */
    const put=(p1,p2,w)=>{
      const len=p1.distanceTo(p2);
      if(len<0.01)return;
      d.position.copy(p1).lerp(p2,.5);
      dir.subVectors(p2,p1).normalize();
      d.quaternion.setFromUnitVectors(AX,dir);
      d.scale.set(w,w,len);
      d.updateMatrix();
      nestRod.setMatrixAt(k++,d.matrix);
    };
    for(let L=0;L<NL;L++){
      const v0=0.035+L*0.0815;
      if(v0>0.90)break;
      for(let C=0;C<NC;C++){
        const u0=((C/NC)+(L*0.0431))%1;
        const a0=u0*Math.PI*2;
        /* 两组反斜向杆：交叉成菱形网 */
        for(const dir of [1,-1]){
          const j1=nhash(L*9973+C*31+dir*7),j2=nhash(L*131+L*9973+C*53+dir*11);
          const wob=(j1-.5)*0.022;                       /* 半径方向随机扰动 */
          const v1=Math.min(.975,v0+0.070+j2*0.012);
          const du=dir*(0.0285+j1*0.004);
          const a1=a0+du;
          nestP(a0,v0,p);nestP(a1,v1,q);
          const rr=1+wob;
          p.set(p.x*rr,p.y,p.z*rr);q.set(q.x*rr,q.y,q.z*rr);
          put(p,q,0.34+j1*0.09);
        }
      }
      /* 环向次梁：每层 4 段弧（水平环向，是屋面的第二道骨架） */
      for(let S=0;S<RING_PER;S++){
        const a0=(S/RING_PER)*Math.PI*2+ (L%2?0.04:0);
        const a1=((S+1)/RING_PER)*Math.PI*2;
        const v=v0+0.030;
        const SEG=8;
        for(let s=0;s<SEG;s++){
          const b0=a0+(a1-a0)*(s/SEG),b1=a0+(a1-a0)*((s+1)/SEG);
          const rr=0.990;
          nestP(b0,v,p);nestP(b1,v,q);
          p.set(p.x*rr,p.y,p.z*rr);q.set(q.x*rr,q.y,q.z*rr);
          put(p,q,0.42);
        }
      }
    }
    /* 竖向次梁：每 15° 一根，从碗沿直通天洞 */
    for(let s=0;s<24;s++){
      const a=s/24*Math.PI*2;
      const SEG=8;
      for(let i=0;i<SEG;i++){
        const v0=0.02+i*(0.96/SEG),v1=0.02+(i+1)*(0.96/SEG);
        const rr=0.992;
        nestP(a,v0,p);nestP(a,v1,q);
        p.set(p.x*rr,p.y,p.z*rr);q.set(q.x*rr,q.y,q.z*rr);
        put(p,q,0.46);
      }
    }
    nestRod.count=k;                      // 实际放了多少根就渲染多少根，别留空实例
    nestRod.instanceMatrix.needsUpdate=true;
  }
  nestRod.castShadow=false;nestRod.receiveShadow=false;nest.add(nestRod);

  /* ── 24 根主支撑格构柱：伞骨，从碗沿外侧地面斜撑到屋面 ──
     几何硬约束（这版整个重做过 —— 原版柱身直接从看台踏面里犁过去，
     每根柱都在看台上犁出一道沟，柱头还顶穿屋面）：
       · 柱脚落在环梁外 4m 的地面椭圆上；
       · 柱轴斜率固定 K=1.72（与水平面约 60°）；
       · 柱头 = 柱轴与屋面的交点（数值求解，南北 v≈0.47 / 东西 v≈0.31）。
     由此可把三个「不穿模」条件算死：
       ① 柱在碗沿环梁半径处中心高 6.88m，柱顶 7.73m < 环梁底 8.23m → 不碰环梁；
       ② 柱在半径 46.7m 处已升到看台顶面高度 9.05m，而看台外缘在 44m
          → 柱全程在看台之上，不穿踏面；
       ③ 柱轴始终在屋面之下，只在柱头一点相接 → 不穿屋面。 */
  {
    const CHORD=.40, SPAN=1.45, K=1.72;
    const FOOT_X=NEST.B+4.0, FOOT_Z=NEST.A+4.0;   /* 柱脚椭圆：47.6 / 52 */
    const chords=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),nestSteelM,24*4);
    const lacing=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),nestSteelM,24*14);
    const feet  =new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),concM,24);
    const knots =new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),nestSteelM,24);
    const d=new THREE.Object3D(),bot=new THREE.Vector3(),top=new THREE.Vector3();
    const ax=new THREE.Vector3(),u1=new THREE.Vector3(),u2=new THREE.Vector3(),tmp=new THREE.Vector3();
    const dir=new THREE.Vector3(),AX=new THREE.Vector3(0,0,1);
    /* 柱脚距圆心的水平距离 / 屋面上某点的水平距离 */
    const dF=a=>Math.hypot(FOOT_X*Math.cos(a),FOOT_Z*Math.sin(a));
    const dQ=(a,v)=>{const p=nestP(a,v,new THREE.Vector3());return Math.hypot(p.x,p.z);};
    /* 求柱轴与屋面的交点：f(v)=屋面高度 - K*(柱脚距 - 该点距) */
    const solveV=(a)=>{
      const DF=dF(a);
      let pv=0,pf=Infinity;
      for(let i=1;i<=300;i++){
        const v=i/300*.98;
        const f=nestY(a,v)-K*(DF-dQ(a,v));
        if(pf===Infinity){pv=v;pf=f;continue;}
        if(pf>0&&f<=0)return pv+(v-pv)*(pf/(pf-f));
        pv=v;pf=f;
      }
      return .5;
    };
    let ci=0,li=0;
    for(let s=0;s<24;s++){
      const a=s/24*Math.PI*2;
      bot.set(Math.cos(a)*FOOT_X,0,Math.sin(a)*FOOT_Z);
      nestP(a,solveV(a),top);
      ax.subVectors(top,bot).normalize();
      tmp.set(0,1,0);
      if(Math.abs(ax.dot(tmp))>.94)tmp.set(1,0,0);
      u1.crossVectors(ax,tmp).normalize();
      u2.crossVectors(ax,u1).normalize();
      /* 柱脚混凝土基座 */
      d.position.copy(bot);d.position.y=.28;d.quaternion.identity();
      d.scale.set(2.1,.56,2.1);d.updateMatrix();
      feet.setMatrixAt(s,d.matrix);
      /* 柱头节点块（与屋面咬合的支座） */
      d.position.copy(top);
      d.quaternion.setFromUnitVectors(AX,ax);
      d.scale.set(1.7,.5,1.7);d.updateMatrix();
      knots.setMatrixAt(s,d.matrix);
      /* 4 根角钢 */
      const corner=[[-1,-1],[1,-1],[1,1],[-1,1]];
      for(const [s1,s2] of corner){
        const p=new THREE.Vector3().copy(bot)
          .addScaledVector(u1,s1*SPAN/2).addScaledVector(u2,s2*SPAN/2);
        const q=new THREE.Vector3().copy(top)
          .addScaledVector(u1,s1*SPAN/2).addScaledVector(u2,s2*SPAN/2);
        const len=p.distanceTo(q);
        d.position.copy(p).lerp(q,.5);
        dir.subVectors(q,p).normalize();
        d.quaternion.setFromUnitVectors(AX,dir);
        d.scale.set(CHORD,CHORD,len);d.updateMatrix();
        chords.setMatrixAt(ci++,d.matrix);
      }
      /* 缀条：柱身每 1/8 一道横撑（每柱 2 道，共 14 根） */
      for(let l=1;l<=7;l++){
        const t=l/8;
        const c=new THREE.Vector3().copy(bot).lerp(top,t);
        for(let e=0;e<2;e++){
          const p=new THREE.Vector3().copy(c).addScaledVector(u1,(e?1:-1)*SPAN/2).addScaledVector(u2,-SPAN/2);
          const q=new THREE.Vector3().copy(c).addScaledVector(u1,(e?1:-1)*SPAN/2).addScaledVector(u2, SPAN/2);
          const len=p.distanceTo(q);
          d.position.copy(p).lerp(q,.5);
          dir.subVectors(q,p).normalize();
          d.quaternion.setFromUnitVectors(AX,dir);
          d.scale.set(.18,.18,len);d.updateMatrix();
          lacing.setMatrixAt(li++,d.matrix);
        }
      }
    }
    chords.count=ci;lacing.count=li;      // 实际放了多少就渲染多少，别让实例数溢出缓冲
    chords.instanceMatrix.needsUpdate=true;lacing.instanceMatrix.needsUpdate=true;
    feet.instanceMatrix.needsUpdate=true;knots.instanceMatrix.needsUpdate=true;
    for(const o of [chords,lacing,feet,knots]){
      o.castShadow=false;o.receiveShadow=false;nest.add(o);
    }
  }

  /* 天洞环梁是马鞍的，必须按真实高度走，不能用一个平均高度。
     碗沿主环梁已在上面「悬挑碗沿格构环带」里建过（外圈），这里不再重复。 */
  {
    const pts=[];
    for(let i=0;i<120;i++){
      const a=i/120*Math.PI*2;
      const p=nestP(a,1,new THREE.Vector3());
      pts.push(p);
    }
    const curve=new THREE.CatmullRomCurve3(pts,true);
    const m=add(nest,new THREE.TubeGeometry(curve,180,.72,8,true),nestSteelM,0,0,0);
    m.castShadow=true;
  }

  /* ── 内场照明：草皮上叠一层冷白加色（像被场灯照亮）──
     原来这条是「碗沿内侧大面积加色泛光带」（暖橙、贴在内场圈上），
     一大片半透明橙环把看台下沿糊成脏橙色，是「杂乱感」的主要来源。
     现在换成小面积冷白草皮灯带 + 看台 LED 灯带，画面立刻干净。 */
  {
    const poolM=new THREE.MeshBasicMaterial({
      map:glowTex,color:0xcfe0ff,transparent:true,opacity:.20,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
    const g=new THREE.Mesh(ellipseBand(R_IN_A-4.6,R_IN_B-4.2,R_IN_A-1.6,R_IN_B-1.4,96),poolM);
    g.position.set(0,.13,0);
    g.renderOrder=2;g.userData.noReflect=true;nest.add(g);
  }
  /* ── 场边高杆灯已删除（4 根 16.5m 的大灯杆直接插在跑道草皮里）──
     原来这 4 根杆立在草皮中央、杆身插进场地，既是「杂乱感」的一大来源，
     也是一处实打实的穿模（灯杆底座埋在跑道里）。现代体育场的室内照明本来就
     来自屋面灯槽与碗沿 LED，所以这里只留两样：
       ① 碗沿外圈地面的一道冷白「洗墙光带」；
       ② 屋面钢格构自身的自发光（见 nestSteelM）。
     整座鸟巢的夜色从此只有一种色相：冷白。 */
  {
    const washM=new THREE.MeshBasicMaterial({
      map:glowTex,color:0xcfe0ff,transparent:true,opacity:.14,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
    const w=new THREE.Mesh(ellipseBand(NEST.A+1.0,NEST.B+1.0,NEST.A+6.2,NEST.B+6.2,96),washM);
    w.position.set(0,.09,0);
    w.renderOrder=2;w.userData.noReflect=true;nest.add(w);
  }

  /* ── 南侧主入口：门廊 + 发光门厅 + 台阶 + 售票亭 + 旗杆 ── */
  {
    const ez=NEST.B+2.0;
    /* 门厅：中性冷白（和屋面钢构同一色相），售票亭窗口留一点暖琥珀做焦点 */
    const doorGlow=new THREE.MeshStandardMaterial({
      color:0x1c2532,emissive:0xd6e8ff,emissiveIntensity:.50,roughness:.3});
    const winGlow=new THREE.MeshStandardMaterial({
      color:0x2a2118,emissive:0xffb877,emissiveIntensity:.55,roughness:.3});
    addNS(nest,BX(24,1.2,6.0),M(0xc2bdb4,{roughness:.86}),0,.6,ez+2.8);
    addNS(nest,BX(23.4,.18,5.6),M(0xd6d1c8,{roughness:.82}),0,1.26,ez+2.8);
    /* 门廊：六根钢柱 + 顶盖 */
    for(const sx of [-1,0,1])for(const sz of [-1,1]){
      addNS(nest,new THREE.CylinderGeometry(.30,.34,8.0,10),nestSteelM,sx*9.4,4.0,ez+2.8+sz*2.2);
    }
    addNS(nest,BX(23,.66,6.4),nestSteelM,0,8.3,ez+2.8);
    addNS(nest,BX(23.4,.24,6.8),M(0xeef4f8,{roughness:.94}),0,8.72,ez+2.8);
    /* 门厅暖光 */
    addNS(nest,BX(17,5.2,.16),doorGlow,0,2.8,ez+1.2);
    addNS(nest,BX(19,1.1,.6),doorGlow,0,6.0,ez+1.1);
    /* 售票亭 ×2 */
    for(const sx of [-1,1]){
      const bx=sx*14.6;
      addNS(nest,BX(4.0,3.4,3.0),M(0xd8d3ca,{roughness:.8}),bx,1.7,ez+3.4);
      addNS(nest,BX(4.3,.26,3.3),M(0x9fa4a8,{roughness:.8}),bx,3.52,ez+3.4);
      addNS(nest,BX(4.4,.20,3.4),M(0xeef4f8,{roughness:.94}),bx,3.75,ez+3.4);
      addNS(nest,BX(2.4,1.2,.12),winGlow,bx,2.1,ez+1.88);
    }
    /* 旗杆 ×4 */
    for(let i=0;i<4;i++){
      const fx=-13.5+i*9;
      addNS(nest,new THREE.CylinderGeometry(.09,.12,11.0,8),M(0xe4e6e8,{roughness:.34,metalness:.5}),fx,5.5,ez+6.4);
      addNS(nest,new THREE.SphereGeometry(.15,10,8),M(0xf0d68a,{roughness:.3,metalness:.7}),fx,11.2,ez+6.4);
      const fl=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.2),new THREE.MeshBasicMaterial({
        color:i%2?0xc02a2f:0x3d82c0,side:THREE.DoubleSide}));
      fl.position.set(fx+.92,9.6,ez+6.4);fl.castShadow=false;nest.add(fl);
    }
  }

  /* ── 周边铺装环路 + 行道树 + 路灯 ── */
  {
    const paveM=M(0xc4ccd2,{roughness:.9});
    /* 铺装从看台外缘(44/39.6) 就开始铺，把悬挑碗沿下面那圈 4m 空隙盖住，
       玩家从南门进来走的是有铺装的地面，不会踩在悬空区里。 */
    const ring=add(nest,ellipseBand(OUT_A-.8,OUT_B-.8,NEST.A+5.0,NEST.B+5.0,96),paveM,0,.06,0);
    ring.castShadow=false;ring.receiveShadow=true;
    /* 原来这里还有一条 4.5m 宽的"外环马路"，加上内圈铺装带就是两条大环，
       在鸟巢外围套出明显的"马路圈"—— 已删。地面留铺装 + 雪地即可。 */
    /* 行道树：沿外环等距排（南侧留出入口） */
    const treeM=M(0x3f5a3c,{roughness:.95});
    for(let i=0;i<26;i++){
      const a=i/26*Math.PI*2;
      if(Math.sin(a)>0.72)continue;                       /* 南侧留口 */
      const px=Math.cos(a)*(NEST.B+7.2),pz=Math.sin(a)*(NEST.A+7.2);
      addNS(nest,new THREE.CylinderGeometry(.22,.30,3.2,7),M(0x4a3b2e,{roughness:.95}),px,1.6,pz);
      const cr=new THREE.Mesh(new THREE.ConeGeometry(1.9,5.4,8),treeM);
      cr.position.set(px,5.4,pz);cr.castShadow=true;nest.add(cr);
    }
    /* 路灯 */
    for(let i=0;i<12;i++){
      const a=i/12*Math.PI*2;
      if(Math.sin(a)>0.72)continue;
      const px=Math.cos(a)*(NEST.B+6.0),pz=Math.sin(a)*(NEST.A+6.0);
      addNS(nest,new THREE.CylinderGeometry(.13,.18,6.2,8),M(0x6e747a,{roughness:.7,metalness:.3}),px,3.1,pz);
      addNS(nest,BX(.7,.22,.7),M(0xe9f2ff,{roughness:.4,emissive:0xcfe0ff,emissiveIntensity:.8}),px,6.3,pz);
    }
  }

  /* 碗沿碰撞体在下面单独加 —— OUTDOOR_OBS 这个表在模块靠后位置才建，
     在这里 push 会撞上 TDZ（Cannot access before initialization）。 */
}

/* ══ 3. 游乐园左侧璀璨圣诞教堂 (-49, 0, 36) ══
   这一整段上一轮「拆花溪校区」时被连带删掉了（校区段 7220~8919 覆盖到了这里），
   后果不只是教堂没了：教堂广场那块铺装地面也跟着没了，
   底下的城市街道网格整片露出来 —— 看起来就是「游乐园的地面莫名其妙多了很多马路」。
   现已从 63ebe0c 原样恢复。 */
{
  // ══ 3. 游乐园左侧璀璨圣诞教堂 (-49, 0, 36) ══
  const lmGroup=new THREE.Group();scene.add(lmGroup);
  // 新海诚冬夜暖金烛光哥特花窗 & 圣洁玫瑰花窗贴图（告别花哨彩色格子，呈现柔和暖琥珀透光质感）
  const stainedTex=(()=>{
    const c=document.createElement('canvas');c.width=128;c.height=256;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,256,0,0);
    g.addColorStop(0,'#ffb85c');g.addColorStop(.45,'#e88b48');g.addColorStop(.82,'#34568b');g.addColorStop(1,'#182946');
    x.fillStyle=g;x.fillRect(0,0,128,256);
    x.strokeStyle='#1c2536';x.lineWidth=3;
    for(let y=28;y<256;y+=32){x.beginPath();x.moveTo(0,y);x.lineTo(128,y);x.stroke();}
    for(let cx=32;cx<128;cx+=32){x.beginPath();x.moveTo(cx,0);x.lineTo(cx,256);x.stroke();}
    x.strokeStyle='#c9a35e';x.lineWidth=4;x.strokeRect(2,2,124,252);
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
  })();
  const roseTex=(()=>{
    const c=document.createElement('canvas');c.width=256;c.height=256;
    const x=c.getContext('2d');
    const rg=x.createRadialGradient(128,128,10,128,128,120);
    rg.addColorStop(0,'#fff3c4');rg.addColorStop(.42,'#ffbe5c');rg.addColorStop(.78,'#43689c');rg.addColorStop(1,'#18253c');
    x.fillStyle=rg;x.fillRect(0,0,256,256);
    x.strokeStyle='rgba(26,34,48,.75)';x.lineWidth=3.5;
    for(let i=0;i<16;i++){
      const a=i*(Math.PI*2/16);
      x.beginPath();x.moveTo(128,128);x.lineTo(128+Math.cos(a)*118,128+Math.sin(a)*118);x.stroke();
    }
    x.strokeStyle='#e0b868';x.lineWidth=6;x.beginPath();x.arc(128,128,116,0,Math.PI*2);x.stroke();
    x.beginPath();x.arc(128,128,58,0,Math.PI*2);x.stroke();
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
  })();
  const stainedM=new THREE.MeshBasicMaterial({map:stainedTex});
  const roseM=new THREE.MeshBasicMaterial({map:roseTex});
  const brickRedM=M(0x7c2d28,{roughness:.76,metalness:.06});
  const ivoryStoneM=M(0xe6dfd3,{roughness:.72,metalness:.06});
  const wineVelvetM=M(0x7a1724,{roughness:.68,metalness:.14});
  const goldTrimM=M(0xe0b24c,{roughness:.28,metalness:.82});
  const slateRoofM=M(0x28323e,{roughness:.72,metalness:.18});
  const copperDomeM=M(0x2d6e6c,{roughness:.36,metalness:.62});
  const woodDoorM=M(0x4a2417,{roughness:.72});
  const warmGlowM=new THREE.MeshBasicMaterial({color:0xffe49e});
  const goldGlowM=new THREE.MeshBasicMaterial({color:0xffcf56});
  const redGlowM=new THREE.MeshBasicMaterial({color:0xff4757});
  const greenGlowM=new THREE.MeshBasicMaterial({color:0x2ed573});
  const carpetM=M(0xb01e28,{roughness:.84});
  const garlandM=M(0x1b5230,{roughness:.85});

  // 辅助：沿线段排布发光圣诞灯串
  const addLightString=(parent,x1,y1,z1,x2,y2,z2,count,palette)=>{
    for(let i=0;i<=count;i++){
      const t=i/count;
      const mat=palette[i%palette.length];

    for(const sx of [-1,1]){

       同一个 t：不管谁在哪台设备上登录，抬头看到的都是同一时刻。

       ══════════════════════════════════════════════════════════════════ */
    const CLOCK_R=1.72;                      // 钟盘半径

    /* ── 盘面：罗马数字 + 分钟刻度 + 金环（512 画布）── */
    const clockFaceTex=(()=>{

      g.addColorStop(0,'#2a3a5e');g.addColorStop(.70,'#17223c');g.addColorStop(1,'#0c1326');

    const CLOCK_FACES=[

    const clockSlotM=M(0x1d2740,{roughness:.70,metalness:.10,emissive:0x3a2a12,emissiveIntensity:.30});
    for(const wz of [-.98,.98]){

/* ══ 教堂 / 大剧院 后场 · 大号热气球（真实构造 · 光遇柔光质感 · 可登乘升降）══

const balloons=[];

/* ── 迪士尼乐园风格瓜瓣贴图 ──
   迪士尼乐园那排气球长这样：竖条高饱和彩色瓜瓣，每瓣印一个角色图案，
   顶部一顶金皇冠，底下一圈奶油色扇贝裙边。
   贴图画成 128×1024 的窄长条（对上瓜瓣约 2.0m 宽 × 15.5m 高的比例，图案才不会被拉扁），
   每片瓜瓣一张，同时当 map 和 emissiveMap 用 ——
   夜里只有图案本身会发光，黑色米奇剪影仍然是黑的，不会被整片自发光冲成灰影。 */
const DISNEY_PALETTE=[0xd93a2c,0xe8a81a,0x2f6fbe,0x3f8f4a,0xd9701f,0x76449f,0xd9446f,0x1a93a4];
const DISNEY_MOTIFS=['mickey','castle','text','star'];
function disneyGoreTex(hex,motif){
  const W=128,H=1024;
  const [c,x]=cv(W,H);
  x.fillStyle='#'+hex.toString(16).padStart(6,'0');
  x.fillRect(0,0,W,H);
  /* 竖向布纹 */
  for(let i=0;i<W;i+=4){x.fillStyle='rgba(255,255,255,.055)';x.fillRect(i,0,2,H);}
  /* 顶部受暖光提亮、火焰口方向压暗（画布顶端 = 伞顶） */
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,255,255,.16)');
  g.addColorStop(.34,'rgba(255,255,255,.02)');
  g.addColorStop(.68,'rgba(0,0,0,.05)');
  g.addColorStop(1,'rgba(0,0,0,.28)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  /* ── 印刷图案 ──
     位置定在画布 70% 处 = 伞高 30% 处 —— 正好是伞身最宽的那一圈
     （prof 在 t≈0.3 取到最大半径 5.6m），图案画在这里既贴在最宽处，
     仰拍机位下又落在画面中部；之前放在画布 44%（伞高 56%），
     那半截被透视压扁，图案挤在伞顶一小撮里，远看只有一小条。 */
  const cx=W/2, cy=H*.70, R=W*.45;
  if(motif==='mickey'){
    x.fillStyle='#16161b';
    x.beginPath();x.arc(cx,cy,R*.86,0,Math.PI*2);x.fill();
    x.beginPath();x.arc(cx-R*.62,cy-R*.60,R*.38,0,Math.PI*2);x.fill();
    x.beginPath();x.arc(cx+R*.62,cy-R*.60,R*.38,0,Math.PI*2);x.fill();
    x.fillStyle='#fdf7ea';
    x.beginPath();x.ellipse(cx,cy+R*.13,R*.60,R*.53,0,0,Math.PI*2);x.fill();
    x.fillStyle='#16161b';
    x.beginPath();x.ellipse(cx-R*.24,cy+R*.05,R*.105,R*.145,0,0,Math.PI*2);x.fill();
    x.beginPath();x.ellipse(cx+R*.24,cy+R*.05,R*.105,R*.145,0,0,Math.PI*2);x.fill();
    x.beginPath();x.ellipse(cx,cy+R*.28,R*.125,R*.095,0,0,Math.PI*2);x.fill();
  }else if(motif==='castle'){
    x.fillStyle='#fdf6e4';
    const tower=(tx,ty,w,h)=>{
      x.fillRect(tx-w/2,ty-h,w,h);
      x.beginPath();x.moveTo(tx-w*.62,ty-h);x.lineTo(tx,ty-h-w*1.5);x.lineTo(tx+w*.62,ty-h);x.closePath();x.fill();
      return ty-h-w*1.5;
    };
    const a1=tower(cx,cy+R*.85,R*.46,R*1.55);
    const a2=tower(cx-R*.62,cy+R*.85,R*.32,R*1.05);
    const a3=tower(cx+R*.62,cy+R*.85,R*.32,R*1.05);
    x.fillStyle='#3a2a1c';
    x.beginPath();x.moveTo(cx-R*.15,cy+R*.85);x.lineTo(cx-R*.15,cy+R*.42);
    x.arc(cx,cy+R*.42,R*.15,Math.PI,0);x.lineTo(cx+R*.15,cy+R*.85);x.closePath();x.fill();
    x.fillStyle='#f0c64a';
    for(const fx of [[cx,a1],[cx-R*.62,a2],[cx+R*.62,a3]]){
      x.fillRect(fx[0]-1.5,fx[1]-R*.26,3,R*.26);
      x.beginPath();x.moveTo(fx[0],fx[1]-R*.26);x.lineTo(fx[0]+R*.22,fx[1]-R*.18);
      x.lineTo(fx[0],fx[1]-R*.10);x.closePath();x.fill();
    }
  }else if(motif==='text'){
    /* 沿弧线排字在这张 128px 宽的窄贴图里排不开（11 个字挤 100px 弧长，
       全叠在一起还容易被裁掉），改成上下两行横排的 logo 写法。
       瓜瓣的 u 方向从外面看是反的，所以画布上先把字左右镜像一次，贴到伞上才是正的
       （城堡/米奇/星星本身左右对称，看不出来，只有字会露馅）。 */
    x.save();x.translate(W,0);x.scale(-1,1);
    x.fillStyle='#fdf6e4';
    x.textAlign='center';x.textBaseline='middle';
    x.font='italic 700 28px Georgia,"Times New Roman",serif';
    x.fillText('Disney',cx,cy-17);
    x.font='italic 700 21px Georgia,"Times New Roman",serif';
    x.fillText('Parks',cx,cy+13);
    x.strokeStyle='rgba(240,198,74,.85)';x.lineWidth=2;
    x.beginPath();x.moveTo(cx-32,cy+28);x.lineTo(cx+32,cy+28);x.stroke();
    x.restore();
  }else{
    x.fillStyle='#fdf6e4';
    x.beginPath();
    for(let i=0;i<10;i++){
      const rr2=i%2?R*.42:R*.92,a=-Math.PI/2+i*Math.PI/5;
      const px=cx+Math.cos(a)*rr2,py=cy+Math.sin(a)*rr2;
      i?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.closePath();x.fill();
    x.fillStyle='#f0c64a';
    x.beginPath();x.arc(cx,cy,R*.22,0,Math.PI*2);x.fill();
  }
  /* ── 两侧鎏金接缝：瓜瓣之间的载重压条 ── */
  const sg=x.createLinearGradient(0,0,10,0);
  sg.addColorStop(0,'#d9a441');sg.addColorStop(1,'rgba(217,164,65,0)');
  x.fillStyle=sg;x.fillRect(0,0,10,H);
  const sg2=x.createLinearGradient(W-10,0,W,0);
  sg2.addColorStop(0,'rgba(217,164,65,0)');sg2.addColorStop(1,'#d9a441');
  x.fillStyle=sg2;x.fillRect(W-10,0,10,H);
  x.fillStyle='rgba(120,80,20,.5)';x.fillRect(0,0,2,H);x.fillRect(W-2,0,2,H);
  return ctex(c);
}
function buildHotAirBalloon(x,z){
  const g=new THREE.Group();
  /* ── 尺寸按真实热气球比例重做 ──
     伞体最大直径 11.2m、伞高 15.5m、篮口 2.4×1.3×1.9m（伞高≈直径1.3倍）
     火焰口离地 4.9m，人在篮里抬头能看到整张伞 ── */
  const GORES=16,RAD=5.6,HGT=15.5,BASE=4.9;
  const BW=2.4,BH=1.3,BD=1.9;                     // 吊篮 宽/高/深
  const prof=t=>RAD*(.34+.66*Math.pow(Math.sin(Math.PI*Math.pow(t,.56)),.78))*(1-.46*Math.pow(t,7));
  /* 每片瓜瓣一套自己的材质：贴图里既有本片主色，也有印刷图案。
     材质变多不增加 draw call（本来就是一片一个 mesh）。 */
  const fabricMs=[];
  const US=10,VS=20;
  for(let gi=0;gi<GORES;gi++){
    const a0=gi/GORES*Math.PI*2,a1=(gi+1)/GORES*Math.PI*2;
    /* ── 配色改成迪士尼乐园那排气球 ──
       乐园气球是竖条高饱和彩色 + 每瓣一个角色印刷 + 顶部金皇冠 + 底部奶油扇贝裙边。
       之前这版是复古节日色（番茄红/暖橙/陈金/米白…），偏怀旧不偏乐园。
       竖条色直接来自贴图，饱和度不再靠顶点色硬拉 —— 顶点色改成灰度也省掉了每片一次的 HSL 计算。 */
    const tex=disneyGoreTex(DISNEY_PALETTE[gi%DISNEY_PALETTE.length],DISNEY_MOTIFS[gi%DISNEY_MOTIFS.length]);
    const pos=new Float32Array((US+1)*(VS+1)*3),uvs=new Float32Array((US+1)*(VS+1)*2),idx=[];
    let p=0;
    for(let v=0;v<=VS;v++){
      const t=v/VS,r0=prof(t);
      for(let u=0;u<=US;u++){
        const uu=u/US,r=r0*(1+.042*Math.sin(Math.PI*uu)),a=a0+(a1-a0)*uu;
        pos[p]=Math.cos(a)*r;
        pos[p+1]=BASE+HGT*t-.16*Math.sin(Math.PI*uu)*Math.sin(Math.PI*Math.min(1,t*.92));
        pos[p+2]=Math.sin(a)*r;
        uvs[(p/3)*2]=uu;uvs[(p/3)*2+1]=t;   // u 横跨瓜瓣、v 沿伞高（贴图是窄长条，图案才不变形）
        p+=3;
      }
    }
    for(let v=0;v<VS;v++)for(let u=0;u<US;u++){
      const a=v*(US+1)+u,b=a+1,c=a+US+1,d=c+1;idx.push(a,c,b,b,c,d);
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('uv',new THREE.BufferAttribute(uvs,2));
    geo.setIndex(idx);geo.computeVertexNormals();
    /* 同一张贴图当 map 和 emissiveMap：
       夜景补光是冷蓝月光，红瓜瓣乘上蓝光会被洗成灰蓝（实测饱和度只剩 0.25），
       让 emissive 跟着贴图走，色彩才立得住；
       黑色图案在 emissiveMap 里也是黑的 —— 米奇剪影不会被整片自发光冲成灰影。 */
    const gm=new THREE.MeshStandardMaterial({
      map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:.42,
      roughness:.82,metalness:0,side:THREE.DoubleSide,envMapIntensity:.18
    });

  }
  /* ── 底部奶油色扇贝裙边 + 顶部金皇冠 ──
     迪士尼乐园气球的裙边是奶油白带波浪花边，顶部是个金色皇冠状通风盖。
     裙边原来垂到 3.675，把燃烧器和火焰整个盖住，只在底下漏出一截火苗，
     看着像「火从裙子里漏出来」；现在收到 4.075，火焰口露出来，
     火苗从燃烧器往上舔进伞口，才是热气球该有的样子。 */
  const skirt=new THREE.Mesh(new THREE.CylinderGeometry(2.05,1.78,0.95,20,1,true),
    new THREE.MeshStandardMaterial({color:0xf7ddb0,roughness:.88,side:THREE.DoubleSide,emissive:0xffa050,emissiveIntensity:.30}));
  skirt.position.y=4.55;skirt.userData.noReflect=true;g.add(skirt);
  /* 裙边下摆的扇贝花边（22 个小圆瓣，InstancedMesh 一个 draw call） */
  {
    const sg=new THREE.InstancedMesh(new THREE.SphereGeometry(.17,10,8),M(0xf7ddb0,{roughness:.9,emissive:0xffa050,emissiveIntensity:.26}),22);
    const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),v3=new THREE.Vector3(),s3=new THREE.Vector3(1,.62,1);
    for(let i=0;i<22;i++){
      const a=i/22*Math.PI*2;
      v3.set(Math.cos(a)*1.79,4.02,Math.sin(a)*1.79);
      q.setFromEuler(new THREE.Euler(0,-a,0));
      m4.compose(v3,q,s3);sg.setMatrixAt(i,m4);

    sg.instanceMatrix.needsUpdate=true;sg.castShadow=false;sg.userData.noReflect=true;g.add(sg);
  }
  /* 裙边下摆鎏金压条 */
  {
    const trim=new THREE.Mesh(new THREE.TorusGeometry(1.80,.075,8,44),
      M(0xd9a441,{roughness:.40,metalness:.60,envMapIntensity:.55,emissive:0x4a3410,emissiveIntensity:.30}));
    trim.position.y=4.12;trim.rotation.x=Math.PI/2;trim.userData.noReflect=true;g.add(trim);
  }
  /* 顶部金皇冠：环 + 尖顶盖（乐园气球顶上那个金色皇冠状通风盖） */
  const crown=new THREE.Mesh(new THREE.TorusGeometry(1.02,.09,8,24),M(0xd9a441,{roughness:.42,metalness:.62,envMapIntensity:.55,emissive:0x4a3410,emissiveIntensity:.30}));
  crown.position.y=BASE+HGT;crown.rotation.x=Math.PI/2;crown.userData.noReflect=true;g.add(crown);
  const crownCap=new THREE.Mesh(new THREE.ConeGeometry(1.03,.92,16),
    M(0xd9a441,{roughness:.40,metalness:.62,envMapIntensity:.6,emissive:0x4a3410,emissiveIntensity:.32}));
  crownCap.position.y=BASE+HGT+.52;crownCap.userData.noReflect=true;g.add(crownCap);
  /* 皇冠下面一道细金环（乐园气球在顶部有一圈 logo 束带） */
  {
    const band=new THREE.Mesh(new THREE.TorusGeometry(prof(.86),.22,8,48),
      M(0xd9a441,{roughness:.42,metalness:.60,envMapIntensity:.55,emissive:0x513a12,emissiveIntensity:.34}));
    band.position.y=BASE+HGT*.86;band.rotation.x=Math.PI/2;band.userData.noReflect=true;g.add(band);
  }
  /* 载重带 + 吊索（单条 LineSegments） */
  const lp=[];
  for(let k=0;k<GORES;k++){
    const a=k/GORES*Math.PI*2;
    for(let v=0;v<VS;v++){
      const t0=v/VS,t1=(v+1)/VS;
      lp.push(Math.cos(a)*prof(t0),BASE+HGT*t0,Math.sin(a)*prof(t0));
      lp.push(Math.cos(a)*prof(t1),BASE+HGT*t1,Math.sin(a)*prof(t1));
    }
  }
  {
    const t=.50,r=prof(t),y=BASE+HGT*t;
    for(let k=0;k<GORES;k++){
      const a0=k/GORES*Math.PI*2,a1=(k+1)/GORES*Math.PI*2;
      lp.push(Math.cos(a0)*r,y,Math.sin(a0)*r,Math.cos(a1)*r,y,Math.sin(a1)*r);
    }
  }

function toggleBalloonRide(i){

function updateBalloonRide(dt){
  const t=performance.now()*.001;
  for(let i=0;i<balloons.length;i++){
    const b=balloons[i];
    const riding=balloonSys.riding&&balloonSys.idx===i;
    if(riding){
      /* 升降：W/↑ 或摇杆上推 = 升，S/↓ 或摇杆下推 = 降 */
      let up=0;
      /* 导演机位在跟热气球时：自动升空（外部 AI 录制不需要有人按键） */
      const _dirBalloon=director.active&&director.shot&&director.shot.ride==='balloon';
      if(_dirBalloon)up=1;
      else{
        if(fp.keys['KeyW']||fp.keys['ArrowUp'])up+=1;
        if(fp.keys['KeyS']||fp.keys['ArrowDown'])up-=1;
        if(joy.mag>0.02)up+=-joy.dy*1.2;
      }
      up=Math.max(-1,Math.min(1,up));
      if(_dirBalloon){
        /* 极小幅横摆：让镜头相对地面有视差，又不会飘出安全区撞到树阵 */
        b.x+=Math.sin(t*.33+i*1.1)*.30*dt;
        b.z+=Math.cos(t*.27+i*.7)*.30*dt;
      }
      b.vy+=(up*3.4-b.vy)*Math.min(1,dt*2.4);
      b.y=Math.max(1.05,Math.min(62,b.y+b.vy*dt));
      b.burn+=(Math.max(0,up)*.85+.20-b.burn)*Math.min(1,dt*6);
      fp.x=b.x;fp.z=b.z;fp.y=b.y;
      camera.position.set(b.x,b.y+2.45,b.z);   // 站进篮口上方，视线越过篮沿直接看出去
      camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
      hudShow('','下车 (E)',stopBalloonRide,true);
      b.hud=true;
    }else{
      /* 没人乘坐时：缓缓回到微微悬浮的状态 */
      b.vy*=Math.max(0,1-dt*1.8);
      const hover=1.05+Math.sin(t*.55+i*1.3)*.10+Math.sin(t*.87+i*2.1)*.05;
      b.y+=(hover-b.y)*Math.min(1,dt*.9);
      b.burn+=(.08-b.burn)*Math.min(1,dt*3);
      if(b.hud){b.hud=false;hudHide();}
    }
    /* 姿态：升时前倾、缓缓摇摆 */
    b.g.position.set(b.x,b.y,b.z);
    b.g.rotation.z=-b.vy*.035;
    b.g.rotation.x=Math.sin(t*.42+i)*.018;
    b.g.rotation.y=Math.sin(t*.23+i*1.7)*.055;
    const fl=.55+b.burn*.85+Math.sin(t*17+i)*.06;
    b.flame.scale.set(.80+b.burn*.50,fl,.80+b.burn*.50);
    b.flame.material.opacity=.22+b.burn*.66;
    b.flameIn.material.opacity=.04+b.burn*.56;
    b.burnerGlow.material.opacity=.06+b.burn*.42;
    b.burnerGlow.scale.setScalar(.7+b.burn*.5);
    b.flameIn.scale.set(.70+b.burn*.40,fl*.82,.70+b.burn*.40);
    for(let gi2=0;gi2<b.fabricMs.length;gi2++)b.fabricMs[gi2].emissiveIntensity=.40+b.burn*.14;
    b.burnerLight.intensity=(14+b.burn*30)*(1+Math.sin(t*23+i)*.05);
    const h=Math.max(0,b.y-1.05),pr=7.0+h*1.05;
    b.pool.position.set(b.x,.03,b.z);
    b.pool.scale.set(pr,pr,1);
    b.pool.material.opacity=Math.max(.04,.32/(1+h*.15));
  }
  /* 靠近提示：站着不动也能上球 */
  if(!balloonSys.riding&&fp.on&&!wheelSys.riding&&!trainSys.riding&&!launchSys.active&&!heliSys.riding){
    const i=balloonNearPlayer();
    if(i>=0){
      hudShow('大号热气球 · 按 E 或点击登上吊篮（升空后 W/↑ 上升、S/↓ 下降）','上热气球 (E)',()=>toggleBalloonRide(i));
      balloons[i].hud=true;
    }
  }
}

/* 相机基向量：fwd = 视线方向（three 相机朝 -Z），right / up = 屏幕右 / 屏幕上 */
function camFrame(){
  camera.updateMatrixWorld();
  _mFwd.set(0,0,-1).transformDirection(camera.matrixWorld);
  _mRight.set(1,0,0).transformDirection(camera.matrixWorld);
  _mUp.set(0,1,0).transformDirection(camera.matrixWorld);
}
/* 沿 45° 斜线走 1 像素 = 多少米：2·D·tan(fov/2)/屏高
   （水平与垂直每像素米数相同，所以屏幕上的 45° 就是世界的 45°） */
function pxToMeter(D){
  return 2*D*Math.tan(camera.fov*Math.PI/360)/Math.max(innerHeight,1);

/* 摆一颗流星（参数全部按屏幕像素定义，手机桌面观感一致）：
   sx,sy = 头部起点在屏幕上的位置（NDC，x 右为正、y 上为正）
   D     = 距相机深度（米）
   headPx= 头部飞过的屏幕距离（沿 45° 斜线的像素）
   trailPx = 尾迹长（像素） */
function placeMeteor(m,sx,sy,D,headPx,trailPx,dur,envBase){
  camFrame();
  const tanY=Math.tan(camera.fov*Math.PI/360);
  const tanX=tanY*Math.max(camera.aspect,.35);
  /* 起点：屏幕 NDC 反投影成世界射线，再乘深度 */
  _mRay.copy(_mFwd)
    .addScaledVector(_mRight,sx*tanX)
    .addScaledVector(_mUp,sy*tanY)
    .normalize();
  m.p0.copy(camera.position).addScaledVector(_mRay,D);
  const mpp=pxToMeter(D);
  m.travel=headPx*mpp;
  m.trail=trailPx*mpp;
  m.dur=dur;m.envBase=envBase;m.life=0;m.state=1;
  m.pts.visible=true;

function updateMeteors(dt){

  else{
    /* 朝目标缓缓转向，转速上限 12°/s —— 玩家猛转视角时雨幕不会甩 */
    const ang=Math.acos(Math.min(1,Math.max(-1,rainDir.dot(_mTarget))));
    if(ang>1e-4){
      const step=Math.min(ang,12*Math.PI/180*dt);
      _mAxis.copy(rainDir).cross(_mTarget);
      if(_mAxis.lengthSq()>1e-10)rainDir.applyAxisAngle(_mAxis.normalize(),step).normalize();
    }

    spawnWave(meteorWave.big);
    meteorWave.cd=meteorWave.big?R(6.5,10.0):R(4.5,6.5);
  }
  const now=performance.now()*.001;
  for(let i=0;i<METEOR_N;i++){
    const m=meteors[i];

    U.uTime.value=now;
    if(m.state===1){
      m.wait-=dt;
      if(m.wait>0){U.uEnv.value=0;continue;}
      m.state=2;m.life=0;
      /* 生成瞬间把方向锁进世界空间：这一波所有流星共用同一条方向 */
      m.dir.copy(rainDir);
      U.uDir.value.copy(m.dir);
    }
    if(m.state!==2){U.uEnv.value=0;continue;}
    m.life+=dt;
    const k=m.life/m.dur;
    if(k>=1){
      m.state=0;U.uEnv.value=0;m.pts.visible=false;
      if(i<METEOR_BASE){spawnBase(m);m.wait=R(.5,2.4);}
      continue;
    }
    /* 头部沿锁定方向推进；尾迹挂在头部后方，长度随飞行时间从短到长 */
    const traveled=k*m.travel;
    const curTrail=Math.min(m.trail,traveled+m.trail*.18);
    _mHead.copy(m.p0).addScaledVector(m.dir,traveled);
    /* 亮度包络：快速点亮 → 稳定 → 尾巴淡出；越接近地面越暗 */
    const fade=Math.min(1,Math.max(0,(_mHead.y-6)/34));
    U.uEnv.value=m.envBase*fade*Math.min(1,m.life*6)*(k<.78?1:Math.max(0,(1-k)/.22));
    U.uHead.value.copy(_mHead);
    U.uLen.value=curTrail;
  }

  mergeStatic(legL);mergeStatic(legR);mergeStatic(armL);mergeStatic(armR);

  legL.userData.keep=true;legR.userData.keep=true;

  g.userData={legL,legR,armL,armR,keep:true};
  return g;

function pickNpcName(){

  x.textAlign='center';

}
function addNpc(path,color,skin,speed,indoor,opts={}){

  p.userData.physObj={type:'npc',ref:item};
  /* 头顶小号名字牌：挂在小熊身上，跟随移动与压扁弹跳 */
  const nm=pickNpcName();

}

const SK={};

/* ── UV 重映射到图集格子（flipU 用于背面文字不镜像）── */
SK.uvCell=(geo,col,row,cols,rows,flipU)=>{
  const uv=geo.attributes.uv;if(!uv)return geo;
  const u0=col/cols,u1=(col+1)/cols,v0=1-(row+1)/rows,v1=1-row/rows;
  for(let i=0;i<uv.count;i++){
    const u=uv.getX(i),v=uv.getY(i);
    uv.setXY(i,flipU?(u0+u1-(u0+u)):(u0+u*(u1-u0)),v0+v*(v1-v0));
  }
  uv.needsUpdate=true;return geo;
};

const skWoodCanvas=(vert)=>{
  const [c,x]=cv(256,256);
  x.fillStyle='#43291a';x.fillRect(0,0,256,256);
  const n=8,w=256/n;
  for(let i=0;i<n;i++){
    const sh=94+((i*37)%26);
    x.fillStyle=`rgb(${sh+28},${sh},${sh-40})`;
    if(vert)x.fillRect(i*w,0,w-2,256);else x.fillRect(0,i*w,256,w-2);
    for(let g=0;g<10;g++){

      x.stroke();
    }
    x.fillStyle='rgba(24,13,5,.44)';
    if(vert)x.fillRect(i*w+w-2,0,2,256);else x.fillRect(0,i*w+w-2,256,2);
  }
  return c;
};

  if(!m){

      emissiveMap:SK.brickTex,emissive:0x7a5a33,emissiveIntensity:.85});
    SK.wallCache.set(tint,m);
  }
  return m;
};

/* ── 尖拱 / 圆拱轮廓（教堂同款）── */
SK.archPath=(path,w,h,pt)=>{
  path.moveTo(-w/2,0);
  if(pt){path.lineTo(-w/2,h*.56);path.quadraticCurveTo(-w*.36,h*.90,0,h);
          path.quadraticCurveTo(w*.36,h*.90,w/2,h*.56);}
  else{path.lineTo(-w/2,h-w/2);path.absarc(0,h-w/2,w/2,Math.PI,0,true);}
  path.lineTo(w/2,0);path.closePath();return path;
};
/* 拱形浮雕（实心尖拱，用作「国王长廊」式盲拱）*/
SK.archGeo=(w,h,d,pt)=>{
  const sh=new THREE.Shape();SK.archPath(sh,w,h,pt);
  const g=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false});
  g.translate(0,0,-d/2);return g;
};

/* ── 坡屋顶：石板瓦 + 厚雪（雪只盖坡面）+ 檐板 + 屋脊压条 ── */
SK.pitchedRoof=(parent,o)=>{
  const W=o.w,D=o.d,rise=o.rise,eaveY=o.y,over=o.over===undefined?.26:o.over;
  const slate=o.slate||SK.M.slate,trim=o.trim||SK.M.trim;
  const slopeZ=D/2+over,ang=Math.atan2(rise,slopeZ),L=Math.hypot(rise,slopeZ);
  const ny=Math.cos(ang),nzu=-Math.sin(ang);      // 坡面法线（上坡法向）
  const upY=Math.sin(ang),upZ=ang;                  // 上坡方向
  for(const sz of [-1,1]){
    const r=add(parent,BX(W+.06,.20,L),slate,0,eaveY+rise/2+.06,sz*slopeZ/2);
    r.rotation.x=sz*ang;
    /* 雪：贴着瓦面（法向抬 0.155 = 瓦半厚 0.10 + 雪半厚 0.045 + 1cm 缝），
       再沿坡面往上收 0.12m，于是檐口露出一条深色石板边 */
    const off=0.155,inset=0.12;
    const sn=addNS(parent,BX(W-.12,.09,L-inset*2),SK.M.snow,
      0,eaveY+rise/2+.06+ny*off+upY*inset,
      sz*slopeZ/2+sz*nzu*off+sz*Math.cos(ang)*inset);
    sn.rotation.x=sz*ang;
    /* 竖向檐板：封住斜面板端面（消灭所有毛边），
       用瓦色而不是米色 —— 米色板在夜里会变成一条抢眼的大黄带子 */
    add(parent,BX(W+.10,.17,.09),slate,0,eaveY+.01,sz*(slopeZ+.05));
  }
  /* 屋脊压条 + 脊雪 */
  add(parent,BX(W+.10,.15,.34),trim,0,eaveY+rise+.15,0);
  addNS(parent,BX(W-.10,.09,.22),SK.M.snow,0,eaveY+rise+.27,0);
  return {ang,L,slopeZ};
};

/* ── 拱窗：木框 + 暖光玻璃 + 盲拱 + 窗台 ── */
/* 窗户：局部 +Z 为朝外方向（rotY 决定朝向哪面墙）
   ⚠ 原来玻璃盒中心在 z+.03、厚度 .06 → 玻璃背面正好压在墙面 z 上，
     墙皮和玻璃两个面深度完全相同，抢深度缓冲 —— 从背面看过去
     就是「窗户一直在闪」。现在玻璃离墙皮 2cm、窗框离墙皮 4.5cm，
     正面/背面/侧面都不再共面。 */
SK.window=(parent,x,y,z,gi,w,h,rotY)=>{
  const gm=SK.M.glass[gi%SK.M.glass.length],trim=SK.M.trim,t=.10;
  const g=new THREE.Group();
  g.position.set(x,y,z);
  if(rotY)g.rotation.y=rotY||0;
  parent.add(g);
  add(g,BX(w,h,.06),gm,0,h/2,.05);
  add(g,BX(w+t*2,t,.15),trim,0,-t/2,.12);
  add(g,BX(t,h+t,.15),trim,-w/2-t/2,h/2,.12);
  add(g,BX(t,h+t,.15),trim, w/2+t/2,h/2,.12);
  add(g,BX(w+t*2,t,.15),trim,0,h+t/2,.12);
  const ah=Math.max(.32,w*.40);
  const a=add(g,SK.archGeo(w+t*2.6,ah,.13,true),trim,0,h+t+.05,.09);
  a.castShadow=false;
  add(g,BX(.13,.20,.18),SK.M.trimDark,0,h+t+ah-.08,.14);
  return g;
};

/* ── 门：门扇线脚 + 门套 + 三角门楣 + 铜把手 + 门槛 ── */
SK.door=(parent,x,y,z,woodMat)=>{
  const w=1.12,h=1.92,trim=SK.M.trim;
  add(parent,BX(w,h,.10),woodMat,x,y+h/2,z+.05);
  add(parent,BX(w-.32,h*.40,.04),SK.M.woodDark,x,y+h*.27,z+.10);
  add(parent,BX(w-.32,h*.28,.04),SK.M.woodDark,x,y+h*.73,z+.10);
  add(parent,BX(.13,h+.18,.19),trim,x-w/2-.07,y+h/2,z+.10);
  add(parent,BX(.13,h+.18,.19),trim,x+w/2+.07,y+h/2,z+.10);
  add(parent,BX(w+.36,.16,.21),trim,x,y+h+.09,z+.11);
  add(parent,new THREE.SphereGeometry(.05,10,8),SK.M.gold,x+.38,y+h*.48,z+.13);
  add(parent,BX(w+.22,.10,.32),SK.M.stone,x,y+.05,z+.13);
};

/* ── 雨篷：条纹篷布 + 波浪垂帘 + 锻铁托架 ── */
SK.awning=(parent,x,y,z,w,d,cell,valance=true)=>{
  const geo=new THREE.BoxGeometry(w,.07,d);
  SK.uvCell(geo,cell%4,(cell/4)|0,4,4);
  const slab=new THREE.Mesh(geo,SK.M.fabric);
  slab.position.set(x,y,z+d/2+.02);slab.rotation.x=-.16;
  slab.castShadow=false;slab.receiveShadow=true;parent.add(slab);
  if(valance){
    /* 波浪垂帘：整块带扇贝边的布片
       ⚠ 原来用一排 SphereGeometry 做垂帘球 —— 球从雨篷边缘鼓出来，
         自身背光又接不到点光源，远看就是一串黑疙瘩（正是「看不懂的纯色块」）。
         现在改成单块扇贝边布片：边缘是布的波浪，不凸出、不发黑，还省 draw call。 */
    const n=Math.max(5,Math.round(w/.24));
    const HH=.30;                     // 垂帘总高（米）
    const sh=new THREE.Shape();
    sh.moveTo(0,1);sh.lineTo(1,1);sh.lineTo(1,1-.72);
    for(let i=n-1;i>=0;i--){
      const x0=i/n,x1=(i+1)/n;
      sh.lineTo((x0+x1)/2,1-.72-.28);
      sh.lineTo(x0,1-.72);
    }
    sh.lineTo(0,1);
    const vg=new THREE.ExtrudeGeometry(sh,{depth:.05,bevelEnabled:false});
    vg.scale(w,HH,1);
    SK.uvCell(vg,cell%4,(cell/4)|0,4,4);
    const v=new THREE.Mesh(vg,SK.M.fabric);
    v.position.set(x-w/2,y-HH,z+d+.05);
    v.castShadow=false;v.receiveShadow=true;parent.add(v);
  }
  for(const s of [-1,1]){
    const br=add(parent,BX(.05,.05,.42),SK.M.iron,x+s*(w/2-.16),y-.14,z+d*.5+.02);
    br.rotation.x=-.9;
  }
};


/* ── 街边小店（北街 / 西段 / 东段）：教堂级立面 ── */
SK.shopHouse=(parent,o)=>{
  const g=new THREE.Group();
  g.position.set(o.x,0,o.z);g.rotation.y=o.rot||0;parent.add(g);
  const W=4.40,D=3.60,PL=.32,WH=2.88;
  const wallTop=PL+WH, corn=.32, eaveY=wallTop+corn, rise=.98;
  const wallM=SK.wallMat(SK.WALL_TINTS[o.tint%SK.WALL_TINTS.length]);
  const trim=SK.M.trim,trimD=SK.M.trimDark;
  const face=D/2;

  /* 勒脚（两层线脚，替代原来的单层薄板）*/
  add(g,BX(W+.18,PL,D+.18),SK.M.stone,0,PL/2,0);
  add(g,BX(W+.26,.08,D+.26),trimD,0,PL+.04,0);
  /* 主体砂岩砖墙 */
  add(g,BX(W,WH,D),wallM,0,PL+WH/2,0);
  /* 转角壁柱（教堂的竖向分割，破掉大平面）*/
  for(const sx of [-1,1])for(const sz of [-1,1])
    add(g,BX(.26,WH-.08,.26),trim,sx*(W/2-.11),PL+(WH-.08)/2,sz*(D/2-.11));
  /* 檐口三层递收线脚 */
  add(g,BX(W+.10,.10,D+.10),trimD,0,wallTop+.05,0);
  add(g,BX(W+.24,.12,D+.24),trim,0,wallTop+.16,0);
  add(g,BX(W+.12,.10,D+.12),trimD,0,wallTop+.27,0);
  /* 屋顶 */
  SK.pitchedRoof(g,{w:W,d:D,y:eaveY,rise:rise});
  /* 两端山墙（实体尖拱 + 封檐板 + 小圆窗）*/
  {
    const gw=D/2+.06,gh=rise-.04;
    const sh=new THREE.Shape();
    sh.moveTo(-gw,0);sh.lineTo(gw,0);sh.lineTo(0,gh);sh.closePath();
    const gg=new THREE.ExtrudeGeometry(sh,{depth:.22,bevelEnabled:false});
    gg.rotateY(Math.PI/2);
    const ang=Math.atan2(rise,D/2+.26),L=Math.hypot(rise,D/2+.26);
    for(const sx of [-1,1]){
      const gm=new THREE.Mesh(gg,wallM);
      gm.position.set(sx*(W/2-.11),eaveY-.02,0);
      gm.castShadow=true;gm.receiveShadow=true;g.add(gm);
      /* 封檐板：盖住山墙与瓦面的接缝 */
      for(const sz of [-1,1]){
        const bb=add(g,BX(.12,.26,L),trim,sx*(W/2+.03),eaveY+rise/2,sz*(D/2+.26)/2);
        bb.rotation.x=sz*ang;
      }
      /* 山墙小圆窗 */
      const rw=addNS(g,new THREE.CylinderGeometry(.26,.26,.10,16),SK.M.glass[o.glass%4],sx*(W/2+.04),eaveY+rise*.52,0);
      rw.rotation.z=Math.PI/2;
      add(g,new THREE.TorusGeometry(.28,.05,6,18),trim,sx*(W/2+.07),eaveY+rise*.52,0).rotation.y=Math.PI/2;
    }
  }
  /* 烟囱（带顶帽与积雪）*/
  {
    add(g,BX(.50,.92,.50),wallM,1.26,eaveY+rise*.55,-.55);
    add(g,BX(.62,.12,.62),trim,1.26,eaveY+rise*.55+.50,-.55);
    addNS(g,BX(.58,.08,.58),snowCapM,1.26,eaveY+rise*.55+.60,-.55);
    for(let i=0;i<3;i++){
      const sm=addNS(g,new THREE.SphereGeometry(.13,8,6),M(0xffffff,{roughness:.9,transparent:true,opacity:.14}),
        1.26+ (i-1)*.05,eaveY+rise*.55+.85+i*.22,-.5);
      sm.scale.set(1,1.4,1);
    }
  }

  /* ── 正面（+Z）立面 ── */
  SK.window(g,-1.50,0.92,face,o.glass,.96,1.00);
  SK.window(g, 1.50,0.92,face,o.glass,.96,1.00);
  SK.door(g,0,PL,face,SK.M.wood);
  /* 门廊雨篷（只罩门，不遮两侧窗）*/
  SK.awning(g,0,2.38,face+.04,2.05,.66,o.fab);
  /* 台阶 */
  add(g,BX(1.9,.10,.55),SK.M.stone,0,.22,face+.30);
  add(g,BX(2.3,.09,.85),SK.M.stone,0,.11,face+.55);
  /* 檐口横匾已删（全场只保留艺术馆门牌），这里只留两道装饰线脚 */
  {
    add(g,BX(3.02,.08,.12),trimD,0,3.21,face+.14);
    add(g,BX(3.02,.08,.12),trimD,0,2.47,face+.14);
  }
  /* 雨篷前沿一串彩灯 */
  for(let i=0;i<7;i++){
    const b=addNS(g,new THREE.SphereGeometry(.075,8,6),getBulbMat([0xff4d4d,0xffe078,0x48e58b,0xfff2cc][i%4],i),
      -0.85+i*.28,2.28,face+.72);
  }
  /* 立面柔光贴片：假装窗光洒在砖墙上（不占点光源预算）*/
  {
    const gl=new THREE.Mesh(new THREE.PlaneGeometry(4.6,3.0),new THREE.MeshBasicMaterial({
      map:glowTex,color:0xffc98a,transparent:true,opacity:.30,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    gl.position.set(0,1.75,face+.04);gl.castShadow=false;g.add(gl);
    /* 雨篷下的暖光带：让门脸有「店里透出来的光」 */
    const st=new THREE.Mesh(new THREE.PlaneGeometry(4.1,1.1),new THREE.MeshBasicMaterial({
      map:glowTex,color:0xffbe7a,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    st.rotation.x=-Math.PI/2;st.position.set(0,.04,face+1.0);st.castShadow=false;g.add(st);
  }
  /* 门两侧壁灯（铁艺挑臂 + 暖光玻璃罩，夜里让门口有光）*/
  for(const sx of [-1,1]){
    const X=sx*.86;
    add(g,BX(.09,.09,.30),SK.M.iron,X,2.16,face+.16);
    const lant=addNS(g,new THREE.CylinderGeometry(.13,.16,.26,10),SK.M.glass[3],X,1.98,face+.32);
    add(g,BX(.20,.05,.20),SK.M.iron,X,2.13,face+.32);
    const halo=new THREE.Mesh(new THREE.PlaneGeometry(1.0,1.0),new THREE.MeshBasicMaterial({
      map:glowTex,color:0xffc98a,transparent:true,opacity:.34,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    halo.position.set(X,1.96,face+.36);halo.castShadow=false;g.add(halo);
  }
  /* 门口的暖光带
     ⚠ 原来挂在 face+.12，正好等于门板木雕内板的前表面（门扇 z+.05 厚 .10，
       内板 z+.10 厚 .04 → 前表面 z+.12）——两个面深度完全相同，抢深度缓冲
       表现为「门在闪」。这里挪到 face+.17 并加 polygonOffset 彻底错开。 */
  {
    const dg=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.2),new THREE.MeshBasicMaterial({
      map:glowTex,color:0xffbe7a,transparent:true,opacity:.26,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,
      polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4}));
    dg.position.set(0,1.30,face+.17);dg.castShadow=false;g.add(dg);
  }
  /* 门前石槽花箱 */
  {
    add(g,BX(.70,.30,.34),SK.M.woodDark,-1.44,.55,face+.42);
    add(g,BX(.64,.06,.30),SK.M.stone,-1.44,.72,face+.42);
    for(let i=0;i<5;i++){
      const f=addNS(g,new THREE.SphereGeometry(.10,8,6),M(i%2?0xd23b32:0x2f8f6b,{roughness:.8}),
        -1.44-.24+i*.12,.80,face+.42);
      f.scale.set(1,.8,1);
    }
    add(g,BX(.70,.30,.34),SK.M.woodDark,1.44,.55,face+.42);
    add(g,BX(.64,.06,.30),SK.M.stone,1.44,.72,face+.42);
    for(let i=0;i<5;i++){
      const f=addNS(g,new THREE.SphereGeometry(.10,8,6),M(i%2?0xffb8d8:0xd8a13c,{roughness:.8}),
        1.44-.24+i*.12,.80,face+.42);
      f.scale.set(1,.8,1);
    }
  }
  /* 背面（-Z）也要有脸：两窗一门 + 小壁灯 */
  {
    const bz=-face;
    /* 背面朝向 -Z：窗户整体转 180°，玻璃才朝外，不会插进墙里 */
    SK.window(g,-1.20,1.05,bz,o.glass,.86,1.00,Math.PI);
    SK.window(g, 1.20,1.05,bz,o.glass,.86,1.00,Math.PI);
    add(g,BX(.90,1.86,.10),SK.M.woodDark,.30,.93+.0,bz+.02);
    add(g,BX(1.04,.14,.18),trim,.30,1.90,bz+.06);
    for(const sx of [-1,1]){
      const arm=add(g,BX(.10,.10,.34),SK.M.iron,sx*1.72,2.42,bz-.16);
      addNS(g,new THREE.SphereGeometry(.13,10,8),SK.M.glass[o.glass%4],sx*1.72,2.28,bz-.30);
    }
  }
  /* 侧面（±X）小窗 */
  /* 侧面小窗：朝向 ±X（原来按 +Z 造，宽边是沿 X 的，等于在侧墙上横插一块玻璃） */
  for(const sx of [-1,1])for(const sz of [-.6,.6])
    SK.window(g,sx*W/2,1.30,sz,o.glass,.62,.80,sx>0?Math.PI/2:-Math.PI/2);
  /* 店里透出来的暖光落在雪地上 */
  {
    const spill=new THREE.Mesh(new THREE.PlaneGeometry(5.4,4.4),new THREE.MeshBasicMaterial({
      color:0xffc98a,transparent:true,opacity:.11,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    spill.rotation.x=-Math.PI/2;spill.position.set(0,.03,face+.9);spill.castShadow=false;g.add(spill);
  }
  return g;
};

/* ── 集市摊位 / 游乐园小吃摊：教堂级木构 ── */
SK.stallHouse=(parent,o)=>{
  const g=new THREE.Group();
  g.position.set(o.x,0,o.z);g.rotation.y=o.rot||0;parent.add(g);
  const W=o.w||3.00,D=o.d||2.20,H=o.h||2.35;
  const wood=SK.M.wood,woodD=SK.M.woodDark,woodL=SK.M.woodLight;
  const px=W/2-.17,pz=D/2-.17;

  /* 石台基 + 线脚 */
  add(g,BX(W+.24,.16,D+.20),SK.M.stone,0,.08,0);
  add(g,BX(W+.32,.07,D+.28),SK.M.trimDark,0,.175,0);
  /* 四根车削木柱：柱础盘 + 柱身 + 柱头 + 顶球 */
  const postH=H-.46;
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const X=sx*px,Z=sz*pz;
    add(g,new THREE.CylinderGeometry(.15,.18,.13,12),SK.M.stone,X,.27,Z);
    add(g,new THREE.CylinderGeometry(.085,.10,postH,12),wood,X,.20+postH/2,Z);
    add(g,BX(.26,.13,.26),woodL,X,H-.24,Z);
    add(g,new THREE.SphereGeometry(.095,12,9),woodL,X,H-.12,Z);
  }
  /* 后背木板墙 + 两层搁板 + 横向压条（背板要够高，站在摊前看不穿到后面的街景）*/
  const backH=Math.min(H-.42,2.34);
  add(g,BX(W-.24,backH,.10),wood,0,.20+backH/2,-(D/2-.12));
  for(let i=0;i<3;i++)add(g,BX(W-.24,.07,.13),woodL,0,.20+.26+i*((backH-.5)/2),-(D/2-.17));
  add(g,BX(W-.24,.09,.14),woodL,0,1.36,-(D/2-.16));
  add(g,BX(W-.24,.09,.14),woodL,0,1.74,-(D/2-.16));
  /* 侧板 + 上方竖棂（镂空，挡不住视线但有细节）*/
  for(const sx of [-1,1]){
    add(g,BX(.09,.92,D-.30),wood,sx*(W/2-.12),.20+.46,0);
    const slatH=Math.max(.4,H-.30-1.12);
    for(let i=0;i<5;i++)
      add(g,BX(.05,slatH,.05),woodL,sx*(W/2-.12),1.12+slatH/2,-(D/2-.34)+i*((D-.68)/4));
  }
  /* 柜台：台面 + 前挡板 + 线脚 + 腿 */
  const cw=W-.34;
  add(g,BX(cw,.12,.88),SK.M.woodH,0,1.00,.46);
  add(g,BX(cw,.72,.09),SK.M.woodH,0,.58,.86);
  add(g,BX(cw-.04,.07,.15),woodL,0,.93,.90);
  add(g,BX(cw,.06,.13),woodD,0,.26,.88);
  for(const sx of [-1,1])add(g,BX(.12,.92,.12),woodD,sx*(cw/2-.14),.60,.86);

  /* 屋顶：石板瓦 + 厚雪 + 檐板 + 屋脊压条 */
  SK.pitchedRoof(g,{w:W,d:D,y:H,rise:.52,over:.20});
  /* 两端山墙 + 封檐板 */
  {
    const gw=D/2+.04,gh=.50;
    const sh=new THREE.Shape();
    sh.moveTo(-gw,0);sh.lineTo(gw,0);sh.lineTo(0,gh);sh.closePath();
    const gg=new THREE.ExtrudeGeometry(sh,{depth:.20,bevelEnabled:false});
    gg.rotateY(Math.PI/2);
    const ang=Math.atan2(.52,D/2+.20),L=Math.hypot(.52,D/2+.20);

  const lacqM=M(0x1a1d25,{roughness:.12,metalness:.52,envMapIntensity:1.8});
  const brassM=M(0xd9a441,{roughness:.30,metalness:.86,emissive:0xff9c3a,emissiveIntensity:.55});
  const velvetM=M(0x7d1f2c,{roughness:.86,metalness:.02});
  const keyM=new THREE.MeshStandardMaterial({color:0xe8e2d4,roughness:.38,metalness:.02});
  const bkeyM=new THREE.MeshStandardMaterial({color:0x0a0b0e,roughness:.26,metalness:.12});

  /* ── 铺装：圆台整个拆掉了 ──
     原来这个半径 3.85m 的石板圆盘把钢琴整个托起来，看上去像展台，
     挤在市集摊位边上，一团乱。现在只留一条从市集拐角接进来的石板路，
     钢琴自己站在雪地上，两棵树在路两侧 —— 空间一下子松开了。 */
  /* ── 石板路：从市集拐角 (-33.9,-13.0) 向西，走到两棵树之间就收尾 ──
     之前还多折了一段往北，结果正好铺在钢琴脚下：一块亮白平板从琴身底下伸出来，
     钢琴又变成「站在台子上」，跟前面拆掉的石板圆台是一回事。现在路到树前为止，
     后面整片是干净的雪地，钢琴就站在雪上。 */
  {
    const road=add(plaza,BX(8.7,.08,1.7),paveM,-38.25,.04,-13.0);road.castShadow=false;
    const k1=add(plaza,BX(8.7,.10,.12),paveD,-38.25,.045,-13.85);k1.castShadow=false;
    const k2=add(plaza,BX(8.7,.10,.12),paveD,-38.25,.045,-12.15);k2.castShadow=false;
  }
  /* ── 两棵圣诞树（分列广场西北 / 西南角） ── */
  const TREE_SC=[.86,.70];
  const treePos=[[-42.6,-10.0],[-42.6,-15.4]];   // 分列石板路尽头的南北两侧，像一对门柱
  const treeBulbGrp=[];
  for(let ti=0;ti<2;ti++){
    const t=buildChristmasTree({scale:TREE_SC[ti],layers:6,gifts:true});
    t.position.set(treePos[ti][0],0,treePos[ti][1]);
    t.rotation.y=ti*.7;
    t.userData.keep=true;              // 树会随风摇摆，不能被合批冻住
    plaza.add(t);
    /* 树身上的彩灯：单独一组再合批，四个材质 → 四个 mesh */
    const bg=new THREE.Group();
    t.add(bg);
    const sc=TREE_SC[ti];
    for(let i=0;i<16;i++){
      const u=i/15, a=u*Math.PI*6+ti*1.3, rr=(1.25-u*.60)*sc, y=(.75+u*2.85)*sc;
      addNS(bg,new THREE.SphereGeometry(.048,7,6),getBulbMat([0xff4d4d,0xffe078,0x48e58b,0xfff2cc][i%4],i),
        Math.cos(a)*rr,y,Math.sin(a)*rr);
    }
    mergeStatic(bg);
    treeBulbGrp.push(t);
    /* 树脚一盏小暖光：树是深绿锥体，夜里不给光就是一团黑影 */
    const tl2=new THREE.PointLight(0xffd39a,5.5,5.4,2.0);
    tl2.position.set(treePos[ti][0],1.55,treePos[ti][1]);
    scene.add(tl2);
  }
  /* ── 灯串：两棵树之间拉一条，中间下垂 ── */
  /* 灯串必须有电线：没有线就是一串浮在半空的球，看着像bug */
  const cableM=M(0x23282e,{roughness:.85,metalness:.10});
  function lightCable(pts){
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      const len=Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z);
      if(len<.02)continue;
      const m=add(plaza,BX(.016,.016,len),cableM,(a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2);
      m.lookAt(b.x,b.y,b.z);
      m.castShadow=false;
    }
  }
  {
    const A=new THREE.Vector3(treePos[0][0],3.45*TREE_SC[0]+.25,treePos[0][1]);
    const B=new THREE.Vector3(treePos[1][0],3.45*TREE_SC[1]+.25,treePos[1][1]);
    const pts=[];
    for(let i=0;i<=24;i++){
      const u=i/24, p=new THREE.Vector3().lerpVectors(A,B,u);
      p.y-=Math.sin(u*Math.PI)*1.15;
      pts.push(p);
    }
    for(let i=1;i<24;i++)
      addNS(plaza,new THREE.SphereGeometry(.052,8,6),
        getBulbMat([0xff4d4d,0xffe078,0x48e58b,0xfff2cc][i%4],i),pts[i].x,pts[i].y,pts[i].z);
    lightCable(pts);
    /* 小径两侧也用地埋灯。原来是两根 2.9m 高的纯黑杆子，顶上顶个小球，
       俯视就是两个黑点，夜里既不照路也认不出是什么。现在统一成钢琴那一圈的做法。 */
    const posts=[[-37.6,-14.25],[-35.2,-11.75]];
    for(const q of posts){
      addNS(plaza,new THREE.SphereGeometry(.085,10,8),getBulbMat(0xffd49a,0),q[0],.045,q[1]);
      const ring=addNS(plaza,new THREE.TorusGeometry(.135,.028,6,16),M(0x3a4149,{roughness:.5,metalness:.7}),q[0],.012,q[1]);
      ring.rotation.x=Math.PI/2;
      const sp=addNS(plaza,new THREE.CircleGeometry(.42,20),regNightGlow(new THREE.MeshBasicMaterial({
        map:mulGlowTex,color:0xffffff,transparent:true,opacity:.50,
        blending:THREE.MultiplyBlending,depthWrite:false,fog:false}),.50),q[0],.016,q[1]);
      sp.rotation.x=-Math.PI/2;sp.renderOrder=2;sp.userData.noReflect=true;
    }
  }
  /* ── 钢琴周围一圈地埋灯 ──
     原来广场四角的矮灯柱，灯杆又矮又细，夜里既看不清也照不到东西，
     而它们的地面光晕是加色混合 —— 落在白雪上只会更白，等于没有。
     现在改成围着钢琴的一圈地埋小灯：灯是实体的，在雪地上有明确的形体感，
     远远就能看见钢琴那边有一圈暖光在呼吸。 */
  {
    const bg2=new THREE.Group();
    plaza.add(bg2);
    for(let i=0;i<16;i++){
      const a=i/16*Math.PI*2;
      const lx=-45.3+Math.cos(a)*2.45, lz=-11.3+Math.sin(a)*2.45;
      addNS(bg2,new THREE.SphereGeometry(.085,10,8),getBulbMat(0xffd49a,i),lx,.045,lz);
      /* 每颗灯下面一圈金属灯圈，雪地上一眼能看出是「地埋灯」而不是浮空的小球 */
      const ring=addNS(bg2,new THREE.TorusGeometry(.135,.028,6,16),M(0x3a4149,{roughness:.5,metalness:.7}),lx,.012,lz);
      ring.rotation.x=Math.PI/2;
      /* 灯脚下的雪面暖斑：地埋灯的球只有 8.5cm，站在地上根本看不见。
         用乘法贴图在雪地上留一小圈淡暖光，远看就是「钢琴外围一圈亮着的地灯」。 */
      const spot=addNS(bg2,new THREE.CircleGeometry(.42,20),regNightGlow(new THREE.MeshBasicMaterial({
        map:mulGlowTex,color:0xffffff,transparent:true,opacity:.50,
        blending:THREE.MultiplyBlending,depthWrite:false,fog:false}),.50),lx,.016,lz);
      spot.rotation.x=-Math.PI/2;spot.renderOrder=2;spot.userData.noReflect=true;
    }
    mergeStatic(bg2);
  }
  /* ── 地面扫光：一条贴地旋转的暖色扇形 ──
     这里必须用「乘法混合」而不是加色混合：加色落在白雪上只会把雪地烧得更白，
     等于什么都看不见；乘法是「暖色 × 白雪 = 暖色」，雪地上才会真的显出一圈暖光。 ── */
  {
    /* color 必须是纯白：MeshBasicMaterial 的 color 会再乘一次 map，
       乘色 + 乘混合 = 颜色平方，白雪上直接烧成一块深橘色圆盘（等于把拆掉的底盘又画回来）。 */
    const sm=new THREE.MeshBasicMaterial({map:mulGlowTex,color:0xffffff,transparent:true,opacity:.30,
      blending:THREE.MultiplyBlending,depthWrite:false,fog:false});
    const sw=new THREE.Mesh(new THREE.RingGeometry(2.00,3.10,34,1,0,1.05),sm);
    sw.rotation.x=-Math.PI/2;
    sw.position.set(-45.3,.022,-11.3);
    sw.renderOrder=2;sw.userData.noReflect=true;sw.userData.keep=true;
    plaza.add(sw);
    pianoPlaza.sweep=sw;pianoPlaza.sweepMat=sm;
  }
  /* ── 大钢琴 ──────────────────────────────────────────────────────
     真实三角钢琴比例：长 2.4m / 宽 1.5m / 键盘高 0.75m
     掀开 28° 的琴盖 + 内部音板琴弦 + 描金边 + 88 键 + 琴凳 + 踏板 */
  const pg=new THREE.Group();
  pg.position.set(-45.3,0,-11.3);        // 挪到广场西边的开阔雪地上，离开市集摊位的挤压
  pg.rotation.y=2.42;                    // 键盘朝东南，正对着从小径进来的方向
  pg.scale.setScalar(1.28);              // 放大成一台「演出级」大三角钢琴
  plaza.add(pg);
  pianoPlaza.pg=pg;
  {
    /* 琴腿 */
    for(const q of [[-.60,.92],[.60,.92],[0,-.92]])
      add(pg,new THREE.CylinderGeometry(.055,.078,.66,10),lacqM,q[0],.33,q[1]);
    /* 琴身做成「空壳」：底板 + 侧板 + 前后挡板。
       掀开琴盖能看见里面的金色音板和琴弦 —— 做成实心黑盒子就只是一块方块。 */
    add(pg,BX(1.44,.05,1.40),lacqM,0,.685,.35);            // 宽段底板
    add(pg,BX(.96,.05,.91),lacqM,0,.685,-.805);             // 尾段底板
    add(pg,BX(.06,.30,1.40),lacqM,-.69,.82,.35);           // 宽段左侧板
    add(pg,BX(.06,.30,1.40),lacqM,.69,.82,.35);            // 宽段右侧板
    add(pg,BX(1.44,.30,.06),lacqM,0,.82,1.02);             // 键盘下方前挡板
    /* 前挡板外侧也来一道反光，正面看琴时才不是一条死黑的带子 */
    const faceSheen=addNS(pg,new THREE.PlaneGeometry(1.38,.26),new THREE.MeshBasicMaterial({
      map:lacquerSheenTex,transparent:true,opacity:.12,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false}),0,.85,1.055);
    faceSheen.renderOrder=3;faceSheen.userData.noReflect=true;
    add(pg,BX(1.44,.30,.06),lacqM,0,.82,-.32);             // 中段挡板
    add(pg,BX(.06,.30,.91),lacqM,-.45,.82,-.805);          // 尾段左侧板
    add(pg,BX(.06,.30,.91),lacqM,.45,.82,-.805);           // 尾段右侧板
    add(pg,BX(.96,.30,.06),lacqM,0,.82,-1.23);             // 尾端挡板
    /* 内部：金色音板 + 一排琴弦 + 两根撑柱 */
    add(pg,BX(1.28,.02,1.30),brassM,0,.78,.35);
    add(pg,BX(.86,.02,.85),brassM,0,.78,-.80);
    for(let i=0;i<7;i++)
      addNS(pg,BX(.012,.012,1.24),M(0xf2dba2,{roughness:.22,metalness:.90,emissive:0xffcf82,emissiveIntensity:.62}),-.42+i*.14,.80,.35);
    for(let i=0;i<4;i++)
      addNS(pg,BX(.012,.012,.78),M(0xf2dba2,{roughness:.22,metalness:.90,emissive:0xffcf82,emissiveIntensity:.62}),-.24+i*.16,.80,-.80);
    add(pg,BX(.05,.10,.05),lacqM,-.52,.80,.20);
    add(pg,BX(.05,.10,.05),lacqM,.52,.80,.20);
    add(pg,BX(.05,.10,.05),lacqM,0,.80,-.62);
    /* 描金边 */
    addNS(pg,BX(1.46,.014,.035),goldM,0,.972,1.045);
    addNS(pg,BX(.98,.014,.035),goldM,0,.972,-1.26);
    addNS(pg,BX(.035,.014,1.40),goldM,.722,.972,.35);
    addNS(pg,BX(.035,.014,1.40),goldM,-.722,.972,.35);
    addNS(pg,BX(.035,.014,.91),goldM,.482,.972,-.805);
    addNS(pg,BX(.035,.014,.91),goldM,-.482,.972,-.805);
    /* 琴盖（沿低音侧铰链掀开 26°，边缘描金，才像琴盖不像木板） */
    const hinge=new THREE.Group();
    hinge.position.set(-.73,.995,-.10);
    pg.add(hinge);
    add(hinge,BX(1.54,.09,2.36),lacqM,.75,0,0);
    addNS(hinge,BX(.035,.11,2.36),goldM,1.52,0,0);
    hinge.rotation.z=.46;
    /* 掀开的琴盖顶面贴一层环境反光：黑漆立刻有体积，
       不用再靠加光源（加光源只会把琴盖照成一块死白）。 */
    const sheen=addNS(hinge,new THREE.PlaneGeometry(1.50,2.26),new THREE.MeshBasicMaterial({
      map:lacquerSheenTex,transparent:true,opacity:.45,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false}),.75,.052,.02);
    sheen.rotation.x=-Math.PI/2;
    sheen.renderOrder=3;sheen.userData.noReflect=true;
    add(pg,new THREE.CylinderGeometry(.014,.014,.52,6),brassM,.28,1.26,-.05);
    /* 谱架 */
    const desk=add(pg,BX(.92,.34,.035),lacqM,0,1.02,.86);
    desk.rotation.x=-.30;
    /* 键床 */
    add(pg,BX(1.34,.07,.26),lacqM,0,.70,1.05);
    /* 88 键：36 白键 + 25 黑键（两个 InstancedMesh，两个 draw call） */
    const KW=.033,NW=36;
    const x0=-(NW*KW)/2;
    const wMidi=new Int16Array(NW),bMidi=[];
    for(let i=0;i<NW;i++)
      wMidi[i]=60+12*Math.floor(i/7)+[0,2,4,5,7,9,11][i%7];
    const tmp=new THREE.Object3D();
    const white=new THREE.InstancedMesh(new THREE.BoxGeometry(KW*.92,.026,.215),keyM,NW);
    white.castShadow=false;white.receiveShadow=false;
    for(let i=0;i<NW;i++){
      tmp.position.set(x0+(i+.5)*KW,.745,1.06);
      tmp.rotation.set(0,0,0);tmp.updateMatrix();
      white.setMatrixAt(i,tmp.matrix);
      white.setColorAt(i,new THREE.Color(1,1,1));
    }
    white.instanceMatrix.needsUpdate=true;
    white.instanceColor.needsUpdate=true;
    pg.add(white);
    const black=new THREE.InstancedMesh(new THREE.BoxGeometry(KW*.60,.030,.128),bkeyM,25);
    black.castShadow=false;black.receiveShadow=false;
    let bi=0;
    for(let i=0;i<NW-1&&bi<25;i++){
      if([0,1,3,4,5].indexOf(i%7)<0)continue;
      tmp.position.set(x0+(i+1)*KW,.762,1.022);
      tmp.rotation.set(0,0,0);tmp.updateMatrix();
      black.setMatrixAt(bi,tmp.matrix);
      black.setColorAt(bi,new THREE.Color(1,1,1));
      bMidi.push(wMidi[i]+1);
      bi++;
    }
    black.instanceMatrix.needsUpdate=true;
    black.instanceColor.needsUpdate=true;
    pg.add(black);
    pianoPlaza.white=white;pianoPlaza.black=black;
    pianoPlaza.wMidi=wMidi;pianoPlaza.bMidi=bMidi;
    pianoPlaza.wglow=new Float32Array(NW);
    pianoPlaza.bglow=new Float32Array(25);
    /* 琴凳 */
    const bench=new THREE.Group();
    bench.position.set(0,0,1.98);
    pg.add(bench);
    add(bench,BX(.80,.09,.40),velvetM,0,.48,0);
    add(bench,BX(.84,.04,.44),lacqM,0,.525,0);
    for(const q of [[-.32,-.14],[.32,-.14],[-.32,.14],[.32,.14]])
      add(bench,BX(.06,.44,.06),lacqM,q[0],.22,q[1]);
    /* 踏板 */
    add(pg,BX(.20,.30,.10),lacqM,0,.22,1.02);
    for(const q of [-.06,0,.06])add(pg,BX(.035,.02,.16),brassM,q,.09,1.06);
  }
  /* ── 钢琴脚下的灯：这轮的重点全在这儿 ──
     钢琴通体亮漆黑面，夜景里不给底光就是一坨黑影。
     现在琴身底下塞了三盏贴地的暖光往上照（uplit）——
     琴腿、琴身下沿、琴凳全被从下往上勾出轮廓，黑色漆面立刻有了体积感；
     再加琴盖上方一盏窄角射灯压下来，照亮掀开的琴盖和里面的金色音板、琴弦。
     一台钢琴在雪夜里要靠「光」立得住，不是靠再堆装饰件。 */
  {
    /* 脚下光池：乘法混合，雪地上真的能看见一圈暖光 */
    const pl=new THREE.Mesh(new THREE.CircleGeometry(1,48),regNightGlow(new THREE.MeshBasicMaterial({
      map:mulGlowTex,color:0xffffff,transparent:true,opacity:.34,
      blending:THREE.MultiplyBlending,depthWrite:false,fog:false}),.34));
    pl.rotation.x=-Math.PI/2;
    pl.position.set(pg.position.x,.028,pg.position.z);
    pl.scale.setScalar(2.05);   /* 光池只盖住琴脚，多了就成了「底盘」 */
    pl.renderOrder=2;pl.userData.noReflect=true;
    plaza.add(pl);
    /* 三盏贴地暖光往上照（跟着钢琴一起移动、一起放大）*/
    /* decay 1.25 而不是物理的 2：贴地的灯离雪面只有 30cm，
       1/d² 在那儿会烧出一块死白的过曝斑，1.25 次衰减才收得住。 */
    const upl=[[0,.34,.88,1.05,3.0],[.64,.52,.42,.72,2.6],[-.56,.44,-.30,.72,2.6]];
    const uplArr=[];
    for(const [ux,uy,uz,ii,dd] of upl){
      const l=new THREE.PointLight(0xffb26a,ii,dd,1.25);
      l.position.set(ux,uy,uz);
      l.userData.base=ii;
      pg.add(l);
      uplArr.push(l);
    }
    pianoPlaza.upl=uplArr;
    pianoPlaza.light=uplArr[0];
    /* 琴盖上的窄角射灯：只照琴腔和音板，锥角锁住不外溢 */
    const spot=new THREE.SpotLight(0xffdcae,10,3.6,.32,.85,1.4);
    spot.position.set(1.34,2.06,.12);
    pg.add(spot);
    const tgt=new THREE.Object3D();tgt.position.set(.10,.86,.06);
    pg.add(tgt);spot.target=tgt;
    pianoPlaza.spot=spot;
  }
  /* 碰撞：钢琴 / 琴凳 / 两棵树 */
  OUTDOOR_OBS.push([pg.position.x,pg.position.z,2.30]);
  OUTDOOR_OBS.push([treePos[0][0],treePos[0][1],.85]);
  OUTDOOR_OBS.push([treePos[1][0],treePos[1][1],.75]);
}

/* ══ 钢琴弹奏 + 灯光秀驱动 ══ */
function pianoWhiteIndex(midi){
  const o=Math.floor((midi-60)/12), s=(midi-60)%12;
  const p=[0,2,4,5,7,9,11].indexOf(s);
  return p<0?-1:o*7+p;
}
function pianoHit(midi){
  const pp=pianoPlaza;
  const wi=pianoWhiteIndex(midi);
  if(wi>=0&&wi<pp.wglow.length)pp.wglow[wi]=1;
  for(let i=0;i<pp.bMidi.length;i++)if(pp.bMidi[i]===midi)pp.bglow[i]=1;
}
function pianoPlay(){
  const s=sfx;
  if(!s||!s.ctx||!s.on)return;
  const t0=s.ctx.currentTime+.06;
  /* 一段上行再下行的小夜曲（C E G C E …），每个音点亮一个琴键 */
  const seq=[60,64,67,72,76,72,67,64,60,67];
  for(let i=0;i<seq.length;i++){
    s.playPianoFx(seq[i],t0+i*.235,.62,.17,0);
    pianoHit(seq[i]);
  }
  pianoPlaza.flash=1;
  s.blip(1046,.10,.05);
}
function updatePianoPlaza(dt,t){
  const pp=pianoPlaza;
  if(!pp.g)return;
  /* 琴键发光：按下 → 亮 → 1 秒内熄灭 */
  const dg=dt*1.9;
  const c=new THREE.Color();
  for(let i=0;i<pp.wglow.length;i++){
    if(pp.wglow[i]>0)pp.wglow[i]=Math.max(0,pp.wglow[i]-dg);
    const g=pp.wglow[i];
    c.setRGB(1+g*1.7,1+g*1.05,1-g*.30);
    pp.white.setColorAt(i,c);
  }
  for(let i=0;i<pp.bglow.length;i++){
    if(pp.bglow[i]>0)pp.bglow[i]=Math.max(0,pp.bglow[i]-dg);
    const g=pp.bglow[i];
    c.setRGB(1+g*2.2,1+g*1.2,1-g*.15);
    pp.black.setColorAt(i,c);
  }
  pp.white.instanceColor.needsUpdate=true;
  pp.black.instanceColor.needsUpdate=true;
  /* 地面扫光：平时慢转，弹奏时加速 + 提亮 */
  pp.flash=Math.max(0,pp.flash-dt*.85);
  if(pp.sweep){
    pp.sweep.rotation.y=phaseOf(24.17)*.26+pp.flash*.9;   // 纯相位，扫光全服同进度
    /* 扫光是「灯在转」的效果，白天该没有；flash（弹奏反馈）不受昼夜限制 */
    pp.sweepMat.opacity=(.09+.07*Math.sin(t*1.7))*MUL_GLOW_K+pp.flash*.24;
  }
  if(pp.upl)for(const l of pp.upl)l.intensity=l.userData.base*(1+pp.flash*2.2);
  if(pp.spot)pp.spot.intensity=13+pp.flash*16;
  /* 走近就提示 */
  if(fp.on&&!wheelSys.riding&&!trainSys.riding&&!balloonSys.riding&&!launchSys.active&&!heliSys.riding){
    const d=Math.hypot(fp.x-pp.px,fp.z-pp.pz);
    if(d<4.8)hudShow('圣诞大钢琴 · 按 E 弹一段','弹奏 (E)',pianoPlay);
  }
}

  /* ── 星夜极光风景云霄飞车（回归舒展流畅风格：多段开阔冲高回落 + 全程正立零倾斜，串起北街/雪林/旋转木马/摩天轮/烟花全景） ── */
  {
    const cg=new THREE.Group();fair.add(cg);
    const pts=[
      new THREE.Vector3(-10.5,  1.65, 23.2), // 北侧从容发车
      new THREE.Vector3(-19.5,  7.20, 22.6), // 缓坡爬升，远眺美术馆与北街灯火
      new THREE.Vector3(-27.2, 13.40, 24.5), // 1. 西北 13.4m 高处平稳观景段起点

      new THREE.Vector3(-28.8,  8.60, 34.6), // 俯冲入弯过渡点（把谷底尖角磨圆）
      new THREE.Vector3(-28.4,  3.60, 39.0), // 舒展顺滑俯冲谷底
