/* ══ 碰碰车：玩家接管驾驶（冰面 Arcade 物理） ══
   W/↑ 油门 · S/↓ 刹车倒车 · A/← D/→ 转向 · 拖动鼠标环顾 · E 下车
   横向抓地力弱 → 转向会甩尾；撞到别的车会被弹开并把它撞出轨道。 */
const BUMPER={maxV:8.0,acc:9.6,rev:5.6,drag:1.10,lat:2.70,turn:1.85,minTurnV:1.25,steerLag:5.2,
              edgeX:11.15,edgeZ:7.15,carR:.76,push:.42};

/* ══ 碰碰车撞击表现 ══
   撞车不该只是「弹开 + 缩一下」，要看得见：
     · 车身朝撞击方向压扁（上下扁、四周鼓）
     · 朝撞击方向侧倾 + 回弹（弹簧，不是硬停）
     · 撞击点飞起一蓬雪沫
     · 车上那只小熊驾驶员举手惊呼
   力度 power 0~1.6，(nx,nz) 是撞击方向（世界坐标单位向量）。 */
function bumperBump(car,nx,nz,power){
  const st=car.userData.st;
  if(!st)return;
  const p=Math.min(1.6,Math.max(0,power));
  if(p<.05)return;
  st.sq=Math.min(1.1,st.sq+p*.8);
  /* 撞击方向换算到车身本地（车头 = +Z）*/
  const ang=car.rotation.y;
  const lx=nx*Math.cos(ang)-nz*Math.sin(ang);
  const lz=nx*Math.sin(ang)+nz*Math.cos(ang);
  st.pitchV+=lz*p*1.5;      // 被推着走 → 车头跟着下沉（正面顶 → 车头一沉）
  st.rollV+=lx*p*1.2;       // 侧向被推 → 车身侧倾
  st.spinV+=lx*p*.9;        // 挨撞侧的车会被顶得转个角度
  st.react=Math.min(1,st.react+p*.65);
  /* 撞击点雪沫（接触点在被推方向的反侧） */
  const px=car.position.x-nx*.62, pz=car.position.z-nz*.62;
  const n=3+Math.round(p*4);
  for(let i=0;i<n;i++){
    spawnSnowPuff(px+R(-.14,.14),.30+R(0,.1),pz+R(-.14,.14),
      nx*R(.5,1.9)+R(-.6,.6),R(.9,2.4),nz*R(.5,1.9)+R(-.6,.6),R(.05,.13),R(.30,.62));
  }
}
/* 撞击动画推进：弹簧回弹 + 压扁 + 驾驶员反应 */
function bumperBumpAnim(car,dt){
  const st=car.userData.st;
  if(!st)return;
  if(st.sq>0)st.sq=Math.max(0,st.sq-dt*3.2);
  const K=58,C=10.5;
  st.pitchV+=(-st.pitch*K-st.pitchV*C)*dt; st.pitch+=st.pitchV*dt;
  st.rollV+=(-st.roll*K-st.rollV*C)*dt;   st.roll+=st.rollV*dt;
  st.spinV+=(-st.spin*46-st.spinV*8.5)*dt; st.spin+=st.spinV*dt;
  /* 压扁：上下扁、四周鼓；叠一点侧倾摇摆 */
  const s=.62*(1+st.sq*.04);
  car.scale.set(s*(1+st.sq*.055), s*(1-st.sq*.105), s*(1+st.sq*.055));
  car.rotation.x=st.pitch;
  car.rotation.z=st.roll+Math.sin(t*7.3+st.ph)*st.sq*.05;
  if(st.spin)car.rotation.y+=st.spin;
  /* 驾驶员：被撞到就举手 */
  const drv=car.userData.driver;
  if(st.react>0){
    st.react=Math.max(0,st.react-dt*1.5);
    st.reactWas=1;
    if(drv&&drv.userData.armL){
      const r=st.react;
      drv.userData.armL.rotation.x=-.78-r*1.45;
      drv.userData.armR.rotation.x=-.78-r*1.45;
      drv.userData.armL.rotation.z=r*.35;
      drv.userData.armR.rotation.z=-r*.35;
    }
  }else if(st.reactWas){
    st.reactWas=0;
    if(drv&&drv.userData.armL){
      drv.userData.armL.rotation.x=-.78;drv.userData.armR.rotation.x=-.78;
      drv.userData.armL.rotation.z=0;drv.userData.armR.rotation.z=0;
    }
  }
}
/* 撞击声：闷响 + 金属余韵，力度越大越响 */
function bumperClash(power,dist){
  const pw=Math.min(1,Math.max(.15,power));
  const vol=Math.max(0,1-(dist||0)/30);
  if(vol<=0)return;
  sfx.blip(92+pw*44,.20,(.055+pw*.075)*vol);
  sfx.blip(720+pw*430,.11,.045*pw*vol);
  sfx.blip(1210,.07,.028*pw*vol);
}
function updateBumperDrive(dt){
  const b=wheelSys.bump;
  if(!b||!wheelSys.riding||wheelSys.kind!=='bumper'||!b.car)return;
  const car=b.car;
  /* ── 输入 ── */
  let thr=0,str=0;
  if(fp.keys['KeyW']||fp.keys['ArrowUp'])thr+=1;
  if(fp.keys['KeyS']||fp.keys['ArrowDown'])thr-=1;
  if(fp.keys['KeyA']||fp.keys['ArrowLeft'])str-=1;
  if(fp.keys['KeyD']||fp.keys['ArrowRight'])str+=1;
  if(joy.mag>0.02){thr+=-joy.dy*1.25;str+=joy.dx*1.35;}
  thr=Math.max(-1,Math.min(1,thr));
  str=Math.max(-1,Math.min(1,str));
  /* 油门/方向盘做一点平滑：不会一按就猛打，也保留推背感 */
  const _t0=b.thr||0,_s0=b.steer||0;
  b.thr=_t0+(thr-_t0)*Math.min(1,BUMPER.steerLag*dt);
  b.steer=_s0+(str-_s0)*Math.min(1,BUMPER.steerLag*dt);
  thr=b.thr;str=b.steer;
  /* ── 车速分解：纵向（沿车头）+ 横向（甩尾） ── */
  let ang=b.ang,vx=b.vx,vz=b.vz;
  const fx=Math.sin(ang),fz=Math.cos(ang);
  let vf=vx*fx+vz*fz;
  const lxv=vx-fx*vf, lzv=vz-fz*vf;
  /* 油门 / 刹车倒车 */
  if(thr>0)vf+=BUMPER.acc*thr*dt;
  else if(thr<0){
    if(vf>.5)vf-=BUMPER.rev*1.7*dt;      // 先刹住
    else vf+=BUMPER.rev*thr*dt;          // 停住后倒车
  }
  /* 冰面滑行阻力 + 横向抓地衰减 */
  vf-=vf*Math.min(1,BUMPER.drag*dt);
  const kf=Math.exp(-BUMPER.lat*dt);
  const nlx=lxv*kf,nlz=lzv*kf;
  /* 转向：车速不够转不动（有抓地感，不是原地转圈） */
  const grip=Math.min(1,Math.abs(vf)/BUMPER.minTurnV);
  ang-=str*BUMPER.turn*grip*dt;
  const nfx=Math.sin(ang),nfz=Math.cos(ang);
  vx=nfx*vf+nlx; vz=nfz*vf+nlz;
  /* 限速 */
  const spd=Math.hypot(vx,vz);
  if(spd>BUMPER.maxV){vx*=BUMPER.maxV/spd;vz*=BUMPER.maxV/spd;}
  /* ── 位移 ── */
  let px=car.position.x+vx*dt, pz=car.position.z+vz*dt;
  /* ── 撞围栏 ── */
  let hitWall=0,wallNx=0,wallNz=0;
  if(px> BUMPER.edgeX){px= BUMPER.edgeX;vx=-vx*.45;hitWall=1;wallNx=-1;}
  if(px<-BUMPER.edgeX){px=-BUMPER.edgeX;vx=-vx*.45;hitWall=1;wallNx=1;}
  if(pz> BUMPER.edgeZ){pz= BUMPER.edgeZ;vz=-vz*.45;hitWall=1;wallNz=-1;}
  if(pz<-BUMPER.edgeZ){pz=-BUMPER.edgeZ;vz=-vz*.45;hitWall=1;wallNz=1;}
  car.position.x=px;car.position.z=pz;
  /* ── 撞其他车：互相弹开 + 把对方撞出轨道 ── */
  let hitCar=0,carNx=0,carNz=0,carPower=0;
  for(const o of amusement.bumper){
    if(o===car)continue;
    const dx=px-o.position.x, dz=pz-o.position.z;
    const d=Math.hypot(dx,dz);
    const rr=BUMPER.carR*2;
    if(d>=rr||d<1e-4)continue;
    const nx=dx/d, nz=dz/d;
    const push=rr-d;
    px+=nx*push; pz+=nz*push;
    const ovx=o.userData.st.vx||0, ovz=o.userData.st.vz||0;
    const rel=(vx-ovx)*nx+(vz-ovz)*nz;          // 接近速度（负=正在撞上）
    if(rel<0){
      const imp=-(1+BUMPER.push)*rel*.5;
      vx+=nx*imp; vz+=nz*imp;
      const ost=o.userData.st;
      ost.kx=(ost.kx||0)-nx*imp*1.15;
      ost.kz=(ost.kz||0)-nz*imp*1.15;
      hitCar=1;carNx=nx;carNz=nz;
      carPower=Math.max(carPower,Math.min(1.5,-rel*.42));
      /* 对方那台也要有反应：被顶得歪一下、驾驶员举手 */
      bumperBump(o,-nx,-nz,carPower);
    }
  }
  car.position.x=px;car.position.z=pz;
  car.rotation.y=ang;
  b.ang=ang;b.vx=vx;b.vz=vz;b.speed=Math.hypot(vx,vz);
  /* ── 撞击反馈：闷响 + 车身压扁侧倾 + 镜头一抖 ── */
  if(hitCar&&carPower>.05){
    bumperBump(car,carNx,carNz,carPower);             // 自己被顶着走
    b.shake=Math.min(1,(b.shake||0)+carPower*.85);   // 镜头抖一下
  }
  if(hitWall){
    const wl=Math.hypot(wallNx,wallNz)||1;
    bumperBump(car,wallNx/wl,wallNz/wl,.55+Math.min(.7,Math.abs(b.speed||0)*.09));
    b.shake=Math.min(1,(b.shake||0)+.35);
  }
  if((hitCar||hitWall)&&b.hitCd<=0){
    b.hitCd=.22;
    bumperClash(hitCar?carPower:.5,0);
  }
  if(b.hitCd>0)b.hitCd-=dt;
  if(b.shake>0)b.shake=Math.max(0,b.shake-dt*2.8);
  bumperBumpAnim(car,dt);   // 弹簧回弹 + 压扁 + 驾驶员反应
  car.updateMatrixWorld(true);
}

function updateWheelRide(dt){
  if(wheelSys.riding&&fp.on){
    const wp=new THREE.Vector3();
    if(wheelSys.kind==='wheel'&&wheelSys.cab){
      wheelSys.cab.getWorldPosition(wp);
      wp.y-=.52;wp.z+=.12;
    }else if(wheelSys.kind==='carousel'&&amusement.horses&&amusement.horses.length){
      wp.set(0,.98,.05).applyMatrix4(amusement.horses[0].g.matrixWorld);
    }else if(wheelSys.kind==='ship'&&amusement.ship){
      wp.set(2.1,-3.65,0).applyMatrix4(amusement.ship.matrixWorld);
    }else if(wheelSys.kind==='coaster'&&amusement.coaster){
      const co=amusement.coaster, car0=co.cars[0];
      if(!co._camL){co._camL=new THREE.Vector3();co._camU=new THREE.Vector3();co._camDir=new THREE.Vector3();co._camDirS=null;}
      // 车厢矩阵本帧刚更新过位置：先同步 matrixWorld，避免相机用上一帧矩阵导致俯冲高速段一帧滞后抖动
      car0.updateMatrixWorld(true);
      wp.set(0,.70,.24).applyMatrix4(car0.matrixWorld);
      fp.x=wp.x;fp.z=wp.z;fp.y=wp.y-FP_EYE;
      camera.position.copy(wp);
      co._camL.set(0,.56,8.0).applyMatrix4(car0.matrixWorld);
      // 视线方向做指数平滑：过顶转俯冲时不再瞬间折角“顿一下”
      co._camDir.subVectors(co._camL,wp).normalize();
      if(!co._camDirS)co._camDirS=co._camDir.clone();
      co._camDirS.lerp(co._camDir,1-Math.exp(-dt*9)).normalize();
      co.sampleTrackUp(co.t%1,co._camU);
      camera.up.copy(co._camU);
      camera.lookAt(co._camL.copy(wp).addScaledVector(co._camDirS,8));
      hudShow('','下车 (E)',stopFacilityRide,true);
      return;
    }else if(wheelSys.kind==='bumper'&&(wheelSys.car||amusement.bumper.length)){
      const car=wheelSys.car||amusement.bumper[0];
      const b=wheelSys.bump;
      /* 坐在原来那只小熊的位置上：视点落在驾驶员头部高度 */
      wp.set(0,1.26,-.10).applyMatrix4(car.matrixWorld);
      fp.x=wp.x;fp.z=wp.z;fp.y=wp.y-FP_EYE;
      camera.position.copy(wp);
      const ang=(b&&b.ang!==undefined)?b.ang:car.rotation.y;
      const look=(b&&b.look)||0;
      /* 撞击瞬间镜头抖一下（力度 b.shake 随时间衰减） */
      const sh=(b&&b.shake)||0;
      if(sh>0){
        camera.position.x+=R(-.055,.055)*sh;
        camera.position.y+=R(-.05,.05)*sh;
        camera.position.z+=R(-.055,.055)*sh;
      }
      camera.rotation.set(fp.pitch+(sh?R(-.05,.05)*sh:0),ang+Math.PI+look,sh?R(-.07,.07)*sh:0,'YXZ');
      hudShow('','下车 (E)',stopFacilityRide,true);
      return;
    }else if(wheelSys.kind==='sleigh'){
      // 坐在圣诞老人后面的高处礼物堆上：居高临下俯瞰圣诞老人背影、三只驯鹿与雪夜全城
      wp.set(0,2.05,-2.65).applyMatrix4(flyingSleigh.matrixWorld);
    }else if(wheelSys.kind==='heli'&&wheelSys.heli){
      wp.set(0,.18,1.95).applyMatrix4(wheelSys.heli.g.matrixWorld);
    }
    fp.x=wp.x;fp.z=wp.z;fp.y=wp.y-FP_EYE;
    camera.position.copy(wp);
    camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
    hudShow('','下车 (E)',stopFacilityRide,true);
    return;
  }
  trainBtnEl.onclick=()=>toggleRideTrain(null);
  if(!trainSys.riding&&!launchSys.active&&fp.on){
    const dw=Math.hypot(fp.x-27,fp.z-36);
    if(dw<10.5){
      hudShow('敞篷观景摩天轮 · 按 E 或点击坐上吊篮','坐摩天轮 (E)',()=>toggleRideWheel(null));
    }
  }
}
trainBtnEl.onclick=()=>toggleRideTrain();
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(e.code==='KeyK'){
    toggleRideFacility({kind:'sleigh',label:'空中圣诞驯鹿雪橇'});
    return;
  }
  if(e.code==='KeyE'){
    if(heliSys.riding){heliSys.fast=true;return;}
    if(heliNearPlayer()){toggleHeliRide();return;}
    if(balloonSys.riding){stopBalloonRide();return;}
    const _bNear=balloonNearPlayer();
    if(_bNear>=0){toggleBalloonRide(_bNear);return;}
    if(wheelSys.riding){toggleRideWheel(null);return;}
    if(trainSys.riding){toggleRideTrain();return;}
    if(fp.on&&Math.hypot(fp.x-27,fp.z-36)<10.5){toggleRideWheel(null);return;}
    if(fp.on&&trainCars.some(c=>Math.hypot(fp.x-c.position.x,fp.z-c.position.z)<9.5)){toggleRideTrain();return;}
    if(fp.on&&Math.hypot(fp.x-pianoPlaza.px,fp.z-pianoPlaza.pz)<4.8){pianoPlay();return;}
  }
});

function updateTrain(dt){
  // 全程不停站连续高速巡航
  trainSys.atStation=null;
  trainSys.speed=trainSys.maxSpeed;
  trainSys.u=(trainSys.u+(trainSys.speed*dt)/TRAIN_LEN)%1;

  // 更新 6 节加长重型列车编组位姿（双转向架弦线对齐，过弯平滑零脱轨）+ 防止玩家穿模
  const bogieHalf=2.05/TRAIN_LEN;
  for(let i=0;i<trainCars.length;i++){
    const distBack=i===0?0:(6.45+(i-1)*6.52);
    const cu=(trainSys.u-distBack/TRAIN_LEN+1)%1;
    const pF=TRAIN_CURVE.getPointAt((cu+bogieHalf)%1);
    const pR=TRAIN_CURVE.getPointAt((cu-bogieHalf+1)%1);
    const px=(pF.x+pR.x)*.5, pz=(pF.z+pR.z)*.5;
    trainCars[i].position.set(px,0,pz);
    trainCars[i].rotation.y=Math.atan2(pF.x-pR.x,pF.z-pR.z);
    if(!trainSys.riding&&!launchSys.active&&fp.on){
      const dx=fp.x-px,dz=fp.z-pz,d=Math.hypot(dx,dz);
      if(d<2.45&&d>.01){fp.x=px+(dx/d)*2.45;fp.z=pz+(dz/d)*2.45;}
    }
  }

  // 车头大烟囱迎风向后翻滚浓密蒸汽云团 + 前侧双蒸汽气缸泄压白雾
  const loco=trainCars[0];
  loco.updateMatrixWorld();
  const locoTg=TRAIN_CURVE.getTangentAt(trainSys.u);
  const backX=-locoTg.x, backZ=-locoTg.z;
  const rightX=-locoTg.z, rightZ=locoTg.x;

  trainSys.steamCd-=dt;
  if(trainSys.steamCd<=0){
    trainSys.steamCd=.038;
    const noz=new THREE.Vector3(R(-.10,.10),3.22,1.95).applyMatrix4(loco.matrixWorld);
    const pf=trainSteamPuffs[trainSteamCursor];
    trainSteamCursor=(trainSteamCursor+1)%trainSteamPuffs.length;
    pf.alive=true;pf.life=0;pf.max=R(1.45,2.05);
    pf.x=noz.x;pf.y=noz.y;pf.z=noz.z;
    // 迎风强力后掠：初速度猛烈朝列车正后方喷卷，并带向上热浮力与横向湍流
    const backSpd=R(5.8,9.2), sideJit=R(-.75,.75);
    pf.vx=backX*backSpd+rightX*sideJit;
    pf.vy=R(2.8,4.1);
    pf.vz=backZ*backSpd+rightZ*sideJit;
    pf.bx=backX;pf.bz=backZ;
    pf.sc0=R(.82,1.12);pf.sc1=R(3.1,4.4);
  }
  trainSys.pistonCd-=dt;
  if(trainSys.pistonCd<=0){
    trainSys.pistonCd=.11;
    for(const s of [-1,1]){
      const cp=new THREE.Vector3(s*1.32,.56,2.15).applyMatrix4(loco.matrixWorld);
      spawnSnowPuff(cp.x,cp.y,cp.z,backX*3.5+rightX*s*1.8,R(.9,1.6),backZ*3.5+rightZ*s*1.8,.85,.45);
    }
  }

  // 更新迎风后掠蒸汽云团（先向上喷涌再被迎面风压弯向后上方拉出 15m+ 翻滚长烟带）
  for(let i=0;i<trainSteamPuffs.length;i++){
    const pf=trainSteamPuffs[i];
    if(!pf.alive)continue;
    pf.life+=dt;
    if(pf.life>=pf.max){
      pf.alive=false;pf.mat.opacity=0;pf.sp.position.set(0,-40,0);continue;
    }
    const u=pf.life/pf.max;
    // 迎风空气阻力持续把烟团往后推，同时上升速度随高度逐渐放缓平流
    pf.vx+=pf.bx*3.6*dt;
    pf.vz+=pf.bz*3.6*dt;
    pf.vy=Math.max(.55,pf.vy-1.35*dt);
    const curl=Math.sin(pf.life*5.2+pf.wob)*.85;
    pf.x+=(pf.vx-pf.bz*curl)*dt;
    pf.y+=pf.vy*dt;
    pf.z+=(pf.vz+pf.bx*curl)*dt;
    pf.sp.position.set(pf.x,pf.y,pf.z);
    const sc=pf.sc0+(pf.sc1-pf.sc0)*Math.pow(u,.68);
    pf.sp.scale.set(sc,sc*.88,1);
    const fadeIn=Math.min(1,u*6.5);
    const fadeOut=Math.pow(1-u,1.25);
    pf.mat.opacity=.78*fadeIn*fadeOut;
  }

  // 玩家乘车视角跟随（锁定在最后一节加长车厢最后一排，面向正后方观景）
  if(trainSys.riding&&fp.on){
    const caboose=trainCars[trainCars.length-1];
    if(!caboose.userData._camS){caboose.userData._camS=new THREE.Vector3();caboose.userData._camL=new THREE.Vector3();}
    const seat=caboose.userData._camS.set(0,1.56,-2.28).applyMatrix4(caboose.matrixWorld);
    const lookBack=caboose.userData._camL.set(0,1.40,-16.0).applyMatrix4(caboose.matrixWorld);
    fp.x=seat.x;fp.z=seat.z;fp.y=seat.y-FP_EYE;
    camera.position.copy(seat);
    camera.up.set(0,1,0);
    camera.lookAt(lookBack);
    hudShow('','下车 (E)',()=>toggleRideTrain(),true);
  }else if(fp.on){
    const nearCar=trainCars.some(c=>Math.hypot(fp.x-c.position.x,fp.z-c.position.z)<9.5);
    if(nearCar){
      hudShow('🚂 皇家冬夜加长特快经过身旁 · 点击车厢或按 E 随时上车','上车 (E)',()=>toggleRideTrain());
    }else{
      hudHide();
    }
  }else{
    hudHide();
  }
}

/* ══ Saltline 级真实法线贴图（NormalMap）+ 粗糙度贴图 + 材质对比度调优 ══ */
(function initSaltlinePBR(){
  function makeNormalAndRough(mode){
    const S=256,c=document.createElement('canvas');c.width=S;c.height=S;
    const x=c.getContext('2d'),img=x.createImageData(S,S),d=img.data;
    const rc=document.createElement('canvas');rc.width=S;rc.height=S;
    const rx=rc.getContext('2d'),rimg=rx.createImageData(S,S),rd=rimg.data;
    /* 整数哈希代替 sin 哈希：同样的噪声分布，但一张 256² 贴图快 2~3 倍
       （原来 3 张贴图要 114ms，sin 是大头） */
    const h=(ix,iy)=>{let n=(((ix%S)+S)%S)*374761393+(((iy%S)+S)%S)*668265263;
      n=(n^(n>>>13))*1274126177;return ((n^(n>>>16))>>>0)/4294967296;};
    const vnoise=(px,py)=>{
      const ix=Math.floor(px),iy=Math.floor(py),fx=px-ix,fy=py-iy;
      const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
      const a=h(ix,iy),b=h(ix+1,iy),c2=h(ix,iy+1),d2=h(ix+1,iy+1);
      return a+(b-a)*ux+(c2-a)*uy+(a-b-c2+d2)*ux*uy;
    };
    const heightAt=(xx,yy)=>{
      if(mode==='snow')return vnoise(xx*.07,yy*.07)*.65+vnoise(xx*.16,yy*.16)*.35;
      if(mode==='wood'){const ring=Math.sin((xx*.14+vnoise(xx*.03,yy*.02)*3.5)*3.14)*.5+.5;return ring*.72+vnoise(xx*.18,yy*.04)*.28;}
      return vnoise(xx*.12,yy*.12)*.65+vnoise(xx*.28,yy*.28)*.35;
    };
    const strength=mode==='wood'?0.95:mode==='snow'?0.45:0.65;
    for(let y=0;y<S;y++)for(let xx=0;xx<S;xx++){
      const dx=(heightAt(xx+1,y)-heightAt(xx-1,y))*strength;
      const dy=(heightAt(xx,y+1)-heightAt(xx,y-1))*strength;
      let nx=-dx,ny=-dy,nz=1;const il=1/Math.hypot(nx,ny,nz);
      nx*=il;ny*=il;nz*=il;
      const p=(y*S+xx)*4;
      d[p]=Math.round((nx*.5+.5)*255);d[p+1]=Math.round((ny*.5+.5)*255);d[p+2]=Math.round((nz*.5+.5)*255);d[p+3]=255;
      const rv=Math.max(110,Math.min(255,Math.round((0.55+heightAt(xx,y)*0.45)*255)));
      rd[p]=rd[p+1]=rd[p+2]=rv;rd[p+3]=255;
    }
    x.putImageData(img,0,0);rx.putImageData(rimg,0,0);
    const ntx=new THREE.CanvasTexture(c);ntx.wrapS=ntx.wrapT=THREE.RepeatWrapping;ntx.repeat.set(mode==='wood'?2:6,mode==='wood'?2:6);ntx.anisotropy=4;
    const rtx=new THREE.CanvasTexture(rc);rtx.wrapS=rtx.wrapT=THREE.RepeatWrapping;rtx.repeat.set(mode==='wood'?2:6,mode==='wood'?2:6);rtx.anisotropy=4;
    return {ntx,rtx};
  }
  const snowPBR=makeNormalAndRough('snow'), woodPBR=makeNormalAndRough('wood'), stonePBR=makeNormalAndRough('stone');
  // 艺术馆内部 (shop / shop1 / shop2，不含天台室外展区 roofExpo) 独占写实 PBR 微缩沙盘光影（克隆共享材质并标记 noToon）
  const museumPbrClones=new Map();
  shop.traverse(o=>{
    if(o===roofExpo)return;
    let p=o.parent;while(p){if(p===roofExpo)return;p=p.parent;}
    if(!o.isMesh||!o.material)return;
    const cloneMat=m=>{
      if(!m)return m;
      if(m.userData&&m.userData.isMuseumPBR)return m;
      if(!museumPbrClones.has(m)){
        const cm=m.clone();
        cm.userData=Object.assign({},m.userData,{noToon:true,isMuseumPBR:true});
        museumPbrClones.set(m,cm);
      }
      return museumPbrClones.get(m);
    };
    o.material=Array.isArray(o.material)?o.material.map(cloneMat):cloneMat(o.material);
  });
  const seen=new Set();
  scene.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    for(const m of mats){
      if(!m||seen.has(m))continue;seen.add(m);
      if(m.isMeshStandardMaterial||m.isMeshPhysicalMaterial){
        const isMP=!!(m.userData&&m.userData.isMuseumPBR);
        if(m.metalness>=.45||m.roughness<=.42){
          m.envMapIntensity=Math.max(m.envMapIntensity||1,1.55);m.needsUpdate=true;continue;
        }
        if(m.normalMap||m.bumpMap||m.map)continue;
        const c=m.color;if(!c)continue;
        const lum=c.r*.3+c.g*.59+c.b*.11;
        if(lum>.78&&m.roughness>=.86){
          m.normalMap=snowPBR.ntx;m.normalScale=new THREE.Vector2(isMP?.42:.14,isMP?.42:.14);
          m.roughnessMap=snowPBR.rtx;m.needsUpdate=true;
        }else if(c.r>c.b*1.25&&m.roughness>=.70&&lum<.55){
          m.normalMap=woodPBR.ntx;m.normalScale=new THREE.Vector2(isMP?.52:.20,isMP?.52:.20);
          m.roughnessMap=woodPBR.rtx;m.needsUpdate=true;
        }else if(m.roughness>=.80){
          m.normalMap=stonePBR.ntx;m.normalScale=new THREE.Vector2(isMP?.36:.14,isMP?.36:.14);
          m.roughnessMap=stonePBR.rtx;m.needsUpdate=true;
        }
      }
    }
  });
})();

/* ══ 日系二次元电影感三渲二全局着色器增强（Cel Ramp + 冷青紫暗部 + 动漫 Rim 轮廓光） ══ */
(function initAnimeNPR(){
  function applyAnimeToon(m){
    if(!m||m.userData._animePatched||m.userData.noToon||m.transparent)return;
    if(!(m.isMeshStandardMaterial||m.isMeshPhysicalMaterial))return;
    if(m.metalness>=.72&&m.roughness<=.25)return;
    m.userData._animePatched=true;
    const prevCompile=m.onBeforeCompile;
    m.customProgramCacheKey=()=>'anime_npr_v1';
    m.onBeforeCompile=(shader,r)=>{
      if(prevCompile)prevCompile(shader,r);
      shader.fragmentShader=shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `
        {
          float _lum=dot(gl_FragColor.rgb,vec3(0.299,0.587,0.114));
          // 锐利两阶半日系赛璐璐明暗切分，保留贴图纹理细节的同时增强动画块面感
          float _cel=smoothstep(0.14,0.20,_lum)*0.42+smoothstep(0.46,0.53,_lum)*0.58;
          vec3 _celCol=gl_FragColor.rgb*clamp(_cel/max(_lum,0.012),0.55,1.42);
          // 暗部向新海诚雪夜冷青紫偏移，告别脏灰黑影
          vec3 _shadowCold=gl_FragColor.rgb*vec3(0.76,0.85,1.12)+vec3(0.018,0.026,0.062);
          float _darkMask=1.0-smoothstep(0.05,0.32,_lum);
          vec3 _styled=mix(_celCol,_shadowCold,_darkMask*0.48);
          // 强烈日系二次元边缘轮廓光 (Anime Rim Light，使用 Three.js 标准视图空间法线 normal)
          float _rim=pow(1.0-clamp(abs(dot(normalize(normal),normalize(vViewPosition))),0.0,1.0),3.2);
          _styled+=vec3(0.56,0.80,1.0)*_rim*0.20*(1.0-smoothstep(0.42,0.92,_lum));
          gl_FragColor.rgb=mix(gl_FragColor.rgb,_styled,0.52);
        }
        #include <dithering_fragment>
        `
      );
    };
    m.needsUpdate=true;
  }
  window._applyAnimeToon=applyAnimeToon;
  scene.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(applyAnimeToon);
  });
})();

        new THREE.Vector3(sx*.64,.08,-1.05),new THREE.Vector3(sx*.64,.08,1.15),new THREE.Vector3(sx*.64,.24,1.46)
      ]);
      addNS(g,new THREE.TubeGeometry(skCurve,14,.028,8,false),steelM,0,0,0);
      for(const sz of [-.52,.68]){
        addNS(g,new THREE.CylinderGeometry(.022,.026,.46,8),darkM,sx*.48,.28,sz).rotation.z=sx*.36;
      }
    }
    addNS(g,new THREE.SphereGeometry(.04,6,5),new THREE.MeshBasicMaterial({color:0xff4d5a}),-.44,.64,.10);
    addNS(g,new THREE.SphereGeometry(.04,6,5),new THREE.MeshBasicMaterial({color:0x4de896}),.44,.64,.10);
    addNS(g,new THREE.SphereGeometry(.042,6,5),new THREE.MeshBasicMaterial({color:0xff5555}),0,1.88,-4.34);

    // 6. 修长 5.8m 直径 4 叶主旋翼（真实修长比例）
    const rotor=new THREE.Group();rotor.position.set(0,1.56,-.22);g.add(rotor);
    addNS(rotor,new THREE.CylinderGeometry(.10,.14,.22,12),darkM,0,-.09,0);
    addNS(rotor,new THREE.SphereGeometry(.14,12,8),goldM,0,.04,0).scale.set(1,.48,1);
    for(let k=0;k<4;k++){
      const arm=new THREE.Group();arm.rotation.y=k*Math.PI/2;rotor.add(arm);
      addNS(arm,BX(2.85,.018,.10),darkM,1.46,0,0);
      addNS(arm,BX(.24,.020,.11),goldM,2.78,0,0);
    }

    // 7. 机鼻下方航拍光电球形吊舱 + 柔淡光束
    const spot=new THREE.Group();spot.position.set(0,.34,1.62);g.add(spot);
    addNS(spot,new THREE.SphereGeometry(.11,10,8),darkM,0,0,0);
    addNS(spot,new THREE.SphereGeometry(.065,8,6),new THREE.MeshBasicMaterial({color:cfg.beam}),0,-.04,.06);
    /* 探照灯光束：恢复圆锤形锥体。
       上次删掉换成小光点+地面光池后，空中就没有那道扫射的光柱了。
       现在恢复锥体，并按路灯光幕同样的办法收拾干净：
       - 32 段（原 16 段）→ 轮廓无折线硬角
       - 顶点色沿轴向渐变：灯口最亮、越往下越淡 → 不会糊成实心白带
       - 双面可见，从下方/侧面看都是一道柔和光柱 */
    const beamH=cfg.y-1.0;
    const beamGeo=new THREE.ConeGeometry(1.35,beamH,32,1,true);
    {
      const pa=beamGeo.attributes.position,cols=new Float32Array(pa.count*3);
      for(let i=0;i<pa.count;i++){
        const t=(pa.getY(i)+beamH/2)/beamH;   // 0 = 地面端, 1 = 灯口
        const f=.45+.55*Math.pow(t,1.5);       // 下端留底噪，否则大面全透明 → 光柱看不见
        cols[i*3]=f;cols[i*3+1]=f;cols[i*3+2]=f;
      }
      beamGeo.setAttribute('color',new THREE.BufferAttribute(cols,3));
    }
    const beamCone=new THREE.Mesh(beamGeo,new THREE.MeshBasicMaterial({
      color:cfg.beam,vertexColors:true,transparent:true,opacity:.12,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
    beamCone.position.y=-beamH/2;beamCone.castShadow=false;beamCone.raycast=()=>{};
    spot.add(beamCone);
    /* 灯口亮核 */
    const beamDot=addNS(spot,new THREE.SphereGeometry(.13,10,8),
      new THREE.MeshBasicMaterial({color:cfg.beam,transparent:true,opacity:.9,
        blending:THREE.AdditiveBlending,depthWrite:false}),0,-.05,.06);
    beamDot.castShadow=false;
    /* 地面落点光斑：真实探照灯打到地面的应该是一个柔和的小亮斑，
       不是一整块生硬的平色圆盘（原来半径 9.4m，边缘还是硬的，
       远看就是"地面上巨大的光影"）。改用 glowTex 软边贴图，半径收到 ~1.8m，
       位置跟随光锥的实际落点（光锥有俯仰和左右摆动，落点不在正下方）。 */
    const poolM=new THREE.MeshBasicMaterial({
      map:glowTex,color:cfg.beam,transparent:true,opacity:.42,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
    const beamPool=new THREE.Mesh(new THREE.PlaneGeometry(1,1),poolM);
    beamPool.rotation.x=-Math.PI/2;beamPool.castShadow=false;beamPool.raycast=()=>{};
    beamPool.scale.set(3.6,3.6,1);
    beamPool.position.y=.03;
    beamPool.renderOrder=2;
    scene.add(beamPool);
    const item={g,rotor,tRotor,spot,cfg,beamPool,poolM,beamCone,beamH};
    g.userData.physObj={type:'ride',ref:{kind:'heli',heli:item,label:cfg.name}};
    helis.push(item);
  }
}
const _bdV=new THREE.Vector3();
function updateHelis(dt){
  for(let i=0;i<helis.length;i++){
    const h=helis[i],c=h.cfg;
    const a=t*c.spd+c.ph;
    const nx=c.cx+Math.cos(a)*c.rx, nz=c.cz+Math.sin(a)*c.rz;
    const ny=c.y+Math.sin(t*1.2+c.ph)*.65;
    const vx=-Math.sin(a)*c.rx*c.spd, vz=Math.cos(a)*c.rz*c.spd;
    h.g.position.set(nx,ny,nz);
    h.g.rotation.y=Math.atan2(vx,vz);
    h.g.rotation.x=.09; // 前倾巡航姿态
    h.rotor.rotation.y=phaseOf(.2856)*22;
    if(h.beamCone){
      /* 光锥始终从灯口打到地面：按当前飞行高度动态拉伸锥长
         （原来长度固定，飞机一浮沉，光锥就悬空或插进地里） */
      const hh=Math.max(5,h.g.position.y+.34);
      h.beamCone.scale.y=hh/h.beamH;
      h.beamCone.position.y=-hh/2;
      if(h.beamPool){
        /* 光斑落在光锥真正的地面落点上：光锥有俯仰和左右摆动，
           落点并不在机腹正下方 */
        _bdV.set(0,-1,0).applyEuler(h.spot.rotation).applyEuler(h.g.rotation);
        const len=hh/Math.max(.25,-_bdV.y);
        h.beamPool.position.set(h.g.position.x+_bdV.x*len,.04,h.g.position.z+_bdV.z*len);
      }
    }
    h.tRotor.rotation.x=phaseOf(.2417)*26;
    // 探照灯来回摆动扫射地面
    h.spot.rotation.z=Math.sin(t*1.6+i*2.1)*.26;
    h.spot.rotation.x=.18+Math.cos(t*1.1+i)*.14;
  }
}

/* ══ 游乐园上空密集绚丽烟花秀（集中游乐园内发射 · 不同高度/大小 · 纯正双芯礼花） ══ */
const fwSys=(()=>{
  const MAX=1800;
  const pos=new Float32Array(MAX*3), col=new Float32Array(MAX*3);
  for(let i=0;i<MAX;i++)pos[i*3+1]=-999;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({
    size:1.75,map:glowTex,vertexColors:true,transparent:true,opacity:.96,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false
  });
  const pts=new THREE.Points(geo,mat);pts.frustumCulled=false;pts.raycast=()=>{};scene.add(pts);

  // 游乐园上空 + 教堂方向外围夜空发射点（教堂位置 (-49, 0, 36) 后方与两侧外围）
  const LAUNCHERS=[
    [-20,26],[4,29],[26,26],[-14,42],[8,38],[30,46],[-4,52],[20,52],
    [-58,28],[-64,38],[-58,48],[-44,58]
  ];
  const PALETTES=[
    [0xffd86b,0xfff3c4,0xff9e44],
    [0xff3b5c,0xffffff,0xffa6b8],
    [0x38bdf8,0xa855f7,0xe0f2fe],
    [0x2ee59d,0xffe078,0x7dd3fc],
    [0xff7eb6,0xfde047,0xf43f5e],
    [0x60a5fa,0xfbbf24,0xffffff],
    [0xfb7185,0x34d399,0xfef08a]
  ];
  const shells=[], sparks=[];
  let nextWave=0.2, waveNo=0;

  function launchOne(){
    const [lx,lz]=LAUNCHERS[Math.floor(Math.random()*LAUNCHERS.length)];
    const pal=PALETTES[Math.floor(Math.random()*PALETTES.length)];
    // 随机三种不同高度与爆炸规模：小(0) / 中(1) / 巨型双芯(2)
    const r=Math.random();
    const sizeTier=r<.35?0:(r<.78?1:2);
    const tgtY=sizeTier===0?R(20,28):sizeTier===1?R(30,42):R(44,62);
    shells.push({
      x:lx+R(-3,3),y:0.5,z:lz+R(-3,3),
      vx:R(-2.2,2.2),vy:Math.sqrt(2*15*tgtY),vz:R(-2.2,2.2),
      pal,sizeTier,trailCd:0
    });
  }
  function pushSpark(x,y,z,vx,vy,vz,c,life,drag=1.22,grav=4.8){
    if(sparks.length>=MAX-12)sparks.shift();
    sparks.push({x,y,z,vx,vy,vz,r:c.r,g:c.g,b:c.b,life,maxLife:life,drag,grav});
  }
  function burst(sh){
    const cTmp=new THREE.Color();
    const t=sh.sizeTier;
    const count=t===0?70:t===1?125:185;
    const minSp=t===0?6.5:t===1?11.0:15.5;
    const maxSp=t===0?11.5:t===1?17.5:24.5;
    const lifeBase=t===0?1.35:t===1?1.85:2.45;
    const isWillow=(Math.random()<.28);
    for(let i=0;i<count;i++){
      const u=Math.random()*2-1, th=Math.random()*Math.PI*2, sr=Math.sqrt(1-u*u);
      const inner=(t>=1&&i%4===0);
      const sp=inner?R(minSp*.48,maxSp*.52):R(minSp,maxSp);
      const hex=isWillow?(i%2?0xffe49e:0xffffff):(inner?0xffffff:sh.pal[i%sh.pal.length]);
      cTmp.setHex(hex);
      pushSpark(
        sh.x,sh.y,sh.z,
        sr*Math.cos(th)*sp,u*sp+2.0,sr*Math.sin(th)*sp,
        cTmp,
        lifeBase+R(-.25,.45),
        isWillow?.92:1.28,
        isWillow?6.0:4.6
      );
    }
    // 烟花保持静默视觉绽放，不再每发触发短促电子数字音干扰 BGM
  }
  window._triggerFwSalvo=()=>{nextWave=0;};
  return function updateFireworks(dt){
    nextWave-=dt;
    if(nextWave<=0){
      waveNo++;
      const salvo=(waveNo%4===0)?4:(waveNo%2===0?3:2);
      for(let s=0;s<salvo;s++)launchOne();
      nextWave=R(.32,.68);
    }
    for(let i=shells.length-1;i>=0;i--){
      const sh=shells[i];
      sh.vy-=15*dt;
      sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.z+=sh.vz*dt;
      sh.trailCd-=dt;
      if(sh.trailCd<=0&&sparks.length<MAX-20){
        sh.trailCd=.026;
        sparks.push({x:sh.x,y:sh.y,z:sh.z,vx:R(-.5,.5),vy:R(-1.8,-.4),vz:R(-.5,.5),r:1,g:.90,b:.62,life:.42,maxLife:.42,drag:1.0,grav:3.0});
      }
      if(sh.vy<=2.2){burst(sh);shells.splice(i,1);}
    }
    for(let i=sparks.length-1;i>=0;i--){
      const p=sparks[i];
      p.life-=dt;
      if(p.life<=0){sparks.splice(i,1);continue;}
      p.vx*=(1-p.drag*dt);p.vz*=(1-p.drag*dt);
      p.vy=(p.vy-p.grav*dt)*(1-.80*dt);
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    }
    let idx=0;
    for(let i=0;i<sparks.length&&idx<MAX;i++){
      const p=sparks[i];
      const k=Math.max(0,p.life/p.maxLife);
      const tw=k<.42?(.45+.55*Math.sin(t*42+i)):1;
      pos[idx*3]=p.x;pos[idx*3+1]=p.y;pos[idx*3+2]=p.z;
      col[idx*3]=p.r*k*tw;col[idx*3+1]=p.g*k*tw;col[idx*3+2]=p.b*k*tw;
      idx++;
    }
    for(;idx<MAX;idx++){pos[idx*3+1]=-999;}
    geo.attributes.position.needsUpdate=true;
    geo.attributes.color.needsUpdate=true;
  };
})();
const updateFireworks=fwSys;

/* 全部建完 → 撤 boot 遮罩（一次成型，不给用户看半成品场景） */
requestAnimationFrame(()=>{
  const bt=document.getElementById('boot');
  if(bt){bt.classList.add('gone');setTimeout(()=>bt.remove(),800);}
});
animate();
window.__xmT.end=performance.now();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
