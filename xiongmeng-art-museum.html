/* 本地累加时间：只给 shader 用（雪/星光/水面噪声是连续噪声，跨端一致没意义，
   而且 float32 装不下 2.8e7 秒，会被量化成每 2 秒一跳）。
   所有「看得出来的表演」动画一律走服务器权威的 t。 */
let tLocal=0;

/* ══════════════════════════════════════════════════════════════════════
   全局时间基准 —— 服务器权威
   ──────────────────────────────────────────────────────────────────────
   以前全局 t 是 t += dt 累加出来的，每个客户端各转各的：
   同一部旋转木马，在甲的手机上转了两圈，在乙的手机上才转一圈半；
   马戏团四幕的进度也对不上，灯串扫光更是各闪各的。

   现在改成纯函数：t = (服务器时间 - TIME_EPOCH) / 1000
   服务器时间用 NTP 方式校准（ping 带 c1，服务端回 s2/s3，
   offset = ((s2-c1)+(s3-t4))/2，误差只剩路径不对称那一半）。
   只要两端时钟对齐，同一物理时刻看到的就是同一帧 —— 教堂塔上
   那个大钟就是这套时间的可视化。

   TIME_EPOCH 是固定纪元，不是服务器启动时刻：服务器重启时
   所有人的相位不会整体跳一次。
   ══════════════════════════════════════════════════════════════════════ */
let TIME_EPOCH = Date.UTC(2026, 0, 1, 0, 0, 0);
let srvOff = 0;            // 正在用的偏移：服务器时间 − 本地时间(ms)
let srvOffTarget = 0;       // 校准算出来的目标偏移
let srvCalib = false;       // 有没有校准成功过
let srvBestRtt = 9999;     // 历史最小往返，用于诊断
const srvSamples = [];      // {rtt, off} 采样池

/* 收一个采样，更新目标偏移。
   多个采样里挑 RTT 最小的那条 —— 抖动最小的一次最接近真值。 */
function srvPush(rtt, off) {
  if (!(rtt >= 0) || rtt > 6000) return;
  srvSamples.push({ rtt: rtt, off: off });
  if (srvSamples.length > 8) srvSamples.shift();
  let best = srvSamples[0];
  for (const s of srvSamples) if (s.rtt < best.rtt) best = s;
  srvOffTarget = best.off;
  srvBestRtt = Math.min(srvBestRtt, best.rtt);
  srvCalib = true;
}
/* HTTP 校准：t0 发出、t4 收到、serverNow 是服务端生成响应的时刻。
   服务端生成响应时，本地时钟对应 (t0 + rtt/2)（路径对称假设）。 */
function srvSyncHttp(t0, t4, serverNow) {
  const rtt = t4 - t0;
  srvPush(rtt, serverNow - (t0 + rtt * 0.5));
}
/* NTP 校准：c1 客户端发出 / s2 服务端收到 / s3 服务端发出 / t4 客户端收到 */
function srvSyncNtp(c1, s2, s3, t4) {
  const rtt = (t4 - c1) - (s3 - s2);
  const off = ((s2 - c1) + (s3 - t4)) / 2;
  srvPush(rtt, off);
}
/* ── 纯相位 ──
   服务器时间 t 是「秒」，数值很大（2026 年已经 2.8e7 秒）。
   直接 t*ω 当角度会超出 float32 的有效精度（2.8e7 那一档的步长是 2 rad），
   转到 GPU 上会变成「一步一卡」。所以先把时间折进一个周期里：
   角度 = (t % 周期) * ω。折叠点在 2π 的整数倍上，跳过去看不出来。 */
function phaseOf(period){ return t - Math.floor(t/period)*period; }
/* 服务器权威时刻 */
function srvNow() { return Date.now() + srvOff; }

/* 大本钟的指针组（教堂块里赋值）——指针必须脱离合批才能转 */
var bigClock;   /* 注意：不能写 =null，var 声明若带初始化会把教堂块里已赋的值覆盖掉 */
var clockGroupRef;   /* 钟楼指针组引用（显隐开关用） */
/* 大本钟走「服务器权威时间」：和旋转木马、马戏团四幕同一个 t。
   秒针每秒跳一格（机械钟的跳法），分针时针连续走。
   指针角度全部是时间的纯函数，没有任何本地累加 ——
   所以甲的手机和乙的电脑上，同一秒看到的是同一个指向。 */
function updateBigClock(){
  if(!bigClock||!bigClock.hands.length) return;
  const d=new Date(srvNow());
  const sec=d.getSeconds();                    // 整数秒 → 跳秒
  const min=d.getMinutes()+sec/60;
  const hr=(d.getHours()%12)+min/60;
  const A=Math.PI*2;
  for(const h of bigClock.hands){
    h.s.rotation.z=-(sec/60)*A;
    h.m.rotation.z=-(min/60)*A;
    h.h.rotation.z=-(hr/12)*A;
  }
}

(function srvSyncBoot(){

      .then(r => r.ok ? r.json() : null)
      .then(j => {

        if (j.epoch) TIME_EPOCH = j.epoch;
        srvSyncHttp(t0, Date.now(), j.now);
      })
      .catch(() => { });
  } catch (e) { }
})();

/* ── 最外侧城市大道：InstancedMesh 极速车水马龙(28辆) + 人来人往(90人)，总共仅 7 次 Draw Call ── */
const outerCrowd=(()=>{
  const grp=new THREE.Group();scene.add(grp);
  const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _p=new THREE.Vector3(), _s=new THREE.Vector3();
  const _yAxis=new THREE.Vector3(0,1,0);

  // 1. 72 辆外侧大道双向巡航车辆（内外两圈外环大道共 4 条车道，仅占 4 次 Draw Call）
  const CAR_N=72;
  const bodyMesh=new THREE.InstancedMesh(BX(1.85,.72,3.9),M(0xffffff,{roughness:.42,metalness:.35}),CAR_N);
  const cabMesh=new THREE.InstancedMesh(BX(1.56,.52,2.05),M(0x1b2634,{roughness:.2,metalness:.5}),CAR_N);
  const headMesh=new THREE.InstancedMesh(BX(1.52,.18,.12),new THREE.MeshBasicMaterial({color:0xfff2cc}),CAR_N);
  const tailMesh=new THREE.InstancedMesh(BX(1.52,.16,.12),new THREE.MeshBasicMaterial({color:0xff3b30}),CAR_N);
  for(const im of [bodyMesh,cabMesh,headMesh,tailMesh]){
    im.castShadow=false;im.receiveShadow=false;im.frustumCulled=false;im.raycast=()=>{};grp.add(im);
  }
  const carCols=[0xd63838,0x2f6ba8,0xf2c94c,0xeef2f6,0x2c3540,0x2d8a68,0xd97724,0x7c3aed];
  const _c=new THREE.Color();
  const cars=[];
  // 4 条外环矩形车道采样：lane 0/1 为第一外环 (x=±80, z=-46/75)，lane 2/3 为第二外环 (x=±124, z=-84/114)
  function sampleOuterRoad(lane,u){
    const xM=lane===0?82:lane===1?78:lane===2?126:122;
    const zN=lane===0?-48:lane===1?-44:lane===2?-86:-82;
    const zS=lane===0?77:lane===1?73:lane===2?116:112;
    const w=xM*2, h=zS-zN, per=2*(w+h);
    let s=((u%1)+1)%1*per;
    const rev=(lane%2===1);
    if(rev)s=per-s;
    const dir=rev?-1:1;
    if(s<w)return{x:-xM+s,z:zN,yaw:dir>0?Math.PI/2:-Math.PI/2};
    s-=w;
    if(s<h)return{x:xM,z:zN+s,yaw:dir>0?0:Math.PI};
    s-=h;
    if(s<w)return{x:xM-s,z:zS,yaw:dir>0?-Math.PI/2:Math.PI/2};
    s-=w;
    return{x:-xM,z:zS-s,yaw:dir>0?Math.PI:0};
  }
  for(let i=0;i<CAR_N;i++){
    const lane=i%4, idx=Math.floor(i/4);
    const u=idx/(CAR_N/4)+(lane*.025);
    const spd=(lane<2?.023:.018)+((i%3)*.0018);
    _c.setHex(carCols[i%carCols.length]);
    bodyMesh.setColorAt(i,_c);
    cars.push({lane,u,spd});
  }
  if(bodyMesh.instanceColor)bodyMesh.instanceColor.needsUpdate=true;

  // 2. 240 位外侧全路网人行道小熊行人（仅占 3 次 Draw Call）
  const PED_N=240;
  const pBody=new THREE.InstancedMesh(new THREE.CylinderGeometry(.17,.22,.68,8),M(0xffffff,{roughness:.78}),PED_N);
  const pHead=new THREE.InstancedMesh(new THREE.SphereGeometry(.19,8,6),M(0xe8cba0,{roughness:.8}),PED_N);
  const pEarGeo=(()=>{
    const g1=new THREE.SphereGeometry(.07,6,5);g1.translate(-.14,.15,0);
    const g2=new THREE.SphereGeometry(.07,6,5);g2.translate(.14,.15,0);
    return mergeGeos([g1,g2],true);
  })();
  const pEars=new THREE.InstancedMesh(pEarGeo,M(0xdca86c,{roughness:.82}),PED_N);
  for(const im of [pBody,pHead,pEars]){
    im.castShadow=false;im.receiveShadow=false;im.frustumCulled=false;im.raycast=()=>{};grp.add(im);
  }
  const pedCols=[0xd23b32,0x2f8f6b,0x3f6ba8,0xe8c24a,0x8f3a68,0xc99456,0xd07a9a,0x4a7068];
  const peds=[];
  const walks=[
    {ax:'x',fix:-51.2,min:-176,max:176},{ax:'x',fix:-40.8,min:-176,max:176},
    {ax:'x',fix:80.2,min:-176,max:176},{ax:'x',fix:69.8,min:-176,max:176},
    {ax:'x',fix:-89.2,min:-176,max:176},{ax:'x',fix:-78.8,min:-176,max:176},
    {ax:'x',fix:-129.2,min:-176,max:176},{ax:'x',fix:119.2,min:-176,max:176},
    {ax:'z',fix:-85.2,min:-176,max:176},{ax:'z',fix:-74.8,min:-176,max:176},
    {ax:'z',fix:85.2,min:-176,max:176},{ax:'z',fix:74.8,min:-176,max:176},
    {ax:'z',fix:-129.0,min:-176,max:176},{ax:'z',fix:129.0,min:-176,max:176}
  ];
  for(let i=0;i<PED_N;i++){
    const w=walks[i%walks.length];
    const t0=((i*0.6180339887)%1);
    const dir=(i%2===0)?1:-1;
    const spd=1.4+(i%5)*.22;
    _c.setHex(pedCols[i%pedCols.length]);
    pBody.setColorAt(i,_c);
    peds.push({w,pos:w.min+(w.max-w.min)*t0,dir,spd,phase:i*1.3});
  }
  if(pBody.instanceColor)pBody.instanceColor.needsUpdate=true;

  return{CAR_N,bodyMesh,cabMesh,headMesh,tailMesh,cars,sampleOuterRoad,PED_N,pBody,pHead,pEars,peds,_m,_q,_p,_s,_yAxis};
})();

function updateOuterCrowd(dt,t){
  const oc=outerCrowd, {_m,_q,_p,_s,_yAxis}=oc;
  // 更新 28 辆外侧大道车流
  for(let i=0;i<oc.CAR_N;i++){
    const c=oc.cars[i];
    c.u=(c.u+c.spd*dt)%1;
    const pt=oc.sampleOuterRoad(c.lane,c.u);
    _q.setFromAxisAngle(_yAxis,pt.yaw);
    const sinY=Math.sin(pt.yaw), cosY=Math.cos(pt.yaw);
    _p.set(pt.x,.42,pt.z);_s.set(1,1,1);_m.compose(_p,_q,_s);oc.bodyMesh.setMatrixAt(i,_m);
    _p.set(pt.x-sinY*.15,.98,pt.z-cosY*.15);_m.compose(_p,_q,_s);oc.cabMesh.setMatrixAt(i,_m);
    _p.set(pt.x+sinY*1.96,.44,pt.z+cosY*1.96);_m.compose(_p,_q,_s);oc.headMesh.setMatrixAt(i,_m);
    _p.set(pt.x-sinY*1.96,.46,pt.z-cosY*1.96);_m.compose(_p,_q,_s);oc.tailMesh.setMatrixAt(i,_m);
  }
  oc.bodyMesh.instanceMatrix.needsUpdate=true;
  oc.cabMesh.instanceMatrix.needsUpdate=true;
  oc.headMesh.instanceMatrix.needsUpdate=true;
  oc.tailMesh.instanceMatrix.needsUpdate=true;

  // 更新 90 位外侧人行道小熊行人
  for(let i=0;i<oc.PED_N;i++){
    const p=oc.peds[i], w=p.w;
    p.pos+=p.dir*p.spd*dt;
    if(p.pos>w.max){p.pos=w.max;p.dir=-1;}
    else if(p.pos<w.min){p.pos=w.min;p.dir=1;}
    const x=w.ax==='x'?p.pos:w.fix, z=w.ax==='z'?p.pos:w.fix;
    const yaw=w.ax==='x'?(p.dir>0?Math.PI/2:-Math.PI/2):(p.dir>0?0:Math.PI);
    const bounce=Math.abs(Math.sin(t*6.5+p.phase))*.06;
    _q.setFromAxisAngle(_yAxis,yaw);_s.set(1,1,1);
    _p.set(x,.47+bounce,z);_m.compose(_p,_q,_s);oc.pBody.setMatrixAt(i,_m);
    _p.set(x,.96+bounce,z);_m.compose(_p,_q,_s);oc.pHead.setMatrixAt(i,_m);
    _p.set(x,.96+bounce,z);_m.compose(_p,_q,_s);oc.pEars.setMatrixAt(i,_m);
  }
  oc.pBody.instanceMatrix.needsUpdate=true;
  oc.pHead.instanceMatrix.needsUpdate=true;
  oc.pEars.instanceMatrix.needsUpdate=true;
}

function updateAerialHaze(dt,t){
  const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
  // A. UE5 级前中后景空气透视纵深：平地漫步时远雾更有空间层次(0.0036)，乘坐云霄飞车高空俯瞰时自动适度减薄保持通透明亮
  const baseD=scene.userData.baseFogD!==undefined?scene.userData.baseFogD:0.0036;
  const onCoaster=!!(wheelSys.riding&&wheelSys.kind==='coaster');
  const heightFactor=THREE.MathUtils.clamp(1.0-(cy-6.0)/38.0, 0.48, 0.96)*(onCoaster?0.72:1.0);
  scene.fog.density=baseD*heightFactor;

  // B. 玩家前景随行轮廓暖光：在低空/乘坐过山车时紧贴前方 4.2m 柔和照亮前景
  camera.getWorldDirection(aerialHaze._fwd);
  aerialHaze.playerFill.position.set(cx+aerialHaze._fwd.x*4.2, Math.max(1.8,cy+.3), cz+aerialHaze._fwd.z*4.2);
  const nearGround=THREE.MathUtils.clamp(1.0-(cy-4.0)/16.0, 0.35, 1);
  aerialHaze.playerFill.intensity=0.52*nearGround;

  // C. 《光遇》风格视觉中心体积光雾：前景 (<14m) 完全退散保持极致清晰，中远景在地标中心绽放柔和呼吸光晕
  const mistHeightAtten=THREE.MathUtils.clamp(1.10-(cy-6.0)/48.0, .42, 1.0);
  for(const m of aerialHaze.mists){
    const d=Math.hypot(m.x-cx, m.z-cz);
    const fgClear=THREE.MathUtils.smoothstep(d,12,28);
    const farFade=1.0-THREE.MathUtils.smoothstep(d,135,220);
    const pulse=0.92+0.08*Math.sin(t*1.1+m.phase);
    m.sp.position.y=m.y+Math.sin(t*.45+m.phase)*.22;
    m.mat.opacity=m.baseOp*fgClear*farFade*mistHeightAtten*pulse*mistK;
    m.sp.visible=m.mat.opacity>.004;
  }
}

/* ══ 多人联机 · 前端模块 ══ */
/* ════════════════════════════════════════════════════════════
   多人联机 · 前端模块（熊萌艺术馆）
   —— 账号登录 / 同号踢出 / 可改显示 ID / 远端玩家同步
   —— 第三人称模式（角色模型 + 弹簧跟随相机）
   依赖全局：THREE / scene / camera / fp / XM / sfx
   ════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  const MP = {
    ws: null, account: '', display: '', connected: false,
    peers: new Map(),          // account -> {display, target:{x,y,z,yaw}, cur:{...}, group, tag}
    self: null,                // 本地第三人称角色
    third: false,              // 是否第三人称
    camDist: 5.2, camHeight: 2.35, camSide: 0.55,
    lastSend: 0, sendHz: 15,
    reconnectAt: 0, tries: 0,
    onKicked: null,
    /* ── 弱网/重连用的状态 ──
       gen：连接「代数」。每次新建 WebSocket 递增一次，
             旧连接的 onclose/onmessage 一律作废 ——
             少了它，旧连接迟到的 close 事件会把刚建好的新连接也一起踢掉，
             表现就是「刚连上又掉，掉完又连」，无限循环。
       _deadline：必须收到 pong 的截止时间；超时 = 连接已经半开（弱网/息屏），
             主动断开重连，比等浏览器几十分钟的 TCP 超时快得多。 */
    gen: 0, _deadline: 0, _lastPing: 0, _hb: null,
    _noReconnect: false,       // 登录被拒（密码错/账号不存在）时不再自动重试
  };
  window.MP = MP;

  /* ── 显示 ID 的本地存档（改过的 ID 下次进去还在）──
     按账号分开存：同一个账号一个 ID，换账号不会串味 */
  MP.savedName = function () {
    try {
      const map = JSON.parse(localStorage.getItem('xm_mp_names') || '{}');
      return map[MP.account] || '';
    } catch (e) { return ''; }
  };
  MP.saveName = function (v) {
    if (!MP.account) return;
    try {
      const map = JSON.parse(localStorage.getItem('xm_mp_names') || '{}');
      if (v) map[MP.account] = v; else delete map[MP.account];
      localStorage.setItem('xm_mp_names', JSON.stringify(map));
    } catch (e) { }
  };

  /* ── 角色整体尺寸 ──
     主角原来 1.83m，站在园里的维尼小熊（~1.3m）旁边像个巨人。
     现在整体缩到 0.74 → 头顶 1.36m，比 NPC 高一点点刚好。
     缩放放在 rig 组里做，名牌不跟着缩（名字要看得清）。 */
  const AV_SCALE = .74, AV_TOP = 1.36;

  /* ── WebSocket URL：同源 wss ── */
  function wsURL() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return proto + '//' + location.host + '/alex-garage/ws/';
  }

  /* ══════════════════════════════════════════════════════
     登录界面
     ══════════════════════════════════════════════════════ */
  function buildLoginUI() {
    if (document.getElementById('mp-login')) return;
    const wrap = document.createElement('div');
    wrap.id = 'mp-login';
    wrap.innerHTML = `
      <div class="mp-card">
        <div class="mp-title">熊萌艺术馆</div>
        <div class="mp-sub">圣诞冰雪特展 · 联机入口</div>
        <label class="mp-row"><span>账号</span>
          <input id="mp-acc" type="text" autocomplete="username" placeholder="test01" maxlength="20">
        </label>
        <label class="mp-row"><span>密码</span>
          <input id="mp-pass" type="password" autocomplete="current-password" placeholder="123456" maxlength="20">
        </label>
        <div class="mp-quick">
          <button data-a="test01" data-p="123456">test01</button>
          <button data-a="test02" data-p="123456">test02</button>
        </div>
        <button id="mp-go" class="mp-go">进入展厅</button>
        <div class="mp-msg" id="mp-msg"></div>
      </div>`;
    document.body.appendChild(wrap);
    /* 登录页默认可见 → 右上角工具条先藏起来（卡片会压住它）*/
    document.body.classList.add('mp-login-open');
    const msg = wrap.querySelector('#mp-msg');
    const acc = wrap.querySelector('#mp-acc');
    const pass = wrap.querySelector('#mp-pass');

    wrap.querySelectorAll('.mp-quick button').forEach(b => {
      b.onclick = () => { acc.value = b.dataset.a; pass.value = b.dataset.p; msg.textContent = ''; };
    });
    wrap.querySelector('#mp-go').onclick = () => {
      const a = acc.value.trim(), p = pass.value;
      if (!a || !p) { msg.textContent = '请填写账号和密码'; return; }
      msg.textContent = '连接中…';
      msg.className = 'mp-msg';
      MP.connect(a, p, true);
    };
    [acc, pass].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') wrap.querySelector('#mp-go').click(); });
    });
    MP._ui = { wrap, msg, acc, pass };
  }

  function setMsg(txt, kind) {
    if (!MP._ui) return;
    MP._ui.msg.textContent = txt;
    MP._ui.msg.className = 'mp-msg' + (kind ? ' ' + kind : '');
  }

  function hideLogin() {
    if (MP._ui) MP._ui.wrap.classList.add('hide');
    document.body.classList.remove('mp-login-open');
  }
  function showLogin() {
    if (MP._ui) { MP._ui.wrap.classList.remove('hide'); setMsg(''); }
    /* 登录卡片会盖住右上角工具条，登录时把工具条一起藏了，别让按钮露一半 */
    document.body.classList.add('mp-login-open');
  }

  /* ══════════════════════════════════════════════════════
     连接 / 断线重连
     ══════════════════════════════════════════════════════ */
  /* 断线提示条：独立于登录卡片（登录卡片这时是隐藏的，
     之前提示写进隐藏的卡片里，玩家根本看不到，只觉得「别人不动了」）*/
  function showNet(txt) {
    let el = document.getElementById('mp-net');
    if (!el) {
      el = document.createElement('div');
      el.id = 'mp-net';
      el.innerHTML = '<span class="mp-dot"></span><span id="mp-net-t"></span>';
      document.body.appendChild(el);
    }
    const t = el.querySelector('#mp-net-t');
    if (t) t.textContent = txt;
    el.classList.add('on');
  }
  function hideNet() {
    const el = document.getElementById('mp-net');
    if (el) el.classList.remove('on');
  }

  /* ── 版本自检 + 主动更新 ──
     服务端把「当前线上版本」的构建标记推过来（WS 的 update 消息），
     跟本页 <meta name="xm-build"> 比对；不一致 = 这个标签页跑的是旧页面。
     三条来源都会走到这里：① WS 主动推送 ② 登录时的 welcome ③ 自己轮询。
     按钮小、贴右上角（不横在屏幕中间），手机端用安全区避开刘海。
     点一下 = 通知 Service Worker 更新 + 带版本号强制拉新页面重载。 */
  function xmMyBuild() {
    const meta = document.querySelector('meta[name="xm-build"]');
    return meta ? meta.content : '';
  }
  function showUpdateUI(serverBuild) {
    const mine = xmMyBuild();
    if (!serverBuild || !mine || mine.indexOf('__') === 0) return;   // 没标记就跳过
    if (mine === serverBuild) return;
    let el = document.getElementById('xm-upd');
    if (!el) {
      el = document.createElement('div');
      el.id = 'xm-upd';
      el.innerHTML = '<span>有新版本</span><button id="xm-upd-btn">立即更新</button>';
      document.body.appendChild(el);
      el.querySelector('#xm-upd-btn').onclick = function () { applyUpdate(); };
    }
    el.classList.add('on');
  }
  function checkBuild(serverBuild) { showUpdateUI(serverBuild); }
  async function applyUpdate() {
    const btn = document.getElementById('xm-upd-btn');
    if (btn) { btn.textContent = '更新中…'; btn.disabled = true; }
    try {
      if (navigator.serviceWorker) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) { try { await reg.update(); } catch (e) { } }
        if (navigator.serviceWorker.controller) {
          try { navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' }); } catch (e) { }
        }
      }
    } catch (e) { }
    /* 带一个唯一参数强制走网络拿新页面；原来的 ?ui 之类的参数全部保留 */
    try {
      const u = new URL(location.href);
      u.searchParams.set('_v', Date.now().toString());
      location.replace(u.toString());
    } catch (e) { location.reload(); }
  }
  /* 兜底轮询：还没登录、WS 断了、被代理挡了 —— 这几种情况都收不到推送，
     但只要页面开着，30 秒内一定会自己发现新版本并弹按钮。
     URL 后面带时间戳，绕过 Service Worker 的 stale-while-revalidate 缓存。 */
  (function pollBuild(){
    const tick = async () => {
      try {
        const r = await fetch('/alex-garage/ws/build?_=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return;
        const j = await r.json();
        if (j && j.build) showUpdateUI(j.build);
      } catch (e) { }
    };
    setTimeout(tick, 5000);
    setInterval(tick, 30000);
  })();

  /* 应用层心跳：每 8 秒 ping 一次，12 秒收不到 pong 就判定连接已经半开
     —— 弱网/手机息屏时 TCP 不会立刻断，浏览器可能几十分钟都不报错，
        只能靠应用层心跳自己发现，然后主动断开重连 */
  function startBeat() {
    stopBeat();
    MP._lastPing = 0;
    MP._hb = setInterval(() => {
      if (!MP.connected) return;
      const now = performance.now();
      /* 连接已经不是 OPEN（CLOSING/CLOSED）→ 直接当断线处理，
         不等心跳超时（关闭握手没走完时浏览器会一直卡在 CLOSING）*/
      if (!MP.ws || MP.ws.readyState !== 1) { forceReconnect(); return; }
      if (MP._deadline && now > MP._deadline) { forceReconnect(); return; }
      if (now - MP._lastPing > 8000) {
        MP._lastPing = now;
        MP._deadline = now + 12000;
        MP.send({ t: 'ping', c1: Date.now() });
      }
    }, 2000);
  }
  function stopBeat() {
    if (MP._hb) { clearInterval(MP._hb); MP._hb = null; }
    MP._deadline = 0;
  }
  /* 主动掐掉半开的连接，交给统一的重连逻辑 */
  function forceReconnect() {
    const ws = MP.ws;
    MP.ws = null;
    if (ws) {
      try { ws.onclose = null; ws.onmessage = null; ws.onerror = null; ws.close(); } catch (e) { }
    }
    MP.connected = false;
    MP.clearPeers();
    stopBeat();
    scheduleReconnect();
  }
  /* 退避重连：0.8s → 1.2s → 1.9s … 封顶 6s，额外 ±25% 抖动
     （多台设备同时断线时避免一起冲上来）*/
  function scheduleReconnect() {
    MP.tries++;
    const base = Math.min(6000, 800 * Math.pow(1.55, Math.max(0, MP.tries - 1)));
    const wait = Math.round(base * (0.75 + Math.random() * 0.5));
    showNet('连接断开，正在重连' + (MP.tries > 1 ? '（第 ' + MP.tries + ' 次）' : '') + '…');
    clearTimeout(MP._rt);
    MP._rt = setTimeout(() => { MP.connect(MP.account, MP._pass, true); }, wait);
  }

  MP.connect = function (account, pass, force) {
    MP.account = account; MP._pass = pass;
    MP._noReconnect = false;
    MP._kicked = false;      // 手动登录时清掉「被顶号」标记，否则第一次断线会被误当成被踢
    /* 同一时刻只留一条连接：正在连接/已连接时不再新建 ——
       否则两条连接会把对方的 close 当成断线，来回互踢 */
    if (MP.ws) {
      const st = MP.ws.readyState;
      if ((st === 0 || st === 1) && !force) return;
      const old = MP.ws; MP.ws = null;
      try { old.onclose = null; old.onmessage = null; old.onerror = null; old.close(); } catch (e) { }
    }
    const gen = ++MP.gen;
    let ws;
    try { ws = new WebSocket(wsURL()); }
    catch (e) { setMsg('无法建立连接：' + e.message, 'err'); scheduleReconnect(); return; }
    MP.ws = ws;

    ws.onopen = () => {
      if (gen !== MP.gen) return;
      /* 连稳 8 秒后才把退避计数清零 —— 连上就立刻掉的话，
         退避永远停在 0.8 秒，会把服务端打爆 */
      setTimeout(() => { if (gen === MP.gen && MP.connected) MP.tries = 0; }, 8000);
      ws.send(JSON.stringify({ t: 'login', account, pass, name: MP.savedName() }));
      /* 连上就立刻对一次时（不等 8 秒心跳）：pong 带 s2/s3，
         客户端按 NTP 算出自己跟服务器的时钟偏移，
         这样动画相位从第一秒起就是全服统一的。 */
      try { ws.send(JSON.stringify({ t: 'ping', c1: Date.now() })); } catch (e) { }
    };
    ws.onmessage = ev => {
      if (gen !== MP.gen) return;      // 旧连接迟到的消息一律忽略
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      MP.onMsg(m);
    };
    ws.onclose = () => {
      if (gen !== MP.gen) return;      // 已被新连接取代，忽略
      MP.connected = false;
      MP.clearPeers();
      MP.handReset();
      handHudHide();
      stopBeat();
      if (MP.onKicked) { MP.onKicked(); return; }
      if (MP._kicked) { MP._kicked = false; return; }   // 被顶号：不自动重连
      if (MP._noReconnect) return;                       // 账号密码被拒：不自动重试
      scheduleReconnect();
    };
    ws.onerror = () => { };
  };

  MP.send = function (o) {
    if (MP.ws && MP.ws.readyState === 1) {
      try { MP.ws.send(JSON.stringify(o)); } catch (e) { }
    }
  };

  /* ══════════════════════════════════════════════════════
     牵手：A 主动发起 → B 同意 → B 完全跟着 A 走
     ── 协议 ──
       上行：{t:'hand_req',to}        A 向 B 发起
             {t:'hand_res',to,accept} B 回应
             {t:'hand_end'}           任何一方松手
       下行：{t:'hand_in',from,display}   B 收到请求（弹同意/拒绝）
             {t:'hand_wait',to,display}  A 看到「已发出，等回应」
             {t:'hand_rej',from,display} B 拒绝了
             {t:'hand_pair',a,b,aDisplay,bDisplay} 配对成功（a=牵人的，b=跟人的）
             {t:'hand_end',a,b}        配对解除
     ══════════════════════════════════════════════════════ */
  const HAND_D = .62;          // 两人中心间距（世界米；角色整体缩放 0.74 之后）
  MP.hand = { role: '', partner: '', partnerName: '', pendingTo: '', pendingToName: '', pendingFrom: '', pendingName: '' };

  function buildHandUI() {
    /* HTML 里已经放好了这个条子，这里只负责把按钮绑上 ——
       之前写成「元素已存在就直接 return」，结果 MP._handUI 永远是 undefined，
       handHud() 里读 u.msg 直接抛错，整个 MP.update 每 0.12 秒崩一次，
       连带位置广播都断了（多人同步直接死掉）。 */
    let h = document.getElementById('hand-hud');
    if (!h) {
      h = document.createElement('div');
      h.id = 'hand-hud';
      h.innerHTML = '<span id="hand-name"></span>' +
        '<span id="hand-btns"><button id="hand-yes">同意</button><button id="hand-no">拒绝</button></span>' +
        '<button id="hand-act"></button>';
      document.body.appendChild(h);
    }
    if (MP._handUI) return;
    MP._handUI = { el: h, name: h.querySelector('#hand-name'), btns: h.querySelector('#hand-btns'), act: h.querySelector('#hand-act') };
    h.querySelector('#hand-yes').onclick = function () { MP.handRespond(true); };
    h.querySelector('#hand-no').onclick = function () { MP.handRespond(false); };
    h.querySelector('#hand-act').onclick = function () { MP.handAction(); };
  }
  /* mode: 'ask'=同意/拒绝两颗  'act'=一颗主按钮  'none'=只留小字条
     整块 UI 贴在屏幕右边缘，不占画面正中。 */
  function handHud(mode, name, actLabel) {
    buildHandUI();
    const u = MP._handUI;
    /* 兜底：UI 绑定失败时直接跳过，绝不能让一个提示条把 MP.update 整段打断
       （MP.update 里还负责推位置广播，一崩整个多人同步就死了）*/
    if (!u || !u.act) return;
    u.name.textContent = name || '';
    u.name.classList.toggle('on', !!name);
    u.btns.classList.toggle('on', mode === 'ask');
    u.act.style.display = (mode === 'act') ? 'inline-block' : 'none';
    if (actLabel) u.act.textContent = actLabel;
    u.el.classList.add('show');
  }
  function handHudHide() { if (MP._handUI) MP._handUI.el.classList.remove('show'); }

  MP.handReset = function () {
    MP.hand = { role: '', partner: '', partnerName: '', pendingTo: '', pendingToName: '', pendingFrom: '', pendingName: '' };
  };
  /* 最近的别人（用来发起牵手） */
  MP.nearestPeer = function () {
    if (!fp.on) return null;
    let best = null, bd = 2.8;
    for (const p of MP.peers.values()) {
      const d = Math.hypot(p.cur.x - fp.x, p.cur.z - fp.z);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  };
  /* 一个键/一个按钮干两件事：没牵→发起；牵了→松手 */
  MP.handAction = function () {
    if (!MP.connected) return;
    if (MP.hand.role) { MP.handEnd(); return; }
    if (MP.hand.pendingTo) {                 // 等待中 → 取消这次请求
      MP.send({ t: 'hand_cancel', to: MP.hand.pendingTo });
      MP.hand.pendingTo = ''; MP.hand.pendingToName = '';
      handHudHide();
      return;
    }
    if (MP.hand.pendingFrom) return;
    const near = MP.nearestPeer();
    if (!near) { handHud('none', '附近没人', ''); setTimeout(handHudHide, 1700); return; }
    MP.send({ t: 'hand_req', to: near.account });
    MP.hand.pendingTo = near.account;
    MP.hand.pendingToName = near.display || near.account;
    handHud('none', '已发出 · 等 ' + MP.hand.pendingToName, '');
  };
  MP.handRespond = function (accept) {
    const from = MP.hand.pendingFrom;
    MP.hand.pendingFrom = ''; MP.hand.pendingName = '';
    if (from) MP.send({ t: 'hand_res', to: from, accept: !!accept });
    handHudHide();
  };
  MP.handEnd = function () {
    if (!MP.hand.role) return;
    MP.send({ t: 'hand_end' });
    MP.handReset();
    handHudHide();
  };
  /* HUD 刷新：牵手中 / 等待回应 / 收到请求 / 旁边有人 */
  /* 自愈：配对对象已经不在房间里了（掉线/被踢），把本地配对状态解开。
     不然玩家会卡在「牵着」状态，界面上一直显示松手按钮，再也发不起新的牵手。 */
  MP.handSelfHeal = function (dt) {
    if (!MP.hand.role) return;
    const peer = MP.peers.get(MP.hand.partner);
    if (peer) { MP._handMiss = 0; return; }
    MP._handMiss = (MP._handMiss || 0) + dt;
    if (MP._handMiss < 4) return;            // 先等几秒，别被一次 players 刷新误伤
    MP.send({ t: 'hand_end' });
    MP.handReset();
    handHudHide();
  };
  MP.updateHandHud = function () {
    /* 顺序很要紧：已经配对 / 有人在等我回应 / 有人向我发起 —— 这三种提示
       不看是不是沉浸模式，全程都要显示。
       之前把 !fp.on 的判断放在最前面，结果在沙盘模式收到牵手请求时，
       提示刚弹出 0.12 秒就被这一句藏掉了 —— 玩家根本看不到「有人要和你牵手」。 */
    if (!MP.connected) { handHudHide(); return; }
    if (MP.hand.role) {
      handHud('act', MP.hand.partnerName || MP.hand.partner, '松手');
      return;
    }
    if (MP.hand.pendingFrom) {
      handHud('ask', MP.hand.pendingName + ' 想和你牵手', '');
      return;
    }
    if (MP.hand.pendingTo) {
      /* 等对方回应：给一颗「取消」按钮。
         不然一旦对方那边没弹提示（比如对方在旧版本页面里），
         这边就永远卡在「等待」状态，再也发不起新的牵手。 */
      handHud('act', '等 ' + MP.hand.pendingToName + ' 回应', '取消');
      return;
    }
    /* 只有「旁边有人，可以发起」这一条需要行走模式（沙盘里角色不动，没什么可牵的）*/
    if (!fp.on) { handHudHide(); return; }
    const near = MP.nearestPeer();
    if (near) handHud('act', near.display || near.account, '牵手');
    else handHudHide();
  };
  /* 两只手牵在一起的那一小团（把两个人的手接上）*/
  function handLinkMesh() {
    if (MP._handLink) return MP._handLink;
    const m = new THREE.Mesh(new THREE.SphereGeometry(.13, 14, 10),
      new THREE.MeshStandardMaterial({ color: 0xfff0d8, roughness: .9 }));
    m.visible = false;
    scene.add(m);
    MP._handLink = m;
    return m;
  }
  /* 领队的朝向（自己算，不看第三人称身体）
     —— 之前用的是 MP.self.rotation.y，但 MP.self 的位置/朝向只在
        「第三人称开着」的时候才更新；第一人称下它一直停在世界原点 (0,0,0)。
        结果被牵的人被画到原点去（离领队 10 米），
        领队的「附近玩家」搜索找不到人 → 松手后再也牵不上。 */
  function leaderFacing(dt) {
    const moving = Math.hypot(fp.vx, fp.vz) > .25;
    const want = moving ? Math.atan2(fp.vx, fp.vz) : fp.yaw + Math.PI;
    if (MP._leadTheta === undefined) MP._leadTheta = want;
    let d = want - MP._leadTheta;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    MP._leadTheta += d * (1 - Math.pow(.0004, dt));
    return MP._leadTheta;
  }
  /* 领队的位置 + 朝向：两个人的中间点、谁在前面，都以它为准 */
  MP.handAnchor = function () {
    if (!MP.hand.role) return null;
    if (MP.hand.role === 'leader') {
      return { x: fp.x, y: fp.y, z: fp.z, th: leaderFacing(0.016), spd: Math.hypot(fp.vx, fp.vz) };
    }
    const ld = MP.peers.get(MP.hand.partner);
    if (!ld) return null;
    return { x: ld.group.position.x, y: ld.group.position.y, z: ld.group.position.z, th: ld.group.rotation.y, spd: ld.rawSpeed || 0 };
  };
  window.diorama.hand = function () {
    return {
      role: MP.hand.role, partner: MP.hand.partner, partnerName: MP.hand.partnerName,
      pendingTo: MP.hand.pendingTo, pendingFrom: MP.hand.pendingFrom,
      peers: [...MP.peers.keys()],
      link: MP._handLink ? [+MP._handLink.position.x.toFixed(3), +MP._handLink.position.y.toFixed(3), +MP._handLink.position.z.toFixed(3)] : null
    };
  };

  MP.onMsg = function (m) {
    switch (m.t) {
      case 'welcome': {
        MP.connected = true;
        MP.display = m.you.display || MP.account;
        hideNet();
        setMsg('');
        hideLogin();
        startBeat();
        /* 显示 ID 存档：服务端记住的那份为准，本地也存一份，下次进去还是它 */
        if (MP.display && MP.display !== MP.account) MP.saveName(MP.display);
        if (m.build) checkBuild(m.build);
        /* 服务端下发的纪元（时间基准），用它覆盖本地默认值 */
        if (m.epoch) TIME_EPOCH = m.epoch;
        MP.clearPeers();
        (m.players || []).forEach(pl => {
          if (pl.account !== MP.account) MP.addPeer(pl);
        });
        MP.syncPeersUI();
        /* 登录成功后露出「个人」按钮，但个人信息默认不展开 */
        if (MP._panel) { MP._panel.p.style.display = ''; MP._panel.p.classList.remove('open'); document.body.classList.remove('mp-open'); }
        MP.startThirdPersonBody();
        /* 单机模式下已经建过本地角色的话，把头顶名牌换成账号名 */
        if (MP.selfTag) {
          const s3 = makeTagSprite(MP.display || MP.account, '#ffd9a0');
          MP.selfTag.material.map.dispose();
          MP.selfTag.material.map = s3.material.map;
          MP.selfTag.material.needsUpdate = true;
        }
        if (window.MP_UI) MP_UI.onLogin(m.you);
        break;
      }
      case 'update': {           // 服务端主动推送：线上有新版本了
        showUpdateUI(m.build);
        if (window.sfx) sfx.blip(880,.10,.06);
        break;
      }
      case 'players': {
        (m.players || []).forEach(pl => {
          if (pl.account === MP.account) return;
          const ex = MP.peers.get(pl.account);
          if (ex) { ex.display = pl.display; ex.target = pl.p; ex.mode = pl.mode; }
          else MP.addPeer(pl);
        });
        // 移除已下线的
        const alive = new Set((m.players || []).map(x => x.account));
        for (const acc of [...MP.peers.keys()]) {
          if (!alive.has(acc)) MP.removePeer(acc);
        }
        MP.syncPeersUI();
        break;
      }
      case 'move': {
        const p = MP.peers.get(m.account);
        if (p) {
          p.display = m.display || p.display;
          /* 速度/方向用「服务器下发的真实位移」算，不要用插值后的坐标 ——
             插值是指数平滑，会把速度峰值削平，算出来的步幅偏小，
             远端角色会显得走路没劲；方向也会残留一点「还没停下的漂移」 */
          const now = performance.now();
          if (p.rawTgt) {
            const dtm = Math.max(.02, (now - p.rawTime) / 1000);
            const dx = m.p.x - p.rawTgt.x, dz = m.p.z - p.rawTgt.z;
            const v = Math.hypot(dx, dz) / dtm;
            /* 网络抖动会让单帧速度出尖峰，做一次低通平滑 */
            p.rawSpeed = (p.rawSpeed === undefined) ? v : p.rawSpeed * .55 + v * .45;
            p.rawDx = dx; p.rawDz = dz;
          } else {
            p.rawDx = 0; p.rawDz = 0;
          }
          p.rawTgt = { x: m.p.x, y: m.p.y, z: m.p.z };
          p.rawTime = now;
          p.target = m.p;
          p.targetJy = m.p.jy || 0;
          p.mode = m.mode || 'fp';
          p.lastSeen = performance.now();
        }
        break;
      }
      case 'rename': {
        const p = MP.peers.get(m.account);
        if (p) { p.display = m.display; refreshTag(p); }
        MP.syncPeersUI();
        break;
      }
      case 'kicked': {
        MP._kicked = true;        // 标记被顶号，禁止自动重连
        MP._noReconnect = true;
        hideNet();
        try { localStorage.removeItem('xm_mp_acc'); localStorage.removeItem('xm_mp_pass'); } catch (e) { }
        MP.onKicked = function () {
          MP.onKicked = null;
          MP.connected = false;
          MP.clearPeers();
          MP.handReset();
          handHudHide();
          stopBeat();
          /* 被顶号 = 联机结束，第三人称一并关掉（否则相机没人写，画面冻住）*/
          MP.third = false;
          if (MP.self) MP.self.visible = false;
          if (MP._panel) {
            MP._panel.third.classList.remove('on');
            MP._panel.third.textContent = '第三人称';
            MP._panel.p.style.display = 'none';
            MP._panel.p.classList.remove('open');
          }
          if (typeof setViewBtn === 'function') setViewBtn();
          showLogin();
          setMsg('该账号在别处登录，已被踢下线', 'err');
        };
        MP.onKicked();
        break;
      }
      case 'pong': {
        MP._deadline = 0;         // 心跳有回音 → 连接是活的
        /* 顺便对时：pong 里带 s2(服务端收到时刻) / s3(服务端发出时刻)，
           加上客户端的 c1(发出) 和现在的 t4(收到)，按 NTP 算偏移。
           每 8 秒一次，采样池里挑 RTT 最小的那条当准。 */
        if (m.c1 && m.s2 && m.s3) {
          if (m.epoch) TIME_EPOCH = m.epoch;
          srvSyncNtp(m.c1, m.s2, m.s3, Date.now());
        }
        break;
      }
      case 'err': {
        const code = m.code || '';
        if (code === 'handbusy') {
          /* 对方正在牵别人 / 正在被别人牵：只是这次牵手没成，不是登录问题 */
          MP.hand.pendingTo = ''; MP.hand.pendingToName = '';
          handHud('none', m.msg || '对方现在不方便', '');
          setTimeout(handHudHide, 2300);
          return;
        }
        if (code === 'retry') {
          /* 服务端说「这个号刚被顶过，过会儿再试」→ 账号没错，保留登录信息稍后重试 */
          MP._noReconnect = true;
          showNet('稍后重试…');
          clearTimeout(MP._rt);
          MP._rt = setTimeout(() => { MP.connect(MP.account, MP._pass, true); }, 3500);
          return;
        }
        if (code === 'kicked') {
          /* 真被顶号：停掉自动重连，清账号，等用户重新登录 */
          MP._kicked = true;
          MP._noReconnect = true;
          hideNet();
          try { localStorage.removeItem('xm_mp_acc'); localStorage.removeItem('xm_mp_pass'); } catch (e) { }
          showLogin();
          setMsg(m.msg || '该账号在别处登录', 'err');
          return;
        }
        /* 账号不存在 / 密码错误：停下来让用户改，别一直重试刷服务端 */
        MP._noReconnect = true;
        hideNet();
        setMsg(m.msg || '登录失败', 'err');
        showLogin();
        return;
      }
      /* ── 牵手 ── */
      case 'hand_in': {          // 有人向我发起牵手 → 弹同意/拒绝
        MP.hand.pendingFrom = m.from || '';
        MP.hand.pendingName = m.display || m.from || '';
        handHud('ask', MP.hand.pendingName + ' 想和你牵手', '');
        try { sfx.blip(988, .16, .10); } catch (e) { }
        break;
      }
      case 'hand_wait': {        // 我的请求已发出，等对方回应
        MP.hand.pendingTo = m.to || '';
        MP.hand.pendingToName = m.display || m.to || '';
        handHud('none', '已发出 · 等 ' + MP.hand.pendingToName, '');
        break;
      }
      case 'hand_cancel': {     // 对方取消了请求
        MP.hand.pendingFrom = ''; MP.hand.pendingName = '';
        handHudHide();
        break;
      }
      case 'hand_rej': {        // 被拒绝了
        MP.hand.pendingTo = ''; MP.hand.pendingToName = '';
        handHud('none', (m.display || '对方') + ' 拒绝了', '');
        setTimeout(handHudHide, 2300);
        break;
      }
      case 'hand_pair': {        // 配对成功：a=牵人的（领队），b=跟人的（跟随者）
        if (m.a === MP.account) {
          MP.hand = { role: 'leader', partner: m.b, partnerName: m.bDisplay || m.b, pendingTo: '', pendingToName: '', pendingFrom: '', pendingName: '' };
        } else if (m.b === MP.account) {
          MP.hand = { role: 'follower', partner: m.a, partnerName: m.aDisplay || m.a, pendingTo: '', pendingToName: '', pendingFrom: '', pendingName: '' };
        } else {
          MP.handReset();
        }
        handHudHide();
        break;
      }
      case 'hand_end': {         // 配对解除（有人松手或掉线）
        if (MP.hand.role && (m.a === MP.account || m.b === MP.account)) MP.handReset();
        handHudHide();
        break;
      }
      case 'chat': {
        if (window.MP_UI) MP_UI.pushChat(m);
        break;
      }
    }
  };

  /* ══════════════════════════════════════════════════════
     远端玩家
     ══════════════════════════════════════════════════════ */
  /* 蛋仔风格头顶名牌：圆角气泡 + 左侧头像圆片 + 底部小尖角指向角色
     （蛋仔派对里每个玩家头顶就是一个圆鼓鼓的气泡名牌）*/
  function makeTagSprite(text, color) {
    const c = document.createElement('canvas');
    const W = 512, H = 160;
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.clearRect(0, 0, W, H);
    /* color 统一传 '#rrggbb' 字符串（调用方已拼好，这里不再重复加 #） */
    const hex = String(color).charAt(0) === '#' ? String(color) : '#' + color.toString(16).padStart(6, '0');

    x.font = '800 46px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    x.textBaseline = 'middle';
    const nameW = x.measureText(text).width;
    const R = 40;                       // 气泡圆角
    const PAD = 16;
    const AV = 68;                      // 头像直径
    const bubbleW = Math.min(W - 8, PAD * 2 + AV + 12 + nameW + 18);
    const bx = (W - bubbleW) / 2, by = 14, bh = 84;
    const tipY = by + bh;

    /* 底部小尖角（指向角色头顶）—— 蛋仔式三角气泡嘴 */
    const tipW = 26, tipH = 20;
    const tipX = W / 2;
    x.beginPath();
    x.moveTo(tipX - tipW / 2, tipY - 4);
    x.lineTo(tipX, tipY + tipH);
    x.lineTo(tipX + tipW / 2, tipY - 4);
    x.closePath();
    x.fillStyle = hex; x.fill();

    /* 气泡主体：白底 + 彩色描边 + 底部内侧也填白 */
    x.beginPath();
    x.moveTo(bx + R, by);
    x.arcTo(bx + bubbleW, by, bx + bubbleW, by + bh, R);
    x.arcTo(bx + bubbleW, by + bh, bx, by + bh, R);
    x.arcTo(bx, by + bh, bx, by, R);
    x.arcTo(bx, by, bx + bubbleW, by, R);
    x.closePath();
    x.fillStyle = 'rgba(255,255,255,.94)'; x.fill();
    x.strokeStyle = hex; x.lineWidth = 7; x.lineJoin = 'round'; x.stroke();

    /* 头像圆片：同色渐变球，蛋仔玩家列表那种小圆章 */
    const ax = bx + PAD + AV / 2, ay = by + bh / 2;
    const g = x.createLinearGradient(ax - AV / 2, ay - AV / 2, ax + AV / 2, ay + AV / 2);
    g.addColorStop(0, hex);
    g.addColorStop(1, shade(color, .55));
    x.beginPath(); x.arc(ax, ay, AV / 2 - 3, 0, Math.PI * 2);
    x.fillStyle = g; x.fill();
    x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 4; x.stroke();
    /* 头像里的首字 */
    x.fillStyle = '#fff';
    x.font = '800 34px system-ui,-apple-system,"PingFang SC",sans-serif';
    x.textAlign = 'center';
    x.fillText(text.slice(0, 1).toUpperCase(), ax, ay + 2);

    /* 名字 */
    x.fillStyle = '#2b3242';
    x.font = '800 44px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    x.textAlign = 'left';
    x.fillText(text, ax + AV / 2 + 10, ay + 3, bubbleW - AV - PAD * 2);

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(1.72, 0.538, 1);
    sp.renderOrder = 999;
    return sp;
  }
  /* 颜色压暗（头像渐变用）—— 接受 '#rrggbb' 字符串 */
  function shade(hex, k) {
    const h = String(hex).replace('#', '');
    const r = Math.round(parseInt(h.slice(0, 2), 16) * k);
    const g = Math.round(parseInt(h.slice(2, 4), 16) * k);
    const b = Math.round(parseInt(h.slice(4, 6), 16) * k);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function roundRect(x, px, py, w, h, r) {
    x.beginPath();
    x.moveTo(px + r, py);
    x.arcTo(px + w, py, px + w, py + h, r);
    x.arcTo(px + w, py + h, px, py + h, r);
    x.arcTo(px, py + h, px, py, r);
    x.arcTo(px, py, px + w, py, r);
    x.closePath();
  }

  const PEER_COLORS = [0x6fd3ff, 0xffb35c, 0x8be28f, 0xff8fb0, 0xc9a2ff];
  let peerColorIdx = 0;

  MP.addPeer = function (pl) {
    if (MP.peers.has(pl.account)) return;
    const color = PEER_COLORS[peerColorIdx++ % PEER_COLORS.length];
    const group = buildAvatar(color);
    scene.add(group);
    const tag = makeTagSprite(pl.display || pl.account, '#' + color.toString(16).padStart(6, '0'));
    tag.position.y = AV_TOP + .28;
    /* 名牌直接挂在 group 上（形变只作用在身体组，名牌不受影响）*/
    group.add(tag);
    group.userData.tag = tag;
    const peer = {
      account: pl.account, display: pl.display || pl.account,
      target: pl.p || { x: 0, y: 0, z: 0, yaw: 0 },
      cur: { x: pl.p ? pl.p.x : 0, y: pl.p ? pl.p.y : 0, z: pl.p ? pl.p.z : 0, yaw: 0 },
      group, tag, color, lastSeen: performance.now()
    };
    MP.peers.set(pl.account, peer);
    return peer;
  };

  MP.removePeer = function (account) {
    const p = MP.peers.get(account);
    if (!p) return;
    scene.remove(p.group);
    p.group.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (o.material.map) o.material.map.dispose();
        o.material.dispose();
      }
    });
    MP.peers.delete(account);
  };

  MP.clearPeers = function () {
    for (const acc of [...MP.peers.keys()]) MP.removePeer(acc);
  };

  function refreshTag(peer) {
    if (peer.tag && peer.tag.material && peer.tag.material.map) {
      peer.tag.material.map.dispose();
    }
    const s = makeTagSprite(peer.display, '#' + peer.color.toString(16).padStart(6, '0'));
    peer.tag.material.map = s.material.map;
    peer.tag.material.needsUpdate = true;
  }

  /* ── 远端玩家模型：矮胖雪人熊（跟场景风格一致，不抢戏）── */
  /* 蛋仔风格角色：蛋形身体 + 大圆头 + 小短手 + 圆脚 + 白肚皮
     —— 蛋仔派对的主角本身就是一颗蛋，造型越圆润越像那个味儿 */
  function buildAvatar(colorHex) {
    const g = new THREE.Group();
    const baseCol = new THREE.Color(colorHex);
    const bodyM = new THREE.MeshStandardMaterial({
      color: colorHex, roughness: .62, metalness: .03,
      emissive: new THREE.Color(colorHex).multiplyScalar(.22), emissiveIntensity: .5
    });
    const snowM = new THREE.MeshStandardMaterial({ color: 0xfdfdff, roughness: .78, metalness: 0 });
    const furM = new THREE.MeshStandardMaterial({ color: 0xfff0d8, roughness: .92 });
    const darkM = new THREE.MeshStandardMaterial({ color: 0x2b3242, roughness: .42 });
    const blushM = new THREE.MeshStandardMaterial({ color: 0xff9db4, roughness: .85 });
    const scarfM = new THREE.MeshStandardMaterial({ color: 0xd23b32, roughness: .78 });
    const innerM = new THREE.MeshStandardMaterial({ color: 0xf3a3b5, roughness: .85 });
    const giftM = new THREE.MeshStandardMaterial({ color: 0xe14b45, roughness: .68 });
    const ribM = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: .45, metalness: .2 });

    /* 身体 = 大衣本体：蛋形上小下大
       —— 半宽 .308（上一版 .423，瘦了 27%），头顶 1.69（上一版 1.80），整体小一圈 */
    const body = new THREE.Mesh(new THREE.SphereGeometry(.385, 20, 14), bodyM);
    body.position.y = .69; body.scale.set(.80, 1.10, .80);
    body.castShadow = true;
    g.add(body);

    /* 白肚兜（衣服的前襟）：贴在大衣前面，只占胸口一小块，
       上一版做得太大，整颗蛋都被白球盖住了 */
    const bib = new THREE.Mesh(new THREE.SphereGeometry(.17, 16, 12), snowM);
    bib.position.set(0, .62, .24); bib.scale.set(1, .9, .5);
    g.add(bib);

    /* 奶油毛领（服饰）：脖子一圈厚毛边 */
    const collar = new THREE.Mesh(new THREE.TorusGeometry(.235, .07, 8, 18), furM);
    collar.position.y = 1.01; collar.rotation.x = Math.PI / 2; collar.scale.set(1, 1, .9);
    g.add(collar);

    /* 红围巾（服饰）+ 垂下来的围巾尾 */
    const scarf = new THREE.Mesh(new THREE.TorusGeometry(.215, .085, 8, 18), scarfM);
    scarf.position.y = 1.13; scarf.rotation.x = Math.PI / 2; scarf.scale.set(1, 1, .85);
    g.add(scarf);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(.13, .30, .06), scarfM);
    tail.position.set(.16, .95, .17); tail.rotation.z = -.20;
    g.add(tail);

    /* 腰带（服饰）：腰上一圈深色带子（在肚兜下方，才看得见）*/
    const belt = new THREE.Mesh(new THREE.TorusGeometry(.25, .028, 6, 20), darkM);
    belt.position.y = .44; belt.rotation.x = Math.PI / 2; belt.scale.set(1, 1, .88);
    g.add(belt);

    /* 纽扣（服饰）：肚兜上两颗，凸出前襟一点才看得见 */
    for (const by of [.66, .56]) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(.024, 8, 6), darkM);
      b.position.set(0, by, by > .6 ? .330 : .326);
      g.add(b);
    }

    /* 大圆头（比上一版小一圈：半径 .325）*/
    const head = new THREE.Mesh(new THREE.SphereGeometry(.325, 20, 14), bodyM);
    head.position.y = 1.38; head.scale.set(1, .96, 1);
    head.castShadow = true;
    g.add(head);

    /* 熊耳朵（耳朵）：头顶两只圆耳朵 + 粉色耳心
       —— 放在头顶偏后（z=-.02）而不是两侧，否则会被脑袋挡住看不见 */
    for (const s of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(.105, 12, 8), bodyM);
      ear.position.set(s * .13, 1.70, -.02);
      ear.scale.set(1, 1.05, .9);
      ear.rotation.z = -s * .18;
      ear.castShadow = true;
      g.add(ear);
      const ie = new THREE.Mesh(new THREE.SphereGeometry(.052, 8, 6), innerM);
      ie.position.set(s * .13, 1.705, .055);
      ie.scale.set(1, 1, .5);
      ie.rotation.z = -s * .18;
      g.add(ie);
    }

    /* 眼睛：黑豆眼 + 高光；腮红；小嘴
       —— 每一件的位置都按「头部球面实际半径」往外推一点，不然会埋进脑袋里看不见 */
    for (const s of [-1, 1]) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), darkM);
      e.position.set(s * .105, 1.405, .285); e.scale.set(1, 1.12, .7);
      g.add(e);
      const gl = new THREE.Mesh(new THREE.SphereGeometry(.018, 6, 5), snowM);
      gl.position.set(s * .092, 1.44, .312);
      g.add(gl);
      /* 腮红 */
      const bl = new THREE.Mesh(new THREE.SphereGeometry(.065, 10, 8), blushM);
      bl.position.set(s * .175, 1.325, .245); bl.scale.set(1, .85, .4);
      g.add(bl);
    }
    /* 小嘴（弧线）*/
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(.05, .012, 6, 12, Math.PI), darkM);
    mouth.position.set(0, 1.305, .312); mouth.rotation.z = Math.PI;
    g.add(mouth);

    /* 小背包（单品）：背后一个方方的小包 + 翻盖 + 两条肩带
       —— 上一版是个圆球，远看只像一坨贴上去的圆饼，认不出是包 */
    const bagM = new THREE.MeshStandardMaterial({ color: 0x8d5b43, roughness: .85 });
    const bag = new THREE.Mesh(new THREE.BoxGeometry(.30, .32, .17), bagM);
    bag.position.set(0, .72, -.30);
    bag.castShadow = true;
    g.add(bag);
    const flap = new THREE.Mesh(new THREE.BoxGeometry(.32, .13, .19), furM);
    flap.position.set(0, .84, -.30);
    g.add(flap);
    /* 肩带：从包顶绕过肩膀的两条带子 */
    for (const s of [-1, 1]) {
      const st = new THREE.Mesh(new THREE.BoxGeometry(.045, .30, .045), furM);
      st.position.set(s * .105, .72, -.20); st.rotation.x = -.38;
      g.add(st);
    }

    /* 圆脚：每只脚挂一个 footGrp，跳跃时整只脚能一起抬起/前伸
       —— 鞋底要落在地面上（y=0），鞋帮还得跟身体底面接上；
          中间留一截缝，看起来就是「身体和鞋子分离了」 */
    const feet = [];
    for (const s of [-1, 1]) {
      const fg = new THREE.Group();
      /* 矮胖圆鞋 */
      const ft = new THREE.Mesh(new THREE.SphereGeometry(.13, 12, 9), darkM);
      ft.position.set(s * .155, .112, .035); ft.scale.set(1, .72, 1.3);
      fg.add(ft);
      /* 白鞋底 */
      const sole = new THREE.Mesh(new THREE.SphereGeometry(.125, 12, 9), snowM);
      sole.position.set(s * .155, .045, .035); sole.scale.set(1, .42, 1.25);
      fg.add(sole);
      /* 脚踝：把鞋和身体连起来的一小团，缺了它身体就悬在鞋上面 */
      const ank = new THREE.Mesh(new THREE.SphereGeometry(.115, 12, 9), darkM);
      ank.position.set(s * .145, .195, .02); ank.scale.set(.92, 1.05, .92);
      fg.add(ank);
      g.add(fg);
      feet.push(fg);
    }
    /* 短手：挂在「肩关节组」里，肩组再挂到身体组，
       这样走路时是「肩绕身体转」，而不是整个球体平移 */
    const shoulders = [];
    for (const s of [-1, 1]) {
      const shoulder = new THREE.Group();
      shoulder.position.set(s * .27, .90, 0);
      const arm = new THREE.Mesh(new THREE.SphereGeometry(.11, 10, 8), bodyM);
      arm.position.set(0, -.10, .04); arm.scale.set(1, 1.25, .9);
      arm.castShadow = true;
      shoulder.add(arm);
      g.add(shoulder);
      shoulders.push(shoulder);

      /* 单品：右手捧一个圣诞礼物盒，走路时跟着手一起晃 */
      if (s === 1) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(.13, .11, .13), giftM);
        box.position.set(0, -.32, .13); box.rotation.y = .3;
        shoulder.add(box);
        const rb1 = new THREE.Mesh(new THREE.BoxGeometry(.03, .125, .135), ribM);
        rb1.position.copy(box.position); rb1.rotation.copy(box.rotation);
        shoulder.add(rb1);
        const rb2 = new THREE.Mesh(new THREE.BoxGeometry(.135, .03, .135), ribM);
        rb2.position.copy(box.position); rb2.rotation.copy(box.rotation);
        shoulder.add(rb2);
        /* 礼物盒挂在肩组里：牵手时这条手臂要伸出去，
           盒子得先收起来（不然手伸出去还抱着盒子，像端着一盘苹果去跳舞）*/
        shoulder.userData.gift = [box, rb1, rb2];
      }
    }
    /* 身体组：跑动时整体前后倾 + 上下弹（蛋仔的「软」重心）*/
    const bodyGrp = new THREE.Group();
    g.add(bodyGrp);
    g.userData.keep = true;   // 不参与静态合批
    g.userData.shoulders = shoulders;
    g.userData.bodyGrp = bodyGrp;
    g.userData.feet = feet;
    /* 把身体部件整体挪进 bodyGrp（脖子/头/肚/围巾保持原坐标 → 用反向平移补偿）
       脚除外：脚留在外面，压扁拉伸时脚才不会跟着变形陷进地面 */
    const bodyParts = [];
    g.children.forEach(c => { if (c !== bodyGrp && !shoulders.includes(c) && !feet.includes(c)) bodyParts.push(c); });
    bodyParts.forEach(c => bodyGrp.add(c));
    /* 整体缩放：身体/手脚一起缩，名牌留在外面不缩 */
    const rig = new THREE.Group();
    rig.scale.setScalar(AV_SCALE);
    rig.userData.keep = true;
    g.add(rig);
    rig.add(bodyGrp);
    shoulders.forEach(s => rig.add(s));
    feet.forEach(f => rig.add(f));
    return g;
  }

  /* 让角色面朝「实际移动方向」，静止时面朝视角前方
     —— 蛋仔里角色永远朝着跑动的方向，不会「倒着走」或「扭头看镜头」 */
  function faceByMove(avatar, dt, moveX, moveZ, viewYaw) {
    const moving = Math.hypot(moveX, moveZ) > .25;
    let want;
    if (moving) {
      /* 模型正面就是 +Z（鼻子朝 +Z），atan2(x,z) 直接给出朝向，不用加 PI */
      want = Math.atan2(moveX, moveZ);
    } else {
      /* 静止时背对相机、面朝视线方向 —— 视线方向是 (-sin,-cos)，
         换算成模型的 +Z 正面基准需要 +PI */
      want = viewYaw + Math.PI;
    }
    /* 最短弧插值，转向柔和 */
    let d = want - avatar.rotation.y;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const k = 1 - Math.pow(.0001, dt);
    avatar.rotation.y += d * k;
  }

  /* 蛋仔式角色动画：走路循环 + 跳跃三段
     —— 走地用 sin（不是 |sin|）：绝对值整流会让波峰导数突变，看起来就是一路抽搐
     —— 跳跃分三段：起跳蹬地拉伸 → 滞空手臂上举、脚收起 → 落地压扁回弹
     —— 全部压缩/拉伸都作用在 bodyGrp（以脚底为轴），脚单独放在外面不参与形变 */
  const LAND_T = .22;          // 落地缓冲时长（秒）
  /* handSide：0=不牵手；-1=用右手牵（模型 local -X 那一侧）；+1=用左手牵
     注意模型朝向：正面是 +Z，那么 local +X 是角色的左手、local -X 是右手。*/
  function animateAvatar(avatar, dt, speed, jumpY, jumpVy, st, handSide) {
    const body = avatar.userData.bodyGrp;
    const shoulders = avatar.userData.shoulders || [];
    const feet = avatar.userData.feet || [];
    const moving = speed > .35;
    const sp = Math.min(1, speed / 3.2);
    const inAir = jumpY > .01 || jumpVy !== 0;

    /* 状态机：进空中 / 落地缓冲计时 */
    if (inAir) {
      if (!st.air) { st.air = true; st.airT = 0; }
      st.airT += dt;
      st.landT = 0;
    } else {
      if (st.air) { st.air = false; st.landT = LAND_T; st.lastJy = 0; st.riseAcc = 0; }
      else if (st.landT > 0) st.landT -= dt;
    }

    /* 走路相位：空中停摆，别在滞空时手脚乱动 */
    const freq = (moving && !inAir) ? Math.min(9.5, 4.2 + sp * 5.3) : 0;
    st.v += freq * dt;
    const ph = st.v;

    let sy = 1, sxz = 1, rotX = 0, rotZ = 0, bodyY = 0;
    let armL = 0, armR = 0, armZ = .18;
    let footLift = 0, footFwd = 0, footTilt = 0;

    if (inAir) {
      /* ── 滞空：起跳那一瞬拉得最高 → 顶点回落 → 下落再拉一点 ──
         拉伸量按「上升阶段已经涨了多高」算，不按速度幅度算：
         远端玩家的速度是估算出来的（幅度偏小），
         用速度会让远端看起来几乎不拉伸，用上升高度则两边一致 */
      const dy = jumpY - (st.lastJy === undefined ? jumpY : st.lastJy);
      st.lastJy = jumpY;
      const rising = jumpVy > .05;
      if (rising) st.riseAcc = (st.riseAcc || 0) + Math.max(0, dy);
      else st.riseAcc = 0;
      const target = rising
        ? 1.14 - Math.min(.10, st.riseAcc * .55)
        : 1.06;
      st.sy = (st.sy === undefined) ? target
        : st.sy + (target - st.sy) * (1 - Math.pow(.002, dt));
      sy = st.sy; sxz = 1 / Math.sqrt(sy);
      rotX = -.14;                                  // 空中微微前倾
      rotZ = Math.sin(ph * .7) * .03;
      armL = -2.05; armR = -2.05; armZ = .55;       // 双手高举过头
      footLift = .085; footFwd = .05; footTilt = -.35;  // 收腿
    } else if (st.landT > 0) {
      /* ── 落地：触地瞬间最扁 → 回弹（末端连续，不突变）── */
      const k = Math.max(0, st.landT / LAND_T);      // 1 → 0
      const prog = 1 - k;                            // 0 → 1
      const sq = 1 - .20 * Math.cos(prog * Math.PI) * (1 - prog);
      sy = sq; sxz = 1 / Math.sqrt(sq);
      rotX = -.10;
      armL = .45; armR = .45; armZ = .30;            // 手臂落下
    } else {
      /* ── 地面行走 ── */
      bodyY = moving ? Math.sin(ph * 2) * .055 * sp : 0;
      rotX = moving ? -.10 * sp : 0;
      rotZ = moving ? Math.sin(ph) * .07 * sp : 0;
      if (moving) { armL = Math.sin(ph) * .85 * sp; armR = -armL; armZ = .18; }
      /* 走路节奏压缩：脚落地那一瞬压一下 */
      let sq = 1;
      if (moving) sq = 1 - Math.max(0, -Math.sin(ph * 2)) * .055 * sp;
      sy = sq; sxz = 1 / Math.sqrt(sq);
    }

    if (body) {
      body.scale.set(sxz, sy, sxz);
      body.position.y = bodyY;
      body.rotation.x = rotX;
      body.rotation.z = rotZ;
    }
    if (shoulders.length === 2) {
      shoulders[0].rotation.x = armL;
      shoulders[1].rotation.x = armR;
      shoulders[0].rotation.z = -armZ;
      shoulders[1].rotation.z = armZ;
      /* 牵手：用来牵人的那条手臂改成「前伸 + 向外」，
         另一条手臂继续正常摆动；这条手臂上的礼物盒先收起来 */
      for (let i = 0; i < 2; i++) {
        const g = shoulders[i].userData.gift;
        if (!g) continue;
        const holding = (handSide < 0 && i === 0) || (handSide > 0 && i === 1);
        for (const m of g) m.visible = !holding;
      }
      if (handSide) {
        const sh = shoulders[handSide < 0 ? 0 : 1];
        sh.rotation.x = -.85;                       // 前伸
        sh.rotation.z = handSide < 0 ? -1.0 : 1.0;  // 向外（朝对方）
      }
    }
    for (let i = 0; i < feet.length; i++) {
      const f = feet[i];
      f.position.y = footLift;
      f.position.z = footFwd;
      f.rotation.x = footTilt;
    }
    /* 名牌贴着头顶：身体拉伸/压扁时一起升降，别悬在半空
       （角色改小后头顶到 1.81，牌子跟着降）*/
    const tg = avatar.userData.tag;
    if (tg) tg.position.y = AV_TOP * sy + .28;
    return inAir;
  }

  /* ══════════════════════════════════════════════════════
     本地第三人称角色
     ══════════════════════════════════════════════════════ */
  MP.startThirdPersonBody = function () {
    if (MP.self) return;
    const g = buildAvatar(0xffd9a0);
    g.visible = false;
    scene.add(g);
    MP.self = g;
    /* 名牌挂在「不参与形变」的外层 group 上 —— 身体压缩/拉伸只作用在 bodyGrp，
       名牌既不会被压扁，也不会跟着上下点头 */
    MP.selfTag = makeTagSprite(MP.display || MP.account || '我', '#ffd9a0');
    MP.selfTag.position.y = AV_TOP + .28;
    g.add(MP.selfTag);
    g.userData.tag = MP.selfTag;
    MP._phase = { v: 0 };
  };

  /* ══════════════════════════════════════════════════════
     第三人称相机
     ══════════════════════════════════════════════════════ */
  /* 「第三人称现在是否真的在接管相机」——全项目唯一判断口径。
     必须同时满足：开了第三人称 + 处于沉浸（fp.on）+ 角色已创建且可见。
     fpUpdate 与 MP.update 都查它，避免出现「两边都不写相机 → 画面冻住」。 */
  MP.thirdLive = function () {
    return !!(MP.third && fp.on && MP.self && MP.self.visible);
  };

  MP.toggleThird = function () {
    MP.third = !MP.third;
    /* 没联机也能用第三人称：第一次开就地把本地角色建出来 */
    if (MP.third && !MP.self) MP.startThirdPersonBody();
    if (MP.self) MP.self.visible = MP.third && fp.on;
    if (MP._panel) {
      MP._panel.third.classList.toggle('on', MP.third);
      MP._panel.third.textContent = MP.third ? '第一人称' : '第三人称';
    }
    if (MP.third && fp.on) {
      // 从第一人称切到第三人称：先把相机摆到角色背后（同一套 orbit 构图）
      const p0 = Math.max(-1.05, Math.min(1.05, fp.pitch));
      const pivot = new THREE.Vector3(fp.x, fp.y + 1.42, fp.z);
      const f0 = new THREE.Vector3(
        -Math.sin(fp.yaw) * Math.cos(p0),
        Math.sin(p0),
        -Math.cos(fp.yaw) * Math.cos(p0)
      );
      const camUp0 = .55 + Math.abs(Math.sin(p0)) * 2.0;
      const w0 = new THREE.Vector3(
        fp.x + Math.sin(fp.yaw) * Math.cos(p0) * MP.camDist,
        pivot.y + camUp0,
        fp.z + Math.cos(fp.yaw) * Math.cos(p0) * MP.camDist
      );
      camera.position.copy(w0);
      const l0 = pivot.clone().addScaledVector(f0, 12);
      camera.lookAt(l0);
    }
    if (typeof setViewBtn === 'function') setViewBtn();
    if (window.sfx) sfx.blip(660, .08, .05);
  };

  /* 手动设置本地位置（调试 / 自动化测试用；正常走动由 fpUpdate 驱动） */
  MP.setLocalPos = function (x, y, z, yaw) {
    MP._manual = true;
    MP._lastX = x; MP._lastY = y || 0; MP._lastZ = z; MP._lastYaw = yaw || 0;
  };

  /* ── 乘坐设施一律第一人称 ──
     上车前把第三人称关掉（第三人称相机会跟设施的座位视角打架，
     而且自己的角色会糊在镜头前面）；下车后恢复用户原来的选择。 */
  MP.pushFirstPerson = function () {
    if (MP._fpSaved !== undefined) return;
    MP._fpSaved = MP.third;
    if (MP.third) MP.toggleThird();   // 会同步按钮状态和角色显隐
  };
  MP.popFirstPerson = function () {
    if (MP._fpSaved === undefined) return;
    const v = MP._fpSaved; MP._fpSaved = undefined;
    if (v && !MP.third) MP.toggleThird();
  };

  /* 把相机钉死在一个机位（自动化截图用）：
     第三人称相机每帧都会改相机位置和朝向，钉死后才能拍到指定角度 */
  MP.freezeCam = function (px, py, pz, tx, ty, tz) {
    if (!MP._camFrozen) {
      MP._camFrozen = true;
      /* 记下原型方法：冻结是「打补丁」，不解除会把整个相机的 lerp/lookAt 永久废掉，
         后面任何设施的乘坐视角都会失效（直升机就踩过这个坑）。 */
      MP._camOrig = {
        lerp: camera.position.lerp,
        slerp: camera.quaternion.slerp,
        lookAt: camera.lookAt
      };
      camera.position.lerp = function () { return this; };
      camera.quaternion.slerp = function () { return this; };
      camera.lookAt = function () { return this; };
      /* OrbitControls 每帧会重算相机位置：极角被 maxPolarAngle 夹住，
         机位越高越会被顶回去（想要 y=2.4 实际变成 y=7.7）。
         钉死时直接停掉 controls.update，把 target 也对齐到注视点。 */
      try { controls.update = function () { }; controls.enabled = false; } catch (e) { }
    }
    camera.position.set(px, py, pz);
    camera.up.set(0, 1, 0);
    const m = new THREE.Matrix4().lookAt(
      camera.position, new THREE.Vector3(tx, ty, tz), camera.up);
    camera.quaternion.setFromRotationMatrix(m);
    try { controls.target.set(tx, ty, tz); } catch (e) { }
    return MP.debug();
  };

  /* 解除 freezeCam：把 camera.position.lerp / quaternion.slerp / lookAt 还原回原型，
     否则同页面后续的乘坐视角（直升机/摩天轮/热气球）全都会失去相机控制。 */
  MP.unfreezeCam = function () {
    if (!MP._camFrozen) return false;
    MP._camFrozen = false;
    const o = MP._camOrig;
    if (o) {
      camera.position.lerp = o.lerp;
      camera.quaternion.slerp = o.slerp;
      camera.lookAt = o.lookAt;
    }
    MP._camOrig = null;
    /* freezeCam 是给 controls.update 打的实例属性补丁，删掉自有属性即恢复原型方法 */
    try { delete controls.update; controls.enabled = true; } catch (e) { }
    return true;
  };

  /* 调试接口：给自动化测试读状态用 */
  MP.debug = function () {
    const peers = {};
    for (const p of MP.peers.values()) {
      peers[p.account] = {
        display: p.display,
        target: { x: p.target.x, y: p.target.y, z: p.target.z, yaw: p.target.yaw },
        cur: { x: p.cur.x, y: p.cur.y, z: p.cur.z, yaw: p.cur.yaw },
        groupPos: [+p.group.position.x.toFixed(3), +p.group.position.y.toFixed(3), +p.group.position.z.toFixed(3)],
        tagOpacity: +p.tag.material.opacity.toFixed(3),
        screen: (() => {
          const v = p.group.position.clone(); v.y += 1.2; v.project(camera);
          return [Math.round((v.x * .5 + .5) * window.innerWidth), Math.round((-v.y * .5 + .5) * window.innerHeight)];
        })(),
        distToCam: +camera.position.distanceTo(p.group.position).toFixed(3)
      };
    }
    return {
      connected: MP.connected, account: MP.account, display: MP.display,
      third: MP.third,
      selfVisible: MP.self ? MP.self.visible : null,
      selfPos: MP.self ? [+MP.self.position.x.toFixed(3), +MP.self.position.y.toFixed(3), +MP.self.position.z.toFixed(3)] : null,
      camPos: [+camera.position.x.toFixed(3), +camera.position.y.toFixed(3), +camera.position.z.toFixed(3)],
      /* 第三人称构图诊断：角色头顶/脚底投影到屏幕的高度（0=屏幕顶, 1=屏幕底）
         + 相机俯仰角（度，正=抬头）*/
      selfScreen: MP.self ? (() => {
        const v = new THREE.Vector3();
        const pr = (y) => {
          v.set(MP.self.position.x, MP.self.position.y + y, MP.self.position.z).project(camera);
          return [+(-v.y * .5 + .5).toFixed(3), +(-v.z).toFixed(3)];
        };
        const d = new THREE.Vector3();
        camera.getWorldDirection(d);
        return {
          head: pr(1.25), feet: pr(0),
          camPitchDeg: +(Math.asin(Math.max(-1, Math.min(1, d.y))) * 180 / Math.PI).toFixed(2)
        };
      })() : null,
      peers
    };
  };

  /* ══════════════════════════════════════════════════════
     每帧更新（插值远端玩家 + 推本地位置 + 第三人称相机）
     ══════════════════════════════════════════════════════ */
  MP.update = function (dt) {
    /* ── 牵手：跟随者的位置/朝向整个锁到领队右手边 ──
       跟随者不走自己的路：位置由领队的角色朝向算出来（右手边 HAND_D 处），
       所以两个人永远并排，不会出现「一个往前一个往后」这种拧巴姿势。 */
    if (MP.hand.role === 'follower' && MP.connected) {
      const ld = MP.peers.get(MP.hand.partner);
      if (ld) {
        const th = ld.group.rotation.y;
        fp.x = ld.group.position.x - Math.cos(th) * HAND_D;
        fp.z = ld.group.position.z + Math.sin(th) * HAND_D;
        fp.y = ld.group.position.y;
        fp.jumpY = ld.curJy || 0;
        fp.jumpVy = 0;
        fp.vx = 0; fp.vz = 0;
      }
    }
    /* ── 本地第三人称角色 + 相机（不依赖联机：没登录也能切第三人称）── */
    /* 本地第三人称角色跟随 */
    if (MP.third && fp.on && MP.self) {
      /* 角色根节点跟着离地高度抬起来 —— 少了这一步，人只是原地拉伸，不会跳起来 */
      MP.self.position.set(fp.x, fp.y + fp.jumpY, fp.z);
      /* 牵手跟随中：步速和朝向都跟领队，自己没有输入 */
      const _ld = (MP.hand.role === 'follower' && MP.connected) ? MP.peers.get(MP.hand.partner) : null;
      const spd = _ld ? (_ld.rawSpeed || 0) : Math.hypot(fp.vx, fp.vz);
      /* 面朝移动方向（不是镜头方向）—— 侧着走就侧着走，不会扭头看镜头 */
      if (_ld) {
        /* 跟随者：朝向锁死成领队的朝向（最短弧插值，转向柔和）*/
        let d = _ld.group.rotation.y - MP.self.rotation.y;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        MP.self.rotation.y += d * (1 - Math.pow(.0004, dt));
      } else {
        faceByMove(MP.self, dt, fp.vx, fp.vz, fp.yaw);
      }
      /* 蛋仔式动画：走路循环 + 跳跃三段（起跳 / 滞空 / 落地）*/
      animateAvatar(MP.self, dt, spd, fp.jumpY, fp.jumpVy, MP._phase,
        MP.hand.role === 'leader' ? -1 : (MP.hand.role === 'follower' ? 1 : 0));

      /* 相机：蛋仔式第三人称构图 ——
         相机挂在角色后上方（orbit），视线沿角色正前方 12m 出去，
         角色因此自然沉到画面下半部，不会横挡正前方视线；
         抬头时视线跟着抬，角色在下半部越沉越低 */
      const yaw = fp.yaw;
      /* 手机端拖动抬头能到 ±1.4，之前的 ±0.6 硬限幅会把视角「卡住」。
         这里放宽到 ±1.05 并做指数平滑，抬头/低头都是连续的 */
      const pTarget = Math.max(-1.05, Math.min(1.05, fp.pitch));
      if (MP._cp === undefined) MP._cp = pTarget;
      MP._cp += (pTarget - MP._cp) * (1 - Math.pow(.0006, dt));
      const pitch = MP._cp;
      const dist = MP.camDist;
      /* pivot = 角色头顶略上方（跟着离地高度一起抬，跳跃时相机才不会把角色甩出画面）*/
      const pivot = new THREE.Vector3(fp.x, fp.y + fp.jumpY + 1.42, fp.z);
      const fwd = new THREE.Vector3(
        -Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        -Math.cos(yaw) * Math.cos(pitch)
      );
      /* 相机高度：pitch 越大相机越高（正负对称）——
         这样抬头时视线仰起、低头时视线俯下，角色两种情况都沉在画面底部，
         不会低頭時突然跑到视野上方挡路 */
      const camUp = .55 + Math.abs(Math.sin(pitch)) * 2.0;
      const want = new THREE.Vector3(
        fp.x + Math.sin(yaw) * Math.cos(pitch) * dist,
        pivot.y + camUp,
        fp.z + Math.cos(yaw) * Math.cos(pitch) * dist
      );
      const kk = 1 - Math.pow(.0009, dt);
      camera.position.lerp(want, kk);
      /* 瞄准点：角色前方 12m（远处 → 俯角极小，视线基本水平）*/
      const look = pivot.clone().addScaledVector(fwd, 12);
      const dir = look.clone().sub(camera.position);
      if (dir.lengthSq() > 1e-6) {
        const targetQ = new THREE.Quaternion().setFromRotationMatrix(
          new THREE.Matrix4().lookAt(camera.position, look, camera.up)
        );
        camera.quaternion.slerp(targetQ, 1 - Math.pow(.0004, dt));
      }
      camera.position.copy(camera.position);  // 保持
    }

    /* 角色只在「第三人称 + 沉浸」时可见；回到沙盘视角就隐藏 */
    if (MP.self) MP.self.visible = MP.third && fp.on;

    if (!MP.connected) return;

    /* 远端玩家：位置/朝向插值 */
    const now = performance.now();
    for (const p of MP.peers.values()) {
      const k = 1 - Math.pow(.0016, dt);      // 指数平滑
      const tx = p.target.x, ty = p.target.y, tz = p.target.z;
      p.cur.x += (tx - p.cur.x) * k;
      p.cur.y += (ty - p.cur.y) * k;
      p.cur.z += (tz - p.cur.z) * k;
      /* 离地高度插值 + 竖直速度估算（远端也要能播跳跃动作）*/
      const tj = p.targetJy || 0;
      const prevJy = p.curJy === undefined ? tj : p.curJy;
      p.curJy = prevJy + (tj - prevJy) * k;
      const vyRaw = (p.curJy - prevJy) / Math.max(dt, .001);
      p.curVy = (p.curVy === undefined) ? vyRaw : p.curVy * .78 + vyRaw * .22;
      // 朝向：走最短弧
      let dy = p.target.yaw - p.cur.yaw;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      p.cur.yaw += dy * k;
      /* 牵手：我是领队 → 被牵方直接贴在领队右手边，
         位置/朝向/步速全部跟领队（他自己广播的位置有延迟，不用）*/
      let handSide = 0;
      if (MP.hand.role === 'leader' && p.account === MP.hand.partner) {
        const th = leaderFacing(dt);
        p.cur.x = fp.x - Math.cos(th) * HAND_D;
        p.cur.z = fp.z + Math.sin(th) * HAND_D;
        p.cur.y = fp.y;
        p.cur.yaw = th - Math.PI;
        p.curJy = fp.jumpY; p.targetJy = fp.jumpY; p.curVy = 0;
        p.rawDx = fp.vx; p.rawDz = fp.vz;
        p.rawSpeed = Math.hypot(fp.vx, fp.vz);
        handSide = 1;                 // 被牵方伸出左手
      }
      p.group.position.set(p.cur.x, p.cur.y, p.cur.z);
      /* 远端：用服务器下发的真实位移推速度和方向 */
      const mvX = p.rawDx || 0, mvZ = p.rawDz || 0;
      const vNow = p.rawSpeed !== undefined ? p.rawSpeed : 0;
      faceByMove(p.group, dt, mvX, mvZ, p.cur.yaw);
      animateAvatar(p.group, dt, vNow, p.curJy || 0, p.curVy || 0, p.phase || (p.phase = { v: 0 }), handSide);
      // 标签始终朝向相机（Sprite 自带）
      // 远距离时淡出标签，避免糊屏
      const d = camera.position.distanceTo(p.group.position);
      p.tag.material.opacity = d > 42 ? 0 : (d > 26 ? (42 - d) / 16 : 1);
    }

    /* 牵着手的那一小团：把两个人的手接上 */
    const _an = MP.handAnchor();
    if (_an) {
      const _lm = handLinkMesh();
      _lm.visible = true;
      _lm.position.set(
        _an.x - Math.cos(_an.th) * (HAND_D * .5),
        _an.y + .66,
        _an.z + Math.sin(_an.th) * (HAND_D * .5)
      );
    } else if (MP._handLink) {
      MP._handLink.visible = false;
    }

    /* 牵手 HUD 刷新（8Hz 够了，别每帧动 DOM）*/
    MP._hudT = (MP._hudT || 0) - dt;
    if (MP._hudT <= 0) { MP._hudT = .12; MP.handSelfHeal(dt); MP.updateHandHud(); }

    /* 推本地位置（y 含离地高度，jy 单独给一份让对方能播跳跃动作）*/
    const now2 = performance.now();
    if (now2 - MP.lastSend > 1000 / MP.sendHz) {
      MP.lastSend = now2;
      const px = MP._manual ? MP._lastX : (fp.on ? fp.x : (MP._lastX || 0));
      const py = MP._manual ? MP._lastY : (fp.on ? fp.y : (MP._lastY || 0));
      const pz = MP._manual ? MP._lastZ : (fp.on ? fp.z : (MP._lastZ || 0));
      const pyaw = MP._manual ? MP._lastYaw : (fp.on ? fp.yaw : (MP._lastYaw || 0));
      const pjy = MP._manual ? 0 : (fp.on ? fp.jumpY : 0);
      if (!MP._manual) { MP._lastX = px; MP._lastY = py; MP._lastZ = pz; MP._lastYaw = pyaw; }
      MP.send({
        t: 'pos', mode: MP.third ? 'tp' : 'fp',
        p: { x: px, y: py + pjy, z: pz, yaw: pyaw, jy: pjy }
      });
    }
  };

  /* ══════════════════════════════════════════════════════
     HUD：在线玩家列表 + 改 ID + 视角按钮
     ══════════════════════════════════════════════════════ */
  function buildPanel() {
    if (document.getElementById('mp-panel')) return;
    const p = document.createElement('div');
    p.id = 'mp-panel';
    /* 默认收起：只有一颗「个人」按钮，点开才显示账号 / ID / 改 ID / 玩家列表 */
    p.innerHTML = `
      <button id="mp-me-btn" title="个人信息">
        <span class="mp-avatar" id="mp-me-av">?</span>
        <span>个人</span>
        <span class="mp-cnt" id="mp-cnt"></span>
      </button>
      <div class="mp-body">
        <div class="mp-me-row">
          <span class="mp-avatar" id="mp-me-av2">?</span>
          <span class="mp-me-name" id="mp-me">未登录</span>
        </div>
        <div class="mp-field"><b>账号</b><span id="mp-acc-t">-</span></div>
        <div class="mp-field"><b>ID</b><span id="mp-id-t">-</span></div>
        <div class="mp-peers" id="mp-peers"></div>
        <div class="mp-edit">
          <input id="mp-name" type="text" maxlength="16" placeholder="换个名字">
          <button id="mp-save">改</button>
        </div>
        <div class="mp-btn-row">
          <button id="mp-third" class="mp-btn mp-btn3">第三人称</button>
          <button id="mp-logout" class="mp-btn mp-btn2">退出</button>
        </div>
      </div>`;
    document.body.appendChild(p);
    const self = p.querySelector('#mp-me');
    const peers = p.querySelector('#mp-peers');
    const nameI = p.querySelector('#mp-name');
    const accT = p.querySelector('#mp-acc-t');
    const idT = p.querySelector('#mp-id-t');
    const cnt = p.querySelector('#mp-cnt');
    const meBtn = p.querySelector('#mp-me-btn');
    /* 未登录时整块藏起来 */
    p.style.display = 'none';
    /* 点「个人」展开 / 再点收起 */
    const setPanelOpen=on=>{p.classList.toggle('open',on);document.body.classList.toggle('mp-open',on);};
    meBtn.onclick = () => {
      setPanelOpen(!p.classList.contains('open'));
      if (p.classList.contains('open')) nameI.focus();
    };
    p.querySelector('#mp-save').onclick = () => {
      const v = nameI.value.trim();
      if (!v) return;
      MP.send({ t: 'name', name: v });
      MP.display = v;
      MP.saveName(v);          // 存下来，下次进去还是这个 ID
      if (MP.selfTag) {
        const s2 = makeTagSprite(v, '#ffd9a0');
        MP.selfTag.material.map.dispose();
        MP.selfTag.material.map = s2.material.map;
        MP.selfTag.material.needsUpdate = true;
      }
      idT.textContent = v;
      nameI.value = '';
      MP.syncPeersUI();
    };
    nameI.addEventListener('keydown', e => { if (e.key === 'Enter') p.querySelector('#mp-save').click(); });
    p.querySelector('#mp-third').onclick = () => MP.toggleThird();
    p.querySelector('#mp-logout').onclick = () => {
      try { if (MP.ws) { MP.ws.onclose = null; MP.ws.close(); } } catch (e) { }
      MP.ws = null; MP.connected = false; MP.onKicked = null; MP._kicked = true;
      MP._noReconnect = true;
      MP.clearPeers();
      stopBeat();
      hideNet();
      /* 退出联机 = 回到纯单机：第三人称随之关闭，
         不然 MP.third 残留 true 会让第一人称和多人模块都不写相机 → 画面冻住 */
      MP.third = false;
      if (MP.self) MP.self.visible = false;
      if (MP._panel) {
        MP._panel.third.classList.remove('on');
        MP._panel.third.textContent = '第三人称';
      }
      try { localStorage.removeItem('xm_mp_acc'); localStorage.removeItem('xm_mp_pass'); } catch (e) { }
      if (MP._panel) { MP._panel.p.style.display = 'none'; MP._panel.p.classList.remove('open'); }
      if (typeof setViewBtn === 'function') setViewBtn();
      showLogin();
    };
    MP._panel = { p, self, peers, nameI, meAv: p.querySelector('#mp-me-av'),
                  meAv2: p.querySelector('#mp-me-av2'), accT, idT, cnt, meBtn,
                  third: p.querySelector('#mp-third') };
  }

  /* 在线玩家：蛋仔那种横排小圆章，每人一枚，悬停显示名字 */
  MP.syncPeersUI = function () {
    if (!MP._panel) return;
    const { self, peers, meAv, meAv2, accT, idT, cnt } = MP._panel;
    self.textContent = MP.display || MP.account || '未登录';
    const ch = (MP.display || MP.account || '?').slice(0, 1).toUpperCase();
    if (meAv) meAv.textContent = ch;
    if (meAv2) meAv2.textContent = ch;
    if (accT) accT.textContent = MP.account || '-';
    if (idT) idT.textContent = MP.display || '-';
    const list = [];
    for (const p of MP.peers.values()) {
      const hex = '#' + p.color.toString(16).padStart(6, '0');
      list.push('<span class="mp-badge" style="--c:' + hex + '" title="' + escapeHtml(p.display) + '">'
        + escapeHtml((p.display || '?').slice(0, 1).toUpperCase())
        + '<i>' + escapeHtml(p.display) + '</i></span>');
    }
    if (!list.length) list.push('<span class="mp-none">暂无其他玩家</span>');
    peers.innerHTML = list.join('');
    /* 收起状态下的队友数量角标 */
    if (cnt) {
      const n = MP.peers.size;
      cnt.textContent = n ? String(n) : '';
      cnt.classList.toggle('on', n > 0);
    }
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ══════════════════════════════════════════════════════
     初始化
     ══════════════════════════════════════════════════════ */
  MP.init = function () {
    buildLoginUI();
    buildPanel();
    // 自动登录：查 localStorage
    const saved = localStorage.getItem('xm_mp_acc');
    const savedP = localStorage.getItem('xm_mp_pass');
    if (saved && savedP) {
      MP._ui.acc.value = saved;
      MP._ui.pass.value = savedP;
      setMsg('正在恢复上次登录…');
      MP.connect(saved, savedP);
    }
    // 记住登录信息
    const origLogin = MP.onMsg;
    MP.onMsg = function (m) {
      if (m.t === 'welcome') {
        localStorage.setItem('xm_mp_acc', MP.account);
        localStorage.setItem('xm_mp_pass', MP._pass || '');
      }
      origLogin(m);
    };

    /* ── 弱网 / 后台回来时的补救 ──
       手机切后台、锁屏、断 Wi-Fi 换流量之后，浏览器的 WebSocket
       常常既不报错也不重连（半开）。这里用可见性和网络状态两个信号
       把连接立刻拉起来，不用干等心跳超时。 */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (MP.connected) {
        /* 回到前台先探一下：6 秒内没有回音就当连接已死 */
        MP._lastPing = 0;
        MP._deadline = performance.now() + 6000;
        MP.send({ t: 'ping', c1: Date.now() });
      } else if (MP.account) {
        MP.tries = 0;
        MP.connect(MP.account, MP._pass, true);
      }
    });
    window.addEventListener('online', () => {
      if (MP.connected) { MP.send({ t: 'ping', c1: Date.now() }); return; }
      if (!MP.account) return;
      MP.tries = 0;
      MP.connect(MP.account, MP._pass, true);
    });
    window.addEventListener('pagehide', () => {
      /* 页面被关掉/切走时，主动断开，别留一个僵尸连接占着账号 */
      try { if (MP.ws) { MP.ws.onclose = null; MP.ws.close(); } } catch (e) { }
    });
  };

  MP.setThird = function (v) {
    if (MP._panel) MP._panel.third.classList.toggle('on', v);
  };

  document.addEventListener('DOMContentLoaded', () => MP.init());
  if (document.readyState !== 'loading') MP.init();

})();


function animate(){
  requestAnimationFrame(animate);
  renderer.info.reset();
  /* 开场 1.6 秒的运动侦测 + 静态合批（分帧做完就停，不再有额外开销） */
  if(_autoMerge.phase<3)_autoMergeTick();
  const dt=Math.min(clock.getDelta(),.05);
  /* ── 全局时间：服务器权威 ──
     以前这里是 t += dt（本地累加），每个客户端各转各的；
     现在 t 是服务器时间的纯函数，所以旋转木马 / 马戏团四幕 /
     灯串扫光在任何设备上都是同一个进度。
     偏移小偏差慢慢逼近（免得相位突然跳一下），大偏差直接跳
     （页面刚加载时的首次校准，这时玩家还没看清画面）。 */
  {
    const _d=srvOffTarget-srvOff;
    if(Math.abs(_d)>2500) srvOff=srvOffTarget;
    else srvOff+=_d*Math.min(1,dt*1.5);
  }
  tLocal+=dt;
  t=(srvNow()-TIME_EPOCH)/1000;

  /* 轻飘物件（留言提示牌等）上下浮一点，走服务器时间，多端同相位 */
  for(const f of FLOATERS){
    f.obj.position.y=f.y0+Math.sin(t*f.sp+f.ph)*f.amp;
    f.obj.rotation.z=Math.sin(t*f.sp*.7+f.ph)*.035;
  }

  /* 环城车流物理模拟（安全跟车制动 / 行人礼让鸣笛 / 过弯离心侧倾 / 刹车点头悬架 / 车轮滚转与轮胎扬雪） */
  for(const tr of traffic){
    if(tr.honkCd>0)tr.honkCd-=dt;
    if(tr.boostT>0)tr.boostT-=dt;
    if(tr.puffCd>0)tr.puffCd-=dt;
    let tgtSpd=tr.baseSpeed*(tr.boostT>0?1.36:1.0);
    // 1. 同向车道安全跟车距离控制
    for(const o of traffic){
      if(o===tr||o.dir!==tr.dir||Math.abs(o.laneOff-tr.laneOff)>1.35)continue;
      const ds=((o.s-tr.s)*tr.dir+LOOP.totalLen)%LOOP.totalLen;
      if(ds>.1&&ds<11.5){
        tgtSpd=Math.min(tgtSpd,Math.max(0,(ds-5.6)/5.9)*tr.baseSpeed);
      }
    }
    const cyaw=tr.c.rotation.y, fwdX=Math.sin(cyaw), fwdZ=Math.cos(cyaw);
    // 2. 第一人称玩家横穿马路时急刹礼让 + 双音鸣笛
    if(fp.on&&fp.y<.75){
      const fx=fp.x-tr.c.position.x, fz=fp.z-tr.c.position.z;
      const ahead=fx*fwdX+fz*fwdZ, lat=Math.abs(fx*fwdZ-fz*fwdX);
      if(ahead>-1.0&&ahead<9.8&&lat<2.3){
        tgtSpd=Math.min(tgtSpd,Math.max(0,(ahead-3.6)*.85));
        if(ahead>1.0&&ahead<7.5&&tr.honkCd<=0&&tr.curSpd>1.6){sfx.horn();tr.honkCd=4.2;}
      }
    }
    // 3. 室外萌宠 / 小熊靠近路面时减速避让
    for(const a of liveAnimals){
      const ax=a.x-tr.c.position.x, az=a.z-tr.c.position.z;
      const ahead=ax*fwdX+az*fwdZ, lat=Math.abs(ax*fwdZ-az*fwdX);
      if(ahead>.4&&ahead<5.5&&lat<1.9)tgtSpd=Math.min(tgtSpd,1.4);
    }
    const dv=tgtSpd-tr.curSpd;
    const maxRate=dv>=0?5.2:14.5;
    tr.accel=Math.max(-maxRate,Math.min(maxRate,dv/Math.max(.005,dt)));
    tr.curSpd=Math.max(0,tr.curSpd+tr.accel*dt);

    tr.s=(tr.s+tr.curSpd*dt*tr.dir+LOOP.totalLen)%LOOP.totalLen;
    const p=LOOP.sample(tr.s,tr.laneOff);
    tr.c.position.set(p.x,0,p.z);
    const newYaw=Math.atan2(p.tx*tr.dir,p.tz*tr.dir);
    let dyaw=newYaw-tr.yawPrev;
    while(dyaw>Math.PI)dyaw-=Math.PI*2;
    while(dyaw<-Math.PI)dyaw+=Math.PI*2;
    tr.yawPrev=newYaw;
    const omega=dyaw/Math.max(.005,dt);
    tr.c.rotation.y=newYaw;

    // 悬架弹簧动力学：制动点头 + 加速仰头 + 过弯离心侧倾 + 路面起伏
    const pitchTgt=Math.max(-.046,Math.min(.046,-tr.accel*.0038));
    const rollTgt=Math.max(-.065,Math.min(.065,omega*tr.curSpd*.014));
    const roadBump=Math.sin(tr.s*.55)*.005*Math.min(1,tr.curSpd/5.5);
    tr.pitchV+=(pitchTgt-tr.pitch)*92*dt-tr.pitchV*11*dt;tr.pitch+=tr.pitchV*dt;
    tr.rollV+=(rollTgt-tr.roll)*88*dt-tr.rollV*10*dt;tr.roll+=tr.rollV*dt;
    tr.heaveV+=(roadBump-tr.heave)*125*dt-tr.heaveV*12*dt;tr.heave+=tr.heaveV*dt;
    if(tr.c.userData.chassis){
      const ch=tr.c.userData.chassis;
      ch.position.y=tr.heave;ch.rotation.x=tr.pitch;ch.rotation.z=tr.roll;
    }
    // 车轮随实测线速度真实转动 + 前轮随转向角真实偏转 + 刹车尾灯增亮
    tr.wheelAng+=(tr.curSpd*dt)/.33;
    if(tr.c.userData.wheels){
      for(const w of tr.c.userData.wheels)w.rotation.x=tr.wheelAng;
    }
    if(tr.c.userData.steerPivots){
      const steer=Math.max(-.32,Math.min(.32,omega*.34));
      for(const sp of tr.c.userData.steerPivots)sp.rotation.y+=(steer-sp.rotation.y)*Math.min(1,dt*12);
    }
    const wantBrake=(tr.accel<-1.6||tr.curSpd<.4)?1:0;
    tr.brakeAmt+=(wantBrake-tr.brakeAmt)*Math.min(1,dt*10);
    if(tr.c.userData.tlMat)tr.c.userData.tlMat.color.setHex(tr.brakeAmt>.25?0xff5c3d:0xd62418);
    tr.tl.scale.setScalar(1+tr.brakeAmt*.75);
    tr.tl.material.opacity=.40+tr.brakeAmt*.48;
    tr.pool.material.opacity=.24+Math.sin(t*3+tr.s)*.05;
    // 后轮甩雪花效果（高速或过弯更明显）
    if(tr.curSpd>4.5&&tr.puffCd<=0){
      tr.puffCd=.095/Math.max(1,tr.curSpd/7.5);
      for(const s of [-.75,.75]){
        const rx=p.x-fwdX*1.35+fwdZ*s, rz=p.z-fwdZ*1.35-fwdX*s;
        spawnSnowPuff(rx,.08,rz,-fwdX*1.6+R(-.4,.4),R(.55,1.25),-fwdZ*1.6+R(-.4,.4),.75,.45);
      }
    }
  }

  /* 双层圣诞飘雪 */
  if(snow&&snow.visible){
    const p=snow.geometry.attributes.position.array;
    for(let i=0;i<p.length/3;i++){
      p[i*3+1]-=snowSpd[i]*dt;
      p[i*3]+=Math.sin(t*.7+i)*.48*dt+dt*.32;
      if(p[i*3+1]<1.6||insideBuilding(p[i*3],p[i*3+2],p[i*3+1])){
        let dx,dz;
        do{dx=Math.random()*130-65;dz=Math.random()*80-40;}while(inBuildingXZ(dx,dz));
        p[i*3]=dx;p[i*3+1]=32+Math.random()*5;p[i*3+2]=dz;
      }
    }
    snow.geometry.attributes.position.needsUpdate=true;
  }
  if(snowFar&&snowFar.visible){
    const p=snowFar.geometry.attributes.position.array;
    for(let i=0;i<p.length/3;i++){
      p[i*3+1]-=snowFarSpd[i]*dt;
      p[i*3]+=Math.cos(t*.5+i)*.32*dt+dt*.22;
      if(p[i*3+1]<1.6||insideBuilding(p[i*3],p[i*3+2],p[i*3+1])){
        let dx,dz;
        do{dx=Math.random()*140-70;dz=Math.random()*90-45;}while(inBuildingXZ(dx,dz));
        p[i*3]=dx;p[i*3+1]=34+Math.random()*5;p[i*3+2]=dz;
      }
    }
    snowFar.geometry.attributes.position.needsUpdate=true;
  }
  /* 持续绚丽流星雨（夜幕 / 晓暮均流畅绽放） */
  starMat.uniforms.uTime.value=tLocal;
  const nightNow=Math.sin(((state.hour-6)/12)*Math.PI)<=0.03;
  const twilight=!nightNow&&(state.hour>=16.8||state.hour<=7.2);
  const starOn=(nightNow||twilight)&&state.stars;
  if(starOn)updateMeteors(dt);
  starMat.uniforms.uOpacity.value=nightNow?.88:.42;
  if(meteors.length){const _mop=nightNow?1.0:.62;for(let i=0;i<meteors.length;i++){const _mm=meteors[i];_mm.u.uOpacity.value=_mop;_mm.pts.visible=starOn&&_mm.state!==0;}}
  stars.visible=starOn;

  /* 空中巡游圣诞老人驯鹿雪橇 + 魔法星尘拖尾 */
  {
    const a=t*.16;
    const nx=Math.cos(a)*29, nz=Math.sin(a)*16-2, ny=16.5+Math.sin(t*.85)*1.15;
    const vx=-Math.sin(a)*29, vz=Math.cos(a)*16;
    flyingSleigh.position.set(nx,ny,nz);
    flyingSleigh.rotation.y=Math.atan2(vx,vz);
    flyingSleigh.rotation.z=-Math.sin(a*2)*.10;
    for(const fr of flyReindeers){
      const gp=Math.sin(t*7.5+fr.phase)*.58;
      fr.deer.userData.legs[0].rotation.x=gp;
      fr.deer.userData.legs[1].rotation.x=gp*.85;
      fr.deer.userData.legs[2].rotation.x=-gp;
      fr.deer.userData.legs[3].rotation.x=-gp*.85;
    }
    if(sleighDustMesh){
      const m=_rMat,sc=_rScale;
      for(let i=0;i<sleighDustN;i++){
        const d=sleighDust[i];
        d.life+=dt*.55;
        if(d.life>=1){
          d.life=0;
