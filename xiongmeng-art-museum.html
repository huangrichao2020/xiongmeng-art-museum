<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>熊萌艺术馆 · 圣诞冰雪特展</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
<meta name="theme-color" content="#060c14" />
<!--构建标记：部署脚本会把它替换成这一版独有的串。
    客户端拿它跟服务端当前在线版本的标记比对，
    一旦不一致就说明「这个标签页打开的是旧版本」，弹提示让用户刷新。-->
<meta name="xm-build" content="__XM_BUILD__" />
<!-- 线上发新版后，各端（安卓 / iOS / 电脑）右上角会自动弹出「立即更新」按钮：
     服务端检测到 index.html 变了就主动推 WS 通知，页面另有一条 30 秒轮询兜底；
     点按钮会通知 Service Worker 更新并带版本号强制拉新页面重载。 -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="熊萌艺术馆" />
<style>
  :root{
    --bg:#060c14;
    --ink:#e9f2f8;
    --muted:#8aa2b5;
    --line:rgba(240,192,110,.22);
    --line-strong:rgba(240,192,110,.45);
    --accent:#f4c56a;
    --accent-warm:#e85d52;
    --glass:rgba(12,18,26,.76);
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
    --han:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--han);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
  /* 禁止长按选中界面文字：手机浏览器/微信内置浏览器长按按钮会弹出
     系统「取词 + 朗读」浮层（几个深色圆圈把文字圈起来，还带个♪图标），
     糊在画面上很难看。整页不需要复制文本，直接全局关掉。 */
  html,body,#stage,body *{
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }
  /* 输入框要保留正常选中/粘贴能力（留言板） */
  input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  /* 手机长按按钮会弹出系统「取词 + 朗读」浮层（几个深色圆圈把按钮文字圈住，
     右下还跟一个♪朗读图标），糊在 3D 画面上很难看。
     user-select:none 挡不住微信/Safari 那套取词（它能穿透到按钮文字），
     所以把按钮上的文字全部改成伪元素生成 ——
     伪元素不是真实文本节点，取词工具扫不到，长按就不会再弹那个气泡。 */
  .wtools button[data-label]::after,
  .wtop button[data-label]::after,
  #w-run[data-label]::after{
    content:attr(data-label);display:inline-block;pointer-events:none;
  }
  .wtools button[data-label],.wtop button[data-label],#w-run[data-label]{
    -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
  }
  html,body{overscroll-behavior:none}
  #stage{position:fixed;inset:0}

  /* 细网格 + 暗角，给整个界面一个“工程台”的底子 */
  #grain{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  #scan{
    position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, rgba(0,0,0,0) 1px 3px);
  }

  .panel{
    background:var(--glass);
    border:1px solid var(--line);
    backdrop-filter:blur(14px) saturate(120%);
    -webkit-backdrop-filter:blur(14px) saturate(120%);
    border-radius:3px;
  }

  /* ---------- 左上：品牌 + 实时读数 ---------- */
  #rail{
    position:fixed;left:12px;top:14px;z-index:29;
    display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    transition:transform .3s cubic-bezier(.2,.8,.3,1);
  }
  /* 收起时只把内容滑走，≡ 圆钮留在屏内（否则整条栏会被推出屏幕，点不到） */
  body.rail-min #railBody{opacity:0;pointer-events:none;transform:translateX(-150px)}
  #railBody{display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:opacity .22s,transform .22s}
  #railToggle{
    width:28px;height:28px;border-radius:50%;
    border:1px solid var(--line);background:rgba(9,16,24,.82);color:var(--muted);
    font-family:var(--mono);font-size:14px;line-height:1;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #railToggle:hover{color:var(--accent);border-color:var(--line-strong)}
  /* 纯净模式下的常驻时间牌：贴在 ≡ 圆钮下方，点它等于展开侧栏。
     有了它，用户一眼能看见"现在是几点"，也知道时间还能切。 */
  #cleanClock{
    display:none;font-family:var(--mono);font-size:10px;letter-spacing:.10em;color:var(--muted);
    padding:4px 8px;background:rgba(9,16,24,.74);border:1px solid var(--line);border-radius:2px;
    cursor:pointer;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  body.clean #cleanClock{display:block}
  #cleanClock:hover{color:var(--accent);border-color:var(--line-strong)}
  #rail .seasons{display:grid;grid-template-columns:repeat(4,32px);gap:5px}
  #rail .seasons button{width:32px;height:32px;padding:0;font-size:13px;border-radius:3px}
  #rail .seasons button small{display:none}
  #rail #hour{width:146px}
  #rail .toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;width:146px}
  #rail .toggles button{padding:6px 4px;font-size:11px;letter-spacing:.04em;border-radius:3px}
  #railState{
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
    padding:5px 9px;background:rgba(9,16,24,.66);border:1px solid var(--line);border-radius:2px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #railState b{color:var(--accent);font-weight:600}
  #railState i{color:var(--accent-warm);font-style:normal}

  /* 季节方块 / 开关按钮：底子与高亮态 */
  #rail .seasons button{
    background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);
    cursor:pointer;font-family:var(--han);letter-spacing:.08em;
    transition:.22s cubic-bezier(.2,.8,.3,1);
  }
  #rail .seasons button.on{
    color:#04121a;background:var(--accent);border-color:var(--accent);font-weight:600;
    box-shadow:0 0 18px -4px rgba(104,208,245,.75);
  }
  #rail .seasons button:hover{border-color:var(--line-strong);color:var(--ink);background:rgba(104,208,245,.08)}
  #rail .toggles button{
    background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);
    cursor:pointer;font-family:var(--han);letter-spacing:.06em;transition:.2s;
  }
  #rail .toggles button.on{color:var(--accent);border-color:rgba(104,208,245,.5);background:rgba(104,208,245,.1)}
  #rail .toggles button:hover{border-color:var(--line-strong);color:var(--ink)}

  /* 时间滑块 */
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(126,180,220,.22);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 10px rgba(104,208,245,.85);cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px rgba(104,208,245,.85);cursor:grab;
  }

  /* ---------- 右下：操作提示 ---------- */
  #hint{
    position:fixed;right:22px;bottom:20px;z-index:20;padding:9px 14px;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
    display:flex;gap:14px;align-items:center;
  }
  #hint kbd{
    font-family:var(--mono);color:var(--ink);border:1px solid var(--line);
    padding:1px 5px;border-radius:2px;margin-right:5px;font-size:9.5px;
  }
  #fps{color:var(--accent)}

  /* ---------- 沉浸视角 ---------- */
  body.fp #hint,body.fp #tip{display:none!important}
  /* 纯净模式：画面上只留操作控件（摇杆 / 跳 / 返回 / 声音），其余 UI 全部隐去。
     注意：#rail 绝不能一起藏 —— 侧栏里就是晨/昼/暮/夜四个时段按钮和 24 小时滑块，
     藏掉等于把整个时间系统废掉，用户再也切不回清晨/黄昏/夜晚。
     改成只收起侧栏内容（body.rail-min），≡ 圆钮和时间牌留在屏上，点一下就展开。 */
  body.clean #info,body.clean #hint,
  body.clean #tip,body.clean #cross,body.clean #dock,body.clean #panel{display:none!important}
  /* 纯净时仍要能走能转头：操作控件不受 clean 影响 */
  body.clean.walk #joystick,body.clean.walk #w-run,
  body.clean.walk #w-back,body.clean.walk #w-sound{display:block!important}
  /* 操作控件（左手摇杆 / 右下跳 / 右上工具）——触屏端常驻，纯净模式也保留 */
  body.walk #joystick,body.walk #w-run,body.walk #w-back,body.walk #w-sound{display:block}
  body.walk.off #joystick,body.walk.off #w-run,body.walk.off #w-back,body.walk.off #w-sound{display:none}
  /* 触屏设备：无论沉浸还是沙盒，摇杆与跳按钮都在（默认纯净也不藏操作） */
  body.touch #joystick,body.touch #w-run{display:block!important}
  #joystick{
    position:fixed;left:22px;bottom:26px;z-index:27;display:none;
    width:138px;height:138px;border-radius:50%;
    border:1.5px solid rgba(160,210,240,.3);
    background:radial-gradient(circle,rgba(12,22,32,.4) 40%,rgba(12,22,32,.16) 100%);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    touch-action:none;
  }
  #joystick::before{
    content:'';position:absolute;inset:41px;border-radius:50%;
    border:1px dashed rgba(160,210,240,.18);
  }
  #stick{
    position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;
    border-radius:50%;background:rgba(190,225,245,.34);
    border:1.5px solid rgba(210,240,255,.55);
    box-shadow:0 3px 14px rgba(0,0,0,.45);
    pointer-events:none;
  }
  #w-run{
    position:fixed;right:30px;bottom:40px;z-index:27;display:none;
    width:78px;height:78px;border-radius:50%;
    background:rgba(14,24,34,.45);border:1.5px solid rgba(160,210,240,.4);
    color:#d6ecf8;font-family:var(--han);font-size:13px;letter-spacing:.14em;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    touch-action:none;cursor:pointer;
  }
  #w-run.hold{background:rgba(104,208,245,.28);border-color:rgba(160,220,250,.8);color:#fff}
  /* 沉浸模式内的圆形工具组（#wtop）已停用：
     它和右上角常驻的 .wtools 位置几乎重合（right 20/top 18 vs right 14/top 14），
     两套一起显示就会叠成一团圆圈 —— 手机端更糟：
     body.touch #wtop{display:flex!important} 用的是 id 选择器，特异性压过了
     body.touch .wtop{display:none!important}，导致触屏端也照样显示。
     现在统一只保留 .wtools（同样的「视角切换 + 声音」功能，胶囊样式不重叠）。
     DOM 节点保留，JS 里的引用不受影响。 */
  .wtop{
    position:fixed;right:20px;top:18px;z-index:27;display:none!important;gap:10px;
  }
  .wtop button{
    width:46px;height:46px;border-radius:50%;
    background:rgba(12,20,28,.5);border:1px solid rgba(160,210,240,.32);
    color:#cfe3f2;font-family:var(--han);font-size:12px;letter-spacing:.06em;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;transition:.18s;
  }
  .wtop button:hover{color:#fff;border-color:rgba(160,220,250,.7);background:rgba(104,208,245,.2)}
  .wtop button.on{color:var(--accent);border-color:rgba(104,208,245,.55)}
  /* 常驻小工具条：纯净模式下也能切视角/开关声音（永远可见，不受 clean 影响） */
  .wtools{
    position:fixed;right:14px;top:14px;z-index:28;display:flex;gap:7px;
  }
  .wtools button{
    min-width:38px;height:34px;padding:0 9px;border-radius:17px;
    background:rgba(10,18,26,.42);border:1px solid rgba(160,210,240,.26);
    color:#bcd6e8;font-family:var(--han);font-size:11.5px;letter-spacing:.04em;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;transition:.18s;
  }
  .wtools button:hover{color:#fff;border-color:rgba(160,220,250,.6);background:rgba(104,208,245,.18)}
  .wtools button.on{color:var(--accent);border-color:rgba(104,208,245,.5)}
  body.touch .wtools{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));gap:5px}
  body.touch .wtools button{min-width:40px;height:38px;padding:0 6px;border-radius:19px;font-size:11.5px}
  /* 联机登录卡片打开时，右上角工具条被卡片压住 → 干脆藏起来 */
  body.mp-login-open .wtools{display:none}
  /* 个人面板展开时同理：它会盖住右上角工具条，直接把工具条收起来 */
  body.mp-open .wtools{display:none}
  /* 触屏：沉浸内的 .wtop 隐藏，统一用常驻 .wtools，避免两套按钮叠在一起 */
  body.touch .wtop{display:none!important}

  /* ── 页面原生录制按钮 ── */
  #w-rec::before{
    content:'';display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#ff5a5a;margin-right:6px;vertical-align:middle;
    box-shadow:0 0 7px rgba(255,90,90,.85);
  }
  #w-rec.rec{color:#ffb0b0;border-color:rgba(255,120,120,.62);background:rgba(96,18,18,.46)}
  #w-rec.rec::before{animation:recblink 1s steps(1,end) infinite}
  @keyframes recblink{0%,100%{opacity:1}50%{opacity:.2}}

  /* 全局提示条 */
  #xmsg{
    position:fixed;left:50%;bottom:74px;transform:translate(-50%,8px);z-index:78;
    padding:9px 16px;border-radius:4px;pointer-events:none;opacity:0;
    font-family:var(--han);font-size:12.5px;color:#eaf4ff;letter-spacing:.02em;
    background:rgba(8,14,22,.9);border:1px solid var(--line-strong);
    box-shadow:0 8px 26px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;
    max-width:86vw;text-align:center;
  }
  #xmsg.show{opacity:1;transform:translate(-50%,0)}

  /* 录完预览兜底（iOS 上部分浏览器不认 download 属性，只能长按保存） */
  #recpv{
    position:fixed;inset:0;z-index:70;display:none;place-items:center;
    background:rgba(4,8,13,.82);backdrop-filter:blur(6px);
    padding:10px;overflow:auto;
  }
  #recpv.show{display:grid}
  #recpv .rpv-box{
    width:min(92vw,560px);padding:14px;border-radius:6px;max-height:94vh;overflow-y:auto;
    background:rgba(10,16,24,.94);border:1px solid var(--line-strong);
    display:flex;flex-direction:column;gap:10px;align-items:center;
  }
  /* 手机上卡片内容很容易比屏幕高（视频 + 说明 + 4 个按钮），
     视频占太高会把「关闭」挤出屏幕外，按钮点不到 → 视频收到 42vh。 */
  #recpv video{width:100%;max-height:42vh;background:#000;border-radius:3px}
  #recpv p{font-family:var(--han);font-size:12px;color:#a9c4d8;text-align:center;line-height:1.7}
  #recpv p b{color:#ffd9a0;font-weight:600}
  #recpv .rpv-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  /* 卡片内的状态行：#xmsg 提示条的 z-index 比遮罩低，保存卡片打开时提示会被盖住，
     「点了没反应」就是这么来的 —— 所以状态必须写在卡片自己里面。 */
  #recpv-status{
    display:none;width:100%;margin:0;padding:7px 10px;border-radius:4px;
    background:rgba(255,180,110,.12);border:1px solid rgba(255,170,110,.34);
    color:#ffe2c4;font-size:12px;line-height:1.6;text-align:left;
  }
  #recpv-status.on{display:block}
  #recpv-status b{color:#ffd08a;font-weight:600}
  #recpv .rpv-acts .primary{
    padding:9px 22px;border-radius:20px;cursor:pointer;font-family:var(--han);font-size:13px;
    background:rgba(255,138,80,.2);border:1px solid rgba(255,170,110,.6);color:#ffe2c4;font-weight:600;
  }
  #recpv .rpv-acts .primary:active{background:rgba(255,138,80,.34)}
  #recpv button{
    padding:7px 20px;border-radius:16px;cursor:pointer;font-family:var(--han);font-size:12px;
    background:rgba(104,208,245,.16);border:1px solid rgba(160,220,250,.45);color:#dff2ff;
  }
  /* ── 触屏端视觉优化 ──
     手机屏像素密度高（1px 扫描线会变摩尔纹），混合模式暗角在 OLED 上发闷，
     所以触屏端去掉扫描线、换成普通 rgba 暗角，并把整体色调提亮一点。 */
  body.touch #scan{display:none!important}
  body.touch #grain{
    mix-blend-mode:normal;
    background:radial-gradient(125% 95% at 50% 44%, rgba(0,0,0,0) 46%, rgba(4,10,18,.34) 100%);
  }
  /* 触屏：右下「跳」按钮更靠边、更好按 */
  body.touch #w-run{right:max(18px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:72px;height:72px}
  body.touch #joystick{left:max(14px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:134px;height:134px}
  /* 牵手按钮贴右边、压在「跳」按钮上方，别跟左下角的虚拟摇杆叠在一起 */
  body.touch #hand-hud{right:max(14px,env(safe-area-inset-right));bottom:max(116px,calc(env(safe-area-inset-bottom) + 108px))}
  /* 手机上按钮做大一档，方便拇指点 */
  body.touch #hand-hud button{padding:12px 18px;font-size:14px}
  #cross{
    position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:26;
    pointer-events:none;opacity:0;transition:opacity .2s;
  }
  #cross::before,#cross::after{
    content:'';position:absolute;background:rgba(220,240,255,.85);
    box-shadow:0 0 6px rgba(104,208,245,.9);
  }
  #cross::before{left:8px;top:2px;width:2px;height:14px}
  #cross::after{left:2px;top:8px;width:14px;height:2px}
  #fphint{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:26;
    display:none;padding:8px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
    color:#cfe3f2;background:rgba(7,12,19,.72);border:1px solid var(--line);border-radius:2px;
  }
  body.fp #fphint{display:block}
  body.fp:not(.clean) #fphint{opacity:1}
  body.clean #fphint{opacity:0}

  /* ---------- 右侧：区域信息面板 ---------- */
  #info{
    position:fixed;right:22px;top:20px;z-index:20;width:320px;
    padding:16px 18px 18px;opacity:0;transform:translateX(16px);pointer-events:none;
    transition:opacity .32s ease,transform .32s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 22px 60px -26px rgba(0,0,0,.95);
  }
  #info.show{opacity:1;transform:none;pointer-events:auto}
  #info .eyebrow{
    font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--accent);
    text-transform:uppercase;margin-bottom:6px;
  }
  #info h2{font-size:16.5px;font-weight:600;letter-spacing:.06em;margin-bottom:12px}
  #info .rows{border-top:1px solid var(--line);margin:0}
  #info .row{
    display:grid;grid-template-columns:76px 1fr;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:12px;line-height:1.62;
  }
  #info .row dt{color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding-top:2px}
  #info .row dd{color:#c4d6e4;margin:0}
  #info .row dd em{font-style:normal;color:var(--accent-warm)}
  #info .close{
    position:absolute;right:12px;top:11px;width:22px;height:22px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer;border-radius:2px;line-height:1;font-size:13px;
    transition:.2s;
  }
  #info .close:hover{color:var(--ink);border-color:var(--line-strong)}

  /* ---------- 底部快捷导览 Dock ---------- */
  #dock{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:21;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:4px;padding:5px 7px;max-width:min(900px,94vw);
    max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center;
    box-shadow:0 18px 50px -24px rgba(0,0,0,.9);
    transition:opacity .3s,transform .3s;
  }
  #dock button{
    padding:6px 8px;background:rgba(255,255,255,.04);border:1px solid var(--line);
    color:var(--muted);border-radius:2px;cursor:pointer;font-family:var(--han);
    font-size:11px;letter-spacing:.03em;white-space:nowrap;transition:.2s;
  }
  #dock button:hover{color:var(--ink);border-color:var(--line-strong);background:rgba(104,208,245,.1)}
  #dock button.on{color:#04121a;background:var(--accent);border-color:var(--accent);font-weight:600}
  body.clean #dock{opacity:0;pointer-events:none;transform:translate(-50%,12px)}

  /* ---------- 悬停提示 ---------- */
  #tip{
    position:fixed;z-index:30;pointer-events:none;padding:4px 10px;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#dbeefb;
    background:rgba(9,16,24,.88);border:1px solid var(--line-strong);border-radius:2px;
    opacity:0;transition:opacity .16s;white-space:nowrap;transform:translateY(-2px);
  }
  #tip::before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;background:var(--accent)}

  /* ---------- 载入 ---------- */
  #boot{
    position:fixed;inset:0;z-index:60;background:#05090f;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:opacity .7s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #boot .t{font-size:14px;letter-spacing:.42em;color:var(--muted)}
  #boot .bar{width:170px;height:1px;background:rgba(126,180,220,.18);position:relative;overflow:hidden}
  #boot .bar i{position:absolute;inset:0;width:38%;background:var(--accent);
    animation:slide 1.15s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}

  @media (max-width:900px){
    #info{left:22px;right:22px;top:56px;bottom:auto;width:auto}
    #hint{display:none}
  }
  /* 窄屏：Dock 缩窄并可横向滚动，沉浸时抬到摇杆上方，别和摇杆/跑按钮叠在一起 */
  @media (max-width:560px){
    #dock{max-width:calc(100vw - 16px);overflow-x:auto;padding:4px 5px;gap:4px}
    #dock button{padding:6px 8px;font-size:10.5px;letter-spacing:.02em}
    body.fp #dock{bottom:152px}
  }

  /* ---------- 游乐园留言板 · 蛋仔派对风格 ---------- */
  /* 蛋仔派对的 UI：圆润无锐角、糖果高饱和色、软阴影、圆鼓鼓的按钮 */
  #gb-modal{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(38,26,54,.55);backdrop-filter:blur(7px);padding:16px;
  }
  #gb-modal.show{display:flex}
  #gb-box{
    width:min(820px,96vw);height:min(540px,88vh);display:flex;flex-direction:column;
    background:linear-gradient(180deg,#fff8ec 0%,#ffeede 62%,#ffe2e6 100%);
    border:4px solid #ffffff;border-radius:34px;
    box-shadow:0 26px 60px rgba(60,30,70,.45),0 0 0 3px rgba(255,216,77,.75);
    color:#5a4436;overflow:hidden;font-family:var(--han);
  }
  #gb-head{
    display:flex;align-items:center;justify-content:space-between;padding:13px 18px;
    background:linear-gradient(90deg,#ffd84d 0%,#ffb3c8 52%,#a8e6d4 100%);
    border-bottom:4px solid #ffffff;
  }
  #gb-head .title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;color:#7a4a1e;
    text-shadow:0 2px 0 rgba(255,255,255,.85)}
  #gb-head .cnt{font-size:11px;font-family:var(--mono);color:#8a5a2e;background:rgba(255,255,255,.78);
    padding:3px 11px;border-radius:14px;font-weight:700}
  #gb-head .acts{display:flex;align-items:center;gap:8px}
  .gb-btn{
    padding:7px 14px;border-radius:20px;border:2px solid rgba(122,74,30,.16);
    background:#ffffff;color:#7a4a1e;cursor:pointer;font-size:12px;font-weight:700;transition:.18s;
    box-shadow:0 3px 0 rgba(122,74,30,.16);
  }
  .gb-btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 rgba(122,74,30,.18)}
  .gb-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(122,74,30,.16)}
  .gb-btn.pri{background:#ff7aa2;border-color:#ff5c8d;color:#fff;text-shadow:0 1px 0 rgba(190,40,90,.4);
    box-shadow:0 4px 0 #e0507d}
  .gb-btn.pri:hover{background:#ff8fb1}
  .gb-btn.dan{border-color:#ffb3b3;color:#e05a5a}
  .gb-btn.dan:hover{background:#ffe4e4}
  #gb-body{flex:1;display:grid;grid-template-columns:270px 1fr;min-height:0;gap:12px;padding:12px}
  #gb-list{
    border-radius:22px;overflow-y:auto;background:rgba(255,255,255,.72);
    border:3px solid #fff;box-shadow:inset 0 2px 8px rgba(140,90,60,.10);
  }
  .gb-item{
    padding:11px 14px;border-bottom:2px dashed rgba(190,140,90,.24);cursor:pointer;transition:.15s;
  }
  .gb-item:hover{background:rgba(255,216,77,.22)}
  .gb-item.on{background:linear-gradient(90deg,#ffe9a8,#fff2cd);border-left:5px solid #ff7aa2;padding-left:9px}
  .gb-item .row1{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:4px}
  .gb-item .from{font-weight:800;color:#e0507d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
  .gb-item .time{font-size:10px;font-family:var(--mono);color:#a98a68}
  .gb-item .prev{font-size:12px;color:#7d6a58;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #gb-main{padding:14px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;gap:14px;
    border-radius:22px;background:rgba(255,255,255,.55)}
  .gb-letter{
    background:#fffdf6;color:#5a4436;border-radius:24px;
    padding:18px 20px;box-shadow:0 6px 0 rgba(190,140,90,.18),inset 0 0 0 3px #fff;
    border:3px solid #ffd84d;flex:1;display:flex;flex-direction:column;gap:12px;
  }
  .gb-letter .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;color:#a98a68;
    border-bottom:2px dashed rgba(190,140,90,.30);padding-bottom:8px}
  .gb-letter .txt{font-size:17px;line-height:1.7;word-break:break-word;flex:1}
  .gb-letter .ops{display:flex;gap:8px;justify-content:flex-end}
  .gb-form{display:flex;flex-direction:column;gap:10px;flex:1}
  .gb-form label{font-size:12px;color:#8a6b4e}
  .gb-form input,.gb-form textarea{
    width:100%;box-sizing:border-box;background:#fffdf6;border:3px solid #ffd84d;
    border-radius:18px;padding:10px 13px;color:#5a4436;font-size:13px;font-family:var(--han);outline:none;
    box-shadow:inset 0 2px 4px rgba(190,140,90,.10);
  }
  .gb-form input:focus,.gb-form textarea:focus{border-color:#ff7aa2;box-shadow:0 0 0 4px rgba(255,122,162,.22)}
  .gb-form textarea{resize:none;height:86px}
  .gb-form .bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a98a68}
  .gb-err{color:#e0507d;font-size:12px;min-height:16px;font-weight:700}
  /* ---------- 盖楼回复（帖子式） ---------- */
  .gb-item .badge{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 8px;
    border-radius:11px;background:#ff7aa2;color:#fff;font-size:10px;font-weight:800;letter-spacing:.2px}
  .gb-item .badge.zero{background:rgba(190,140,90,.22);color:#a98a68}
  .gb-thread{margin-top:14px;border-top:2px dashed rgba(190,140,90,.32);padding-top:10px;
    display:flex;flex-direction:column;gap:8px}
  .gb-thread .ttl{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:12px;color:#8a6b4e;font-weight:800}
  .gb-thread .ttl .hint{font-weight:400;color:#b39a7c;font-size:11px}
  .gb-rl{background:#fffdf6;border:2px solid rgba(190,140,90,.28);border-radius:16px;padding:8px 12px}
  .gb-rl .hd{display:flex;align-items:center;gap:8px;font-size:11px;color:#a98a68;margin-bottom:3px}
  .gb-rl .hd b{color:#e0507d;font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gb-rl .hd .fl{font-family:var(--mono);color:#b08a5e}
  .gb-rl .hd .act{margin-left:auto;font-size:11px;color:#a9701f;cursor:pointer;font-weight:800;
    background:rgba(255,216,77,.42);border-radius:11px;padding:2px 9px;border:1px solid rgba(200,150,60,.40)}
  .gb-rl .hd .act:hover{background:#ffe08a}
  .gb-rl .bd{font-size:13px;color:#5a4436;line-height:1.65;word-break:break-word}
  .gb-rl.child{background:#fff8ec;border-left:4px solid #ffd84d;margin-left:14px}
  .gb-rl.child .bd{font-size:12.5px;color:#6a5546}
  .gb-rl .kids{margin-top:6px;display:flex;flex-direction:column;gap:6px}
  .gb-rep{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:2px}
  .gb-rep input{background:#fffdf6;border:3px solid #ffd84d;border-radius:18px;padding:8px 12px;
    color:#5a4436;font-size:12px;font-family:var(--han);outline:none}
  .gb-rep input:focus{border-color:#ff7aa2;box-shadow:0 0 0 3px rgba(255,122,162,.20)}
  .gb-rep input.who{width:104px;flex:none}
  .gb-rep input.txt{flex:1;min-width:150px}
  .gb-rep .cnt{font-size:11px;color:#a98a68;white-space:nowrap;padding-bottom:9px}
  .gb-empty{font-size:12px;color:#b39a7c;padding:8px 4px}
  @media (max-width:680px){
    #gb-body{grid-template-columns:1fr;grid-template-rows:175px 1fr}
  }

  /* ---------- 盲盒拆礼弹窗 ---------- */
  #gift-modal{
    position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;
    background:rgba(4,9,16,.66);backdrop-filter:blur(7px);padding:16px;
  }
  #gift-modal.show{display:flex}
  #gift-card{
    width:min(390px,92vw);background:linear-gradient(180deg,#162235,#1b1724);
    border:1px solid rgba(255,216,110,.55);border-radius:10px;padding:22px 22px 18px;
    box-shadow:0 22px 54px rgba(0,0,0,.7);color:#f5f8fc;text-align:center;font-family:var(--han);
  }
  #gift-rarity{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-family:var(--mono);font-weight:700;margin-bottom:8px}
  #gift-rarity.SSR{background:#f59e0b;color:#1a1004}
  #gift-rarity.SR{background:#a855f7;color:#fff}
  #gift-rarity.R{background:#38bdf8;color:#082032}
  #gift-card h3{margin:4px 0 8px;font-size:19px;color:#ffe7a6}
  #gift-desc{font-size:13px;color:#bfd2e6;line-height:1.6;margin:0 0 14px}
  #gift-status{font-size:12px;color:#7ee787;min-height:18px;margin-bottom:10px}
  #gift-card .btns{display:flex;gap:10px;justify-content:center}

  /* ---------- 圣诞观光小火车 HUD ---------- */
  #train-hud{
    position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:28;
    display:none;align-items:center;gap:10px;padding:7px 14px;border-radius:20px;
    background:rgba(16,26,40,.86);border:1px solid rgba(244,197,106,.55);
    backdrop-filter:blur(6px);color:#fff3d1;font-size:12px;font-family:var(--han);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #train-hud.show{display:flex}
  /* 乘坐中：按用户要求不显示任何说明文案，提示条里只留一个下车按钮 */
  #train-hud.bare #train-msg{display:none}
  #train-hud.bare{padding:5px 7px;gap:0}
  /* 文案去掉后按钮就是唯一的下车入口（手机上没有 E 键），按钮放大一档好点 */
  #train-hud.bare #train-btn{padding:9px 22px;font-size:14px;border-radius:16px}
  #train-btn{
    padding:4px 11px;border-radius:12px;border:none;background:#e8b653;color:#1a1104;
    font-weight:700;font-size:12px;cursor:pointer;
  }
  #train-btn:hover{background:#ffd275}
  /* ---------- 牵手 HUD ----------
     不要横在屏幕中间的大字条：它挡住画面正中，玩家一眼就看到一坨字。
     改成贴右边缘的一颗小按钮，只有必要的字（小号名字条）才出现。 */
  #hand-hud{
    position:fixed;right:14px;bottom:118px;z-index:29;
    display:none;flex-direction:column;align-items:flex-end;gap:8px;
    user-select:none;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  #hand-hud.show{display:flex}
  #hand-name{
    display:none;max-width:132px;padding:4px 10px;border-radius:12px;
    background:rgba(16,26,40,.88);border:1px solid rgba(244,197,106,.45);
    color:#fff3d1;font-size:11px;font-weight:700;line-height:1.4;text-align:right;
  }
  #hand-name.on{display:block}
  #hand-btns{display:none;flex-direction:column;gap:8px;align-items:flex-end}
  #hand-btns.on{display:flex}
  #hand-hud button{
    border:none;border-radius:22px;padding:10px 16px;font-size:13px;font-weight:800;
    cursor:pointer;color:#fff;
  }
  #hand-hud button:active{transform:translateY(1.5px)}
  #hand-act{background:linear-gradient(180deg,#ffb35c,#f09230);box-shadow:0 3px 0 #c96f1c;font-size:14px;padding:11px 18px}
  #hand-yes{background:linear-gradient(180deg,#8ee8b4,#43c47c);box-shadow:0 3px 0 #2e9a5f}
  #hand-no{background:linear-gradient(180deg,#ff9db4,#f2708f);box-shadow:0 3px 0 #cf5271}
  /* ---------- 版本过期提示（这个标签页打开的是旧页面）---------- */
  #xm-upd{
    position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:9100;
    display:none;align-items:center;gap:7px;padding:5px 6px 5px 11px;border-radius:18px;
    background:linear-gradient(180deg,#ffd9a0,#ffb35c);color:#4a2c06;
    font-size:11.5px;font-weight:800;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    box-shadow:0 6px 18px rgba(20,40,80,.30),0 2px 0 rgba(255,255,255,.55) inset;
    user-select:none;white-space:nowrap;
  }
  #xm-upd.on{display:flex}
  #xm-upd button{
    border:none;border-radius:14px;padding:5px 11px;font-size:11px;font-weight:800;cursor:pointer;
    background:#fff;color:#a8570c;box-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  #xm-upd button:active{transform:translateY(1px)}
  /* 手机上按钮要够大才好按（iOS 建议 ≥44px 高），但仍然贴边不挡画面 */
  @media (pointer:coarse),(hover:none){
    #xm-upd{right:calc(10px + env(safe-area-inset-right,0px));padding:7px 7px 7px 13px;font-size:12.5px}
    #xm-upd button{padding:9px 14px;font-size:12.5px;border-radius:15px}
  }
  /* ---------- FPV 穿越机特技模式 OSD 抬头显示 ---------- */

  #fpv-top-l{position:absolute;top:32px;left:36px;display:flex;flex-direction:column;gap:4px;font-size:12px}
  #fpv-rec{color:#ff4d5e;font-weight:700;letter-spacing:1px}
  #fpv-top-r{position:absolute;top:32px;right:96px;text-align:right;display:flex;flex-direction:column;gap:4px;font-size:12px}
  #fpv-horizon{
    position:absolute;top:50%;left:50%;width:140px;height:140px;margin:-70px 0 0 -70px;

    background:rgba(8,18,30,.84);border:1px solid rgba(110,228,255,.55);backdrop-filter:blur(6px);
    box-shadow:0 10px 28px rgba(0,0,0,.55);font-family:var(--han);font-size:12px;white-space:nowrap;

  .fpv-btn{
    padding:5px 12px;border-radius:14px;border:1px solid rgba(120,235,255,.45);
    background:rgba(40,180,220,.22);color:#e6fbff;font-weight:700;font-size:12px;cursor:pointer;transition:.15s;

  .fpv-btn:hover{background:rgba(60,210,255,.42)}
  .fpv-btn.exit{background:rgba(235,85,85,.25);border-color:rgba(255,120,120,.55);color:#ffd6d6}
  /* ⚠ 这里原来有一段重复的 #fphint 规则和一个多余的 } —— 那对多余的括号会让
     后面所有 CSS 规则被浏览器当成「嵌套在非法块里」整段丢弃（多人 UI 的样式
     就是这么消失的）。#fphint 在本文件前部已有完整定义，重复的那份已删除。 */

  /* ══ 多人联机 UI ══ */
  #mp-login{
    position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 32%,rgba(40,60,100,.30) 0%,rgba(10,16,30,.62) 80%);
    backdrop-filter:blur(2px);transition:opacity .35s;
  }
  #mp-login.hide{opacity:0;pointer-events:none}
  .mp-card{
    width:min(352px,calc(100vw - 32px));padding:26px 24px 22px;border-radius:26px;
    background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(240,246,255,.95));
    border:4px solid #fff;
    box-shadow:0 18px 50px rgba(20,40,80,.4);
    color:#2b3242;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;

function matKey(o){

   同一材质合并成一个 mesh，视觉完全不变，调用量能降一个量级。 */
function mergeGeos(list,indexed){

     原来一律 toNonIndexed 展开，顶点数直接翻倍 —— 合批一次要复制几百 MB

      if(ch.isMesh){
        if(Array.isArray(ch.material))continue;       // 多材质网格没法合成一个，保留原样
        const key=ch.material.uuid+'|'+(ch.castShadow?1:0)+'|'+ch.renderOrder;
        if(!buckets.has(key))buckets.set(key,{mat:ch.material,cast:ch.castShadow,ro:ch.renderOrder,list:[],idx:0,n:0});
        const b=buckets.get(key);
        b.list.push(ch);
        if(ch.geometry.index)b.idx++;
        b.n++;
        victims.push(ch);
      }else walk(ch);
    }
  };
  walk(root);
  for(const v of victims){ if(v.parent)v.parent.remove(v); v.geometry.dispose(); }
  const tmp=new THREE.Matrix4();
  for(const b of buckets.values()){
    /* 一个桶里全是有索引的走"拼索引"（省一半顶点数据），
       混着非索引的才统一展开（宁可多一倍，也不能画错三角形） */
    const allIdx=b.idx===b.n;
    const prepped=[];
    for(const ch of b.list){
      const g0=ch.geometry;
      let g;
      if(allIdx)g=g0.clone();
      else if(g0.index)g=g0.toNonIndexed();
      else g=g0.clone();
      g.applyMatrix4(tmp.multiplyMatrices(inv,ch.matrixWorld));
      prepped.push(g);
    }
    const mesh=new THREE.Mesh(mergeGeos(prepped,allIdx),b.mat);
    mesh.castShadow=b.cast;mesh.receiveShadow=true;mesh.renderOrder=b.ro;
    mesh.userData.tag=root.userData.tag;
    root.add(mesh);
    for(const g of prepped)g.dispose();
  }
}

/* ══════════════════════════════════════════════════════════════════════
   自动静态合批（开场做一次运动侦测，只合并「确认不动」的零件）
   ──────────────────────────────────────────────────────────────────────
   实测瓶颈不在像素量，而在 draw call：
     · 把渲染分辨率砍到 1/4，帧率只快 1 帧（填充率根本不是瓶颈）；
     · 全景机位（摩天轮顶 / 热气球）一眼望出去 5000+ draw call，帧率直接腰斩。
   所以真正该砍的是 call —— 场景里 6000 多个零件，每个零件都是一次 draw call。

   做法：
     1) 开场 1.6 秒内连续采样每个节点的「本地矩阵」，变过的节点 = 动画节点；
     2) 动画节点标 keep —— 它整棵子树不会被并进父级（走路/旋转/摇摆全部照旧）；
     3) 其余静态零件按材质合并成少数几个 mesh（视觉一模一样，零件少了）。
   合并只发生在「同一个物体内部」或「同一组内部」，绝不跨动画边界。
   ══════════════════════════════════════════════════════════════════════ */
const _autoMerge={phase:0,t0:0,snap:null,queue:null};
function _mergeSnap(){
  const map=new Map();
  scene.updateMatrixWorld(true);
  scene.traverse(o=>{ map.set(o.id,o.matrix.elements.join(',')); });
  return map;
}
function _autoMergeTick(){
  if(_autoMerge.phase===0){ _autoMerge.snap=_mergeSnap(); _autoMerge.phase=1; _autoMerge.t0=performance.now(); return; }
  if(_autoMerge.phase===1){
    /* 检测窗口：原来 1600ms 白等（动画都是连续动的，1 秒内矩阵必变）。
       窗口越长，开场那段"没合批、帧率最差"的空档就越长 —— 用户体感就是卡。 */
    if(performance.now()-_autoMerge.t0<900)return;
    _autoMerge.phase=2;
    const now=_mergeSnap();
    const byId=new Map();
    scene.traverse(o=>byId.set(o.id,o));
    /* 1) 动过的节点 = 动画节点，标 keep：整棵子树不参与向上合并 */
    for(const [id,m] of now){
      const old=_autoMerge.snap.get(id);
      if(old!==undefined&&old!==m){ const o=byId.get(id); if(o)o.userData.keep=true; }
    }
    /* 2) 顶层组排队合批（一帧只合一个组，把一次性长卡顿摊成几帧小卡顿） */
    _autoMerge.queue=scene.children.filter(g=>g&&g.isObject3D&&!(g.userData&&g.userData.keep));
    return;
  }
  if(_autoMerge.phase===2){
    /* 合批前的全场物件快照（只在 ?audit=1 时记录）：
       合批会把同材质的零件并成一个大 mesh，之后再想查「某个东西挡在马路上」
       就查不出来了 —— 合并后的包围盒大得没法用。 */
    if(location.search.indexOf('audit')>=0&&!window.__xmPreMerge){
      try{
        scene.updateMatrixWorld(true);
        const list=[];
        scene.traverse(o=>{
          if(!o.isMesh||!o.geometry)return;
          if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
          const b=o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
          const pt=[];let q=o;for(let i=0;i<4&&q;i++){pt.push((q.userData&&q.userData.tag)||q.type);q=q.parent;}
          list.push({tag:(o.userData&&o.userData.tag)||'',nm:o.name||'',
            gt:o.geometry.type,chain:pt.join('<'),inst:o.isInstancedMesh?o.count:0,
            mn:[+b.min.x.toFixed(2),+b.min.y.toFixed(2),+b.min.z.toFixed(2)],
            mx:[+b.max.x.toFixed(2),+b.max.y.toFixed(2),+b.max.z.toFixed(2)],
            c:(o.material&&o.material.color)?'#'+o.material.color.getHexString():'',
            v:o.geometry.attributes.position.count});
        });
        window.__xmPreMerge=list;
      }catch(e){window.__xmPreMergeError=String(e);}
    }
    const q=_autoMerge.queue;
    if(q&&q.length){
      /* 一帧只合一组是个坑：场景顶层有 178 组，合批本身只要 124ms，
         但一帧一组 = 178 帧 = 6 秒多的连续卡顿（实测帧率全程 29~31，
         迟迟上不去）。改成按时间预算合：一帧最多花 12ms，
         178 组十帧之内合完，卡顿从 6 秒压到 0.3 秒。 */
      const _t0=performance.now();
      while(q.length && performance.now()-_t0<12){
        const g=q.shift();
        const _g0=performance.now();
        try{ mergeStatic(g); }catch(e){}
        (_autoMerge.log||(_autoMerge.log=[])).push({
          tag:(g.userData&&g.userData.tag)||g.type||'?',kids:g.children.length,
          ms:Math.round(performance.now()-_g0)});
      }
      return;
    }
    _autoMerge.phase=3;
    /* 合批后阴影贴图重算一次（合并前后投影一致，重算更保险） */
    renderer.shadowMap.needsUpdate=true;
  }
}

/* ════════════════════════════════════════════════════════════
   1. 渲染器 / 场景 / 相机（高画质直出 + 极速半分辨率泛光管线）
   ════════════════════════════════════════════════════════════ */
const host=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',stencil:false});
/* ── 渲染分辨率分端策略 ──
   手机 DPR 通常是 2~3，1.55 的像素比在 6.7 寸屏上意味着渲染 ~3800×2000，
   再叠加 Bloom 的多级全屏 pass，填充率直接爆掉 → 掉帧、发热。
   触屏设备压到 1.15（画面依然锐利，渲染量降到桌面的 ~55%），
   并把泛光降到 0.35 倍分辨率，再配合阴影降频，手机上才跑得动。 */
const _forceMobile=new URLSearchParams(location.search).has('mobile');
const IS_TOUCH_DEV=_forceMobile||('ontouchstart' in window)||(navigator.maxTouchPoints>0)||innerWidth<820;
/* ── 渲染分辨率：按「渲染像素总量」封顶，不再粗暴砍 DPR ──
   旧策略移动端固定 1.15、低画质档 0.92（甚至低于 CSS 像素的 1 倍），
   在 iPhone DPR=3 屏上等于把画面放大 2.6~3.3 倍 → 整屏发糊 + 像素块。
   现按像素预算换算：iPhone 按 2x 渲染（原生像素的 44%，总负载仍只有桌面的 ~1/4），
   低画质档下限锁死 1.0，绝不再出现 <1 的马赛克。 */
const _dprRaw=Math.max(1,devicePixelRatio||1);
const _pxBudget=IS_TOUCH_DEV?2.1e6:6.2e6;
const _dprFit=Math.sqrt(_pxBudget/Math.max(1,innerWidth*innerHeight));
const HI_DPR=Math.max(1,Math.min(_dprRaw,IS_TOUCH_DEV?2:1.55,_dprFit));
const LO_DPR=Math.max(1,Math.min(HI_DPR,IS_TOUCH_DEV?1.25:1.05));
renderer.setPixelRatio(HI_DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
renderer.shadowMap.needsUpdate=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=IS_TOUCH_DEV?1.18:1.12;
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0c192c,0.0022);

/* 竖屏时垂直 FOV 放大，补偿被压扁的横向视野（移动端 3D 常规做法） */
function fovForAspect(){
  const a=innerWidth/innerHeight;
  if(!IS_TOUCH_DEV)return 60;
  if(a<0.62)return 78;      // 极窄竖屏
  if(a<0.85)return 70;      // 常规竖屏
  return 62;                // 横屏 / 平板
}
const camera=new THREE.PerspectiveCamera(fovForAspect(),innerWidth/innerHeight,.1,700);
camera.position.set(26,19,28);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.055;
controls.minDistance=11;controls.maxDistance=95;
controls.maxPolarAngle=1.44;controls.minPolarAngle=.18;
/* 触屏端沙盒：相机完全由 fp.yaw/pitch + 自管半径接管，
   OrbitControls 在触屏端整体停用（避免双重旋转 / 抢 pointer） */

const HOME={pos:camera.position.clone(),tgt:controls.target.clone()};

/* ── 后期：日系二次元电影感三渲二管线 (2x MSAA Render -> 柔化细描边&新海诚调色 -> 柔和Bloom -> ACES) ── */
/* 移动端同样开 2x MSAA：composer 走 RenderTarget，renderer 的 antialias:true 对它无效，
   触屏关 MSAA = 零抗锯齿，斑马线 / 栏杆 / 远景轮廓全是硬毛刺。
   像素比提到 2x 后总渲染负载仍只有桌面的 ~1/4，2x MSAA 的带宽开销吃得下。 */
const _msaaSamples=Math.min(2,renderer.capabilities.maxSamples||2);
const _composerRT=new THREE.WebGLRenderTarget(Math.max(1,Math.round(innerWidth*HI_DPR)),Math.max(1,Math.round(innerHeight*HI_DPR)),{type:THREE.HalfFloatType,samples:_msaaSamples});
const composer=new EffectComposer(renderer,_composerRT);
composer.addPass(new RenderPass(scene,camera));
const animeOutlineShader={
  uniforms:{
    tDiffuse:{value:null},
    uRes:{value:new THREE.Vector2(Math.max(1,innerWidth*HI_DPR),Math.max(1,innerHeight*HI_DPR))},
    uHQ:{value:1.0},
    uSat:{value:1.05}   /* 微缩景观的饱和度要比现实略高一点，才像摆在桌上的模型 */
  },
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform float uHQ;
    uniform float uSat;
    varying vec2 vUv;
    float luma(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}
    void main(){
      vec2 tx=1.0/uRes;
      vec4 base=texture2D(tDiffuse,vUv);
      vec3 cTl=texture2D(tDiffuse,vUv+vec2(-tx.x, tx.y)).rgb;
      vec3 cTm=texture2D(tDiffuse,vUv+vec2( 0.0,  tx.y)).rgb;
      vec3 cTr=texture2D(tDiffuse,vUv+vec2( tx.x, tx.y)).rgb;
      vec3 cMl=texture2D(tDiffuse,vUv+vec2(-tx.x, 0.0)).rgb;
      vec3 cMr=texture2D(tDiffuse,vUv+vec2( tx.x, 0.0)).rgb;
      vec3 cBl=texture2D(tDiffuse,vUv+vec2(-tx.x,-tx.y)).rgb;
      vec3 cBm=texture2D(tDiffuse,vUv+vec2( 0.0, -tx.y)).rgb;
      vec3 cBr=texture2D(tDiffuse,vUv+vec2( tx.x,-tx.y)).rgb;
      float tl=luma(cTl),tm=luma(cTm),tr=luma(cTr);
      float ml=luma(cMl),mr=luma(cMr);
      float bl=luma(cBl),bm=luma(cBm),br=luma(cBr);
      float gx=-tl-2.0*ml-bl+tr+2.0*mr+br;
      float gy=-tl-2.0*tm-tr+bl+2.0*bm+br;
      // 局部微对比度（轻量化 Cavity AO 质感）+ 轻柔轮廓墨线
      vec3 avgCol=(cTl+cTm+cTr+cMl+cMr+cBl+cBm+cBr)*0.125;
      float avgL=(tl+tm+tr+ml+mr+bl+bm+br)*0.125;
      float edge=smoothstep(0.32,0.68,sqrt(gx*gx+gy*gy));
      float centerL=luma(base.rgb);
      float edgeMask=smoothstep(0.06,0.18,centerL)*(1.0-smoothstep(0.70,1.00,centerL));
      vec3 ink=vec3(0.08,0.10,0.18);
      vec3 col=mix(base.rgb,ink,edge*edgeMask*0.16);
      col*=(1.0+clamp((centerL-avgL)*0.28,-0.08,0.08));
      // UE5 电影级高光柔化肩部曲线 (Filmic Highlight Shoulder) + 新海诚/光遇冷暖分级：
      // 仅对接近过曝(>0.68)的强光地面做丝滑软膝压缩防死白，中低亮度与主灯光保持璀璨通透
      float g=luma(col);
      vec3 hiShoulder=col/(vec3(1.0)+max(col-vec3(0.68),vec3(0.0))*0.48);
      col=mix(col,hiShoulder,smoothstep(0.62,0.96,g));
      g=luma(col);
      vec3 shinkaiShadow=mix(col,col*vec3(0.80,0.90,1.20),(0.38+0.12*uHQ)*(1.0-smoothstep(0.04,0.44,g)));
      vec3 shinkaiWarm=mix(shinkaiShadow,shinkaiShadow*vec3(1.08,1.02,0.91),smoothstep(0.46,0.95,g)*(0.40+0.14*uHQ));
      col=mix(vec3(g),shinkaiWarm,1.12+0.06*uHQ);
      if(uHQ>0.5){
        // 高画质抗闪烁柔光滤镜：采用 9 邻域预滤波均值稳定提取高光，彻底消除移动时细小路灯亚像素闪烁
        col=max(vec3(0.0),(col-0.010)*1.035);
        float filteredL=mix(centerL,avgL,0.68);
        float pureLight=smoothstep(0.82,0.98,filteredL);
        col+=max(avgCol-vec3(0.74),vec3(0.0))*vec3(1.12,0.96,0.78)*pureLight*0.22;
      }
      float vig=1.0-smoothstep(0.38,0.95,length(vUv-vec2(0.5)))*(0.12+0.03*uHQ);
      col*=vig;
      /* 全局饱和度：夜景 ACES + 冷光会把彩度洗掉，录制素材时可整体拉回来 */
      float lum=dot(col,vec3(0.299,0.587,0.114));
      col=mix(vec3(lum),col,uSat);
      gl_FragColor=vec4(col,base.a);
    }
  `
};
const animePass=new ShaderPass(animeOutlineShader);
composer.addPass(animePass);
/* ── 半分辨率 (0.5x) 抗闪烁光遇柔光泛光管线：
   相比 0.25x 采样精度提升 4 倍，彻底解决移动视角时远处路灯跨越低清纹素引起的闪烁 ── */
const BLOOM_SCALE=0.5;
const bloom=new UnrealBloomPass(new THREE.Vector2(Math.max(64,Math.round(innerWidth*BLOOM_SCALE)),Math.max(64,Math.round(innerHeight*BLOOM_SCALE))),.26,.68,.84);
const _bloomSetSize=bloom.setSize.bind(bloom);
bloom.setSize=(w,h)=>_bloomSetSize(Math.max(64,Math.round(w*BLOOM_SCALE)),Math.max(64,Math.round(h*BLOOM_SCALE)));
composer.addPass(bloom);
composer.addPass(new OutputPass());
composer.setPixelRatio(renderer.getPixelRatio());
/* 所有像素比切换统一走这里：animePass 的 Sobel 描边核按 uRes 采样，
   像素比一变就必须同步，否则描边核被拉大 → 额外一层毛刺。 */
function applyDpr(r){
  renderer.setPixelRatio(r);
  composer.setPixelRatio(r);
  if(animePass&&animePass.uniforms&&animePass.uniforms.uRes){
    animePass.uniforms.uRes.value.set(Math.max(1,innerWidth*r),Math.max(1,innerHeight*r));
  }
}

/* ── 灯光（冬夜清澈天光补色，消除灰雾感，保持夜景高对比通透度） ─────────── */
const ambient=new THREE.AmbientLight(0x324966,.46); scene.add(ambient);
const hemi=new THREE.HemisphereLight(0x5c82b0,0x162230,.62); scene.add(hemi);

   暖色实用光负责「照亮」，冷色背光负责「勾边」，暗部才不会糊成一片死黑。

   现在从西北后方低角度打过来，所有物体的背侧会有一道冷蓝轮廓。 */

moon.position.set(-58,26,-48);
scene.add(moon);scene.add(moon.target);
moon.target.position.set(0,3,10);

// 通用：博物馆暖金画框画作（挂墙 / 立面用）
function makeFramedArt(w,h,tex,opts={}){
  const g=new THREE.Group();
  const frameM=M(opts.frameCol||0xd4a852,{roughness:.36,metalness:.55,flatShading:false});
  const matM=M(opts.matCol||0xf4eee4,{roughness:.88,flatShading:false});
  add(g,BX(w+.18,h+.18,.07),frameM,0,0,0);
  add(g,BX(w+.06,h+.06,.082),matM,0,0,.004);
  const artMat=new THREE.MeshStandardMaterial({
    map:tex,emissiveMap:opts.glow?tex:null,emissive:opts.glow?0xffffff:0x000000,
    emissiveIntensity:opts.glow||0,roughness:.42,metalness:.05
  });
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(w,h),artMat);
  pl.position.z=.049;g.add(pl);
  return g;
}

// 通用：户外覆雪暖光立式打卡画框灯箱（支持单面或双面，带底座、圣诞花环与头顶雪冠）
function makePhotoMonument(w,h,tex,opts={}){
  const g=new THREE.Group();
  const bodyM=M(0x232b34,{roughness:.52,metalness:.55,flatShading:false});
  const trimM=M(0xd6a954,{roughness:.35,metalness:.65,flatShading:false});
  const baseH=opts.baseH||.36, cy=baseH+h*.5+.14;
  add(g,BX(w+.46,baseH,.64),M(0x2b333d,{roughness:.68,metalness:.35}),0,baseH*.5,0);
  add(g,BX(w+.52,.07,.70),snowCapM,0,baseH+.035,0);
  add(g,BX(w+.28,h+.28,.20),bodyM,0,cy,0);
  add(g,BX(w+.34,h+.34,.12),trimM,0,cy,0);
  addNS(g,BX(w+.42,.12,.32),snowCapM,0,cy+h*.5+.19,0);
  const pMat=new THREE.MeshStandardMaterial({
    map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:opts.glow||.55,roughness:.38
  });
  const front=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pMat);
  front.position.set(0,cy,.106);g.add(front);
  if(opts.double){
    const back=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pMat);
    back.position.set(0,cy,-.106);back.rotation.y=Math.PI;g.add(back);
  }
  if(opts.wreath!==false){
    const wr=buildWreath(.26);wr.position.set(0,cy+h*.5+.16,.16);g.add(wr);
  }
  return g;
}

/* Stage 1: 512px 无缝水粉椭圆笔触贴图（告别碎盐噪点，大色块干净通透） */
function noiseTex(base,spec,dens){
  const [c,g]=cv(512,512);
  g.fillStyle=base;g.fillRect(0,0,512,512);
  const layers=[
    {n:65,  rx:[24,48], ry:[10,18], a:[.028,.058]},
    {n:110, rx:[10,22], ry:[4,9],   a:[.022,.050]},
    {n:130, rx:[4,10],  ry:[2,5],   a:[.018,.042]}
  ];
  for(const L of layers){
    for(let i=0;i<L.n;i++){
      const x=R(0,512),y=R(0,512),rx=R(L.rx[0],L.rx[1]),ry=R(L.ry[0],L.ry[1]),ang=R(-.45,.45);
      g.fillStyle=`rgba(${spec},${R(L.a[0],L.a[1]).toFixed(3)})`;
      for(const ox of [-512,0,512]){
        if(x+ox<-rx||x+ox>512+rx)continue;
        for(const oy of [-512,0,512]){
          if(y+oy<-ry||y+oy>512+ry)continue;
          g.save();g.translate(x+ox,y+oy);g.rotate(ang);
          g.beginPath();g.ellipse(0,0,rx,ry,0,0,Math.PI*2);g.fill();
          g.restore();
        }
      }
    }
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

function paintSky(top,mid,bot,glow){
  const g=skyCanvas.getContext('2d');
  const lg=g.createLinearGradient(0,0,0,256);
  lg.addColorStop(0,top);lg.addColorStop(.48,mid);lg.addColorStop(.62,bot);lg.addColorStop(1,bot);
  g.fillStyle=lg;g.fillRect(0,0,512,256);
  if(glow){
    const rg=g.createRadialGradient(256,150,0,256,150,230);
    rg.addColorStop(0,glow);rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg;g.fillRect(0,0,512,256);
    /* 银河微光带：按列绘制，中心线随经度正弦起伏。
       旧写法是 rotate(-.28) 后 fillRect(-300,-34,600,68) —— 斜带横跨整幅画布，
       在左右边缘的纵向位置错开约 100px。贴到球面上后，经度接缝两侧
       一个有光带一个没有，天上就割出一条笔直的竖直暗带（站在中央往西望最明显）。
       现在按列画：中心线周期 = 画布宽度，左右边缘像素天然连续，接缝处无色差。 */
    const bandSpan=34, bandAmp=46;
    for(let x=0;x<512;x++){
      const cy=95+bandAmp*Math.sin(2*Math.PI*x/512-0.6);
      const mg=g.createLinearGradient(0,cy-bandSpan,0,cy+bandSpan);
      mg.addColorStop(0,'rgba(120,165,240,0)');
      mg.addColorStop(.5,'rgba(155,195,255,.14)');
      mg.addColorStop(1,'rgba(120,165,240,0)');
      g.fillStyle=mg;g.fillRect(x,cy-bandSpan,1,bandSpan*2);
    }
  }
  skyTex.needsUpdate=true;
}
let envRT=null;

   4. 地形 / 街道

/* ════════════════════════════════════════════════════════════
   4.5 值噪声 / 遮罩烘焙 / 平面反射 / 湿地材质
   做法参考 Saltline：湿区和水洼不是手绘贴图，而是 JS 侧用值噪声
   算出一个场，烘成遮罩交给 shader；雨量是 uniform，不用重建粒子。
   ════════════════════════════════════════════════════════════ */
function makeNoise(seed){
  const N=256,perm=new Uint8Array(N*2),val=new Float32Array(N);
  let s=seed>>>0;
  const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  for(let i=0;i<N;i++){perm[i]=i;val[i]=rnd();}
  for(let i=N-1;i>0;i--){const j=(rnd()*(i+1))|0,t=perm[i];perm[i]=perm[j];perm[j]=t;}
  for(let i=0;i<N;i++)perm[i+N]=perm[i];
  const sm=t=>t*t*(3-2*t);
  const v2=(x,y)=>val[perm[(perm[x&255]+(y&255))&255]];
  return{
    noise(x,y){
      const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
      const u=sm(xf),v=sm(yf);
      const a=v2(xi,yi),b=v2(xi+1,yi),c=v2(xi,yi+1),d=v2(xi+1,yi+1);
      const t=a+(b-a)*u;
      return t+(c+(d-c)*u-t)*v;
    },
    fbm(x,y,oct){
      oct=oct||4;let h=0,f=.5,p=0;
      for(let i=0;i<oct;i++){h+=this.noise(x,y)*f;p+=f;x=x*2.03+17.1;y=y*2.03+9.7;f*=.5;}
      return h/p;
    },
    rnd
  };
}
/* 把标量场烘成遮罩贴图：R=湿度 G=水洼/油污 B=磨损 */
function bakeMask(size,rect,fn){
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d'),img=ctx.createImageData(size,size),d=img.data;
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const wx=rect.x0+(i+0.5)/size*rect.w;
    const wz=rect.z0+(j+0.5)/size*rect.h;
    const o=fn(wx,wz),p=(j*size+i)*4;
    d[p]=o[0]*255;d[p+1]=o[1]*255;d[p+2]=o[2]*255;d[p+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;
  t.generateMipmaps=false;
  return t;
}

/* ── 平面反射：镜像相机 + 离屏 RT ───────────────────────── */
const planar={
  enabled:true,target:null,camera:null,matrix:new THREE.Matrix4(),
  height:.035,hideList:[],_hideCache:null,_hiddenNow:[],
  buildCache(){
    this._hideCache=[];
    scene.traverse(o=>{
      if(!o.isMesh&&!o.isPoints&&!o.isLine)return;
      const addBlend=o.material&&o.material.blending===THREE.AdditiveBlending;
      if(o.userData.noReflect||(addBlend&&!o.userData.inReflect)||this.hideList.indexOf(o)>=0){
        this._hideCache.push(o);
      }
    });
  },
  init(){
    this.target=new THREE.WebGLRenderTarget(832,468,{type:THREE.HalfFloatType,depthBuffer:true,stencilBuffer:false});
    this.target.texture.minFilter=THREE.LinearFilter;
    this.target.texture.magFilter=THREE.LinearFilter;
    this.target.texture.generateMipmaps=false;
    this.camera=new THREE.PerspectiveCamera();
    this._v=new THREE.Vector3();this._t=new THREE.Vector3();
    this._look=new THREE.Vector3();this._cp=new THREE.Vector3();
    this._rot=new THREE.Matrix4();this._n=new THREE.Vector3(0,1,0);
  },
  render(){
    if(!this.enabled||!this.target)return;
    this.renders=(this.renders||0)+1;
    const c=this.camera,r=camera;
    r.updateMatrixWorld();
    this._cp.setFromMatrixPosition(r.matrixWorld);
    this._rot.extractRotation(r.matrixWorld);
    this._v.set(0,this.height,0).sub(this._cp).reflect(this._n).negate();
    this._v.y+=this.height;
    this._look.set(0,0,-1).applyMatrix4(this._rot).add(this._cp);
    this._t.set(0,this.height,0).sub(this._look).reflect(this._n).negate();
    this._t.y+=this.height;
    c.position.copy(this._v);
    c.up.set(0,1,0).applyMatrix4(this._rot).reflect(this._n);
    c.lookAt(this._t);
    c.near=r.near;c.far=r.far;c.fov=r.fov;c.aspect=r.aspect;
    c.updateProjectionMatrix();c.updateMatrixWorld();
    this.matrix.set(.5,0,0,.5, 0,.5,0,.5, 0,0,.5,.5, 0,0,0,1);
    this.matrix.multiply(c.projectionMatrix);
    this.matrix.multiply(c.matrixWorldInverse);
    // 用缓存列表代替每帧全树遍历
    if(!this._hideCache)this.buildCache();
    const hidden=this._hiddenNow;hidden.length=0;
    for(let i=0;i<this._hideCache.length;i++){
      const o=this._hideCache[i];
      if(o.visible){o.visible=false;hidden.push(o);}
    }
    const old=renderer.getRenderTarget();
    renderer.setRenderTarget(this.target);
    renderer.clear();
    renderer.render(scene,c);
    renderer.setRenderTarget(old);
    for(const o of hidden)o.visible=true;
  }
};

/* ── 湿地材质：注入湿度/水洼/雨痕/平面反射 ───────────────── */
const wetRegistry=[];
const wetShared={
  uTime:{value:0},uRain:{value:0},
  uRefl:{value:null},uTexMat:{value:new THREE.Matrix4()},
  uReflOn:{value:1}
};
function wetMaterial(opts,mask,rect,cfg){
  cfg=cfg||{};
  const m=new THREE.MeshStandardMaterial(opts);
  const u={
    uTime:wetShared.uTime,uRain:wetShared.uRain,
    uRefl:wetShared.uRefl,uTexMat:wetShared.uTexMat,uReflOn:wetShared.uReflOn,
    uMask:{value:mask},
    uMaskRect:{value:new THREE.Vector4(rect.x0,rect.z0,rect.w,rect.h)},
    uReflStr:{value:cfg.refl!==undefined?cfg.refl:.55},
    uWetAmt:{value:cfg.wet!==undefined?cfg.wet:1},
    uMarkAmt:{value:cfg.mark!==undefined?cfg.mark:0}
  };
  m.userData.u=u;
  wetRegistry.push({m,base:cfg.wet!==undefined?cfg.wet:1});
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,u);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
        uniform mat4 uTexMat; uniform vec4 uMaskRect;
        varying vec3 vWPos; varying vec4 vReflC;`)
      .replace('#include <project_vertex>',`#include <project_vertex>
        vec4 _wp = modelMatrix * vec4(transformed,1.0);
        vWPos = _wp.xyz;
        vReflC = uTexMat * _wp;`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
        uniform float uTime,uRain,uReflOn,uReflStr,uWetAmt,uMarkAmt;
        uniform sampler2D uMask,uRefl;
        uniform vec4 uMaskRect;
        varying vec3 vWPos; varying vec4 vReflC;
        vec4 gMk;
        float gH(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
        float gVN(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(gH(i),gH(i+vec2(1.,0.)),f.x),mix(gH(i+vec2(0.,1.)),gH(i+vec2(1.,1.)),f.x),f.y);}`)
      .replace('#include <map_fragment>',`#include <map_fragment>
        vec2 _muv = (vWPos.xz - uMaskRect.xy)/uMaskRect.zw;
        gMk = texture2D(uMask,clamp(_muv,vec2(.001),vec2(.999)));
        diffuseColor.rgb *= mix(1.0,0.26,gMk.g*uMarkAmt);`)
      .replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
        float _wet = clamp(gMk.r*uWetAmt,0.0,1.0);
        float _pud = clamp(gMk.g*uWetAmt,0.0,1.0);
        roughnessFactor = mix(roughnessFactor,0.075,_wet*0.9);
        roughnessFactor = mix(roughnessFactor,0.022,_pud*0.7);`)
      .replace('#include <opaque_fragment>',`#include <opaque_fragment>
        if(uReflOn>0.5 && uReflStr>0.0){
          vec2 _ruv = vReflC.xy/max(vReflC.w,0.0001);
          float _n1 = gVN(vWPos.xz*1.7+vec2(uTime*.30,uTime*.19));
          float _n2 = gVN(vWPos.xz*2.3-vec2(uTime*.21,uTime*.33));
          float _st = gVN(vec2(vWPos.x*2.6,vWPos.z*.55+uTime*5.2));
          _ruv += (vec2(_n1,_n2)-0.5)*0.016*uRain;
          _ruv += vec2(0.0,(_st-.5))*0.012*uRain;   // 竖向雨痕把倒影拉花
          vec3 _rc = texture2D(uRefl,clamp(_ruv,vec2(.002),vec2(.998))).rgb;
          vec3 _V = normalize(vViewPosition);
          float _f = pow(1.0-clamp(dot(normal,_V),0.0,1.0),3.0);
          float _reflK=clamp(uReflStr*_wet*(0.22+0.78*_f)*(0.35+0.65*uRain),0.0,0.85);
          gl_FragColor.rgb=mix(gl_FragColor.rgb,max(gl_FragColor.rgb,_rc),_reflK*0.72)+_rc*_reflK*0.25;
        }`);
  };
  m.customProgramCacheKey=()=>'wetshader';
  return m;
}

/* ── 地面遮罩 ─────────────────────────────────────────── */
const nRoad=makeNoise(20261121);

  const n2=nRoad.fbm(x*.30+51,z*.24,3);
  const pud=Math.max(0,n2-.55)/.45;
  const wet=Math.min(1,.42+n*.5+pud*.45);
  const grain=nRoad.fbm(x*1.7,z*1.7,2);

});

/* ── 锈蚀 / 磨损材质库（照搬 Saltline 的命名材质思路） ── */
function bakeTex(size,fn){
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d'),img=ctx.createImageData(size,size),d=img.data;
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const o=fn((i+.5)/size,(j+.5)/size),p=(j*size+i)*4;
    d[p]=o[0]*255;d[p+1]=o[1]*255;d[p+2]=o[2]*255;d[p+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4;
  return t;
}
const nSteel=makeNoise(9090);

  const rust=nSteel.fbm(u*3.3+31,v*3.3+17,4);
  const rr=Math.max(0,rust-.52)/.48;
  let r=.38+g*.12,gg=.40+g*.12,b=.42+g*.12;
  r=r*(1-rr)+.46*rr;gg=gg*(1-rr)+.22*rr;b=b*(1-rr)+.10*rr;
  return[r,gg,b];
});

/* ── 闭合环城圣诞大道（连成完整圆角环路，绕行艺术馆、西花坛与动漫雪园） ── */
const LOOP=(()=>{
  const xA=44,zS=15.0,zN=-21.0,r=10.0,halfW=4.45;
  const xW=-xA-r, xE=xA+r, zSC=zS-r, zNC=zN+r; // xW=-54, xE=54, zSC=5, zNC=-11
  const sxLen=xA*2, szLen=zSC-zNC, arcLen=Math.PI*0.5*r;
  const totalLen=2*sxLen+2*szLen+4*arcLen;
  function sample(s,off=0){
    let u=((s%totalLen)+totalLen)%totalLen;
    if(u<sxLen){ // South: (+xA,zS) -> (-xA,zS)
      const x=xA-u;
      return{x,z:zS+off,tx:-1,tz:0,nx:0,nz:1};
    }
    u-=sxLen;
    if(u<arcLen){ // SW corner: (+PI/2 -> +PI) around (-xA, zSC)
      const a=Math.PI*.5+(u/arcLen)*Math.PI*.5,ca=Math.cos(a),sa=Math.sin(a);
      return{x:-xA+(r+off)*ca,z:zSC+(r+off)*sa,tx:-sa,tz:ca,nx:ca,nz:sa};
    }
    u-=arcLen;
    if(u<szLen){ // West: (-xW, zSC) -> (-xW, zNC)
      const z=zSC-u;
      return{x:xW-off,z,tx:0,tz:-1,nx:-1,nz:0};
    }
    u-=szLen;
    if(u<arcLen){ // NW corner: (+PI -> +1.5*PI) around (-xA, zNC)
      const a=Math.PI+(u/arcLen)*Math.PI*.5,ca=Math.cos(a),sa=Math.sin(a);
      return{x:-xA+(r+off)*ca,z:zNC+(r+off)*sa,tx:-sa,tz:ca,nx:ca,nz:sa};
    }
    u-=arcLen;
    if(u<sxLen){ // North: (-xA, zN) -> (+xA, zN)
      const x=-xA+u;
      return{x,z:zN-off,tx:1,tz:0,nx:0,nz:-1};
    }
    u-=sxLen;
    if(u<arcLen){ // NE corner: (-PI/2 -> 0) around (+xA, zNC)
      const a=-Math.PI*.5+(u/arcLen)*Math.PI*.5,ca=Math.cos(a),sa=Math.sin(a);
      return{x:xA+(r+off)*ca,z:zNC+(r+off)*sa,tx:-sa,tz:ca,nx:ca,nz:sa};
    }
    u-=arcLen;
    if(u<szLen){ // East: (+xE, zNC) -> (+xE, zSC)
      const z=zNC+u;
      return{x:xE+off,z,tx:0,tz:1,nx:1,nz:0};
    }
    u-=szLen; // SE corner: (0 -> +PI/2) around (+xA, zSC)
    const a=(u/arcLen)*Math.PI*.5,ca=Math.cos(a),sa=Math.sin(a);
    return{x:xA+(r+off)*ca,z:zSC+(r+off)*sa,tx:-sa,tz:ca,nx:ca,nz:sa};
  }
  function distToCenter(x,z){
    const qx=Math.max(0,Math.abs(x)-xA);
    const cz=(zS+zN)*.5, hz=(zS-zN)*.5-r;
    const qz=Math.max(0,Math.abs(z-cz)-hz);
    if(qx>0&&qz>0)return Math.abs(Math.hypot(qx,qz)-r);
    return Math.min(Math.abs(Math.abs(z-cz)-(zS-cz)),Math.abs(Math.abs(x)-xE));
  }
  return{xA,zS,zN,xW,xE,zSC,zNC,r,halfW,totalLen,sample,distToCenter};
})();

function makeLoopRibbon(halfW,y,uTile,segs=260,centerOff=0){
  const pos=[],norm=[],uv=[],idx=[];
  for(let i=0;i<=segs;i++){
    const s=(i/segs)*LOOP.totalLen;
    const pIn=LOOP.sample(s,centerOff-halfW);
    const pOut=LOOP.sample(s,centerOff+halfW);
    pos.push(pIn.x,y,pIn.z, pOut.x,y,pOut.z);
    norm.push(0,1,0, 0,1,0);
    uv.push(s/uTile,0, s/uTile,1);
    if(i<segs){
      const a=i*2,b=a+1,c=a+2,d=a+3;
      idx.push(a,c,b, c,d,b);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(norm,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx);
  return geo;
}

function facade(w,h,x,y,z,rotY,tag){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=rotY;shop.add(g);
  const pane=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat);
  pane.receiveShadow=false;pane.castShadow=false;pane.userData.tag=tag;
  g.add(pane);
  // 竖挺：间距放宽到 3.6m，截面减细到 .06×.10 —— 室内看是疏朗的框架而不是一排柱子
  const n=Math.max(2,Math.round(w/3.6));
  const mull=new THREE.InstancedMesh(BX(.06,h,.10),mullMat,n+1);
  const mm=new THREE.Matrix4();
  for(let i=0;i<=n;i++){mm.makeTranslation(-w/2+i*(w/n),0,0);mull.setMatrixAt(i,mm);}
  mull.instanceMatrix.needsUpdate=true;g.add(mull);
  // 横挺
  const hm=new THREE.InstancedMesh(BX(w,.1,.16),mullMat,2);
  hm.setMatrixAt(0,mm.makeTranslation(0,h/2,0));
  hm.setMatrixAt(1,mm.makeTranslation(0,-h/2+.02,0));
  hm.instanceMatrix.needsUpdate=true;g.add(hm);
  // 底部矮墙
  const kw=add(g,BX(w,.55,.22),M(0x2f363e,{roughness:.8}),0,-h/2+.27,0);
  kw.castShadow=false;
  return g;
}

/* 流线型现代轿跑车（同坐标系双 ExtrudeGeometry 车身+座舱，带独立悬架底盘与可旋转车轮） */
function buildCar(color,o={}){
  const g=new THREE.Group();
  const chassis=new THREE.Group();g.add(chassis);
  const L=o.len||4.3, W=o.wid||1.86, hz=L/2;
  const _carCol=new THREE.Color(color||0xe8edf4).lerp(new THREE.Color(0xcbd8ea),.16);
  const bodyM=new THREE.MeshPhysicalMaterial({
    color:_carCol,roughness:.44,metalness:.16,clearcoat:.34,clearcoatRoughness:.24,envMapIntensity:.48
  });
  const dark=M(0x232b36,{roughness:.82,metalness:.05,envMapIntensity:.2,flatShading:false});
  const trimM=M(0xd4dde8,{roughness:.28,metalness:.65,envMapIntensity:.65,flatShading:false});
  const caliperM=M(0xc9382b,{roughness:.4,metalness:.5});
  const glassM=new THREE.MeshPhysicalMaterial({
    color:0x244068,emissive:0x162b4a,emissiveIntensity:.38,roughness:.14,metalness:.10,clearcoat:.65,clearcoatRoughness:.12,envMapIntensity:.85
  });
  const hl=new THREE.MeshBasicMaterial({color:0xfff3d4});
  const tl=new THREE.MeshBasicMaterial({color:0xff4d5a});
  const hl_day=new THREE.MeshBasicMaterial({color:0xbce6ff});

  // Helper: 2D侧影(+X为车头) 挤出并旋转对齐 +Z 车头 / -Z 车尾，X 居中
  function extrudeProfile(shape, width, bev){
    const geo=new THREE.ExtrudeGeometry(shape,{
      depth:width,bevelEnabled:bev>0,bevelThickness:bev,bevelSize:bev,bevelSegments:3,curveSegments:12
    });
    geo.rotateY(-Math.PI/2); // (+x, y, z) -> (-z, y, +x)，因此 +x 精准成为 +Z 车头！
    geo.translate(width/2, 0, 0);
    return geo;
  }

  // 1. 下半部流线车身轮廓（+X = 车头前脸，-X = 车尾；带真实半圆轮拱镂空，彻底零穿模）
  const wr=L*.305, ar=.395;
  const bodySh=new THREE.Shape();
  bodySh.moveTo(-hz+.10, .28);
  bodySh.lineTo(-wr-ar, .28);
  bodySh.absarc(-wr, .34, ar, Math.PI, 0, true);     // 后轮拱真镂空
  bodySh.lineTo(wr-ar, .28);
  bodySh.absarc(wr, .34, ar, Math.PI, 0, true);      // 前轮拱真镂空
  bodySh.lineTo(hz-.10, .28);
  bodySh.quadraticCurveTo(hz+.03, .40, hz, .60);     // 前保险杠
  bodySh.quadraticCurveTo(hz-.04, .78, hz-.22, .83); // 车头鼻翼
  bodySh.lineTo(L*.16, .91);                         // 倾斜引擎盖
  bodySh.lineTo(-L*.43, .95);                        // 平顺腰线至车尾
  bodySh.lineTo(-hz+.06, .94);                       // 微翘小鸭尾
  bodySh.quadraticCurveTo(-hz-.02, .68, -hz+.04, .32);
  bodySh.closePath();

  const bw=W*.86;
  const bodyMesh=add(chassis,extrudeProfile(bodySh,bw,.06),bodyM,0,0,0);
  bodyMesh.castShadow=true;bodyMesh.receiveShadow=true;

  // 2. 上半部一体流线玻璃座舱（与下车身肩线 y=0.88 严格重合，绝不错位）
  const cabSh=new THREE.Shape();
  cabSh.moveTo(-L*.40, .89);
  cabSh.lineTo(L*.15, .89);                          // 齐平窗台底边
  cabSh.lineTo(L*.00, 1.35);                         // 流线前挡风玻璃 A 柱
  cabSh.quadraticCurveTo(-L*.12, 1.41, -L*.24, 1.33); // 车顶弧线
  cabSh.lineTo(-L*.40, .92);                         // 溜背 C 柱后风挡
  cabSh.closePath();

  const cabW=W*.76;
  const cabMesh=add(chassis,extrudeProfile(cabSh,cabW,.035),glassM,0,0,0);
  cabMesh.castShadow=true;

  // 3. 车顶同色金属盖板（覆盖座舱顶部中间，两侧自然露出斜框玻璃）
  const roofSh=new THREE.Shape();
  roofSh.moveTo(-L*.24, 1.32);
  roofSh.lineTo(-L*.01, 1.35);
  roofSh.lineTo(-L*.03, 1.40);
  roofSh.quadraticCurveTo(-L*.13, 1.44, -L*.23, 1.38);
  roofSh.closePath();
  add(chassis,extrudeProfile(roofSh,cabW*.84,.02),bodyM,0,0,0);

  // 黑色侧裙 & 前后运动包围
  add(chassis,BX(W*.98,.11,L*.64),dark,0,.38,0);
  add(chassis,BX(W*.94,.16,.18),dark,0,.40,hz-.01);
  add(chassis,BX(W*.94,.16,.18),dark,0,.42,-hz+.01);
  // 前进气格栅 + 镀铬饰条
  add(chassis,BX(W*.52,.17,.05),dark,0,.58,hz+.04);
  add(chassis,BX(W*.48,.025,.06),trimM,0,.61,hz+.05);

  const bodyFaceX=bw/2+.06; // 挤出含倒角的车身外侧面 X 坐标
  const sillM=M(0x1b212b,{roughness:.88,metalness:.05,envMapIntensity:.12});
  for(const s of [-1,1]){
    // B柱窗框隔条（让侧窗有真实车门框感，不再是光秃一块玻璃）
    add(chassis,BX(.04,.46,.07),sillM,s*(cabW/2+.02),1.13,-L*.08).rotation.x=.06;
    // 车门纵向下摆线 + 前后车门接缝线 + 贴合门面的隐藏式门把手（不再悬空浮在车外）

  for(const s of [-1,1]){

/* 两点之间的圆柱（四肢用，避免用欧拉角硬凑朝向） */
function limb(g,ax,ay,az,bx,by,bz,r,mat){
  const dx=bx-ax,dy=by-ay,dz=bz-az;
  const len=Math.hypot(dx,dy,dz);
  const m=add(g,new THREE.CylinderGeometry(r,r,len,8),mat,(ax+bx)/2,(ay+by)/2,(az+bz)/2);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,dz).normalize());
  return m;
}

    const earG=new THREE.Group();
    earG.position.set(-.055,.170,s*.142);
    earG.rotation.set(-s*.30,s*.16,.12);
    headG.add(earG);
    const earOut=add(earG,new THREE.SphereGeometry(.062,14,12),hide,0,0,0);

  // ── 4. 龙猫森林守护神家族（补齐厚实垂肩手臂+爪脚+毛尾+双小龙猫完整肢体） ──
  function buildTotoro(){
    const g=new THREE.Group();
    /* ── 材质：绒毛 sheen + 克制自发光 ──
       ① sheen 是 MeshPhysicalMaterial 的绒布特性：边缘起一层柔和绒光，
          比单纯调 roughness 更像毛绒玩偶（这才是「漫反射好看」的正解）。
       ② 自发光只让「它自己」微微透亮、暗部不纯黑，不照亮任何邻居 ——
          和上次那道 12m 加色光幕锥体完全不同（那个是把整个广场罩亮）。
       ③ belly/dark/wht 原本是全局共享材质，直接加自发光会让别处的雪人、
          小黄人一起发亮 → 龙猫用专属副本。 */
    const fur=new THREE.MeshPhysicalMaterial({
      color:0x6d7782,roughness:.62,clearcoat:.16,
      sheen:1,sheenColor:0x9fb8d8,sheenRoughness:.86,
      emissive:0x3a4f68,emissiveIntensity:0});
    const belly=new THREE.MeshPhysicalMaterial({
      color:0xf2e8d2,roughness:.70,sheen:1,sheenColor:0xffe0bc,sheenRoughness:.8,
      emissive:0x6b4a26,emissiveIntensity:0});
    const dark=M(0x1f2328,{roughness:.3,flatShading:false}).clone();
    dark.emissive=new THREE.Color(0x1b2836);dark.emissiveIntensity=0;
    const wht=M(0xffffff,{roughness:.15,flatShading:false}).clone();
    wht.emissive=new THREE.Color(0x3d4d61);wht.emissiveIntensity=0;
    /* 自发光基线登记（每帧按昼夜系数缩放：夜里亮、白天几乎不发光） */
    /* belly 刻意压到 .12：奶白肚皮本身反射就高，再叠自发光会糊成一块白斑，
       失去毛绒体积感。暖光交给顶光 + 脚下反弹光，这里只留一点点暖调。 */
    TOTORO_GLOW.push({m:fur,b:.24},{m:belly,b:.12},{m:dark,b:.24},{m:wht,b:.18});
    // 厚实身躯 + 圆润肩颈融合 + 绒毛肚皮
    add(g,new THREE.SphereGeometry(1.16,28,22),fur,0,1.38,0).scale.set(1.02,1.15,.95);
    add(g,new THREE.SphereGeometry(.86,24,18),fur,0,2.08,-.02).scale.set(1.02,.90,.92);
    add(g,new THREE.SphereGeometry(.90,24,18),belly,0,1.26,.40).scale.set(.98,1.05,.62);
    for(let r=0;r<2;r++)for(let c=-1;c<=1;c++){
      if(r===1&&c===0)continue;
      add(g,BX(.24,.065,.06),fur,c*.36,1.58-r*.26,.94).rotation.z=c===0?0:(c>0?-.32:.32);
    }
    // 两侧柔软垂抱手臂 + 爪尖 + 股腿脚掌
    for(const s of [-1,1]){
      add(g,new THREE.SphereGeometry(.32,16,12),fur,s*.86,1.76,.04);
      addLimb(g,[s*.86,1.76,.04],[s*1.04,1.16,.18],.26,.20,fur,14);
      add(g,new THREE.SphereGeometry(.20,14,10),fur,s*1.04,1.12,.20).scale.set(.9,1.1,1.1);
      for(let ci=-1;ci<=1;ci++){
        add(g,new THREE.ConeGeometry(.028,.09,7),dark,s*1.04+ci*.06,.92,.26).rotation.x=Math.PI*.85;
      }
      add(g,new THREE.SphereGeometry(.32,14,12),fur,s*.48,.34,.12);
      add(g,new THREE.SphereGeometry(.28,14,10),fur,s*.50,.15,.26).scale.set(.98,.54,1.38);
      for(let ti=-1;ti<=1;ti++){
        add(g,new THREE.ConeGeometry(.032,.10,7),dark,s*.50+ti*.09,.09,.59).rotation.x=Math.PI*.48;
      }
      // 柔和根部无缝猫头鹰耳
      add(g,new THREE.SphereGeometry(.19,12,10),fur,s*.44,2.56,0);
      addLimb(g,[s*.44,2.56,0],[s*.54,3.10,0],.19,.07,fur,14);
      add(g,new THREE.SphereGeometry(.07,10,8),fur,s*.54,3.10,0);
      add(g,new THREE.SphereGeometry(.14,14,12),wht,s*.34,2.14,.84);
      add(g,new THREE.SphereGeometry(.07,10,8),dark,s*.34,2.15,.95);
      add(g,new THREE.SphereGeometry(.024,6,5),wht,s*.32,2.18,1.00);
      for(let w=-1;w<=1;w++) add(g,BX(.48,.022,.022),dark,s*.68,1.98+w*.07,.84).rotation.z=s*w*.1;
    }
    add(g,new THREE.SphereGeometry(.11,12,10),dark,0,2.04,.95).scale.set(1.3,.75,.8);
    // 后方厚毛绒大尾巴
    add(g,new THREE.SphereGeometry(.46,16,12),fur,0,.44,-.92).scale.set(.95,.88,1.42);
    // 头顶荷叶已删：原来那圈绿盘从侧面探出来，戴上圣诞帽后变成「头上挂一块绿板」，
    // 在夜景里格外扎眼，跟整只灰色龙猫的调子也对不上。现在头顶只留圣诞红帽。
    // 脚边 2 只小龙猫（补全手臂/耳/脚/尾）
    for(const [mx,mz,mc,ms] of [[-1.25,.68,0x6a9ec9,.42],[1.22,.58,0xf4f2eb,.32]]){
      const mini=new THREE.Group();mini.position.set(mx,0,mz);mini.scale.setScalar(ms);g.add(mini);
      const mf=M(mc,{roughness:.62,flatShading:false}).clone();
      mf.sheen=1;mf.sheenColor=0xa8c4e0;mf.sheenRoughness=.85;
      mf.emissive=new THREE.Color(0x36485e);mf.emissiveIntensity=0;
      TOTORO_GLOW.push({m:mf,b:.22});
      add(mini,new THREE.SphereGeometry(.86,18,14),mf,0,.95,0).scale.set(1,1.18,.95);
      add(mini,new THREE.SphereGeometry(.62,14,10),belly,0,.85,.35).scale.set(.9,1,.55);
      add(mini,new THREE.SphereGeometry(.32,12,10),mf,0,.32,-.65).scale.set(.9,.8,1.3);
      for(const s of [-1,1]){
        add(mini,new THREE.SphereGeometry(.16,10,8),mf,s*.38,1.76,0);
        addLimb(mini,[s*.38,1.76,0],[s*.45,2.24,0],.16,.055,mf,10);
        addLimb(mini,[s*.72,1.16,.05],[s*.86,.74,.14],.18,.13,mf,10);
        add(mini,new THREE.SphereGeometry(.20,10,8),mf,s*.36,.12,.18).scale.set(1,.55,1.3);
        add(mini,new THREE.SphereGeometry(.14,10,8),wht,s*.28,1.42,.69);
        add(mini,new THREE.SphereGeometry(.07,8,6),dark,s*.28,1.42,.79);
      }
      add(mini,new THREE.SphereGeometry(.09,8,6),dark,0,1.34,.78).scale.set(1.2,.7,.8);
    }
    return g;
  }

  // 3. 布置 12 座超大经典动漫卡通雕塑（环形 + 四象限广场布局）
  const layout=[
    // 中央压轴大龙猫家族
    [PX,     PZ,     1.95, 0x4ade80, buildTotoro,       1.02, 0],

    [PX+10.2,PZ+6.6, 1.50, 0xfb7185, buildLineFriends,  1.02, -.35]
  ];
  for(const [sx,sz,rad,glow,fn,sc,ry] of layout){
    const ped=parkPedestal(sx,sz,rad,glow);
    const fig=fn();
    /* Line Friends（布朗熊 + 长耳可妮兔）这一组抬到基座顶面 .61：
       雕像局部脚底在 y=0，基座顶在 .14+.47=.61，
       原来统一放在 .50 → 整组有 0.11m 泡在基座里，这就是「大兔子穿模」。 */
    fig.position.y=(fn===buildLineFriends)?.61:.50;
    fig.scale.setScalar(sc);fig.rotation.y=ry;

const treeX=[-29.5,-17.8,-6,5.5,14.5,21.5,32.5,39.5];
{
  const TZ=9.35;
  const bark=M(0x4a3525,{roughness:.92,flatShading:false});

  const soilM=M(0xe6eef6,{roughness:.94});
  const trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.045,.135,4.0,10),bark,treeX.length);
  const treeLeafMat=M(0xffffff,{map:cypressTex,roughness:.80,flatShading:false});
  const TIERS=6;
  const leaf=new THREE.InstancedMesh(new THREE.ConeGeometry(1,1.35,14),treeLeafMat,treeX.length*TIERS);
  const sCap=new THREE.InstancedMesh(new THREE.ConeGeometry(.95,.55,14),snowCapM,treeX.length*TIERS);
  const m4=new THREE.Matrix4(),col=new THREE.Color(),q=new THREE.Quaternion(),e3=new THREE.Euler();
  const tierY=[2.07,2.69,3.32,3.90,4.46,4.99];
  const tierR=[.72,.63,.54,.43,.32,.21];
  const tierH=[1.05,1.02,.98,.95,.92,.96];
  const stBulbCols=[0xff4f4f,0xffe078,0x45d67e];
  const stBulbGeo=new THREE.SphereGeometry(.055,6,5);
  treeX.forEach((x,i)=>{
    add(street,BX(1.25,.22,1.25),pitM,x,.24,TZ);
    add(street,BX(.95,.25,.95),soilM,x,.25,TZ).castShadow=false;
    const hVar=R(.94,1.08);
    m4.compose(new THREE.Vector3(x,2.0*hVar,TZ),q.identity(),new THREE.Vector3(1,hVar,1));
    trunk.setMatrixAt(i,m4);
    for(let c=0;c<TIERS;c++){
      const rr=tierR[c]*R(.92,1.08), hh=tierH[c]*hVar;
      e3.set(R(-.03,.03),c*.75+R(0,.6),R(-.03,.03));q.setFromEuler(e3);
      m4.compose(new THREE.Vector3(x,tierY[c]*hVar,TZ),q,new THREE.Vector3(rr,hh,rr));
      leaf.setMatrixAt(i*TIERS+c,m4);
      // 薄雪仅覆在树冠顶端小帽，露出 80% 真实苍翠柏树针叶肌理
      m4.compose(new THREE.Vector3(x,(tierY[c]+hh*.35)*hVar,TZ),q,new THREE.Vector3(rr*.52,hh*.26,rr*.52));
      sCap.setMatrixAt(i*TIERS+c,m4);
      const shade=.78+c*.045+R(-.04,.04);
      col.setRGB(shade*.82,shade*1.02,shade*.86);leaf.setColorAt(i*TIERS+c,col);
    }
    const stTop=addNS(street,new THREE.OctahedronGeometry(.14,0),getBulbMat(0xffe27a,0),x,7.05*hVar,TZ);
    xmasStars.push(stTop);

  trunk.instanceMatrix.needsUpdate=true;leaf.instanceMatrix.needsUpdate=true;sCap.instanceMatrix.needsUpdate=true;

}

{

     挡住「进动漫雪园」的第一眼视线，按要求整根去掉（含它带的点光源和碰撞体）。 */
  const lx=[-19.5,-10.5,9.5,18.0,36.0];
  const poleM=M(0x2a3138,{roughness:.42,metalness:.72,flatShading:false});
  const poleCurve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,.2,0),
    new THREE.Vector3(0,4.7,0),
    new THREE.Vector3(0,5.65,.35),
    new THREE.Vector3(0,5.95,1.25)
  ]);
  const poleGeo=new THREE.TubeGeometry(poleCurve,20,.068,10,false);
  /* 路灯光幕锥体：所有路灯共用同一份几何与材质
     顶点色沿轴向：灯口最亮、地面端保留 0.45 的浓度。
     注意锥体是「尖端在灯口、大面在地面」，如果把亮度全压在尖端，
     屏幕可见的那块面积极小，整条光锥会看起来完全消失 ——
     所以下端必须留够底噪，只做温和的上亮下淡。 */
  const lampConeGeo=(()=>{
    const geo=new THREE.ConeGeometry(2.6,5.8,32,1,true);
    const pa=geo.attributes.position, cols=new Float32Array(pa.count*3);
    for(let i=0;i<pa.count;i++){
      const t=(pa.getY(i)+2.9)/5.8;      // 0 = 地面端, 1 = 灯口
      const f=.45+.55*Math.pow(t,1.5);
      cols[i*3]=f;cols[i*3+1]=f;cols[i*3+2]=f;
    }
    geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
    return geo;
  })();
  const lampConeMat=new THREE.MeshBasicMaterial({
    color:0xffd79a,vertexColors:true,transparent:true,opacity:.26,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});
  for(const x of lx){
    const g=new THREE.Group();g.position.set(x,0,11.45);street.add(g);
    add(g,poleGeo,poleM,0,0,0);
    add(g,new THREE.CylinderGeometry(.16,.22,.36,14),M(0x1e242a,{roughness:.75}),0,.2,0);
    add(g,BX(.42,.15,.72),M(0x333b43,{roughness:.45,metalness:.65}),0,5.93,1.38);
    add(g,BX(.46,.09,.76),snowCapM,0,6.04,1.38);
    // 路灯柱挂圣诞花环 + 立体厚壁柔光灯罩（替代原先 2D 薄片，彻底消除掠射角亚像素与深度冲突闪烁）
    const lWr=buildWreath(.26);lWr.position.set(0,3.8,.12);g.add(lWr);
    const bulb=new THREE.Mesh(BX(.30,.11,.52),new THREE.MeshBasicMaterial({color:0xffdfa8}));
    bulb.position.set(0,5.79,1.38);g.add(bulb);
    const halo=new THREE.Mesh(new THREE.PlaneGeometry(3.6,3.6),new THREE.MeshBasicMaterial({
      map:glowTex,color:0xffd79a,transparent:true,opacity:.32,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    halo.rotation.x=-Math.PI/2;halo.position.set(0,.05,1.40);g.add(halo);
    halo.userData.noReflect=true;
    lampPools.push(halo);
    /* 灯罩光幕：圆锤形锥体，从灯口落到地面的柔光锥。
       上次把它换成柔光球，光幕感没了。现在恢复锥体，但比原来干净：
       - 32 段（原 16 段）→ 轮廓不再有折线硬角
       - 顶点色沿轴向渐变：灯口最亮，越往下越淡 → 不会有"实心白楔形"
       - 双面可见（玩家站在锥下往上看也能看到内侧），但整体透明度压低 */
    const cone=new THREE.Mesh(lampConeGeo,lampConeMat);
    cone.position.set(0,2.9,1.40);cone.castShadow=false;cone.raycast=()=>{};
    g.add(cone);
    if(x===-19.5||x===9.5){
      const pl=new THREE.PointLight(0xffd9a4,68,34,1.65);
      pl.position.set(x,5.8,12.85);scene.add(pl);shopLights.push({l:pl,base:68,street:true});
    }
  }
  /* ── 沿环城马路补一整串路面灯光晕 ──
     微缩景观的夜景，街道必须有连续、有节奏的光：
     原来只有南侧 5 盏路灯，北段、西弧、东弧大半条马路是死黑沥青，画面像半成品。
     这里沿路内侧路缘铺一串暖色光晕 —— 深色沥青上加色混合才看得见
     （跟钢琴广场那圈地埋灯是同一个手法：加色在黑漆/深色面上有效，在白雪上无效）。
     不再加坡灯杆：灯杆沿路一排排插下去，很容易插进建筑和市集摊位里，
     而光晕贴在路面上、被建筑挡住也只是被挡住，不会穿模。
     零光源成本（不占每像素的光照预算），合批后几乎不增加 draw call。 */
  {
    const roadHaloGeo=new THREE.PlaneGeometry(4.4,4.4);
    const roadHaloMat=regNightGlow(new THREE.MeshBasicMaterial({
      map:glowTex,color:0xffcb8e,transparent:true,opacity:.24,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false}),.24);
    const grp=new THREE.Group();
    const spacing=13;
    const n=Math.max(8,Math.round(LOOP.totalLen/spacing));

      q.position.set(p.x,.05,p.z);
      q.castShadow=false;q.receiveShadow=false;
      q.userData.noReflect=true;
      grp.add(q);
    }
    street.add(grp);
  }
}
