<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>熊萌艺术馆 · 圣诞冰雪特展</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
<meta name="theme-color" content="#060c14" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="熊萌艺术馆" />
<style>
  :root{
    --bg:#060c14;
    --ink:#e9f2f8;
    --muted:#8aa2b5;
    --line:rgba(240,192,110,.22);
    --line-strong:rgba(240,192,110,.45);
    --accent:#f4c56a;
    --accent-warm:#e85d52;
    --glass:rgba(12,18,26,.76);
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
    --han:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--han);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
  /* 禁止长按选中界面文字：手机浏览器/微信内置浏览器长按按钮会弹出
     系统「取词 + 朗读」浮层（几个深色圆圈把文字圈起来，还带个♪图标），
     糊在画面上很难看。整页不需要复制文本，直接全局关掉。 */
  html,body,#stage,body *{
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }
  /* 输入框要保留正常选中/粘贴能力（留言板） */
  input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  /* 手机长按按钮会弹出系统「取词 + 朗读」浮层（几个深色圆圈把按钮文字圈住，
     右下还跟一个♪朗读图标），糊在 3D 画面上很难看。
     user-select:none 挡不住微信/Safari 那套取词（它能穿透到按钮文字），
     所以把按钮上的文字全部改成伪元素生成 ——
     伪元素不是真实文本节点，取词工具扫不到，长按就不会再弹那个气泡。 */
  .wtools button[data-label]::after,
  .wtop button[data-label]::after,
  #w-run[data-label]::after{
    content:attr(data-label);display:inline-block;pointer-events:none;
  }
  .wtools button[data-label],.wtop button[data-label],#w-run[data-label]{
    -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
  }
  html,body{overscroll-behavior:none}
  #stage{position:fixed;inset:0}

  /* 细网格 + 暗角，给整个界面一个“工程台”的底子 */
  #grain{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  #scan{
    position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, rgba(0,0,0,0) 1px 3px);
  }

  .panel{
    background:var(--glass);
    border:1px solid var(--line);
    backdrop-filter:blur(14px) saturate(120%);
    -webkit-backdrop-filter:blur(14px) saturate(120%);
    border-radius:3px;
  }

  /* ---------- 左上：品牌 + 实时读数 ---------- */
  #rail{
    position:fixed;left:12px;top:14px;z-index:29;
    display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    transition:transform .3s cubic-bezier(.2,.8,.3,1);
  }
  /* 收起时只把内容滑走，≡ 圆钮留在屏内（否则整条栏会被推出屏幕，点不到） */
  body.rail-min #railBody{opacity:0;pointer-events:none;transform:translateX(-150px)}
  #railBody{display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:opacity .22s,transform .22s}
  #railToggle{
    width:28px;height:28px;border-radius:50%;
    border:1px solid var(--line);background:rgba(9,16,24,.82);color:var(--muted);
    font-family:var(--mono);font-size:14px;line-height:1;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #railToggle:hover{color:var(--accent);border-color:var(--line-strong)}
  #rail .seasons{display:grid;grid-template-columns:repeat(4,32px);gap:5px}
  #rail .seasons button{width:32px;height:32px;padding:0;font-size:13px;border-radius:3px}
  #rail .seasons button small{display:none}
  #rail #hour{width:146px}
  #rail .toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;width:146px}
  #rail .toggles button{padding:6px 4px;font-size:11px;letter-spacing:.04em;border-radius:3px}
  #railState{
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
    padding:5px 9px;background:rgba(9,16,24,.66);border:1px solid var(--line);border-radius:2px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #railState b{color:var(--accent);font-weight:600}
  #railState i{color:var(--accent-warm);font-style:normal}

  /* 季节方块 / 开关按钮：底子与高亮态 */
  #rail .seasons button{
    background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);
    cursor:pointer;font-family:var(--han);letter-spacing:.08em;
    transition:.22s cubic-bezier(.2,.8,.3,1);
  }
  #rail .seasons button.on{
    color:#04121a;background:var(--accent);border-color:var(--accent);font-weight:600;
    box-shadow:0 0 18px -4px rgba(104,208,245,.75);
  }
  #rail .seasons button:hover{border-color:var(--line-strong);color:var(--ink);background:rgba(104,208,245,.08)}
  #rail .toggles button{
    background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);
    cursor:pointer;font-family:var(--han);letter-spacing:.06em;transition:.2s;
  }
  #rail .toggles button.on{color:var(--accent);border-color:rgba(104,208,245,.5);background:rgba(104,208,245,.1)}
  #rail .toggles button:hover{border-color:var(--line-strong);color:var(--ink)}

  /* 时间滑块 */
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(126,180,220,.22);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 10px rgba(104,208,245,.85);cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border:0;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px rgba(104,208,245,.85);cursor:grab;
  }

  /* ---------- 右下：操作提示 ---------- */
  #hint{
    position:fixed;right:22px;bottom:20px;z-index:20;padding:9px 14px;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
    display:flex;gap:14px;align-items:center;
  }
  #hint kbd{
    font-family:var(--mono);color:var(--ink);border:1px solid var(--line);
    padding:1px 5px;border-radius:2px;margin-right:5px;font-size:9.5px;
  }
  #fps{color:var(--accent)}

  /* ---------- 沉浸视角 ---------- */
  body.fp #hint,body.fp #tip{display:none!important}
  /* 纯净模式：画面上只留操作控件（摇杆 / 跳 / 返回 / 声音），其余 UI 全部隐去 */
  body.clean #rail,body.clean #info,body.clean #hint,
  body.clean #tip,body.clean #cross,body.clean #dock,body.clean #panel{display:none!important}
  /* 纯净时仍要能走能转头：操作控件不受 clean 影响 */
  body.clean.walk #joystick,body.clean.walk #w-run,
  body.clean.walk #w-back,body.clean.walk #w-sound{display:block!important}
  /* 操作控件（左手摇杆 / 右下跳 / 右上工具）——触屏端常驻，纯净模式也保留 */
  body.walk #joystick,body.walk #w-run,body.walk #w-back,body.walk #w-sound{display:block}
  body.walk.off #joystick,body.walk.off #w-run,body.walk.off #w-back,body.walk.off #w-sound{display:none}
  /* 触屏设备：无论沉浸还是沙盒，摇杆与跳按钮都在（默认纯净也不藏操作） */
  body.touch #joystick,body.touch #w-run{display:block!important}
  #joystick{
    position:fixed;left:22px;bottom:26px;z-index:27;display:none;
    width:118px;height:118px;border-radius:50%;
    border:1.5px solid rgba(160,210,240,.3);
    background:radial-gradient(circle,rgba(12,22,32,.4) 40%,rgba(12,22,32,.16) 100%);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    touch-action:none;
  }
  #joystick::before{
    content:'';position:absolute;inset:34px;border-radius:50%;
    border:1px dashed rgba(160,210,240,.18);
  }
  #stick{
    position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:rgba(190,225,245,.34);
    border:1.5px solid rgba(210,240,255,.55);
    box-shadow:0 3px 14px rgba(0,0,0,.45);
    pointer-events:none;
  }
  #w-run{
    position:fixed;right:30px;bottom:40px;z-index:27;display:none;
    width:78px;height:78px;border-radius:50%;
    background:rgba(14,24,34,.45);border:1.5px solid rgba(160,210,240,.4);
    color:#d6ecf8;font-family:var(--han);font-size:13px;letter-spacing:.14em;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    touch-action:none;cursor:pointer;
  }
  #w-run.hold{background:rgba(104,208,245,.28);border-color:rgba(160,220,250,.8);color:#fff}
  /* 沉浸模式内的圆形工具组（#wtop）已停用：
     它和右上角常驻的 .wtools 位置几乎重合（right 20/top 18 vs right 14/top 14），
     两套一起显示就会叠成一团圆圈 —— 手机端更糟：
     body.touch #wtop{display:flex!important} 用的是 id 选择器，特异性压过了
     body.touch .wtop{display:none!important}，导致触屏端也照样显示。
     现在统一只保留 .wtools（同样的「视角切换 + 声音」功能，胶囊样式不重叠）。
     DOM 节点保留，JS 里的引用不受影响。 */
  .wtop{
    position:fixed;right:20px;top:18px;z-index:27;display:none!important;gap:10px;
  }
  .wtop button{
    width:46px;height:46px;border-radius:50%;
    background:rgba(12,20,28,.5);border:1px solid rgba(160,210,240,.32);
    color:#cfe3f2;font-family:var(--han);font-size:12px;letter-spacing:.06em;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;transition:.18s;
  }
  .wtop button:hover{color:#fff;border-color:rgba(160,220,250,.7);background:rgba(104,208,245,.2)}
  .wtop button.on{color:var(--accent);border-color:rgba(104,208,245,.55)}
  /* 常驻小工具条：纯净模式下也能切视角/开关声音（永远可见，不受 clean 影响） */
  .wtools{
    position:fixed;right:14px;top:14px;z-index:28;display:flex;gap:7px;
  }
  .wtools button{
    min-width:38px;height:34px;padding:0 9px;border-radius:17px;
    background:rgba(10,18,26,.42);border:1px solid rgba(160,210,240,.26);
    color:#bcd6e8;font-family:var(--han);font-size:11.5px;letter-spacing:.04em;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;transition:.18s;
  }
  .wtools button:hover{color:#fff;border-color:rgba(160,220,250,.6);background:rgba(104,208,245,.18)}
  .wtools button.on{color:var(--accent);border-color:rgba(104,208,245,.5)}
  body.touch .wtools{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top))}
  body.touch .wtools button{min-width:44px;height:40px;border-radius:20px;font-size:12px}
  /* 触屏：沉浸内的 .wtop 隐藏，统一用常驻 .wtools，避免两套按钮叠在一起 */
  body.touch .wtop{display:none!important}
  /* ── 触屏端视觉优化 ──
     手机屏像素密度高（1px 扫描线会变摩尔纹），混合模式暗角在 OLED 上发闷，
     所以触屏端去掉扫描线、换成普通 rgba 暗角，并把整体色调提亮一点。 */
  body.touch #scan{display:none!important}
  body.touch #grain{
    mix-blend-mode:normal;
    background:radial-gradient(125% 95% at 50% 44%, rgba(0,0,0,0) 46%, rgba(4,10,18,.34) 100%);
  }
  /* 触屏：右下「跳」按钮更靠边、更好按 */
  body.touch #w-run{right:max(18px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:72px;height:72px}
  body.touch #joystick{left:max(16px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:112px;height:112px}
  #cross{
    position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:26;
    pointer-events:none;opacity:0;transition:opacity .2s;
  }
  #cross::before,#cross::after{
    content:'';position:absolute;background:rgba(220,240,255,.85);
    box-shadow:0 0 6px rgba(104,208,245,.9);
  }
  #cross::before{left:8px;top:2px;width:2px;height:14px}
  #cross::after{left:2px;top:8px;width:14px;height:2px}
  #fphint{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:26;
    display:none;padding:8px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
    color:#cfe3f2;background:rgba(7,12,19,.72);border:1px solid var(--line);border-radius:2px;
  }
  body.fp #fphint{display:block}
  body.fp:not(.clean) #fphint{opacity:1}
  body.clean #fphint{opacity:0}

  /* ---------- 右侧：区域信息面板 ---------- */
  #info{
    position:fixed;right:22px;top:20px;z-index:20;width:320px;
    padding:16px 18px 18px;opacity:0;transform:translateX(16px);pointer-events:none;
    transition:opacity .32s ease,transform .32s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 22px 60px -26px rgba(0,0,0,.95);
  }
  #info.show{opacity:1;transform:none;pointer-events:auto}
  #info .eyebrow{
    font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--accent);
    text-transform:uppercase;margin-bottom:6px;
  }
  #info h2{font-size:16.5px;font-weight:600;letter-spacing:.06em;margin-bottom:12px}
  #info .rows{border-top:1px solid var(--line);margin:0}
  #info .row{
    display:grid;grid-template-columns:76px 1fr;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:12px;line-height:1.62;
  }
  #info .row dt{color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding-top:2px}
  #info .row dd{color:#c4d6e4;margin:0}
  #info .row dd em{font-style:normal;color:var(--accent-warm)}
  #info .close{
    position:absolute;right:12px;top:11px;width:22px;height:22px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer;border-radius:2px;line-height:1;font-size:13px;
    transition:.2s;
  }
  #info .close:hover{color:var(--ink);border-color:var(--line-strong)}

  /* ---------- 底部快捷导览 Dock ---------- */
  #dock{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:21;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:4px;padding:5px 7px;max-width:min(900px,94vw);
    max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center;
    box-shadow:0 18px 50px -24px rgba(0,0,0,.9);
    transition:opacity .3s,transform .3s;
  }
  #dock button{
    padding:6px 8px;background:rgba(255,255,255,.04);border:1px solid var(--line);
    color:var(--muted);border-radius:2px;cursor:pointer;font-family:var(--han);
    font-size:11px;letter-spacing:.03em;white-space:nowrap;transition:.2s;
  }
  #dock button:hover{color:var(--ink);border-color:var(--line-strong);background:rgba(104,208,245,.1)}
  #dock button.on{color:#04121a;background:var(--accent);border-color:var(--accent);font-weight:600}
  body.clean #dock{opacity:0;pointer-events:none;transform:translate(-50%,12px)}

  /* ---------- 悬停提示 ---------- */
  #tip{
    position:fixed;z-index:30;pointer-events:none;padding:4px 10px;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#dbeefb;
    background:rgba(9,16,24,.88);border:1px solid var(--line-strong);border-radius:2px;
    opacity:0;transition:opacity .16s;white-space:nowrap;transform:translateY(-2px);
  }
  #tip::before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;background:var(--accent)}

  /* ---------- 载入 ---------- */
  #boot{
    position:fixed;inset:0;z-index:60;background:#05090f;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:opacity .7s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #boot .t{font-size:14px;letter-spacing:.42em;color:var(--muted)}
  #boot .bar{width:170px;height:1px;background:rgba(126,180,220,.18);position:relative;overflow:hidden}
  #boot .bar i{position:absolute;inset:0;width:38%;background:var(--accent);
    animation:slide 1.15s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}

  @media (max-width:900px){
    #info{left:22px;right:22px;top:56px;bottom:auto;width:auto}
    #hint{display:none}
  }
  /* 窄屏：Dock 缩窄并可横向滚动，沉浸时抬到摇杆上方，别和摇杆/跑按钮叠在一起 */
  @media (max-width:560px){
    #dock{max-width:calc(100vw - 16px);overflow-x:auto;padding:4px 5px;gap:4px}
    #dock button{padding:6px 8px;font-size:10.5px;letter-spacing:.02em}
    body.fp #dock{bottom:152px}
  }

  /* ---------- 游乐园邮箱式留言板 ---------- */
  #gb-modal{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(4,9,16,.68);backdrop-filter:blur(8px);padding:16px;
  }
  #gb-modal.show{display:flex}
  #gb-box{
    width:min(820px,96vw);height:min(540px,88vh);display:flex;flex-direction:column;
    background:#101926;border:1px solid rgba(232,182,83,.42);border-radius:8px;
    box-shadow:0 24px 60px rgba(0,0,0,.65);color:#eef4fa;overflow:hidden;font-family:var(--han);
  }
  #gb-head{
    display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    background:linear-gradient(90deg,#182638,#231a24);border-bottom:1px solid rgba(232,182,83,.25);
  }
  #gb-head .title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:#ffe6a8}
  #gb-head .cnt{font-size:11px;font-family:var(--mono);color:#9fb6cc;background:rgba(255,255,255,.07);padding:2px 8px;border-radius:10px}
  #gb-head .acts{display:flex;align-items:center;gap:8px}
  .gb-btn{
    padding:6px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06);color:#e6f0fa;cursor:pointer;font-size:12px;transition:.18s;
  }
  .gb-btn:hover{background:rgba(255,255,255,.14)}
  .gb-btn.pri{background:#d49b38;border-color:#e8b653;color:#141008;font-weight:700}
  .gb-btn.pri:hover{background:#e8b653}
  .gb-btn.dan{border-color:rgba(235,87,87,.45);color:#ff9b9b}
  .gb-btn.dan:hover{background:rgba(235,87,87,.18)}
  #gb-body{flex:1;display:grid;grid-template-columns:270px 1fr;min-height:0}
  #gb-list{
    border-right:1px solid rgba(255,255,255,.09);overflow-y:auto;background:rgba(8,13,20,.55);
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ════════════════════════════════════════════════════════════
   0. 基础工具
   ════════════════════════════════════════════════════════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(20261120);
const R  = (a,b)=>a+(b-a)*rng();
const RI = (a,b)=>Math.floor(R(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')];}
function ctex(c,rep){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const HK='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

const sharedStyle={uWindTime:{value:0}};
const matCache=new Map();
function M(color,o={}){
  if(color===undefined||color===null)color=0xffffff;
  const k=color+'|'+JSON.stringify(o);
  if(matCache.has(k))return matCache.get(k);
  const m=new THREE.MeshStandardMaterial(Object.assign({color,flatShading:false,roughness:.76,metalness:.06,envMapIntensity:.85},o));
  matCache.set(k,m);return m;
}
function add(parent,geo,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function addNS(parent,geo,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  m.castShadow=false;m.receiveShadow=false;parent.add(m);return m;
}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
/* 双面牌匾：正反两面各一块，字都是正的。
   单面的话从背面看要么被剔除（牌匾消失），要么字是镜像的 —— 都不行。 */
function animeSignTex(w,h,cn,en,accent='#f6d690',bgTop='#0f1e36',bgBot='#1b3154'){
  const [c,x]=cv(w,h);
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,bgTop);g.addColorStop(1,bgBot);
  x.fillStyle=g;x.fillRect(0,0,w,h);
  const rg=x.createRadialGradient(w*.82,h*.22,2,w*.82,h*.22,w*.48);
  rg.addColorStop(0,'rgba(255,204,136,0.20)');rg.addColorStop(1,'rgba(255,204,136,0)');
  x.fillStyle=rg;x.fillRect(0,0,w,h);
  const pad=Math.max(5,Math.round(h*.07));
  x.strokeStyle=accent;x.globalAlpha=.72;x.lineWidth=Math.max(2,Math.round(h*.035));
  x.strokeRect(pad,pad,w-pad*2,h-pad*2);x.globalAlpha=1;
  x.textAlign='center';
  x.fillStyle='#fff4dc';
  x.font='700 '+Math.round(h*.36)+'px '+HK;
  x.fillText(cn,w/2,Math.round(h*.49));
  x.fillStyle='#a8d8ff';
  x.font='600 '+Math.max(11,Math.round(h*.165))+'px '+HK;
  x.fillText(en,w/2,Math.round(h*.80));
  return ctex(c);
}
function signPanel(parent,w,h,tex,x,y,z,em){
  const mat=new THREE.MeshStandardMaterial({
    map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:Math.min(.68,em===undefined?.65:em),roughness:.32});
  for(const s of [1,-1]){
    const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
    p.position.set(x,y,z+s*.014);
    if(s<0)p.rotation.y=Math.PI;
    parent.add(p);
  }
  return mat;
}
/* ── 静态合批：把一片装饰里成百上千个小零件按材质合并成少数几个 mesh ──
   新增摊位/店铺/围栏后几何体涨到 7000+，draw call 直接压死帧；
   同一材质合并成一个 mesh，视觉完全不变，调用量能降一个量级。 */
function mergeGeos(list){
  let total=0;
  for(const g of list)total+=g.attributes.position.count;
  const pos=new Float32Array(total*3),nor=new Float32Array(total*3),uv=new Float32Array(total*2);
  let o=0;
  for(const g of list){
    const p=g.attributes.position;
    pos.set(p.array,o*3);
    if(g.attributes.normal)nor.set(g.attributes.normal.array,o*3);
    if(g.attributes.uv)uv.set(g.attributes.uv.array,o*2);
    o+=p.count;
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  out.computeBoundingSphere();
  return out;
}
/* 把 root 子树里所有静态 mesh 按「材质+是否投影」合并；skip 里的对象（会动的）原样保留 */
function mergeStatic(root,skip){
  root.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets=new Map(),victims=[];
  const walk=o=>{
    for(const ch of o.children){
      if(skip&&skip.has(ch))continue;
      if(ch.isInstancedMesh)continue;              // InstancedMesh 自身已合批，严禁被拆成原点单例
      if(ch.userData&&ch.userData.keep)continue;   // 标记 keep 的整棵子树不参与合批
      if(ch.isMesh){
        let g=ch.geometry.clone();
        if(g.index)g=g.toNonIndexed();
        g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,ch.matrixWorld));
        const key=ch.material.uuid+'|'+(ch.castShadow?1:0);
        if(!buckets.has(key))buckets.set(key,{mat:ch.material,cast:ch.castShadow,list:[]});
        buckets.get(key).list.push(g);
        victims.push(ch);
      }else walk(ch);
    }
  };
  walk(root);
  for(const v of victims){ if(v.parent)v.parent.remove(v); v.geometry.dispose(); }
  for(const b of buckets.values()){
    const mesh=new THREE.Mesh(mergeGeos(b.list),b.mat);
    mesh.castShadow=b.cast;mesh.receiveShadow=true;
    mesh.userData.tag=root.userData.tag;
    root.add(mesh);
    for(const g of b.list)g.dispose();
  }
}

/* ════════════════════════════════════════════════════════════
   1. 渲染器 / 场景 / 相机（高画质直出 + 极速半分辨率泛光管线）
   ════════════════════════════════════════════════════════════ */
const host=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',stencil:false});
/* ── 渲染分辨率分端策略 ──
   手机 DPR 通常是 2~3，1.55 的像素比在 6.7 寸屏上意味着渲染 ~3800×2000，
   再叠加 Bloom 的多级全屏 pass，填充率直接爆掉 → 掉帧、发热。
   触屏设备压到 1.15（画面依然锐利，渲染量降到桌面的 ~55%），
   并把泛光降到 0.35 倍分辨率，再配合阴影降频，手机上才跑得动。 */
const _forceMobile=new URLSearchParams(location.search).has('mobile');
const IS_TOUCH_DEV=_forceMobile||('ontouchstart' in window)||(navigator.maxTouchPoints>0)||innerWidth<820;
const HI_DPR=IS_TOUCH_DEV?Math.min(devicePixelRatio||1,1.15):Math.min(devicePixelRatio||1,1.55);
const LO_DPR=Math.min(HI_DPR,IS_TOUCH_DEV?.92:1.05);
renderer.setPixelRatio(HI_DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
renderer.shadowMap.needsUpdate=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=IS_TOUCH_DEV?1.18:1.12;

const animeOutlineShader={
  uniforms:{
    tDiffuse:{value:null},
    uRes:{value:new THREE.Vector2(Math.max(1,innerWidth*HI_DPR),Math.max(1,innerHeight*HI_DPR))},
    uHQ:{value:1.0}
  },
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform float uHQ;
    varying vec2 vUv;
    float luma(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}
    void main(){
      vec2 tx=1.0/uRes;
      vec4 base=texture2D(tDiffuse,vUv);
      vec3 cTl=texture2D(tDiffuse,vUv+vec2(-tx.x, tx.y)).rgb;
      vec3 cTm=texture2D(tDiffuse,vUv+vec2( 0.0,  tx.y)).rgb;
      vec3 cTr=texture2D(tDiffuse,vUv+vec2( tx.x, tx.y)).rgb;
      vec3 cMl=texture2D(tDiffuse,vUv+vec2(-tx.x, 0.0)).rgb;
      vec3 cMr=texture2D(tDiffuse,vUv+vec2( tx.x, 0.0)).rgb;
      vec3 cBl=texture2D(tDiffuse,vUv+vec2(-tx.x,-tx.y)).rgb;
      vec3 cBm=texture2D(tDiffuse,vUv+vec2( 0.0, -tx.y)).rgb;
      vec3 cBr=texture2D(tDiffuse,vUv+vec2( tx.x,-tx.y)).rgb;
      float tl=luma(cTl),tm=luma(cTm),tr=luma(cTr);
      float ml=luma(cMl),mr=luma(cMr);
      float bl=luma(cBl),bm=luma(cBm),br=luma(cBr);
      float gx=-tl-2.0*ml-bl+tr+2.0*mr+br;
      float gy=-tl-2.0*tm-tr+bl+2.0*bm+br;
      // 局部微对比度（轻量化 Cavity AO 质感）+ 轻柔轮廓墨线
      vec3 avgCol=(cTl+cTm+cTr+cMl+cMr+cBl+cBm+cBr)*0.125;
      float avgL=(tl+tm+tr+ml+mr+bl+bm+br)*0.125;
      float edge=smoothstep(0.32,0.68,sqrt(gx*gx+gy*gy));
      float centerL=luma(base.rgb);
      float edgeMask=smoothstep(0.06,0.18,centerL)*(1.0-smoothstep(0.70,1.00,centerL));
      vec3 ink=vec3(0.08,0.10,0.18);
      vec3 col=mix(base.rgb,ink,edge*edgeMask*0.16);
      col*=(1.0+clamp((centerL-avgL)*0.28,-0.08,0.08));
      // UE5 电影级高光柔化肩部曲线 (Filmic Highlight Shoulder) + 新海诚/光遇冷暖分级：
      // 仅对接近过曝(>0.68)的强光地面做丝滑软膝压缩防死白，中低亮度与主灯光保持璀璨通透
      float g=luma(col);
      vec3 hiShoulder=col/(vec3(1.0)+max(col-vec3(0.68),vec3(0.0))*0.48);
      col=mix(col,hiShoulder,smoothstep(0.62,0.96,g));
      g=luma(col);
      vec3 shinkaiShadow=mix(col,col*vec3(0.80,0.90,1.20),(0.38+0.12*uHQ)*(1.0-smoothstep(0.04,0.44,g)));
      vec3 shinkaiWarm=mix(shinkaiShadow,shinkaiShadow*vec3(1.08,1.02,0.91),smoothstep(0.46,0.95,g)*(0.40+0.14*uHQ));
      col=mix(vec3(g),shinkaiWarm,1.12+0.06*uHQ);
      if(uHQ>0.5){
        // 高画质抗闪烁柔光滤镜：采用 9 邻域预滤波均值稳定提取高光，彻底消除移动时细小路灯亚像素闪烁
        col=max(vec3(0.0),(col-0.010)*1.035);
        float filteredL=mix(centerL,avgL,0.68);
        float pureLight=smoothstep(0.82,0.98,filteredL);
        col+=max(avgCol-vec3(0.74),vec3(0.0))*vec3(1.12,0.96,0.78)*pureLight*0.22;
      }
      float vig=1.0-smoothstep(0.38,0.95,length(vUv-vec2(0.5)))*(0.12+0.03*uHQ);
      col*=vig;
      gl_FragColor=vec4(col,base.a);
    }
  `
};

/* ── 半分辨率 (0.5x) 抗闪烁光遇柔光泛光管线：

// 通用：博物馆暖金画框画作（挂墙 / 立面用）
function makeFramedArt(w,h,tex,opts={}){
  const g=new THREE.Group();
  const frameM=M(opts.frameCol||0xd4a852,{roughness:.36,metalness:.55,flatShading:false});
  const matM=M(opts.matCol||0xf4eee4,{roughness:.88,flatShading:false});
  add(g,BX(w+.18,h+.18,.07),frameM,0,0,0);
  add(g,BX(w+.06,h+.06,.082),matM,0,0,.004);
  const artMat=new THREE.MeshStandardMaterial({
    map:tex,emissiveMap:opts.glow?tex:null,emissive:opts.glow?0xffffff:0x000000,
    emissiveIntensity:opts.glow||0,roughness:.42,metalness:.05
  });
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(w,h),artMat);
  pl.position.z=.049;g.add(pl);
  return g;
}

// 通用：户外覆雪暖光立式打卡画框灯箱（支持单面或双面，带底座、圣诞花环与头顶雪冠）
function makePhotoMonument(w,h,tex,opts={}){
  const g=new THREE.Group();
  const bodyM=M(0x232b34,{roughness:.52,metalness:.55,flatShading:false});
  const trimM=M(0xd6a954,{roughness:.35,metalness:.65,flatShading:false});
  const baseH=opts.baseH||.36, cy=baseH+h*.5+.14;
  add(g,BX(w+.46,baseH,.64),M(0x2b333d,{roughness:.68,metalness:.35}),0,baseH*.5,0);
  add(g,BX(w+.52,.07,.70),snowCapM,0,baseH+.035,0);
  add(g,BX(w+.28,h+.28,.20),bodyM,0,cy,0);
  add(g,BX(w+.34,h+.34,.12),trimM,0,cy,0);
  addNS(g,BX(w+.42,.12,.32),snowCapM,0,cy+h*.5+.19,0);
  const pMat=new THREE.MeshStandardMaterial({
    map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:opts.glow||.55,roughness:.38
  });
  const front=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pMat);
  front.position.set(0,cy,.106);g.add(front);
  if(opts.double){
    const back=new THREE.Mesh(new THREE.PlaneGeometry(w,h),pMat);
    back.position.set(0,cy,-.106);back.rotation.y=Math.PI;g.add(back);
  }
  if(opts.wreath!==false){
    const wr=buildWreath(.26);wr.position.set(0,cy+h*.5+.16,.16);g.add(wr);
  }
  return g;
}

/* ════════════════════════════════════════════════════════════
   4.5 值噪声 / 遮罩烘焙 / 平面反射 / 湿地材质
   做法参考 Saltline：湿区和水洼不是手绘贴图，而是 JS 侧用值噪声
   算出一个场，烘成遮罩交给 shader；雨量是 uniform，不用重建粒子。
   ════════════════════════════════════════════════════════════ */
function makeNoise(seed){
  const N=256,perm=new Uint8Array(N*2),val=new Float32Array(N);
  let s=seed>>>0;
  const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  for(let i=0;i<N;i++){perm[i]=i;val[i]=rnd();}
  for(let i=N-1;i>0;i--){const j=(rnd()*(i+1))|0,t=perm[i];perm[i]=perm[j];perm[j]=t;}
  for(let i=0;i<N;i++)perm[i+N]=perm[i];
  const sm=t=>t*t*(3-2*t);
  const v2=(x,y)=>val[perm[(perm[x&255]+(y&255))&255]];
  return{
    noise(x,y){
      const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
      const u=sm(xf),v=sm(yf);
      const a=v2(xi,yi),b=v2(xi+1,yi),c=v2(xi,yi+1),d=v2(xi+1,yi+1);
      const t=a+(b-a)*u;
      return t+(c+(d-c)*u-t)*v;
    },
    fbm(x,y,oct){
      oct=oct||4;let h=0,f=.5,p=0;
      for(let i=0;i<oct;i++){h+=this.noise(x,y)*f;p+=f;x=x*2.03+17.1;y=y*2.03+9.7;f*=.5;}
      return h/p;
    },
    rnd
  };
}
/* 把标量场烘成遮罩贴图：R=湿度 G=水洼/油污 B=磨损 */
function bakeMask(size,rect,fn){
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d'),img=ctx.createImageData(size,size),d=img.data;
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const wx=rect.x0+(i+0.5)/size*rect.w;
    const wz=rect.z0+(j+0.5)/size*rect.h;
    const o=fn(wx,wz),p=(j*size+i)*4;
    d[p]=o[0]*255;d[p+1]=o[1]*255;d[p+2]=o[2]*255;d[p+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;
  t.generateMipmaps=false;
  return t;
}

/* ── 平面反射：镜像相机 + 离屏 RT ───────────────────────── */
const planar={
  enabled:true,target:null,camera:null,matrix:new THREE.Matrix4(),
  height:.035,hideList:[],_hideCache:null,_hiddenNow:[],
  buildCache(){
    this._hideCache=[];
    scene.traverse(o=>{
      if(!o.isMesh&&!o.isPoints&&!o.isLine)return;
      const addBlend=o.material&&o.material.blending===THREE.AdditiveBlending;
      if(o.userData.noReflect||(addBlend&&!o.userData.inReflect)||this.hideList.indexOf(o)>=0){
        this._hideCache.push(o);
      }
    });
  },
  init(){
    this.target=new THREE.WebGLRenderTarget(832,468,{type:THREE.HalfFloatType,depthBuffer:true,stencilBuffer:false});
    this.target.texture.minFilter=THREE.LinearFilter;
    this.target.texture.magFilter=THREE.LinearFilter;
    this.target.texture.generateMipmaps=false;
    this.camera=new THREE.PerspectiveCamera();
    this._v=new THREE.Vector3();this._t=new THREE.Vector3();
    this._look=new THREE.Vector3();this._cp=new THREE.Vector3();
    this._rot=new THREE.Matrix4();this._n=new THREE.Vector3(0,1,0);
  },
  render(){
    if(!this.enabled||!this.target)return;
    this.renders=(this.renders||0)+1;
    const c=this.camera,r=camera;
    r.updateMatrixWorld();
    this._cp.setFromMatrixPosition(r.matrixWorld);
    this._rot.extractRotation(r.matrixWorld);
    this._v.set(0,this.height,0).sub(this._cp).reflect(this._n).negate();
    this._v.y+=this.height;
    this._look.set(0,0,-1).applyMatrix4(this._rot).add(this._cp);
    this._t.set(0,this.height,0).sub(this._look).reflect(this._n).negate();
    this._t.y+=this.height;
    c.position.copy(this._v);
    c.up.set(0,1,0).applyMatrix4(this._rot).reflect(this._n);
    c.lookAt(this._t);
    c.near=r.near;c.far=r.far;c.fov=r.fov;c.aspect=r.aspect;
    c.updateProjectionMatrix();c.updateMatrixWorld();
    this.matrix.set(.5,0,0,.5, 0,.5,0,.5, 0,0,.5,.5, 0,0,0,1);
    this.matrix.multiply(c.projectionMatrix);
    this.matrix.multiply(c.matrixWorldInverse);
    // 用缓存列表代替每帧全树遍历
    if(!this._hideCache)this.buildCache();
    const hidden=this._hiddenNow;hidden.length=0;
    for(let i=0;i<this._hideCache.length;i++){
      const o=this._hideCache[i];
      if(o.visible){o.visible=false;hidden.push(o);}
    }
    const old=renderer.getRenderTarget();
    renderer.setRenderTarget(this.target);
    renderer.clear();
    renderer.render(scene,c);
    renderer.setRenderTarget(old);
    for(const o of hidden)o.visible=true;
  }
};

/* ── 湿地材质：注入湿度/水洼/雨痕/平面反射 ───────────────── */
const wetRegistry=[];
const wetShared={
  uTime:{value:0},uRain:{value:0},
  uRefl:{value:null},uTexMat:{value:new THREE.Matrix4()},
  uReflOn:{value:1}
};
function wetMaterial(opts,mask,rect,cfg){
  cfg=cfg||{};
  const m=new THREE.MeshStandardMaterial(opts);
  const u={
    uTime:wetShared.uTime,uRain:wetShared.uRain,
    uRefl:wetShared.uRefl,uTexMat:wetShared.uTexMat,uReflOn:wetShared.uReflOn,
    uMask:{value:mask},
    uMaskRect:{value:new THREE.Vector4(rect.x0,rect.z0,rect.w,rect.h)},
    uReflStr:{value:cfg.refl!==undefined?cfg.refl:.55},
    uWetAmt:{value:cfg.wet!==undefined?cfg.wet:1},
    uMarkAmt:{value:cfg.mark!==undefined?cfg.mark:0}
  };
  m.userData.u=u;
  wetRegistry.push({m,base:cfg.wet!==undefined?cfg.wet:1});
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,u);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
        uniform mat4 uTexMat; uniform vec4 uMaskRect;
        varying vec3 vWPos; varying vec4 vReflC;`)
      .replace('#include <project_vertex>',`#include <project_vertex>
        vec4 _wp = modelMatrix * vec4(transformed,1.0);
        vWPos = _wp.xyz;
        vReflC = uTexMat * _wp;`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
        uniform float uTime,uRain,uReflOn,uReflStr,uWetAmt,uMarkAmt;
        uniform sampler2D uMask,uRefl;
        uniform vec4 uMaskRect;
        varying vec3 vWPos; varying vec4 vReflC;
        vec4 gMk;
        float gH(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
        float gVN(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(gH(i),gH(i+vec2(1.,0.)),f.x),mix(gH(i+vec2(0.,1.)),gH(i+vec2(1.,1.)),f.x),f.y);}`)
      .replace('#include <map_fragment>',`#include <map_fragment>
        vec2 _muv = (vWPos.xz - uMaskRect.xy)/uMaskRect.zw;
        gMk = texture2D(uMask,clamp(_muv,vec2(.001),vec2(.999)));
        diffuseColor.rgb *= mix(1.0,0.26,gMk.g*uMarkAmt);`)
      .replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
        float _wet = clamp(gMk.r*uWetAmt,0.0,1.0);
        float _pud = clamp(gMk.g*uWetAmt,0.0,1.0);
        roughnessFactor = mix(roughnessFactor,0.075,_wet*0.9);
        roughnessFactor = mix(roughnessFactor,0.022,_pud*0.7);`)
      .replace('#include <opaque_fragment>',`#include <opaque_fragment>
        if(uReflOn>0.5 && uReflStr>0.0){
          vec2 _ruv = vReflC.xy/max(vReflC.w,0.0001);
          float _n1 = gVN(vWPos.xz*1.7+vec2(uTime*.30,uTime*.19));
          float _n2 = gVN(vWPos.xz*2.3-vec2(uTime*.21,uTime*.33));
          float _st = gVN(vec2(vWPos.x*2.6,vWPos.z*.55+uTime*5.2));
          _ruv += (vec2(_n1,_n2)-0.5)*0.016*uRain;
          _ruv += vec2(0.0,(_st-.5))*0.012*uRain;   // 竖向雨痕把倒影拉花
          vec3 _rc = texture2D(uRefl,clamp(_ruv,vec2(.002),vec2(.998))).rgb;
          vec3 _V = normalize(vViewPosition);
          float _f = pow(1.0-clamp(dot(normal,_V),0.0,1.0),3.0);
          float _reflK=clamp(uReflStr*_wet*(0.22+0.78*_f)*(0.35+0.65*uRain),0.0,0.85);
          gl_FragColor.rgb=mix(gl_FragColor.rgb,max(gl_FragColor.rgb,_rc),_reflK*0.72)+_rc*_reflK*0.25;
        }`);
  };
  m.customProgramCacheKey=()=>'wetshader';
  return m;
}

/* ── 地面遮罩 ─────────────────────────────────────────── */
const nRoad=makeNoise(20261121);
const roadMask=bakeMask(512,{x0:-48,z0:-28,w:96,h:56},(x,z)=>{
  const n=nRoad.fbm(x*.085,z*.13,4);
  const n2=nRoad.fbm(x*.30+51,z*.24,3);
  const pud=Math.max(0,n2-.55)/.45;
  const wet=Math.min(1,.42+n*.5+pud*.45);
  const grain=nRoad.fbm(x*1.7,z*1.7,2);
  return[wet,pud,grain];
});

function bakeTex(size,fn){
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d'),img=ctx.createImageData(size,size),d=img.data;
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const o=fn((i+.5)/size,(j+.5)/size),p=(j*size+i)*4;
    d[p]=o[0]*255;d[p+1]=o[1]*255;d[p+2]=o[2]*255;d[p+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=4;
  return t;
}

  const rust=nSteel.fbm(u*3.3+31,v*3.3+17,4);
  const rr=Math.max(0,rust-.52)/.48;
  let r=.38+g*.12,gg=.40+g*.12,b=.42+g*.12;
  r=r*(1-rr)+.46*rr;gg=gg*(1-rr)+.22*rr;b=b*(1-rr)+.10*rr;
  return[r,gg,b];
});

/* ── 闭合环城圣诞大道（连成完整圆角环路，绕行艺术馆、西花坛与动漫雪园） ── */
const LOOP=(()=>{
  const xA=44,zS=15.0,zN=-21.0,r=10.0,halfW=4.45;
  const xW=-xA-r, xE=xA+r, zSC=zS-r, zNC=zN+r; // xW=-54, xE=54, zSC=5, zNC=-11
  const sxLen=xA*2, szLen=zSC-zNC, arcLen=Math.PI*0.5*r;
  const totalLen=2*sxLen+2*szLen+4*arcLen;
  function sample(s,off=0){
    let u=((s%totalLen)+totalLen)%totalLen;
    if(u<sxLen){ // South: (+xA,zS) -> (-xA,zS)
      const x=xA-u;
      return{x,z:zS+off,tx:-1,tz:0,nx:0,nz:1};
    }
    u-=sxLen;
    if(u<arcLen){ // SW corner: (+PI/2 -> +PI) around (-xA, zSC)
      const a=Math.PI*.5+(u/arcLen)*Math.PI*.5,ca=Math.cos(a),sa=Math.sin(a);
      return{x:-xA+(r+off)*ca,z:zSC+(r+off)*sa,tx:-sa,tz:ca,nx:ca,nz:sa};
    }
    u-=arcLen;
    if(u<szLen){ // West: (-xW, zSC) -> (-xW, zNC)
      const z=zSC-u;
      return{x:xW-off,z,tx:0,tz:-1,nx:-1,nz:0};
    }
    u-=szLen;
    if(u<arcLen){ // NW corner: (+PI -> +1.5*PI) around (-xA, zNC)
      const a=Math.PI+(u/arcLen)*Math.PI*.5,ca=Math.cos(a),sa=Math.sin(a);
      return{x:-xA+(r+off)*ca,z:zNC+(r+off)*sa,tx:-sa,tz:ca,nx:ca,nz:sa};
    }
    u-=arcLen;
    if(u<sxLen){ // North: (-xA, zN) -> (+xA, zN)
      const x=-xA+u;
      return{x,z:zN-off,tx:1,tz:0,nx:0,nz:-1};
    }
    u-=sxLen;
    if(u<arcLen){ // NE corner: (-PI/2 -> 0) around (+xA, zNC)
      const a=-Math.PI*.5+(u/arcLen)*Math.PI*.5,ca=Math.cos(a),sa=Math.sin(a);
      return{x:xA+(r+off)*ca,z:zNC+(r+off)*sa,tx:-sa,tz:ca,nx:ca,nz:sa};
    }
    u-=arcLen;
    if(u<szLen){ // East: (+xE, zNC) -> (+xE, zSC)
      const z=zNC+u;
      return{x:xE+off,z,tx:0,tz:1,nx:1,nz:0};
    }
    u-=szLen; // SE corner: (0 -> +PI/2) around (+xA, zSC)
    const a=(u/arcLen)*Math.PI*.5,ca=Math.cos(a),sa=Math.sin(a);
    return{x:xA+(r+off)*ca,z:zSC+(r+off)*sa,tx:-sa,tz:ca,nx:ca,nz:sa};
  }
  function distToCenter(x,z){
    const qx=Math.max(0,Math.abs(x)-xA);
    const cz=(zS+zN)*.5, hz=(zS-zN)*.5-r;
    const qz=Math.max(0,Math.abs(z-cz)-hz);
    if(qx>0&&qz>0)return Math.abs(Math.hypot(qx,qz)-r);
    return Math.min(Math.abs(Math.abs(z-cz)-(zS-cz)),Math.abs(Math.abs(x)-xE));
  }
  return{xA,zS,zN,xW,xE,zSC,zNC,r,halfW,totalLen,sample,distToCenter};
})();

function makeLoopRibbon(halfW,y,uTile,segs=260,centerOff=0){
  const pos=[],norm=[],uv=[],idx=[];
  for(let i=0;i<=segs;i++){
    const s=(i/segs)*LOOP.totalLen;
    const pIn=LOOP.sample(s,centerOff-halfW);
    const pOut=LOOP.sample(s,centerOff+halfW);
    pos.push(pIn.x,y,pIn.z, pOut.x,y,pOut.z);
    norm.push(0,1,0, 0,1,0);
    uv.push(s/uTile,0, s/uTile,1);
    if(i<segs){
      const a=i*2,b=a+1,c=a+2,d=a+3;
      idx.push(a,c,b, c,d,b);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(norm,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx);
  return geo;
}

const cypressTex=(()=>{
  const [c,g]=cv(256,256);
  const bg=g.createLinearGradient(0,0,0,256);
  bg.addColorStop(0,'#245c36');bg.addColorStop(.55,'#194728');bg.addColorStop(1,'#0f301a');
  g.fillStyle=bg;g.fillRect(0,0,256,256);
  for(let i=0;i<1400;i++){
    const x=R(0,256),y=R(0,256),len=R(5,13),ang=R(1.15,1.99);
    g.strokeStyle=i%3===0?'rgba(56,126,74,.52)':(i%3===1?'rgba(14,42,22,.58)':'rgba(36,94,52,.48)');
    g.lineWidth=R(1.2,2.4);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);g.stroke();
  }
  const t=ctex(c,[3,2]);
  return t;
})();

const mullMat=M(0x22282e,{roughness:.5,metalness:.75});

function facade(w,h,x,y,z,rotY,tag){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=rotY;shop.add(g);
  const pane=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat);
  pane.receiveShadow=false;pane.castShadow=false;pane.userData.tag=tag;
  g.add(pane);
  // 竖挺：间距放宽到 3.6m，截面减细到 .06×.10 —— 室内看是疏朗的框架而不是一排柱子
  const n=Math.max(2,Math.round(w/3.6));
  const mull=new THREE.InstancedMesh(BX(.06,h,.10),mullMat,n+1);
  const mm=new THREE.Matrix4();
  for(let i=0;i<=n;i++){mm.makeTranslation(-w/2+i*(w/n),0,0);mull.setMatrixAt(i,mm);}
  mull.instanceMatrix.needsUpdate=true;g.add(mull);
  // 横挺
  const hm=new THREE.InstancedMesh(BX(w,.1,.16),mullMat,2);
  hm.setMatrixAt(0,mm.makeTranslation(0,h/2,0));
  hm.setMatrixAt(1,mm.makeTranslation(0,-h/2+.02,0));
  hm.instanceMatrix.needsUpdate=true;g.add(hm);
  // 底部矮墙
  const kw=add(g,BX(w,.55,.22),M(0x2f363e,{roughness:.8}),0,-h/2+.27,0);
  kw.castShadow=false;
  return g;
}

/* 流线型现代轿跑车（同坐标系双 ExtrudeGeometry 车身+座舱，带独立悬架底盘与可旋转车轮） */
function buildCar(color,o={}){
  const g=new THREE.Group();
  const chassis=new THREE.Group();g.add(chassis);
  const L=o.len||4.3, W=o.wid||1.86, hz=L/2;
  const _carCol=new THREE.Color(color||0xe8edf4).lerp(new THREE.Color(0xcbd8ea),.16);
  const bodyM=new THREE.MeshPhysicalMaterial({
    color:_carCol,roughness:.44,metalness:.16,clearcoat:.34,clearcoatRoughness:.24,envMapIntensity:.48
  });
  const dark=M(0x232b36,{roughness:.82,metalness:.05,envMapIntensity:.2,flatShading:false});
  const trimM=M(0xd4dde8,{roughness:.28,metalness:.65,envMapIntensity:.65,flatShading:false});
  const caliperM=M(0xc9382b,{roughness:.4,metalness:.5});
  const glassM=new THREE.MeshPhysicalMaterial({
    color:0x244068,emissive:0x162b4a,emissiveIntensity:.38,roughness:.14,metalness:.10,clearcoat:.65,clearcoatRoughness:.12,envMapIntensity:.85
  });
  const hl=new THREE.MeshBasicMaterial({color:0xfff3d4});
  const tl=new THREE.MeshBasicMaterial({color:0xff4d5a});
  const hl_day=new THREE.MeshBasicMaterial({color:0xbce6ff});

  // Helper: 2D侧影(+X为车头) 挤出并旋转对齐 +Z 车头 / -Z 车尾，X 居中
  function extrudeProfile(shape, width, bev){
    const geo=new THREE.ExtrudeGeometry(shape,{
      depth:width,bevelEnabled:bev>0,bevelThickness:bev,bevelSize:bev,bevelSegments:3,curveSegments:12
    });
    geo.rotateY(-Math.PI/2); // (+x, y, z) -> (-z, y, +x)，因此 +x 精准成为 +Z 车头！
    geo.translate(width/2, 0, 0);
    return geo;
  }

  // 1. 下半部流线车身轮廓（+X = 车头前脸，-X = 车尾；带真实半圆轮拱镂空，彻底零穿模）
  const wr=L*.305, ar=.395;

function easel(x,z,rot,artColor,artH){
  const g=new THREE.Group();g.position.set(x,F2,z);g.rotation.y=rot;shop2.add(g);

    leg.rotation.x=-TILT;leg.rotation.z=-s*.025;
  }
  add(g,BX(1.26,.07,.07),woodM,0,1.87,-.22);    // 上横梁
  add(g,BX(.07,2.05,.07),woodM,0,1.0,-.245);    // 后立柱：画板靠着它
  add(g,BX(1.16,.06,.28),woodM,0,.52,-.13);     // 托板：画板底边坐这儿
  const cg=new THREE.Group();                  // 画板（自带后倾角）
  cg.position.set(0,.555+ch/2*.9916,-.02-ch/2*.1296);
  cg.rotation.x=-.13;
  g.add(cg);
  add(cg,BX(1.05,ch,.05),M(0xe8e2d2,{roughness:.94}),0,0,0);
  if(artColor&&artColor.isTexture){
    const pm=new THREE.Mesh(new THREE.PlaneGeometry(.92,ch*.88),new THREE.MeshStandardMaterial({
      map:artColor,emissiveMap:artColor,emissive:0xffffff,emissiveIntensity:.18,roughness:.55

    pm.position.z=.032;cg.add(pm);
  }else if(artColor){
    add(cg,BX(.66,ch*.46,.02),M(artColor,{roughness:.9}),-.12,ch*.12,.038);
    add(cg,BX(.28,ch*.24,.02),M(0xd9c9a8,{roughness:.9}),.26,-ch*.2,.038);
  }
  return g;
}

/* 两点之间的圆柱（四肢用，避免用欧拉角硬凑朝向） */
function limb(g,ax,ay,az,bx,by,bz,r,mat){
  const dx=bx-ax,dy=by-ay,dz=bz-az;
  const len=Math.hypot(dx,dy,dz);
  const m=add(g,new THREE.CylinderGeometry(r,r,len,8),mat,(ax+bx)/2,(ay+by)/2,(az+bz)/2);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,dz).normalize());
  return m;
}

  for(const s of [-1,1]){

    const earG=new THREE.Group();
    earG.position.set(-.055,.170,s*.142);
    earG.rotation.set(-s*.30,s*.16,.12);
    headG.add(earG);
    const earOut=add(earG,new THREE.SphereGeometry(.062,14,12),hide,0,0,0);

  /* 路灯光幕锥体：所有路灯共用同一份几何与材质
     顶点色沿轴向：灯口最亮、地面端保留 0.45 的浓度。
     注意锥体是「尖端在灯口、大面在地面」，如果把亮度全压在尖端，

  const lampConeGeo=(()=>{
    const geo=new THREE.ConeGeometry(2.6,5.8,32,1,true);
    const pa=geo.attributes.position, cols=new Float32Array(pa.count*3);
    for(let i=0;i<pa.count;i++){

      const f=.45+.55*Math.pow(t,1.5);
      cols[i*3]=f;cols[i*3+1]=f;cols[i*3+2]=f;

    geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
    return geo;
  })();

/* ══ 喷泉雪地写实流线动物雕刻系统：连续曲面放样身躯 + 收腹弓背 + 飞节弯折四肢 + 顶点毛色渐变（狐狸 / 名犬 / 小花猫） ══ */
const liveAnimals=[];
const _vc=new THREE.Color();

// 核心 1：沿脊柱从后(-Z)到前(+Z)放样连续解剖躯干/头颅（支持上下不对称 ryTop / ryBot 刻画深胸收腹与鼻梁止部）
function loftProfile(rings,segs,colFn,matOpts={}){
  const pos=[],col=[],idx=[],stride=segs+1;
  for(let i=0;i<rings.length;i++){
    const r=rings[i], u=i/(rings.length-1);
    for(let j=0;j<=segs;j++){
      const th=(j/segs)*Math.PI*2, sx=Math.sin(th), cy=Math.cos(th);
      const x=sx*r.rx;
      const y=r.y+(cy>=0?cy*r.ryTop:cy*r.ryBot);
      const z=r.z+(r.tiltY?cy*r.tiltY:0);
      pos.push(x,y,z);
      _vc.setHex(colFn(u,th,x,y,z,r));
      col.push(_vc.r,_vc.g,_vc.b);
    }
  }
  for(let i=0;i<rings.length-1;i++){
    for(let j=0;j<segs;j++){
      const a=i*stride+j,b=(i+1)*stride+j,c=i*stride+j+1,d=(i+1)*stride+j+1;
      idx.push(a,b,c, b,d,c);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial(Object.assign({vertexColors:true,roughness:.84,metalness:.02,flatShading:false},matOpts));
  const m=new THREE.Mesh(geo,mat);
  m.castShadow=true;m.receiveShadow=true;
  return m;
}

// 核心 2：沿真实四足骨骼弯折关节从上(+Y)向下(0)放样修长四肢（含肘部与后腿飞节弯角 + 掌垫落地）
function loftLimb(nodes,segs,colFn){
  const pos=[],col=[],idx=[],stride=segs+1;
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i], u=i/(nodes.length-1);
    for(let j=0;j<=segs;j++){
      const th=(j/segs)*Math.PI*2;
      const x=n[0]+Math.cos(th)*n[3];
      const y=n[1];
      const z=n[2]+Math.sin(th)*n[4];
      pos.push(x,y,z);
      _vc.setHex(colFn(u,th,x,y,z));
      col.push(_vc.r,_vc.g,_vc.b);
    }
  }
  for(let i=0;i<nodes.length-1;i++){
    for(let j=0;j<segs;j++){
      const a=i*stride+j,b=(i+1)*stride+j,c=i*stride+j+1,d=(i+1)*stride+j+1;
      idx.push(a,c,b, c,d,b); // (-Y)x(+Z)=+X -> (a,c,b) 严格朝外
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,metalness:.02,flatShading:false}));
  m.castShadow=true;m.receiveShadow=true;
  return m;
}

// 核心 3：内凹曲面立体耳廓（前凹耳窝、后凸耳背，告别纸锥感）
function sculptEar(w,h,outCol,inCol){
  const pos=[],col=[],idx=[];
  const rows=6, cols=8, stride=cols+1;
  for(let i=0;i<=rows;i++){
    const v=i/rows, width=w*Math.sin((1-v*.86)*Math.PI*.5)*(v<.15?.7+v*2:1);
    const zCurve=-Math.pow(v,1.6)*w*.28;
    for(let j=0;j<=cols;j++){
      const u=j/cols, a=u*Math.PI*2;
      const sx=Math.cos(a)*width*.5;
      const front=Math.sin(a)>0;
      const sz=zCurve+Math.sin(a)*width*(front?.12:.36)-(front?width*.14*(1-v):0);
      pos.push(sx,v*h,sz);
      _vc.setHex(front&&v>.08&&v<.88?inCol:outCol);
      col.push(_vc.r,_vc.g,_vc.b);
    }
  }
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
    const a=i*stride+j,b=(i+1)*stride+j,c=i*stride+j+1,d=(i+1)*stride+j+1;
    idx.push(a,c,b, c,d,b);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.86,side:THREE.DoubleSide,flatShading:false}));
}

// 核心 4：沿自然样条曲线放样渐细蓬松尾巴（支持白尾尖/斑纹着色）
function loftTail(pts,rads,segs,colFn){
  const curve=new THREE.CatmullRomCurve3(pts);
  const frames=curve.computeFrenetFrames(12,false);
  const pos=[],col=[],idx=[],steps=12,stride=segs+1;
  for(let i=0;i<=steps;i++){
    const u=i/steps, p=curve.getPointAt(u), N=frames.normals[i], B=frames.binormals[i];
    const rad=rads(u);
    for(let j=0;j<=segs;j++){
      const th=(j/segs)*Math.PI*2, c=Math.cos(th), s=Math.sin(th);
      const vx=p.x+(N.x*c+B.x*s)*rad, vy=p.y+(N.y*c+B.y*s)*rad, vz=p.z+(N.z*c+B.z*s)*rad;
      pos.push(vx,vy,vz);
      _vc.setHex(colFn(u,th,vx,vy,vz));
      col.push(_vc.r,_vc.g,_vc.b);
    }
  }
  for(let i=0;i<steps;i++)for(let j=0;j<segs;j++){
    const a=i*stride+j,b=(i+1)*stride+j,c=i*stride+j+1,d=(i+1)*stride+j+1;
    idx.push(a,c,b, c,d,b);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.88,flatShading:false}));
  m.castShadow=true;return m;
}

// 通用安装斜嵌入杏仁眼眸（内嵌眶位不突兀）
function attachEyes(headG,ex,ey,ez,angY,irisCol,pupilCol=0x0b0b0d,r=.016){

    const ball=addNS(eg,new THREE.SphereGeometry(r,12,10),eyeMat,0,0,0);

/* 1. 雕刻级流线狐狸（赤狐 / 北极白狐 / 银狐） */
function buildFox(breed='red'){
  const g=new THREE.Group();
  const pal={

  const hipY=.405;
  // 连续放样躯干：臀部 -> 紧致高收腰 -> 深胸骨 -> 流线前倾纤颈
  g.add(loftProfile([
    {z:-.27,y:.41, rx:.004,ryTop:.004,ryBot:.004},
    {z:-.23,y:.41, rx:.072,ryTop:.074,ryBot:.072},
    {z:-.14,y:.425,rx:.092,ryTop:.094,ryBot:.082}, // 饱满后胯股（包裹后腿根）
    {z:-.03,y:.435,rx:.070,ryTop:.078,ryBot:.054}, // 明显敏捷收腹腰线

    {z:+.21,y:.445,rx:.078,ryTop:.082,ryBot:.095}, // 胸前围脖蓬毛
    {z:+.26,y:.51, rx:.058,ryTop:.060,ryBot:.065}, // 颈根
    {z:+.29,y:.575,rx:.046,ryTop:.048,ryBot:.048}  // 颈上端
  ],18,(u,th,x,y,z)=>{
    const cy=Math.cos(th);
    if(cy<-.25||(u>.66&&cy<.18))return pal.belly;
    return pal.coat;
  }));

  // 连续放样狐狸头颅与尖细口鼻止部（无球拼管！）
  const headG=new THREE.Group();headG.position.set(0,.575,.285);g.add(headG);
  headG.add(loftProfile([
    {z:-.07,y:-.01,rx:.044,ryTop:.048,ryBot:.044},
    {z:-.02,y:.015,rx:.084,ryTop:.078,ryBot:.056}, // 饱满腮颊后颅
    {z:+.04,y:.022,rx:.082,ryTop:.074,ryBot:.048}, // 眉弓眼框区
    {z:+.085,y:.005,rx:.052,ryTop:.046,ryBot:.036}, // 鼻梁止部坡降
    {z:+.145,y:-.006,rx:.034,ryTop:.030,ryBot:.026}, // 尖长吻部
    {z:+.200,y:-.012,rx:.020,ryTop:.018,ryBot:.016}, // 鼻端
    {z:+.214,y:-.014,rx:.003,ryTop:.003,ryBot:.003}
  ],18,(u,th,x,y,z)=>{
    const cy=Math.cos(th);
    if(u>.85)return 0x161414; // 黑亮鼻尖
    if(u>.58&&cy<.08)return pal.belly; // 白吻下颌
    if(u>.25&&cy<-.15)return pal.belly; // 白颊
    return pal.coat;
  }));
  attachEyes(headG,.050,.034,.064,.42,pal.eye,0x0b0b0d,.015);
  for(const s of [-1,1]){
    const ear=sculptEar(.072,.135,pal.dark,pal.earIn);
    ear.position.set(s*.054,.072,-.008);ear.rotation.set(.18,s*.22,-s*.24);headG.add(ear);
  }

  // 四条真实骨骼屈节细腿：枢轴深植躯干肌群内部 + 无缝封顶肩股关节 + 精确落地 y=0
  const legCol=(u,th,x,y)=>u>.52?pal.dark:pal.coat;
  const scH=hipY/.355;
  const legs=[];
  for(const [lx,lz,f] of [[.046,.14,1],[-.046,.14,1],[.050,-.14,0],[-.050,-.14,0]]){
    const sgn=lx>0?1:-1;
    // 躯干肩/臀外扩肌垫，与躯干浑然一体
    add(g,new THREE.SphereGeometry(.054,12,10),M(pal.coat,{roughness:.85}),lx*.72,hipY,lz).scale.set(.78,1.22,1.35);
    const fNodes=[
      [-sgn*.018,.025,0,.003,.003],[-sgn*.010,.010,0,.042,.058],[0,-.045,-.006,.038,.050],
      [0,-.15*scH,-.024,.024,.030],[0,-.28*scH,-.008,.018,.020],
      [0,-.33*scH,.018,.018,.022],[0,-.346*scH,.040,.024,.034],[-.001,-.355*scH,.038,.003,.003]
    ];
    const hNodes=[
      [-sgn*.018,.025,.006,.003,.003],[-sgn*.010,.010,.010,.048,.072],[0,-.045,.012,.044,.062],
      [0,-.14*scH,.034,.032,.042],[0,-.24*scH,-.040,.020,.024],
      [0,-.33*scH,-.018,.017,.020],[0,-.346*scH,.010,.024,.034],[0,-.355*scH,.008,.003,.003]
    ];
    const lg=new THREE.Group();lg.position.set(lx,hipY,lz);g.add(lg);
    lg.add(loftLimb(f?fNodes:hNodes,12,legCol));
    legs.push(lg);
  }

  // 飘逸 S 曲线蓬松狐尾（渐变白尾尖）
  const tailG=new THREE.Group();tailG.position.set(0,.415,-.22);g.add(tailG);
  tailG.add(loftTail([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,-.04,-.13),
    new THREE.Vector3(0,-.02,-.27),
    new THREE.Vector3(0,.05,-.40)
  ],u=>Math.sin(u*Math.PI)*.062+.018*(1-u),12,(u)=>u>.68?pal.tip:pal.coat));

  g.userData={headG,tailG,legs};
  return g;
}

    if(u>.86)return 0x161414;
    if(sp.mask&&u>.52&&cy<.18)return sp.belly;
    if(sp.mask&&u>.22&&Math.abs(x)<.024&&cy>.45)return sp.belly; // 白鼻梁通天星
    if(sp.mask&&u>.20&&cy<-.12)return sp.belly;
    return sp.coat;
  }));
  attachEyes(headG,.056,.038,.066,.38,sp.eye,0x0b0b0d,.0165);
  for(const s of [-1,1]){
    if(breed==='golden'){
      const ear=sculptEar(.075,.125,sp.earOut,sp.earIn);
      ear.position.set(s*.082,.042,.005);ear.rotation.set(.25,s*.35,s*2.45);headG.add(ear); // 金毛垂耳
    }else{
      const ear=sculptEar(sp.ear[0],sp.ear[1],sp.earOut,sp.earIn);
      ear.position.set(s*.058,.082,-.006);ear.rotation.set(.15,s*.18,-s*.24);headG.add(ear);
    }
  }

  // 四条骨骼屈节真实腿型：肩股关节内嵌躯干 + 外肌包覆 + 等比接地 y=0
  const scH=hipY/.355;
  const legs=[];
  for(const [lx,lz,f] of [[sp.rx*.54,L*.34,1],[-sp.rx*.54,L*.34,1],[sp.rx*.58,-L*.36,0],[-sp.rx*.58,-L*.36,0]]){
    const sgn=lx>0?1:-1;
    // 躯干肩/股肌肉融接垫，消除任何悬空缝隙
    add(g,new THREE.SphereGeometry(sp.rx*.58,12,10),M(sp.coat,{roughness:.85}),lx*.72,hipY,lz).scale.set(.82,1.18,1.32);
    const fNodes=[
      [-sgn*.018,.025,0,.003,.003],[-sgn*.010,.010,0,.042,.056],[0,-.045*scH,-.004,.038,.048],
      [0,-.15*scH,-.024,.026,.032],[0,-.28*scH,-.006,.020,.022],
      [0,-.325*scH,.016,.020,.024],[0,-.344*scH,.038,.026,.036],[0,-.355*scH,.036,.003,.003]
    ];
    const hNodes=[
      [-sgn*.018,.025,.006,.003,.003],[-sgn*.010,.010,.010,.048,.070],[0,-.045*scH,.012,.044,.062],
      [0,-.14*scH,.032,.034,.044],[0,-.24*scH,-.038,.022,.026],
      [0,-.325*scH,-.018,.019,.022],[0,-.344*scH,.010,.026,.036],[0,-.355*scH,.008,.003,.003]
    ];
    const lg=new THREE.Group();lg.position.set(lx,hipY,lz);g.add(lg);
    lg.add(loftLimb(f?fNodes:hNodes,12,(u)=>u>.52&&sp.mask?sp.belly:sp.coat));
    legs.push(lg);
  }

  // 雕刻尾巴
  const tailG=new THREE.Group();tailG.position.set(0,by+.02,-L*.58);g.add(tailG);
  if(sp.tail==='bob'){
    tailG.add(loftTail([new THREE.Vector3(0,0,0),new THREE.Vector3(0,.03,-.07)],u=>.045*(1-u*.45),10,()=>sp.belly));
  }else if(sp.tail==='curl'){
    tailG.add(loftTail([
      new THREE.Vector3(0,0,0),new THREE.Vector3(0,.11,-.07),
      new THREE.Vector3(.02,.20,.02),new THREE.Vector3(.01,.15,.11)
    ],u=>.042*Math.sin((1-u*.65)*Math.PI*.5),10,()=>sp.coat));
  }else{
    tailG.add(loftTail([
      new THREE.Vector3(0,0,0),new THREE.Vector3(0,-.02,-.14),new THREE.Vector3(0,.06,-.29)
    ],u=>Math.sin(u*Math.PI)*.038+.016,10,()=>sp.coat));
  }

  g.userData={headG,tailG,legs};
  return g;
}

/* 3. 雕刻级灵动小花猫（三花 calico / 奶牛 tuxedo / 橘白斑 tabby / 重点色布偶 siamese） */
function buildCat(breed='calico'){
  const g=new THREE.Group();
  const pal={
    calico: {base:0xf7f4ee,p1:0xe0782c,p2:0x222126,earIn:0xf5bcc6,eye:0x48b862},
    tuxedo: {base:0xf8f9fb,p1:0x1b1d22,p2:0x1b1d22,earIn:0xf0b8c4,eye:0x52c872},
    tabby:  {base:0xf7efe4,p1:0xe88632,p2:0xba5e18,earIn:0xf5bcc6,eye:0xd48e28},
    siamese:{base:0xf4ecdf,p1:0x4a3a32,p2:0x382c26,earIn:0x886c64,eye:0x5bc8ff}
  }[breed]||{base:0xf7f4ee,p1:0xe0782c,p2:0x222126,earIn:0xf5bcc6,eye:0x48b862};

  // 有机顶点斑纹着色函数（平滑无缝自然花纹，告别贴圆球补丁！）
  function catColor(u,th,x,y,z){
    const cy=Math.cos(th);
    if(breed==='calico'){
      if(cy<-.25)return pal.base;
      const w=Math.sin(z*13+x*16+1.1)+Math.cos(z*9-x*12)*.6;
      if(w>.48)return pal.p1;
      if(w<-.45)return pal.p2;
      return pal.base;
    }
    if(breed==='tuxedo'){
      if(cy<-.12||(u>.65&&cy<.3))return pal.base;
      return pal.p1;
    }
    if(breed==='tabby'){
      if(cy<-.20)return pal.base;
      return Math.sin(z*36+Math.abs(x)*14)>.45?pal.p2:pal.p1;
    }
    // siamese: 深色面具与肢端
    if(u>.82)return pal.p1;
    return pal.base;
  }

  const legH=.24, by=.29, hipY=by-.005;
  // 极轻盈柔美猫躯：饱满后股 + 优雅微弓背 + 修颈（充分包容猫腿肩股枢轴）
  g.add(loftProfile([
    {z:-.22,y:by,     rx:.003,ryTop:.003,ryBot:.003},
    {z:-.18,y:by+.01, rx:.058,ryTop:.064,ryBot:.058},
    {z:-.10,y:by+.015,rx:.070,ryTop:.076,ryBot:.062}, // 后胯包裹大腿
    {z:+.01,y:by+.025,rx:.058,ryTop:.064,ryBot:.046}, // 敏捷细腰
    {z:+.12,y:by+.010,rx:.070,ryTop:.072,ryBot:.078}, // 胸肩包裹前腿
    {z:+.19,y:by+.045,rx: .056,ryTop:.056,ryBot:.062},
    {z:+.23,y:by+.105,rx:.042,ryTop:.044,ryBot:.044}
  ],18,(u,th,x,y,z)=>catColor(u,th,x,y,z)));

  // 甜美精致猫首 + 短翘吻垫 + 粉鼻尖 + 花斑尖耳 + 细须
  const headG=new THREE.Group();headG.position.set(0,by+.12,.22);g.add(headG);
  headG.add(loftProfile([
    {z:-.06,y:-.01, rx:.042,ryTop:.044,ryBot:.040},
    {z:-.005,y:.016,rx:.084,ryTop:.074,ryBot:.062}, // 圆润双颊
    {z:+.048,y:.018,rx:.076,ryTop:.066,ryBot:.052},
    {z:+.082,y:-.002,rx:.042,ryTop:.030,ryBot:.032}, // 短俏猫鼻吻
    {z:+.105,y:-.008,rx:.022,ryTop:.018,ryBot:.016},
    {z:+.112,y:-.010,rx:.003,ryTop:.003,ryBot:.003}
  ],18,(u,th,x,y,z)=>{
    if(u>.86)return 0xf2829a; // 粉嫩小鼻尖
    if(breed==='calico'&&u>.25&&Math.cos(th)>.28)return x>0?pal.p1:pal.p2; // 头顶经典对称双色开脸！
    if(breed==='tuxedo'&&Math.cos(th)>-.05&&Math.abs(x)>.018)return pal.p1;
    if(breed==='siamese'&&u>.55)return pal.p1;
    if(breed==='tabby'&&Math.cos(th)>.25)return Math.sin(x*50)>.2?pal.p2:pal.p1;
    return pal.base;
  }));
  attachEyes(headG,.042,.024,.062,.36,pal.eye,0x0b0b0e,.0175);
  const wht=M(0xffffff,{roughness:.1});
  for(const s of [-1,1]){
    const eCol=breed==='calico'?(s>0?pal.p1:pal.p2):(breed==='tabby'?pal.p1:pal.p1);
    const ear=sculptEar(.058,.092,eCol,pal.earIn);
    ear.position.set(s*.054,.064,.002);ear.rotation.set(.12,s*.16,-s*.26);headG.add(ear);
    for(let w=-1;w<=1;w++) addNS(headG,BX(.075,.003,.003),wht,s*.060,-.016+w*.010,.076).rotation.z=s*w*.16;
  }

  // 纤细优雅猫腿：肩股深入躯干内部 + 肌群包覆融合 + 完整封顶防离体
  const scH=hipY/.355;
  const legs=[];
  for(const [lx,lz,f] of [[.038,.115,1],[-.038,.115,1],[.042,-.115,0],[-.042,-.115,0]]){
    const sgn=lx>0?1:-1;
    const shCol=breed==='tuxedo'?pal.p1:(breed==='calico'?(f?(lx>0?pal.p1:pal.base):(lx>0?pal.p2:pal.p1)):(breed==='tabby'?pal.p1:pal.base));
    add(g,new THREE.SphereGeometry(.044,10,8),M(shCol,{roughness:.85}),lx*.72,hipY,lz).scale.set(.8,1.18,1.3);
    const fNodes=[
      [-sgn*.014,.020,0,.003,.003],[-sgn*.008,.008,0,.034,.044],[0,-.040*scH,-.004,.030,.038],
      [0,-.14*scH,-.018,.020,.024],[0,-.27*scH,-.004,.016,.018],
      [0,-.33*scH,.014,.017,.020],[0,-.346*scH,.030,.022,.030],[0,-.355*scH,.028,.002,.002]
    ];
    const hNodes=[
      [-sgn*.014,.020,.005,.003,.003],[-sgn*.008,.008,.008,.038,.054],[0,-.040*scH,.010,.034,.046],
      [0,-.13*scH,.026,.024,.032],[0,-.23*scH,-.030,.017,.020],
      [0,-.33*scH,-.014,.016,.018],[0,-.346*scH,.008,.022,.030],[0,-.355*scH,.006,.002,.002]
    ];
    const lg=new THREE.Group();lg.position.set(lx,hipY,lz);g.add(lg);
    lg.add(loftLimb(f?fNodes:hNodes,10,(u)=>u>.68?(breed==='siamese'?pal.p1:pal.base):(breed==='tuxedo'?pal.p1:breed==='tabby'?pal.p1:pal.base)));
    legs.push(lg);
  }

  // S 形修长灵动猫尾
  const tailG=new THREE.Group();tailG.position.set(0,by+.01,-.18);g.add(tailG);
  tailG.add(loftTail([
    new THREE.Vector3(0,0,0),new THREE.Vector3(0,.09,-.10),
    new THREE.Vector3(0,.22,-.06),new THREE.Vector3(0,.32,-.13)
  ],u=>.022*(1-u*.38),10,(u)=>{
    if(breed==='calico')return u>.55?pal.p2:(u>.25?pal.p1:pal.base);
    if(breed==='tabby')return Math.sin(u*24)>0?pal.p2:pal.p1;
    return pal.p1;
  }));

  g.userData={headG,tailG,legs};
  return g;
}

/* ════════════════════════════════════════════════════════════
   9. 背景：城市天际线 + 雪山群峰 + 云 + 空中圣诞老人雪橇队
   ════════════════════════════════════════════════════════════ */
const skyline=new THREE.Group();scene.add(skyline);
const skylineMats=[];
{
  // ══ 0. 写实砖石建筑立面贴图 + 凹凸法线（消除平滑塑料积木感） ══
  const facadeSpecs=[
    {wall:'#623930',brick:'#4a2821',trim:'#9a8372',wins:['#ffe3a3','#ffd074','#fff4d6']}, // 暖红砖商业楼
    {wall:'#5a626d',brick:'#484f59',trim:'#9aa2ad',wins:['#ffe6b3','#d8ecff','#ffcf78']}, // 暖灰石材街区楼
    {wall:'#314152',brick:'#253240',trim:'#708296',wins:['#ffd98a','#cde6ff','#fde68a']}  // 深蓝灰欧式精品楼
  ];
  for(let p=0;p<3;p++){
    const sp=facadeSpecs[p];
    const c=document.createElement('canvas');c.width=512;c.height=512;
    const x=c.getContext('2d');
    const b=document.createElement('canvas');b.width=512;b.height=512;
    const bx=b.getContext('2d');
    x.fillStyle=sp.wall;x.fillRect(0,0,512,512);
    bx.fillStyle='#888';bx.fillRect(0,0,512,512);
    // 真实交错砖缝与随机明暗肌理
    for(let row=0;row<32;row++){
      const yy=row*16, off=(row%2)*16;
      x.fillStyle=sp.brick;x.fillRect(0,yy,512,2);
      bx.fillStyle='#444';bx.fillRect(0,yy,512,2);
      for(let col=0;col<16;col++){
        const xx=(col*32+off)%512;
        if(rng()<.35){
          x.fillStyle=rng()<.5?'rgba(255,255,255,.04)':'rgba(0,0,0,.06)';
          x.fillRect(xx+2,yy+2,28,12);
        }
        x.fillStyle=sp.brick;x.fillRect(xx,yy,2,16);
        bx.fillStyle='#555';bx.fillRect(xx,yy,2,16);
      }
    }
    const cols=4, rows=4, cw=512/cols, rh=512/rows;
    for(let r=0;r<rows;r++){
      x.fillStyle=sp.trim;x.fillRect(0,r*rh,512,6);
      bx.fillStyle='#d8d8d8';bx.fillRect(0,r*rh,512,6);
      for(let col=0;col<cols;col++){
        const wx=col*cw+26, wy=r*rh+22, ww=cw-52, wh=rh-44;
        // 外框与深凹阴影
        x.fillStyle=sp.trim;x.fillRect(wx-6,wy-6,ww+12,wh+12);
        x.fillStyle='#192028';x.fillRect(wx-2,wy-2,ww+4,wh+4);
        bx.fillStyle='#ececec';bx.fillRect(wx-6,wy-6,ww+12,wh+12);
        bx.fillStyle='#1f1f1f';bx.fillRect(wx,wy,ww,wh);
        if(rng()<.68){
          const g=x.createLinearGradient(wx,wy,wx,wy+wh);
          g.addColorStop(0,'#2e3540');
          g.addColorStop(.32,sp.wins[Math.floor(rng()*sp.wins.length)]);
          g.addColorStop(1,'#ffd27a');
          x.fillStyle=g;
          x.globalAlpha=.78+rng()*.20;
          x.fillRect(wx,wy,ww,wh);
          x.globalAlpha=1;
        }else{
          x.fillStyle='#131a23';
          x.fillRect(wx,wy,ww,wh);
        }
        // 细窗棂
        x.fillStyle='#232c37';
        x.fillRect(wx+ww/2-2,wy,4,wh);
        x.fillRect(wx,wy+wh*.46,ww,4);
        x.fillStyle=sp.trim;
        x.fillRect(wx-8,wy+wh+2,ww+16,6);
      }
    }
    const tx=new THREE.CanvasTexture(c);
    tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=4;
    const btx=new THREE.CanvasTexture(b);
    btx.wrapS=btx.wrapT=THREE.RepeatWrapping;btx.anisotropy=4;
    skylineMats.push(new THREE.MeshStandardMaterial({
      map:tx,emissiveMap:tx,emissive:0xffffff,emissiveIntensity:.34,
      color:0xd8dde4,roughness:.78,metalness:.06,flatShading:false
    }));
  }

  // 根据建筑真实尺寸（米）缩放 BoxGeometry UV，确保每层高 3.2m、每开间 3.0m
  const makeScaledBox=(w,h,d,tileW=12.0,tileH=12.8)=>{
    const g=new THREE.BoxGeometry(w,h,d);
    const uv=g.attributes.uv, nrm=g.attributes.normal;
    for(let i=0;i<uv.count;i++){
      const nx=Math.abs(nrm.getX(i)), ny=Math.abs(nrm.getY(i));
      const u=uv.getX(i), v=uv.getY(i);
      if(nx>.5) uv.setXY(i, u*(d/tileW), v*(h/tileH));
      else if(ny>.5) uv.setXY(i, u*(w/tileW), v*(d/tileW));
      else uv.setXY(i, u*(w/tileW), v*(h/tileH));
    }
    uv.needsUpdate=true;
    return g;
  };

  // 花岗岩地砖铺装纹理 + 凹凸贴图（告别纯色塑料路面/广场）
  const paverTex=(()=>{
    const c=document.createElement('canvas');c.width=256;c.height=256;
    const x=c.getContext('2d');
    x.fillStyle='#aebac6';x.fillRect(0,0,256,256);
    for(let r=0;r<4;r++)for(let cl=0;cl<4;cl++){
      const v=165+Math.floor(rng()*26);
      x.fillStyle=`rgb(${v-6},${v+2},${v+10})`;
      x.fillRect(cl*64+2,r*64+2,60,60);
    }
    x.strokeStyle='rgba(55,65,78,.55)';x.lineWidth=3;
    for(let i=0;i<=256;i+=64){
      x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke();
      x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke();
    }
    const t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
    return t;
  })();
  const roadAsphTex=asphaltTex.clone();roadAsphTex.needsUpdate=true;
  roadAsphTex.wrapS=roadAsphTex.wrapT=THREE.RepeatWrapping;

  // ══ 1. 外围完整写实地面路网与铺装街区系统 ══
  const extRoadM=M(0xffffff,{map:roadAsphTex,roughness:.52,metalness:.22,flatShading:false});
  const extWalkM=M(0xffffff,{map:paverTex,roughness:.84,metalness:.06,flatShading:false});
  const plazaM=M(0xe6edf4,{map:paverTex,roughness:.86,metalness:.05,flatShading:false});
  const curbM=M(0x6d7784,{roughness:.82});
  const dashM=M(0xdcc780,{roughness:.68});
  const zebraM=M(0xe6ecf2,{roughness:.72});

  const addBlockPlaza=(x,z,w,d)=>{
    const pl=add(skyline,makeScaledBox(w,.10,d,3.2,3.2),plazaM,x,.03,z);
    pl.castShadow=false;pl.receiveShadow=true;
    const k=0.45;
    add(skyline,BX(w,.14,k),curbM,x,.05,z-d/2+k/2).castShadow=false;
    add(skyline,BX(w,.14,k),curbM,x,.05,z+d/2-k/2).castShadow=false;
    add(skyline,BX(k,.14,d),curbM,x-w/2+k/2,.05,z).castShadow=false;
    add(skyline,BX(k,.14,d),curbM,x+w/2-k/2,.05,z).castShadow=false;
  };
  addBlockPlaza(-41,-65,68,26);addBlockPlaza(41,-65,68,26);

/* ══ 大规模平行星尘流星雨（纯粒子 · 每颗流星一个 Points，坐标全在 GPU 顶点着色器算）══
   ── 方向 ──────────────────────────────────────────────
   屏幕空间的 45° 斜划：投影后像素位移满足 |Δpx| = |Δpy|，
   而相机空间的 right/up 各分量相等（dx = −dy）时正好成立，
   与宽高比无关 —— 所以方向就是 right − up（相机基向量），全场共用一条。
   方向锁进世界空间，同一波里的所有流星严格平行，绝不散；
   全局方向以 ≤12°/s 的速率缓慢跟随相机，玩家转动视角时雨幕缓缓转向，
   屏幕上恒定是「左上 → 右下 45°」。
   ── 尺度 ──────────────────────────────────────────────
   参考图实测：那条带 425px 长、带宽 ~10px、亮点间距 1.16px、亮像素覆盖 25%。
   反推：每条带 ~620 颗粒子（桌面），带宽 0.25~2.65m，带长 0.22×屏高。
   长度换算：沿 45° 斜线走 1px 对应 2·D·tan(fov/2)/屏高 米，
   所以手机竖屏和桌面横屏看到的带一样长一样宽。
   ── 规模 ──────────────────────────────────────────────
   桌面 48 颗 × 620 粒 ≈ 3 万个光点，手机 32 颗 × 300 粒。
   CPU 每帧只写每颗流星的几个 uniform，粒子坐标一次都不回写。
   ── 节奏 ──────────────────────────────────────────────
   底层 8 颗常驻零星（各自隔 0.5~2.4s 续上）
   + 每 4.5~10s 一波 14~30 颗的大雨幕，波内每颗错开 55ms 从左往右依次落下，
     形成横扫天际的推进感。 */
const METEOR_N=IS_TOUCH_DEV?32:48, METEOR_BASE=8;
const SPARKS_PER_METEOR=IS_TOUCH_DEV?300:620;

const _mRight=new THREE.Vector3(),_mUp=new THREE.Vector3(),_mFwd=new THREE.Vector3();

const rainDir=new THREE.Vector3(0.707,-0.707,0);
let _rainDirInit=false;
const METEOR_VS=`
  attribute float aSize; attribute vec3 aColor; attribute float aAlpha; attribute float aPhase;
  attribute float aU; attribute vec4 aOff;
  uniform vec3 uHead; uniform vec3 uDir;
  uniform float uLen,uEnv,uTime,uPR;
  varying vec3 vCol; varying float vA;
  void main(){
    /* 垂直于轨迹的两个正交基：横向弥散用 */
    vec3 n1=normalize(cross(vec3(0.0,1.0,0.0),uDir));
    vec3 n2=cross(uDir,n1);
    /* 沿轨迹后退：aU=0 在头部，aU=1 在尾端；拖尾微粒再往后挪一点点 */
    float back=aU*uLen+aOff.w*uLen*0.055;
    vec3 wp=uHead-uDir*back+n1*aOff.x+n2*aOff.y;
    /* 每颗星尘独立闪烁：快而柔，像细碎光点各自在呼吸 */
    float tw=.55+.45*pow(.5+.5*sin(uTime*7.4+aPhase*3.1),1.4);
    vCol=aColor;
    vA=uEnv*tw*aAlpha;
    gl_PointSize=aSize*uPR*(.80+.32*tw);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(wp,1.0);
  }`;
const METEOR_FS=`
  uniform float uOpacity;
  varying vec3 vCol; varying float vA;
  void main(){
    if(vA<=0.002)discard;
    vec2 p=gl_PointCoord-.5;
    float r=length(p);
    /* 纯柔边圆点 + 一圈极淡外晕，没有十字星芒 —— 像浮空的光点而不是贴图小星星 */
    float core=smoothstep(.50,.02,r);
    float halo=smoothstep(.50,.10,r)*.30;
    float a=clamp(core+halo,0.0,1.0)*vA*uOpacity;
    gl_FragColor=vec4(vCol*(1.0+.55*core),a);
  }`;
{
  /* 一颗流星 = 一个 Points + 一份独立材质（uniform 各自一份，shader 同一份程序）
     粒子属性全部静态：位置在顶点着色器按 uHead/uDir 实时算，CPU 不回写任何 buffer。 */
  for(let i=0;i<METEOR_N;i++){
    const n=SPARKS_PER_METEOR;
    const pos=new Float32Array(n*3);
    const size=new Float32Array(n);
    const color=new Float32Array(n*3);
    const alpha=new Float32Array(n);
    const phase=new Float32Array(n);
    const uArr=new Float32Array(n);
    const off=new Float32Array(n*4);
    for(let j=0;j<n;j++){
      const idx=j;
      /* 指数 0.82：星头附近粒子更密、尾巴拉得更长更疏 —— 由密到疏的星尘带 */
      const u=Math.pow(j/(n-1),.82);
      uArr[idx]=u;
      phase[idx]=R(0,Math.PI*2);
      const isStreak=(j%4===2);                    // 每 4 颗里 1 颗当拖尾微粒
      const isBig=(j%13===0)||j<6;                // 星头少数几颗放大过曝成白核
      const szBase=isBig?R(2.4,4.0):R(1.0,2.6);
      size[idx]=szBase*(1.0-.62*u)*(isStreak?.50:1)*(isBig?1.15:1);
      /* 颜色：主体柔和紫罗兰，只有星头几颗泛白 */
      if(u<.08) color.set([1.0,.97,1.0],idx*3);
      else if(u<.45) color.set([.58,.46,.92],idx*3);
      else color.set([.34,.28,.78],idx*3);
      /* 横向弥散：头部几乎成束，尾端散开 —— 由窄到宽的光带 */
      const spread=(.25+2.4*u*u)*(isBig?.55:1);
      const ang=R(0,Math.PI*2);
      off[idx*4]=Math.cos(ang)*spread;
      off[idx*4+1]=Math.sin(ang)*spread;
      off[idx*4+2]=R(-.6,.6);
      off[idx*4+3]=isStreak?1:0;
      /* 静态亮度衰减：星头满亮，尾巴按 (1-u)^1.2 衰减 */
      alpha[idx]=u<.07?(isStreak?.55:1.0):Math.pow(1.0-u,1.2)*(isStreak?.42:1.0)*.38;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('aSize',new THREE.BufferAttribute(size,1));
    g.setAttribute('aColor',new THREE.BufferAttribute(color,3));
    g.setAttribute('aAlpha',new THREE.BufferAttribute(alpha,1));
    g.setAttribute('aPhase',new THREE.BufferAttribute(phase,1));
    g.setAttribute('aU',new THREE.BufferAttribute(uArr,1));
    g.setAttribute('aOff',new THREE.BufferAttribute(off,4));
    const mat=new THREE.ShaderMaterial({
      uniforms:{
        uHead:{value:new THREE.Vector3()},uDir:{value:new THREE.Vector3(0,-1,0)},
        uLen:{value:0},uEnv:{value:0},uTime:{value:0},uPR:{value:Math.min(devicePixelRatio,2)},
        uOpacity:{value:1}
      },
      vertexShader:METEOR_VS,fragmentShader:METEOR_FS,
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false
    });
    const pts=new THREE.Points(g,mat);
    pts.frustumCulled=false;pts.userData.noReflect=true;pts.visible=false;
    scene.add(pts);
    meteors.push({
      pts,mat,u:mat.uniforms,
      state:0,wait:0,life:0,dur:3,travel:120,trail:90,envBase:1,
      p0:new THREE.Vector3(),dir:new THREE.Vector3(0,-1,0)
    });
  }
}
/* 相机基向量：fwd = 视线方向（three 相机朝 -Z），right / up = 屏幕右 / 屏幕上 */
function camFrame(){
  camera.updateMatrixWorld();
  _mFwd.set(0,0,-1).transformDirection(camera.matrixWorld);
  _mRight.set(1,0,0).transformDirection(camera.matrixWorld);
  _mUp.set(0,1,0).transformDirection(camera.matrixWorld);
}
/* 沿 45° 斜线走 1 像素 = 多少米：2·D·tan(fov/2)/屏高
   （水平与垂直每像素米数相同，所以屏幕上的 45° 就是世界的 45°） */
function pxToMeter(D){
  return 2*D*Math.tan(camera.fov*Math.PI/360)/Math.max(innerHeight,1);
}
/* 摆一颗流星（参数全部按屏幕像素定义，手机桌面观感一致）：
   sx,sy = 头部起点在屏幕上的位置（NDC，x 右为正、y 上为正）
   D     = 距相机深度（米）
   headPx= 头部飞过的屏幕距离（沿 45° 斜线的像素）
   trailPx = 尾迹长（像素） */
function placeMeteor(m,sx,sy,D,headPx,trailPx,dur,envBase){
  camFrame();
  const tanY=Math.tan(camera.fov*Math.PI/360);
  const tanX=tanY*Math.max(camera.aspect,.35);
  /* 起点：屏幕 NDC 反投影成世界射线，再乘深度 */
  _mRay.copy(_mFwd)
    .addScaledVector(_mRight,sx*tanX)
    .addScaledVector(_mUp,sy*tanY)
    .normalize();
  m.p0.copy(camera.position).addScaledVector(_mRay,D);
  const mpp=pxToMeter(D);
  m.travel=headPx*mpp;
  m.trail=trailPx*mpp;
  m.dur=dur;m.envBase=envBase;m.life=0;m.state=1;
  m.pts.visible=true;
}
/* 一波平行雨幕：位置分层铺满天空，从左往右依次点亮 */
function spawnWave(big){
  const n=big?Math.round(R(22,30)):Math.round(R(14,20));
  const D=R(230,340);
  const H=Math.max(innerHeight,1);
  const headPx=H*(big?.30:.24);
  const trailPx=H*(big?.24:.20);
  for(let j=0;j<n;j++){
    const i=METEOR_BASE+(meteorWave.slot++%Math.max(METEOR_N-METEOR_BASE,1));
    const m=meteors[i];
    /* 起点分层：横向铺开、纵向错落，整片天空都是平行斜线 */
    const sx=R(-1.10,1.10), sy=R(.42,1.30);
    placeMeteor(m,sx,sy,D,headPx*(R(.85,1.15)),trailPx*(R(.85,1.15)),R(2.6,3.8),(big?1.15:.90)*R(.88,1.10));
    m.wait=j*.055+R(0,.04);               // 波内依次错开 55ms —— 横扫的推进感
  }
}
/* 常驻零星：单颗独奏 */
function spawnBase(m){
  const H=Math.max(innerHeight,1);
  placeMeteor(m,R(-1.2,1.1),R(.55,1.30),R(230,340),H*R(.20,.30),H*R(.17,.24),R(3.0,4.4),.62);
}
/* 8 颗常驻零星：开场就位，错峰出发 */
for(let i=0;i<METEOR_BASE;i++){const m=meteors[i];spawnBase(m);m.wait=R(.4,3.0);}
function updateMeteors(dt){
  camFrame();
  /* 目标方向 = 相机空间 right − up（各分量相等 ⇒ 屏幕上是精确 45°） */
  _mTarget.copy(_mRight).sub(_mUp).normalize();
  if(!_rainDirInit){rainDir.copy(_mTarget);_rainDirInit=true;}
  else{
    /* 朝目标缓缓转向，转速上限 12°/s —— 玩家猛转视角时雨幕不会甩 */
    const ang=Math.acos(Math.min(1,Math.max(-1,rainDir.dot(_mTarget))));
    if(ang>1e-4){
      const step=Math.min(ang,12*Math.PI/180*dt);
      _mAxis.copy(rainDir).cross(_mTarget);
      if(_mAxis.lengthSq()>1e-10)rainDir.applyAxisAngle(_mAxis.normalize(),step).normalize();
    }
  }
  /* 节奏：一波大雨幕，4.5~10s 一轮 */
  meteorWave.cd-=dt;
  if(meteorWave.cd<=0){
    meteorWave.big=!meteorWave.big;
    spawnWave(meteorWave.big);
    meteorWave.cd=meteorWave.big?R(6.5,10.0):R(4.5,6.5);
  }
  const now=performance.now()*.001;
  for(let i=0;i<METEOR_N;i++){
    const m=meteors[i];
    const U=m.u;
    U.uTime.value=now;
    if(m.state===1){
      m.wait-=dt;
      if(m.wait>0){U.uEnv.value=0;continue;}
      m.state=2;m.life=0;
      /* 生成瞬间把方向锁进世界空间：这一波所有流星共用同一条方向 */
      m.dir.copy(rainDir);
      U.uDir.value.copy(m.dir);
    }
    if(m.state!==2){U.uEnv.value=0;continue;}
    m.life+=dt;
    const k=m.life/m.dur;
    if(k>=1){
      m.state=0;U.uEnv.value=0;m.pts.visible=false;
      if(i<METEOR_BASE){spawnBase(m);m.wait=R(.5,2.4);}
      continue;
    }
    /* 头部沿锁定方向推进；尾迹挂在头部后方，长度随飞行时间从短到长 */
    const traveled=k*m.travel;
    const curTrail=Math.min(m.trail,traveled+m.trail*.18);
    _mHead.copy(m.p0).addScaledVector(m.dir,traveled);
    /* 亮度包络：快速点亮 → 稳定 → 尾巴淡出；越接近地面越暗 */
    const fade=Math.min(1,Math.max(0,(_mHead.y-6)/34));
    U.uEnv.value=m.envBase*fade*Math.min(1,m.life*6)*(k<.78?1:Math.max(0,(1-k)/.22));
    U.uHead.value.copy(_mHead);
    U.uLen.value=curTrail;
  }
}

  const c=cv(256,420)[0],x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,256,420);
  g.addColorStop(0,'#0f1e36');g.addColorStop(1,'#1b3154');
  x.fillStyle=g;x.fillRect(0,0,256,420);
  const rg=x.createRadialGradient(200,70,4,200,70,180);
  rg.addColorStop(0,'rgba(255,204,136,.20)');rg.addColorStop(1,'rgba(255,204,136,0)');
  x.fillStyle=rg;x.fillRect(0,0,256,420);
  x.strokeStyle='rgba(246,214,144,.72)';x.lineWidth=4;x.strokeRect(10,10,236,400);
  x.fillStyle='#fff4dc';x.font='700 50px '+HK;x.textAlign='center';
  cn.split('').forEach((t,i)=>x.fillText(t,128,86+i*58));
  x.fillStyle='#a8d8ff';x.font='600 16px '+HK;
  x.fillText(en,128,388);
  return ctex(c);
};

      if(_zb.lengthSq()<1e-4)_zb.set(0,1,0);
      trackUps.push(_zb.clone().normalize());

    const sampleTrackUp=(u,out)=>{
      const f=((u%1)+1)%1*NSEG, i0=Math.floor(f)%NSEG, i1=(i0+1)%NSEG;
