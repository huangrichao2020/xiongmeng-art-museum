      new THREE.Vector3(-25.8, 11.40, 48.8), // 2. 西南风景大驼峰拉起（赏雪林与极光）
      new THREE.Vector3(-23.2,  7.60, 51.8), // 驼峰下落过渡点
      new THREE.Vector3(-20.5,  3.80, 54.4), // 西南谷底顺滑拐弯
      new THREE.Vector3(-17.4,  6.90, 54.6), // 谷底回升过渡点
      new THREE.Vector3(-14.0,  9.80, 53.6), // 3. 减少多余起伏，流畅攀升向中央高架
      new THREE.Vector3( -9.5, 12.00, 48.2), // 进入往中央高空观景巡航段
      new THREE.Vector3( -7.2, 12.00, 42.5), // 高处平稳开一段（俯瞰旋转木马与摩天轮）
      new THREE.Vector3( -6.8, 12.00, 35.5), // 高处平稳巡航延伸（直面北街与烟花）
      new THREE.Vector3( -7.6,  5.20, 28.8), // 舒展顺滑降落
      new THREE.Vector3( -8.8,  2.00, 24.2), // 丝滑回站接驳
    ];
    /* centripetal（向心）参数化：按弦长比例分配控制点权重，天然抑制尖角与自交。
       原来用 'catmullrom'+tension .45，在「10m 俯冲紧接 8m 拉升」的谷底会严重过冲，
       轨道拧成尖锐 V 形（左右双轨几乎交叉成死结）。
       现在保留原有大骨架（轨道宽度/观感不变），只在两个陡 V 谷底各补一个过渡点，
       实测最大相邻切向变化 20.1° → 9.5°，双轨最小间距保持 0.47m 正常值。 */
    const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal',.5);
    // 全线无倒立回环，统一使用严格零侧倾正立向上法向（永不倾斜、视角稳定舒适）
    const NSEG=240;
    const trackUps=[];
    const _t0=new THREE.Vector3(), _zb=new THREE.Vector3();
    for(let i=0;i<NSEG;i++){
      curve.getTangentAt(i/NSEG,_t0);
      _zb.set(0,1,0).addScaledVector(_t0,-_t0.y);
      if(_zb.lengthSq()<1e-4)_zb.set(0,1,0);
      trackUps.push(_zb.clone().normalize());
    }
    const sampleTrackUp=(u,out)=>{
      const f=((u%1)+1)%1*NSEG, i0=Math.floor(f)%NSEG, i1=(i0+1)%NSEG;
      return out.copy(trackUps[i0]).lerp(trackUps[i1],f-Math.floor(f)).normalize();
    };
    const spineM=M(0x28384c,{roughness:.38,metalness:.75});
    const railSilverM=M(0xe4edf7,{roughness:.22,metalness:.90});
    const pierFootM=M(0xd9e2ec,{roughness:.85});
    // 中央主脊梁
    const spineMesh=new THREE.Mesh(new THREE.TubeGeometry(curve,220,.18,7,true),spineM);
    spineMesh.castShadow=true;spineMesh.receiveShadow=true;cg.add(spineMesh);
    // 左右双轨：沿真实轨道法向偏移 ±0.42m（不投射阴影保流畅）
    const _upTmp=new THREE.Vector3();
    for(const side of [-1,1]){
      const rPts=[];
      for(let i=0;i<160;i++){
        const u=i/160;
        const p=curve.getPointAt(u), tan=curve.getTangentAt(u);
        sampleTrackUp(u,_upTmp);
        const bin=new THREE.Vector3().crossVectors(tan,_upTmp).normalize();
        rPts.push(p.clone().addScaledVector(bin,side*.42).addScaledVector(_upTmp,.16));
      }
      const rCurve=new THREE.CatmullRomCurve3(rPts,true);
      const rMesh=new THREE.Mesh(new THREE.TubeGeometry(rCurve,220,.062,5,true),railSilverM);
      rMesh.castShadow=false;cg.add(rMesh);
    }
    // 72 组枕木、沿轨彩灯与 A 字钢塔立柱
    const pN=72;
    for(let i=0;i<pN;i++){
      const u=i/pN;
      const p=curve.getPointAt(u), tan=curve.getTangentAt(u);
      const tie=addNS(cg,BX(1.04,.065,.15),spineM,p.x,p.y+.08,p.z);

    // 4 节低矮流线型全景列车（无站台，第 1 节做低矮小尖头不挡视线）
    const cars=[];
    const carCols=[0xd23b32,0xe8a838,0x2f8f6b,0x3f6ba8];

    for(let c=0;c<4;c++){

        nose.rotation.x=Math.PI/2;
        addNS(car,new THREE.SphereGeometry(.09,8,6),getBulbMat(0xfff1a8,0),0,.30,.98);
      }
      add(car,BX(.68,.26,.10),M(0x1f2937,{roughness:.6}),0,.52,-.46);
      add(car,BX(.64,.045,.045),M(0x94a3b8,{roughness:.3,metalness:.8}),0,.56,.20);
      if(c>0){

        rider.position.set(0,.34,-.18);car.add(rider);

      car.userData.physObj={type:'ride',ref:coasterRef};
      cg.add(car);cars.push(car);

  /* ── 云霄飞车整片西半区腹地：巨型星夜皇家花样溜冰场 (-18.0, 0, 38.6，21.2m × 28.4m) + 8 位花样滑冰大师 NPC ── */

  /* ── 巨型圣诞老人地标雕塑（带大理石鎏金底座、礼物袋与挥手致意，向东挪至 (38.5, 0, 52.5) 留出宽敞间距） ── */

         厚实圆角、软萌贴脸。原来的石柱+人字雪顶+鎏金邮筒太"正经建筑"，
         和游乐园的欢乐调性不搭。现在整座亭子改成蛋仔风格：
           · 底座 = 圆鼓鼓的奶油色蛋托盘（不是方石台）
           · 主体 = 一颗巨大的鹅黄色「蛋仔」立牌（蛋型，带腮红和小脚）

           · 配色 = 奶油白 / 鹅黄 / 草莓粉 / 薄荷绿，全高饱和糖果色

    {
      /* 位置：从旋转木马跟前挪到「环路南段马路(z=15)与旋转木马之间」那条空带上，

      const blushM=M(0xff9db4,{roughness:.8,metalness:0});
      /* ① 奶油蛋托底座：一圈圆盘 + 一圈糖珠 */
      add(gb,new THREE.CylinderGeometry(1.62,1.78,.26,28),creamM,0,.13,0);
      add(gb,new THREE.CylinderGeometry(1.50,1.62,.14,28),yolkM,0,.32,0);
      for(let i=0;i<12;i++){

      /* ② 巨型蛋仔立牌：真正的蛋型（上小下大），带腮红和小脚 */
      {

        addNS(egg,new THREE.SphereGeometry(.145,12,10),blushM,-.40,1.02,.78).scale.set(1,.58,.30);
        addNS(egg,new THREE.SphereGeometry(.145,12,10),blushM,.40,1.02,.78).scale.set(1,.58,.30);
        // 眼睛：两颗黑豆 + 白色高光
        for(const s of [-1,1]){
          addNS(egg,new THREE.SphereGeometry(.125,14,12),cocoaM,s*.30,1.26,.82).scale.set(.90,1.06,.6);
          addNS(egg,new THREE.SphereGeometry(.046,10,8),creamM,s*.30+.035,1.32,.89);

        {

          smile.rotation.set(0,0,Math.PI);

        for(const s of [-1,1]){

      /* ③ 草莓奶盖云朵顶：几团压扁的球叠出蓬松感 */
      {
        const cloud=new THREE.Group();cloud.position.set(0,2.44,0);gb.add(cloud);
        const puffs=[[0,0,0,1.02],[-.86,.16,.10,.72],[.86,.16,-.08,.70],[-.42,.44,-.06,.66],[.44,.46,.08,.64],[0,.62,.18,.58]];
        for(const [px,py,pz,sc] of puffs){

        // 奶盖上撒的糖粒
        for(let i=0;i<10;i++){

          addNS(cloud,new THREE.SphereGeometry(.075,10,8),[strawM,mintM,yolkM][i%3],Math.cos(a)*r,.42+ (i%2)*.12,Math.sin(a)*r*.8);
        }
      }
      /* ④ 糖果粉圆角小信箱（蛋仔版，比原来的邮筒小一号、圆一号） */
      {
        const box=new THREE.Group();box.position.set(.62,.42,1.02);gb.add(box);
        const b=add(box,BX(.62,.74,.44),strawM,0,.40,0);
        // 圆角化：四角加小球，看起来就是软软的
        for(const sx of [-1,1])for(const sy of [0,1])for(const sz of [-1,1])
          addNS(box,new THREE.SphereGeometry(.13,12,10),strawM,sx*.25,.40+sy*.30-.15,sz*.17);
        // 投信口（一条深色弧线）
        addNS(box,BX(.30,.055,.06),cocoaM,0,.52,.21);
        // 挂着一枚小爱心标签
        const heart=addNS(box,new THREE.SphereGeometry(.11,12,10),yolkM,.20,.24,.24);

      /* ⑥ 「点我留言」悬浮提示牌：糖果风圆角小牌 + 手写感字。

      {
        const mkSign=(txt)=>{
          const c=document.createElement('canvas');c.width=512;c.height=176;
          const x=c.getContext('2d');
          x.fillStyle='#fff4f8';x.fillRect(0,0,512,176);
          x.fillStyle='#ff7aa2';x.fillRect(0,0,512,22);
          x.fillStyle='#ff7aa2';x.fillRect(0,154,512,22);
          x.fillStyle='#c2185b';x.textAlign='center';x.textBaseline='middle';
          x.font='800 86px '+HK;x.fillText(txt,256,92);
          const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
          return t;
        };
        /* 牌子摆在信箱正上方偏南（南边是游客来的方向）：

        const board=new THREE.Group();board.position.set(.62,3.62,1.05);board.rotation.y=Math.PI;board.scale.setScalar(1.12);board.userData.tag='gbmark';
        /* keep=true：留言亭最后会被 mergeStatic 合批（for(const d of amusement.dyn) mergeStatic(d)），
           没标 keep 的子组会被清空 —— 牌子必须标 keep 才留得住。 */
        board.userData.keep=true;
        gb.add(board);
        /* 背板（糖果粉厚板）+ 牌面 */
        const frame=new THREE.Mesh(new THREE.BoxGeometry(1.62,.60,.09),strawM);
        frame.position.z=-.06;frame.castShadow=false;board.add(frame);
        for(const sx of [-1,1])for(const sy of [-1,1]){
          const k=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),strawM);
          k.position.set(sx*.74,sy*.235,.02);k.castShadow=false;board.add(k);

        const panel=new THREE.Mesh(new THREE.PlaneGeometry(1.48,.50),
          new THREE.MeshBasicMaterial({map:mkSign('点我留言'),side:THREE.DoubleSide,transparent:true}));
        panel.position.z=.015;panel.castShadow=false;board.add(panel);
        /* 牌子吊在信箱正上方、比蛋仔云朵顶更高一点的位置：
           放在人眼高度会被蛋仔的身体整个挡住（蛋仔正好站在信箱与游客之间），
           抬到云朵顶之上才看得见。 */
        const stand=addNS(board,new THREE.CylinderGeometry(.032,.038,2.30,8),creamM,0,-1.42,0);
        stand.castShadow=false;
        const beam=new THREE.Mesh(new THREE.CylinderGeometry(.05,.10,1.5,8),

            blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
        beam.position.set(0,-.95,0);beam.castShadow=false;board.add(beam);
        FLOATERS.push({obj:board,y0:3.62,amp:.055,sp:1.8,ph:.6});
      }

      /* ⑤ 底部一圈软糖圆环（把主体和地面接住，不留硬边） */
      add(gb,new THREE.TorusGeometry(1.34,.13,10,36),mintM,0,.30,0).rotation.x=Math.PI/2;
      /* ⑥ 地面光池（暖光，别太亮） */

        map:glowTex,color:0xffd8a8,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
      gpool.rotation.x=-Math.PI/2;gpool.position.set(0,.10,.2);gpool.castShadow=false;gb.add(gpool);

/* 游乐园里的人：排队、围观、吃小吃、到处溜达（约 75 人热闹逛园） */
{
  let _qSkip=0;
  const Q=(path,c,sp,s,acc)=>{
    if((_qSkip++&1)===1)return; // 游乐园 NPC 减半，园内更通透清爽
    // 确保所有游客都有独立行动路线（若是单点则自动扩展成附近小幅散步环线）
    const p=(path.length>=2&&Math.hypot(path[0][0]-path[1][0],path[0][2]-path[1][2])>0.35)
      ? path
      : [[path[0][0],path[0][1],path[0][2]],[path[0][0]+1.8,path[0][1],path[0][2]+.9],[path[0][0]+.6,path[0][1],path[0][2]+1.9],[path[0][0],path[0][1],path[0][2]]];
    addNpc(p,c,0xfbe2cf,Math.max(sp||.42,.38),false,{scale:s,acc});
  };
  /* 摩天轮排队 */

  /* ── 入口招牌：西侧（朝游乐园方向）两根柱 + 一块灯箱 ── */

/* ══════════════════════════════════════════════════════════════════════
   直升机停机坪 + 可登乘直升机
   ──────────────────────────────────────────────────────────────────────
   · 位置：马戏团南侧、观光铁轨以北的那片空地（原来空着的一块雪地）
   · 停机坪：程序化沥青贴图（白色边界圈 + 中央 H + 十二个边角标记），
             12 盏边缘灯（自发光珠，不新增点光源）、风向袋、锥桶
   · 直升机：写实比例轻型直升机（机身 6.7m、主旋翼直径 9.7m），
             橙红 + 米白 + 金线涂装，航行灯红左绿右白尾
   · 玩法：走近按 E 登机 → 视角自动切到机外朝外看 → 旋翼加速 → 起飞 →
         绕园区飞一圈 → 回到停机坪落地 → 自动下车
   ══════════════════════════════════════════════════════════════════════ */
const HELI_PAD={x:52,z:50.5,R:8.0};
const heliSys={
  riding:false,phase:'idle',t:0,
  rotor:0,rotorSpd:0,idleSpd:.055,
  x:HELI_PAD.x,y:0,z:HELI_PAD.z,yaw:.80,pitch:0,roll:0,
  dist:0,len:1,fast:false,hud:false,
  camBase:0,camOff:0,
  g:null,rotorG:null,tRotor:null,disc:null,shadow:null,sock:null
};

/* ── 停机坪地面贴图：沥青底 + 白色边界圈 + 中央 H + 十二个边角标记 ── */
function helipadPadTex(){
  const S=1024,[c,x]=cv(S,S);
  const gr=x.createLinearGradient(0,0,S,S);
  gr.addColorStop(0,'#3e454d');gr.addColorStop(.55,'#31383f');gr.addColorStop(1,'#373e46');
  x.fillStyle=gr;x.fillRect(0,0,S,S);
  for(let i=0;i<11000;i++){
    x.fillStyle=Math.random()>.5?'rgba(255,255,255,.045)':'rgba(0,0,0,.06)';
    x.fillRect(Math.random()*S,Math.random()*S,1+Math.random()*2.6,1+Math.random()*2.6);
  }
  /* 混凝土板缝 */
  x.strokeStyle='rgba(12,16,22,.28)';x.lineWidth=2.4;
  for(let i=1;i<=3;i++){x.beginPath();x.arc(S/2,S/2,S*0.135*i,0,Math.PI*2);x.stroke();}
  /* 白色边界圈（threshold circle） */
  x.strokeStyle='rgba(236,243,250,.90)';x.lineWidth=14;
  x.beginPath();x.arc(S/2,S/2,S*.40,0,Math.PI*2);x.stroke();
  /* 中央 H */
  x.fillStyle='rgba(242,247,253,.94)';
  const bw=S*.072,bh=S*.30,gap=S*.118;
  x.fillRect(S/2-gap-bw,S/2-bh,bw,bh*2);
  x.fillRect(S/2+gap,S/2-bh,bw,bh*2);
  x.fillRect(S/2-gap,S/2-bw*.52,gap*2+bw*2,bw*1.04);
  /* 十二个边角标记 */
  x.save();x.translate(S/2,S/2);
  x.fillStyle='rgba(240,196,84,.82)';
  for(let i=0;i<12;i++){
    x.save();x.rotate(i/12*Math.PI*2);
    x.fillRect(S*.452,-15,S*.030,30);
    x.restore();
  }
  x.restore();
  /* 旧漆磨损痕 */
  x.strokeStyle='rgba(30,38,46,.16)';x.lineWidth=7;
  for(let i=0;i<7;i++){
    const a=Math.random()*Math.PI*2,r0=S*(.12+Math.random()*.2);
    x.beginPath();
    x.moveTo(S/2+Math.cos(a)*r0,S/2+Math.sin(a)*r0);
    x.lineTo(S/2+Math.cos(a+.3)*r0*1.6,S/2+Math.sin(a+.3)*r0*1.6);
    x.stroke();
  }
  return ctex(c);
}
/* 机号贴纸：小方块，深色字 + 白边，直接贴在机身侧面 */
function heliDecalTex(){
  const W=256,H=112,[c,x]=cv(W,H);
  x.clearRect(0,0,W,H);
  x.font='700 62px '+HK;x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=7;x.strokeStyle='rgba(255,255,255,.85)';
  x.strokeText('H-01',W/2,H/2+2);
  x.fillStyle='rgba(58,22,16,.88)';
  x.fillText('H-01',W/2,H/2+2);
  return ctex(c);
}
function heliSockTex(){
  const [c,x]=cv(160,32);
  for(let i=0;i<5;i++){x.fillStyle=i%2?'#f4efe2':'#ef7a2c';x.fillRect(i*32,0,32,32);}
  return ctex(c);
}
/* 机身下方的软阴影（雪地上用 MultiplyBlending，color 纯白，色相全在贴图里） */
function heliShadowTex(){
  const S=256,[c,x]=cv(S,S);
  const gr=x.createRadialGradient(S/2,S/2,4,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(86,104,132,1)');
  gr.addColorStop(.55,'rgba(150,166,190,1)');
  gr.addColorStop(1,'rgba(255,255,255,1)');
  x.fillStyle=gr;x.fillRect(0,0,S,S);
  return ctex(c);
}

/* ══ 停机坪 ══ */
function buildHelipad(){
  const g=new THREE.Group();
  g.position.set(HELI_PAD.x,0,HELI_PAD.z);
  scene.add(g);
  const R=HELI_PAD.R;

  /* 坪面（圆盘 + 程序化贴图） */
  const pad=add(g,new THREE.CircleGeometry(R,72),
    new THREE.MeshStandardMaterial({map:helipadPadTex(),roughness:.92,metalness:.03}),
    0,.022,0);
  pad.rotation.x=-Math.PI/2;pad.castShadow=false;pad.receiveShadow=true;
  /* 边缘一圈浅色混凝土路缘 */
  const kerb=add(g,new THREE.RingGeometry(R,R+.42,72),
    new THREE.MeshStandardMaterial({color:0x9aa6b2,roughness:.95,metalness:.02}),
    0,.016,0);
  kerb.rotation.x=-Math.PI/2;kerb.castShadow=false;kerb.receiveShadow=true;

  /* 边缘灯：12 盏，自发光珠（不吃光照，夜里永远亮），不新增点光源 */
  const bulbM=new THREE.MeshBasicMaterial({color:0xffc46a});
  const postM=M(0x59636e,{roughness:.6,metalness:.5});
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2+Math.PI/12;
    const px=Math.cos(a)*(R+.72),pz=Math.sin(a)*(R+.72);
    add(g,new THREE.CylinderGeometry(.045,.06,.52,8),postM,px,.26,pz);
    addNS(g,new THREE.SphereGeometry(.10,10,8),bulbM,px,.58,pz);
  }
  /* 坪面外圈溢到雪地上的暖光（雪地上用 MultiplyBlending，暖色烘进贴图） */
  const spillTex=(()=>{
    const S=256,[c,x]=cv(S,S);
    const gr=x.createRadialGradient(S/2,S/2,S*.30,S/2,S/2,S/2);
    gr.addColorStop(0,'rgba(255,246,232,1)');
    gr.addColorStop(.72,'rgba(255,238,214,1)');
    gr.addColorStop(1,'rgba(255,255,255,1)');
    x.fillStyle=gr;x.fillRect(0,0,S,S);
    return ctex(c);
  })();
  const spill=add(g,new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({map:spillTex,color:0xffffff,transparent:true,opacity:.55,
      blending:THREE.MultiplyBlending,depthWrite:false,fog:false}),
    0,.012,0);
  spill.rotation.x=-Math.PI/2;spill.scale.set(R*3.0,R*3.0,1);spill.castShadow=false;

  /* 风向袋（会随风摆动） */
  {
    const p=new THREE.Group();p.position.set(R+1.5,0,-R-1.2);g.add(p);
    p.userData.keep=true;
    add(p,new THREE.CylinderGeometry(.075,.10,3.3,10),postM,0,1.65,0);
    add(p,new THREE.CylinderGeometry(.34,.40,.14,12),M(0x8e99a4,{roughness:.8}),0,.07,0);
    const sock=new THREE.Group();sock.position.set(0,3.15,0);p.add(sock);
    sock.userData.keep=true;
    const cone=new THREE.Mesh(new THREE.CylinderGeometry(.24,.17,1.25,14,1,true),
      new THREE.MeshStandardMaterial({map:heliSockTex(),roughness:.9,side:THREE.DoubleSide}));
    cone.rotation.z=Math.PI/2;cone.position.x=.62;cone.castShadow=false;
    sock.add(cone);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.24,.028,6,16),M(0x9aa6b2,{roughness:.6,metalness:.5}));
    ring.rotation.y=Math.PI/2;sock.add(ring);
    heliSys.sock=sock;
    OUTDOOR_OBS.push([HELI_PAD.x+R+1.5,HELI_PAD.z-R-1.2,.16]);
  }

  /* 锥桶 + 设备箱：坪边不能空得像一块贴纸 */
  {
    const coneM=M(0xef6a26,{roughness:.72});
    const coneB=M(0xf2f4f7,{roughness:.7});
    const spots=[[-R-1.1,-2.2],[-R-1.1,1.4],[2.4,-R-1.0],[R+2.6,3.0]];
    for(const [px,pz] of spots){
      const c=new THREE.Group();c.position.set(px,0,pz);c.rotation.y=Math.random()*3;g.add(c);
      add(c,new THREE.BoxGeometry(.42,.05,.42),M(0x3c434b,{roughness:.9}),0,.03,0);
      add(c,new THREE.ConeGeometry(.17,.52,12),coneM,0,.30,0);
      add(c,new THREE.CylinderGeometry(.105,.125,.09,12),coneB,0,.30,0);
    }
    /* 设备箱：铁皮工具柜 + 一卷盘起的软管 */
    const box=new THREE.Group();box.position.set(-R-2.2,0,R*.55);box.rotation.y=.35;g.add(box);
    add(box,BX(1.30,.86,.72),M(0x5c6b78,{roughness:.62,metalness:.30}),0,.45,0);
    add(box,BX(1.36,.09,.78),M(0x46525d,{roughness:.55,metalness:.35}),0,.92,0);
    add(box,BX(.06,.30,.05),M(0xd7dde4,{roughness:.35,metalness:.7}),.42,.62,.38);
    add(box,new THREE.TorusGeometry(.30,.055,6,18),M(0x2f3841,{roughness:.85}),.95,.14,.10).rotation.x=Math.PI/2;
    OUTDOOR_OBS.push([HELI_PAD.x-R-2.2,HELI_PAD.z+R*.55,.55]);
  }
  return g;
}

/* ══ 直升机（写实比例轻型直升机，朝 -Z 为机头方向） ══ */
/* 两点之间架一根细杆（风挡框这类斜向构件，手算旋转矩阵太啰嗦） */
function strutBetween(parent,mat,a,b,r){
  const A=new THREE.Vector3(a[0],a[1],a[2]),B=new THREE.Vector3(b[0],b[1],b[2]);
  const d=B.clone().sub(A),len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),mat);
  m.position.copy(A).add(B).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  m.castShadow=false;m.receiveShadow=false;parent.add(m);
  return m;
}

function buildHelicopter(x,z,yaw){
  const g=new THREE.Group();
  g.position.set(x,0,z);g.rotation.y=yaw;
  g.userData.keep=true;            // 会飞：整棵子树不能被合批冻住
  scene.add(g);

  const bodyM=M(0xe8563c,{roughness:.42,metalness:.16,envMapIntensity:.55});
  const creamM=M(0xf3e7cf,{roughness:.46,metalness:.08,envMapIntensity:.45});
  const deepM=M(0x27313f,{roughness:.48,metalness:.30,envMapIntensity:.4});
  const steelM=M(0xbcc8d6,{roughness:.28,metalness:.80,envMapIntensity:.7});
  const goldM=M(0xe8c16a,{roughness:.26,metalness:.82,envMapIntensity:.85});
  /* 玻璃：深蓝高光漆面，不做半透明 ——
     半透明叠在橙色机身上会透出橘色，整块玻璃变成紫黑色，反而像塑料玩具；
     卡通渲染里的风挡本来就是一整块深色亮面。 */
  const glassM=M(0x1c4269,{roughness:.10,metalness:.62,envMapIntensity:1.15});
  const windM=M(0x1e4a74,{roughness:.09,metalness:.66,envMapIntensity:1.20});
  windM.side=THREE.DoubleSide;
  /* 起落架用哑光深灰：亮钢色在雪地里会变成一堆白棍子，喧宾夺主 */
  const gearM=M(0x6a7482,{roughness:.55,metalness:.45,envMapIntensity:.35});
  /* 机号贴纸：单独一小块，不靠球体 UV，省得贴图方向猜错 */
  const decalM=new THREE.MeshBasicMaterial({map:heliDecalTex(),transparent:true,side:THREE.DoubleSide,depthWrite:false});

  /* ① 机身：前窄后宽的锥形舱段 + 锥形机鼻 + 圆鼻头
       —— 之前机身是个大球，前脸再套个玻璃球，渲染出来就是一颗紫灯泡；
          真直升机是「锥体机身 + 独立风挡面」，轮廓一眼就认得出。 */
  const fuse=new THREE.Group();
  fuse.position.set(0,1.26,0);fuse.scale.set(1,.88,1);   // 压扁一点，肚子才平
  g.add(fuse);
  {
    const cabin=add(fuse,new THREE.CylinderGeometry(.90,.90,.90,24),bodyM,0,0,.25);
    cabin.rotation.x=-Math.PI/2;                         // 舱段 z -0.20 ~ 0.70
    const tail=add(fuse,new THREE.CylinderGeometry(.90,.30,.72,24),bodyM,0,0,1.06);
    tail.rotation.x=-Math.PI/2;                          // 尾部收细 z 0.70 ~ 1.42
    const nc=add(fuse,new THREE.CylinderGeometry(.40,.90,1.05,24,1,true,Math.PI*.5,Math.PI),bodyM,0,0,-.725);
    nc.rotation.x=-Math.PI/2;                            // 机鼻下半（橙色）
    add(fuse,new THREE.SphereGeometry(.40,18,12),bodyM,0,0,-1.25);   // 鼻头圆角
  }
  /* ② 奶油色机顶罩：沿舱顶包一整片壳，贴着舱壁的曲率走
       （之前是一颗压扁的球扣在顶上，远看像机顶扣了顶白球） */
  {
    const roof=add(fuse,new THREE.CylinderGeometry(.915,.915,.92,26,1,true,-Math.PI*.28,Math.PI*.56),creamM,0,0,.24);
    roof.rotation.x=-Math.PI/2;
  }
  /* ③ 深色机腹 */
  add(fuse,new THREE.SphereGeometry(1,20,14),deepM,0,-.58,.20).scale.set(.84,.36,.85);
  /* ④ 前风挡：罩住机鼻上半的一片壳（贴合锥面），下半留橙色机鼻 */
  {
    const glass=add(fuse,new THREE.CylinderGeometry(.43,.81,.80,24,1,true,-Math.PI*.5,Math.PI),windM,0,0,-.85);
    glass.rotation.x=-Math.PI/2;
    /* 风挡下沿：两条沿锥面斜向的深色细杆，玻璃与机鼻的接缝靠它收口 */
    for(const sx of [-1,1])strutBetween(g,deepM,[sx*.40,1.26,-1.25],[sx*.90,1.26,-.20],.030);
  }
  /* ⑤ 侧面腰线：贴着舱壁的一道细金条（原版是一圈悬空的环） */
  for(const sx of [-1,1]){
    addNS(g,BX(.030,.050,1.15),goldM,sx*.873,1.05,.20);
  }
  for(const sx of [-1,1]){
    /* 圆舱窗：两扇，是「这是直升机」最关键的特征 */
    for(const wz of [-.02,.52]){
      const win=addNS(g,new THREE.SphereGeometry(1,14,10),glassM,sx*.872,1.45,wz);
      win.scale.set(.06,.19,.19);
    }
    /* 门把手 + 踏板 */
    addNS(g,BX(.05,.05,.24),gearM,sx*.855,.92,.58);
    addNS(g,BX(.26,.045,.22),gearM,sx*.78,.58,.58);
    /* 机号贴纸 */
    const dec=new THREE.Mesh(new THREE.PlaneGeometry(.58,.24),decalM);
    dec.position.set(sx*.868,1.14,.25);dec.rotation.y=sx*Math.PI/2;dec.castShadow=false;
    g.add(dec);
    /* 航行灯：红左绿右 */
    addNS(g,new THREE.SphereGeometry(.07,8,6),new THREE.MeshBasicMaterial({color:sx<0?0xff4d5a:0x4de896}),sx*.60,1.28,-.80);
    /* 天线 */
    add(g,new THREE.CylinderGeometry(.016,.022,.52,6),deepM,sx*.28,2.12,.55);
  }
  /* ⑦ 发动机整流罩（旋翼后面那块凸起，是直升机最好认的特征之一） */
  const cowl=add(g,new THREE.SphereGeometry(1,20,14),bodyM,0,1.95,1.00);
  cowl.scale.set(.42,.26,.52);
  add(g,BX(.34,.20,.46),creamM,0,1.88,1.34);
  add(g,new THREE.CylinderGeometry(.085,.10,.30,10),deepM,.26,1.70,1.48).rotation.x=Math.PI/2;
  /* ⑧ 尾梁：锥形圆柱 + 水平安定翼 + 后掠垂尾 */
  const boom=add(g,new THREE.CylinderGeometry(.13,.30,3.05,14),creamM,0,1.40,2.95);
  boom.rotation.x=Math.PI/2;
  add(g,BX(1.65,.07,.34),creamM,0,1.46,4.18);
  for(const sx of [-1,1])add(g,BX(.05,.26,.30),creamM,sx*.80,1.52,4.18);
  const fin=add(g,BX(.11,1.20,.64),bodyM,0,2.02,4.32);fin.rotation.x=-.34;
  add(g,BX(.14,.22,.52),goldM,0,2.54,4.46);
  /* ⑨ 涵道尾桨 */
  const shroud=new THREE.Mesh(new THREE.TorusGeometry(.44,.055,8,20),deepM);
  shroud.position.set(.30,2.04,4.34);shroud.rotation.y=Math.PI/2;shroud.castShadow=false;g.add(shroud);
  const tRotor=new THREE.Group();tRotor.position.set(.30,2.04,4.34);g.add(tRotor);
  tRotor.userData.keep=true;
  for(let k=0;k<3;k++){
    const a=new THREE.Group();a.rotation.x=k*Math.PI/3;tRotor.add(a);
    addNS(a,BX(.055,.60,.13),deepM,0,.32,0);
    addNS(a,BX(.060,.15,.14),creamM,0,.60,0);
  }
  /* ⑩ 主旋翼：四叶 + 变距拉杆 */
  const rotor=new THREE.Group();rotor.position.set(0,2.26,.28);g.add(rotor);
  rotor.userData.keep=true;
  addNS(rotor,new THREE.CylinderGeometry(.10,.15,.44,12),steelM,0,-.24,0);
  addNS(rotor,new THREE.SphereGeometry(.18,12,8),goldM,0,.02,0).scale.set(1,.5,1);
  for(let k=0;k<4;k++){
    const arm=new THREE.Group();arm.rotation.y=k*Math.PI/2;rotor.add(arm);
    const blade=addNS(arm,BX(4.60,.055,.34),deepM,2.46,0,0);
    blade.rotation.z=.035;
    addNS(arm,BX(.52,.062,.36),creamM,4.74,0,0);
    addNS(arm,BX(.24,.28,.10),steelM,.34,-.02,0);
  }
  /* 旋翼盘面模糊影（转速越高越实） */
  const discTex=(()=>{
    const S=256,[c,x]=cv(S,S);
    const gr=x.createRadialGradient(S/2,S/2,S*.06,S/2,S/2,S/2);
    gr.addColorStop(0,'rgba(255,255,255,.05)');
    gr.addColorStop(.55,'rgba(226,236,246,.30)');
    gr.addColorStop(.90,'rgba(214,228,242,.16)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gr;x.fillRect(0,0,S,S);
    return ctex(c);
  })();
  const disc=new THREE.Mesh(new THREE.CircleGeometry(4.95,56),
    new THREE.MeshBasicMaterial({map:discTex,color:0xdfeaf6,transparent:true,opacity:.02,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
  disc.rotation.x=-Math.PI/2;disc.position.set(0,2.30,.28);disc.castShadow=false;disc.visible=false;
  g.add(disc);
  /* ⑪ 起落架：两根滑橇 + 四根支柱（哑光深灰，不跟机身抢眼） */
  for(const sx of [-1,1]){
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(sx*.98,.34,-1.78),
      new THREE.Vector3(sx*.98,.14,-1.44),
      new THREE.Vector3(sx*.98,.11,-.30),
      new THREE.Vector3(sx*.98,.11,1.06),
      new THREE.Vector3(sx*.98,.26,1.62)
    ]);
    add(g,new THREE.TubeGeometry(curve,18,.055,8,false),gearM,0,0,0);
    for(const sz of [-.66,.80]){
      const strut=add(g,new THREE.CylinderGeometry(.042,.052,.92,8),gearM,sx*.76,.52,sz);
      strut.rotation.z=sx*.47;
    }
  }
  /* ⑫ 顶灯 / 尾灯 / 机鼻探照灯 */
  addNS(g,new THREE.SphereGeometry(.07,8,6),new THREE.MeshBasicMaterial({color:0xff6a5a}),0,2.10,.62);
  addNS(g,new THREE.SphereGeometry(.06,8,6),new THREE.MeshBasicMaterial({color:0xfff6e0}),0,1.64,4.50);
  const sl=add(g,new THREE.CylinderGeometry(.12,.14,.20,12),deepM,0,.78,-.66);sl.rotation.x=Math.PI/2;
  addNS(g,new THREE.SphereGeometry(.10,10,8),new THREE.MeshBasicMaterial({color:0xffeec2}),0,.78,-.78);

  /* 机身下的软阴影（跟着高度放大变淡） */
  const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({map:heliShadowTex(),color:0xffffff,transparent:true,opacity:.5,
      blending:THREE.MultiplyBlending,depthWrite:false,fog:false}));
  shadow.rotation.x=-Math.PI/2;shadow.position.y=.035;shadow.castShadow=false;
  shadow.scale.set(7,7,1);shadow.renderOrder=2;shadow.userData.keep=true;
  scene.add(shadow);

  heliSys.g=g;heliSys.rotorG=rotor;heliSys.tRotor=tRotor;heliSys.disc=disc;heliSys.shadow=shadow;
  heliSys.x=x;heliSys.z=z;heliSys.yaw=yaw;
  return g;
}

/* 飞行路线：停机坪水平滑出 → 爬升 → 绕园区一圈 → 回到停机坪上空
   → 收拢成一条下降盘旋 → 水平接地。
   两端都做成水平的：
     · 起飞第一段的切线是水平的（u=0 处切线 = P1-P0），所以离地时不会猛抬头；
     · 降落最后一段水平接地（u=1 处切线 = Pn-Pn-1），
       盘旋下降时坡度也只有 10~30°，不是原来那种 60~70° 的陡降。
   盘旋半径 8~12m，正好套在停机坪（半径 8m）上方，越转越小，最后落在坪中心。 */
const HELI_PATH=new THREE.CatmullRomCurve3([
  new THREE.Vector3(HELI_PAD.x,0.007,HELI_PAD.z),
  new THREE.Vector3(HELI_PAD.x,0.007,44.5),   // 水平滑出
  new THREE.Vector3(50.5,3.2,39.5),          // 爬升
  new THREE.Vector3(46,8.5,36),
  new THREE.Vector3(37,16,32),
  new THREE.Vector3(26,22,25),
  new THREE.Vector3(12,27,17),
  new THREE.Vector3(-4,30,10),
  new THREE.Vector3(-20,31,6),
  new THREE.Vector3(-34,29,12),
  new THREE.Vector3(-40,26,26),
  new THREE.Vector3(-36,25,40),
  new THREE.Vector3(-24,25,50),
  new THREE.Vector3(-8,26,55),
  new THREE.Vector3(10,27,56),
  new THREE.Vector3(30,29,59),              // 从跳伞塔(27.5,52.5,高26m)南侧绕过
  new THREE.Vector3(44,27,54),
  new THREE.Vector3(52,24,52),              // 回到停机坪正上方
  new THREE.Vector3(60,20,56),              // 开始收拢下降
  new THREE.Vector3(64,15,48),
  new THREE.Vector3(58,10,44),
  new THREE.Vector3(48,7,46),
  new THREE.Vector3(46,3.2,56),
  new THREE.Vector3(50,1.0,53.6),         // 最后一段下降（18° 进场）
  new THREE.Vector3(52.0,0.007,51.4),     // 接地：沿 -Z 水平滑进坪心
  new THREE.Vector3(HELI_PAD.x,0.007,HELI_PAD.z)
],false,'catmullrom',.32);
heliSys.len=HELI_PATH.getLength();

buildHelipad();
buildHelicopter(HELI_PAD.x,HELI_PAD.z,heliSys.yaw);

/* ══ 乘坐逻辑 ══ */
function heliNearPlayer(){
  if(!fp.on||heliSys.riding)return false;
  return Math.hypot(fp.x-heliSys.x,fp.z-heliSys.z)<8.2;
}
function toggleHeliRide(){
  if(heliSys.riding){heliSys.fast=true;return;}      // 飞行中按 E = 加速回场
  if(wheelSys.riding)stopFacilityRide();
  if(trainSys.riding)trainSys.riding=false;
  if(balloonSys.riding)stopBalloonRide();
  if(launchSys.active)stopLaunchRide();
  if(!fp.on)fpEnter(true);
  heliSys.riding=true;heliSys.phase='spin';heliSys.t=0;
  heliSys.fast=false;heliSys.dist=0;heliSys.rotorSpd=.05;
  if(window.MP)MP.pushFirstPerson();
  /* 登机瞬间视角就切到机外侧后方：机子在画面里，视线朝外看园区 */
  heliSys.camYaw=heliSys.yaw+2.30;
  heliSys.camOff=0;heliSys.camInit=false;
  fp.yaw=heliSys.camYaw;fp.pitch=-.05;
  sfx.blip(660,.14,.07);
}
function endHeliRide(){
  if(!heliSys.riding)return;
  heliSys.riding=false;heliSys.phase='idle';heliSys.t=0;heliSys.fast=false;
  if(window.MP)MP.popFirstPerson();
  hudHide();
  const a=heliSys.yaw+1.25;
  fp.x=heliSys.x+Math.cos(a)*3.6;fp.z=heliSys.z+Math.sin(a)*3.6;
  fp.y=groundY(fp.x,fp.z);fp.vx=fp.vz=0;
  fp.yaw=heliSys.yaw-Math.PI*.5;fp.pitch=0;
  sfx.blip(392,.12,.06);
}
const _heliTmp=new THREE.Vector3();
const _heliLook=new THREE.Vector3();
const _heliMat=new THREE.Matrix4();
function updateHeliRide(dt){
  const g=heliSys.g;
  if(!g)return;
  const t=performance.now()*.001;

  /* 旋翼转速：停机时慢转，飞行时全速 */
  const want=heliSys.riding?(heliSys.phase==='land'?.30:1):heliSys.idleSpd;
  heliSys.rotor+=(want-heliSys.rotor)*Math.min(1,dt*(heliSys.phase==='spin'?1.15:1.7));
  heliSys.rotorG.rotation.y+=dt*(2.4+heliSys.rotor*46);
  heliSys.tRotor.rotation.x+=dt*(3.2+heliSys.rotor*62);
  if(heliSys.disc){
    heliSys.disc.material.opacity=.02+heliSys.rotor*.20;
    heliSys.disc.visible=heliSys.rotor>.06;
  }
  if(sfx&&sfx.setRotor)sfx.setRotor(heliSys.rotor*.85);

  /* 风向袋：随风慢慢摆 */
  if(heliSys.sock){
    heliSys.sock.rotation.y=Math.sin(t*.42)*.30+2.35+Math.sin(t*1.7)*.10;
    heliSys.sock.rotation.z=Math.sin(t*1.1)*.09;
  }

  if(heliSys.riding){
    if(heliSys.phase==='spin'){
      heliSys.t+=dt;
      heliSys.pitch=0;heliSys.roll=0;      // 停机坪上必须是水平姿态
      g.position.set(heliSys.x,.007+Math.sin(t*40)*.014*heliSys.rotor,heliSys.z);
      g.rotation.set(0,heliSys.yaw,0,'YXZ');
      if(heliSys.t>1.9){heliSys.phase='fly';heliSys.t=0;}
    }else if(heliSys.phase==='fly'){
      const u=clamp(heliSys.dist/heliSys.len,0,1);
      let spd=16*(heliSys.fast?3.4:1);
      spd*=Math.max(.05,Math.min(1,Math.min(u/.10,(1-u)/.14)));
      heliSys.dist+=spd*dt;
      const u2=clamp(heliSys.dist/heliSys.len,0,1);
      const p=HELI_PATH.getPointAt(u2);
      const tg=HELI_PATH.getTangentAt(u2);
      /* 偏航：沿切线走，带平滑，避免曲线拐点处机身突然甩头 */
      const prevYaw=heliSys.yaw;
      let dYaw=Math.atan2(-tg.x,-tg.z)-prevYaw;
      while(dYaw>Math.PI)dYaw-=Math.PI*2;
      while(dYaw<-Math.PI)dYaw+=Math.PI*2;
      heliSys.yaw=prevYaw+dYaw*Math.min(1,dt*2.6);
      heliSys.x=p.x;heliSys.y=Math.max(0,p.y);heliSys.z=p.z;
      /* 俯仰：跟的是「爬升趋势」，不是路径的瞬时切线角。
         三个坑叠在一起会出事：
           ① 符号：rotation.x 为正才是机头抬起（尾巴相对下沉）。
              之前写的是 -climb，爬升时反而把尾巴甩到天上、降落时把尾巴压进地里 —— 就是穿模。
           ② 幅度：尾梁伸到机身后 4.5m、高只有 1.4m，
              俯仰超过 16° 尾巴就插进地面，所以限幅 ±0.20 rad（≈11.5°）。
           ③ 低空：贴地时按离地高度把俯仰收掉，起降段机头不会猛抬、尾巴不会扫地。 */
      const climb=Math.atan2(tg.y,Math.hypot(tg.x,tg.z));
      const agl=Math.max(0,heliSys.y);
      const lowK=Math.min(1,agl/4.0);
      const wantPitch=Math.max(-.20,Math.min(.20,climb*.30))*lowK;
      heliSys.pitch+=(wantPitch-heliSys.pitch)*Math.min(1,dt*2.0);
      const rate=dYaw/Math.max(dt,1e-3);
      /* 侧倾按离地高度衰减：贴地滑行时完全不侧倾。
         以前这里留了 .35 的保底，飞机还站在地上就开始歪 —— 滑橇直接插进雪地。 */
      const wantRoll=Math.max(-.34,Math.min(.34,-rate*.24))*Math.min(1,agl/2.5);
      heliSys.roll+=(wantRoll-heliSys.roll)*Math.min(1,dt*2.0);
      /* 硬约束：任何一个零件都不许低于地面 2cm。
         滑橇底（局部 x=±0.98, y=0.055）被侧倾压下 0.98·sin(roll)，
         尾梁末端（局部 z=4.47, y=1.40）被抬头压下 4.47·sin(pitch)，
         离地 0m 时侧倾最多 2°、离地 0.3m 时抬头最多 4.5°。
         这一层是几何算出来的，不是手感调出来的：改了姿态就自动不会扎地。 */
      const limRoll=Math.asin(Math.max(0,Math.min(1,(agl+0.055-0.02)/0.98)));
      if(Math.abs(heliSys.roll)>limRoll)heliSys.roll=(heliSys.roll<0?-1:1)*limRoll;
      const limPitch=Math.asin(Math.max(-1,Math.min(1,(agl+1.40-0.02)/4.47)));
      if(heliSys.pitch>limPitch)heliSys.pitch=limPitch;
      if(heliSys.pitch<-limPitch)heliSys.pitch=-limPitch;
      g.position.set(heliSys.x,heliSys.y,heliSys.z);
      g.rotation.set(heliSys.pitch,heliSys.yaw,heliSys.roll,'YXZ');
      if(u2>=1){heliSys.phase='land';heliSys.t=0;heliSys.pitch=0;heliSys.roll=0;}
    }else if(heliSys.phase==='land'){
      heliSys.t+=dt;
      heliSys.pitch=0;heliSys.roll=0;
      g.position.set(heliSys.x,.007,heliSys.z);
      g.rotation.set(0,heliSys.yaw,0,'YXZ');
      if(heliSys.t>2.4)endHeliRide();
    }
    /* 机身下的影子：飞越高越大越淡 */
    if(heliSys.shadow){
      const h=Math.max(0,heliSys.y);
      const sc=5.6+h*.30;
      heliSys.shadow.position.set(heliSys.x,.035,heliSys.z);
      heliSys.shadow.scale.set(sc,sc,1);
      heliSys.shadow.material.opacity=Math.max(.06,.46-h*.011);
    }
    /* 相机：机外侧后方，视线朝外
       —— 不能用 camera.position.lerp / camera.lookAt：
          MP.freezeCam 会把这两个方法永久打成空函数（它是钉机位的调试工具），
          一旦同页面先拍过定点图，直升机视角就再也动不了。
          这里改成逐分量插值 + Matrix4.lookAt + setFromRotationMatrix，完全绕开那两个方法。 */
    const BASE=2.30;
    const base=heliSys.yaw+BASE;
    if(!heliSys.camInit){heliSys.camBase=base;heliSys.camOff=0;heliSys.camInit=true;}
    /* 鼠标横向输入 = fp.yaw 的变化量；机身自身偏航引起的基线变化要扣掉，
       否则飞机一拐头，视角就跟着漂，鼠标完全失去控制。 */
    const md=fp.yaw-heliSys.camBase-heliSys.camOff;
    if(Math.abs(md)>1e-6)heliSys.camOff=Math.max(-1.5,Math.min(1.5,heliSys.camOff+md));
    heliSys.camBase=base;
    fp.yaw=base+heliSys.camOff;          // 保持 fp.yaw 与当前视角一致
    /* 追尾机位：机身在画面左下角，视线越过机头看向园区（不是把相机摆到机前朝后看）。
       机头方向 f=(-sin y,-cos y)，机右 r=(cos y,-sin y)。
       相机 = 机 -13f +4.5r +5.5u（后方偏右上方），注视点 = 机 +22f。
       这样机子偏轴约 19°、仰角约 15°，正好卡在画面左下，园区铺在正前方。 */
    const yaw=heliSys.yaw;
    const fwdX=-Math.sin(yaw),fwdZ=-Math.cos(yaw);
    const rgtX=Math.cos(yaw),rgtZ=-Math.sin(yaw);
    const camYaw=yaw+0.333+heliSys.camOff;
    const DIST=13.76;
    const pitch=Math.max(-1.0,Math.min(1.0,fp.pitch));
    _heliTmp.set(heliSys.x+Math.sin(camYaw)*DIST,
                 heliSys.y+5.5+pitch*2.2,
                 heliSys.z+Math.cos(camYaw)*DIST);
    const ck=Math.min(1,dt*3.2);
    camera.position.x+=(_heliTmp.x-camera.position.x)*ck;
    camera.position.y+=(_heliTmp.y-camera.position.y)*ck;
    camera.position.z+=(_heliTmp.z-camera.position.z)*ck;
    camera.up.set(0,1,0);
    /* 调试用：camLookSelf=true 时看机身自己（目视核对俯仰姿态） */
    const lookSelf=!!heliSys.camLookSelf;
    _heliLook.set(heliSys.x+fwdX*(lookSelf?2.2:22),
                  heliSys.y+(lookSelf?0.35:1.6+pitch*14),
                  heliSys.z+fwdZ*(lookSelf?2.2:22));
    _heliMat.lookAt(camera.position,_heliLook,camera.up);
    camera.quaternion.setFromRotationMatrix(_heliMat);
    hudShow(heliSys.phase==='fly'?'直升机 · 绕园区巡航中':'直升机 · 旋翼加速中',
            heliSys.phase==='fly'?'立刻回场 (E)':'等待起飞 (E)',()=>{heliSys.fast=true;},true);
  }else{
    if(heliSys.shadow){
      heliSys.shadow.position.set(heliSys.x,.035,heliSys.z);
      heliSys.shadow.scale.set(5.6,5.6,1);
      heliSys.shadow.material.opacity=.46;
    }
    /* 停机坪上的走近提示 */
    if(fp.on&&!balloonSys.riding&&!wheelSys.riding&&!trainSys.riding&&!launchSys.active){
      if(heliNearPlayer()){
        hudShow('停机坪 · 直升机 · 按 E 或点击登机（起飞后绕园区一圈再落地）','登机 (E)',()=>toggleHeliRide());
        heliSys.hud=true;
      }
    }
  }
}

/* 玩家鼓掌：全场跟着拍一下手 */
function circusClap(){
  if(sfx&&sfx.on)sfx.cheer(.95);
  circus.cheerT=1;
}

/* ══ 马戏团每帧动画：四组表演轮流上场，每 8 秒换一幕 ══ */
function updateCircus(dt,t){
  const c=circus;
  if(!c.g)return;
  const act=Math.floor(t/9)%3;   // 节目表按服务器时间切 → 各端看到的是同一幕（三幕循环）
  circus.act=act;
  if(act!==c.act){
    c.act=act;
    if(fp.on&&sfx&&sfx.on){
      const d=Math.hypot(fp.x-c.x,fp.z-c.z);
      if(d<24)sfx.cheer(Math.max(.16,1-d/26));
    }
  }
  /* 地面扫光 + 追光斑 */
  if(c.sweep)c.sweep.rotation.y=phaseOf(28.5599)*.22;      // 恒速扫光，纯相位
  if(c.sweep2)c.sweep2.rotation.y=-phaseOf(39.2699)*.16;
  if(c.sweepMat)c.sweepMat.opacity=.13+.05*Math.sin(t*1.6);
  if(c.pool){
    const a=t*.42;
    c.pool.position.set(Math.cos(a)*2.55,.122,Math.sin(a)*2.55);
  }
  /* ① 变魔术：礼帽升起，兔子从帽子里冒出来 */
  {
    const m=c.magic;
    if(m.hat&&m.rabbit&&m.mage){
      const ph=(t%9)/9;
      let lift=0,up=0;
      if(act===0&&ph>0.10&&ph<0.68){
        const u=(ph-0.10)/0.58;
        lift=Math.sin(Math.min(1,u*1.7)*Math.PI)*0.36;
        up=(u>0.30&&u<0.94)?1:0;
      }
      m.hat.position.y=1.09+lift;
      m.rabbit.position.y=1.12+lift*.55;
      m.rabbit.visible=up>0;
      if(up)m.rabbit.scale.setScalar(.9+.1*Math.sin(t*6));
      const u=m.mage.userData;
      u.armR.rotation.x=-1.15+Math.sin(t*3.1)*.55;
      u.armL.rotation.x=-0.85+Math.cos(t*2.6)*.45;
      m.mage.rotation.y=Math.sin(t*.85)*.16;
    }
  }
  /* ② 扔苹果整幕已删除（熊 + 飞苹果一并清空） */
  /* ② 杂技：钢丝上往返走（吊环整组已删除） */
  {
    const a=c.acro;
    if(a.walker){
      const fast=(act===1)?1:.42;
      const u=(t*.26*fast)%2;
      const s=u<1?u:2-u;
      a.walker.position.x=-2.55+s*5.10;
      a.walker.rotation.z=Math.sin(t*2.3)*.06;
      a.walker.rotation.y=Math.sin(t*1.1)*.12;
      const w=a.walker.userData;
      /* 平举保持平衡：armL 在左侧要朝 -X 张、armR 在右侧要朝 +X 张。

    const pn=c.createStereoPanner?c.createStereoPanner():null;
    if(pn){pn.pan.value=pan;g.connect(pn);pn.connect(this.musicBus);}
    else g.connect(this.musicBus);
    src.start(t,off,maxD);
  },
  loadSample(url,onReady){
    return fetch(url).then(r=>r.arrayBuffer()).then(ab=>{
      const c=this.ctx;
      if(!c)return null;
      return c.decodeAudioData(ab).then(buf=>{onReady(buf);return buf;});
    }).catch(()=>null);
  },
  loadPiano(){
    if(this.pianoBuf||this._pianoLoading)return;
    this._pianoLoading=true;
    this.loadSample('./audio/piano.wav',b=>{if(b){this.pianoBuf=b;this.pianoReady=true;}}).finally(()=>{this._pianoLoading=false;});
  },
  loadHarp(){
    if(this.harpBuf||this._harpLoading)return;
    this._harpLoading=true;
    this.loadSample('./audio/harp.wav',b=>{if(b){this.harpBuf=b;this.harpReady=true;}}).finally(()=>{this._harpLoading=false;});
  },
  /* dur 是音符的真实时长（秒）。采样不能一律播满整段：
     乐句是 120BPM、八分音符 0.25 秒，如果每个音都响满 1.5 秒，
     稳态会压着三四个钢琴音叠着，音符之间一点缝都没有 ——
     听起来就是一串"叮咚"从头连到尾，比合成音还吵。
     现在按真实时值收尾（时值 + 一点余音），恢复真钢琴的句法。 */
  playPiano(midi,t,dur,vel=.13,pan=.08){
    if(!this.pianoReady||!this.pianoBuf||this.PIANO_MAP[midi]===undefined){
      this.playLead(midi,t,dur,vel*.5,pan);return;
    }
    const playDur=Math.min(this.PIANO_SEG,dur+Math.min(.30,dur*.9));
    this.playBufSample(this.pianoBuf,this.PIANO_MAP[midi],1,t,playDur,vel,pan);
  },
  /* 场景钢琴独奏（集市钢琴广场用）：
     走 master 而不是 musicBus —— musicBus 是 BGM 通道，
     updateBgmMix 会按「馆内/馆外」把它的增益压到 .52 / .30，
     户外的钢琴声会低到基本听不见。独奏要自己的一条通路。 */
  playPianoFx(midi,when,dur,vel=.17,pan=0){
    if(!this.ctx||!this.on)return;
    const c=this.ctx,t=Math.max(when||c.currentTime,c.currentTime);
    if(!this.pianoReady||!this.pianoBuf||this.PIANO_MAP[midi]===undefined){
      this.blip(300+(midi-60)*8,.32,.05);return;
    }
    const src=c.createBufferSource();src.buffer=this.pianoBuf;
    const off=this.PIANO_MAP[midi];
    const g=c.createGain();
    const maxD=Math.max(.08,Math.min(this.PIANO_SEG,dur));
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vel,t+.006);
    g.gain.setValueAtTime(vel,t+maxD-.025);
    g.gain.linearRampToValueAtTime(0,t+maxD);
    src.connect(g);
    const pn=c.createStereoPanner?c.createStereoPanner():null;
    if(pn){pn.pan.value=pan;g.connect(pn);pn.connect(this.master);}
    else g.connect(this.master);
    src.start(t,off,maxD);
  },
  /* 装饰颤音：主音与上方半音快速交替 —— 钟琴/八音盒的标志性手法，
     用在乐谱标了 trill 的音上，是"圣诞味"最直接的来源。
     每个颤音音只播 0.09 秒、间隔 0.062 秒，闪而不糊。 */
  playPianoTrill(midi,t,dur,vel=.11,pan=.08){
    const up=midi+1;
    if(!this.pianoReady||!this.pianoBuf||this.PIANO_MAP[midi]===undefined
       ||this.PIANO_MAP[up]===undefined){
      this.playPiano(midi,t,dur,vel,pan);return;
    }
    const step=.062,n=Math.max(2,Math.round(dur/step));
    for(let k=0;k<n;k++){
      const m=(k%2)?up:midi;
      this.playBufSample(this.pianoBuf,this.PIANO_MAP[m],1,t+k*step,.09,vel*(k%2?.60:1),pan);
    }
  },
  /* 雪橇铃（playSleighBell）已整段删除 ——
     2350/3050 Hz 的金属高频听着就是"嘎嘎嘎哒"，穿透力比主奏钢琴还强，
     玩家直接点名"圣诞老人那个车的声音"要去掉。留个空位，以后真要加回
     蹄声/铃铛，从这里重新写。 */
  /* ══ 合成圣诞乐器 BGM 调度器
     这套乐器（暖钢琴 + 原声贝斯 + 弦乐长音 + 竖琴琶音 + 圣诞大厅混响）
     早就写好了，但之前只有 schedNote/playLead 这些"发声函数"，没有任何定时器去驱动它们，
     所以页面一直在播那三条 mp3。现在把它接上，做成真正的主 BGM：
     音色是合成出来的，音量、节奏、混响都能精确控制，不会像成品 mp3 那样又满又吵。 */
  synth:{timer:null,step:0,nextT:0,gain:.0,beatAcc:0,barIdx:0},
  STEP_DUR:.21,                        // 一个拍单位 = 0.21 秒（轻快治愈的休闲游戏节奏）
  startSynthBgm(){
    const c=this.ctx;
    if(!c||this.synth.timer)return;
    this.synth.step=0;this.synth.beatAcc=0;this.synth.barIdx=0;this.synth.nextT=c.currentTime+.18;
    this.synth.timer=setInterval(()=>{
      if(!this.on||!this.ctx){this.stopSynthBgm();return;}
      const now=this.ctx.currentTime;
      while(this.synth.nextT<now+.45){
        const row=this.SONG[this.synth.step];
        if(!row){this.synth.step=0;this.synth.beatAcc=0;this.synth.barIdx=0;continue;}
        this.playStep(this.synth.nextT,this.synth.step);
        this.synth.nextT+=Math.max(.12,row[1]*this.STEP_DUR);
        this.synth.step=(this.synth.step+1)%this.SONG.length;
        if(this.synth.step===0){this.synth.beatAcc=0;this.synth.barIdx=0;}
      }
    },60);
  },
  stopSynthBgm(){
    if(this.synth.timer){clearInterval(this.synth.timer);this.synth.timer=null;}
  },
  playStep(t,i){
    const row=this.SONG[i];
    if(!row)return;
    const midi=row[0],beats=row[1];
    const dur=Math.max(.12,beats*this.STEP_DUR);
    /* 主旋律：真实 Salamander 三角钢琴采样 */
    if(midi>0){
      this.playPiano(midi,t,dur,.14,.06);
    }
    const chord=this.CHORDS[this.synth.barIdx%this.CHORDS.length];
    /* 每小节第 0 拍：竖琴轻盈琶音 + 根音木贝斯 */
    if(this.synth.beatAcc===0){
      this.curChord=chord;
      this.playArp(chord,t);
      this.playBass(chord[0],t,.75);
    }else if(this.synth.beatAcc===4){
      /* 每小节第 4 拍（半小节）：轻点五音贝斯，形成动森/星露谷式的轻松蹦跳律动 */
      this.playBass(chord[0]+7,t,.55);
    }
    this.synth.beatAcc+=beats;
    if(this.synth.beatAcc>=8){
      this.synth.beatAcc-=8;
      this.synth.barIdx=(this.synth.barIdx+1)%this.CHORDS.length;
      /* 雪橇铃已停用（见 playSleighBell 位置） */
    }
  },
  bgmTracks:null,
  initBgmTracks(){
    if(this.bgmTracks)return;
    const c=this.ctx;
    if(!c)return;
    /* 三条 mp3 已全部停用 —— 这就是那个"一直循环播放圣诞旋律、像弦乐、
       而且比主奏钢琴还抢耳"的东西：
         museum_piano.mp3  99 秒完整圣诞旋律，loop 播放
         park_wonderland.mp3 另一首循环曲（马戏/铜管风）
         rock_festival.mp3  失真摇滚，4k+ 高频贯穿整首，loop 接缝落差 78dB
       它们是"两条同时循环的完整旋律"，而且直连 master、不过合成乐器的
       音量控制（musicBus），所以存在感比主奏钢琴还强 —— 听起来就是一直很吵。
       现在主 BGM 完全由真实钢琴 + 真实竖琴采样承担，这三条只当远景垫，
       反而成了噪音源。音频文件还留在服务器上，想恢复把下面三行加回去即可。 */
    this.bgmTracks={v:{}};
  },
  updateBgmMix(dt){
    if(!this.on)return;
    const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
    const inMus=cx>-10.5&&cx<12.5&&cz>-12.0&&cz<8.5&&cy<9.5;
    /* 合成圣诞乐器 BGM 音量：馆内更饱满，户外收小当远景音乐。
       之前 mp3 垫底占掉了一部分听感份额，现在主 BGM 独自承担，略提一档。 */
    const tSyn=inMus?.52:.30;
    if(this.musicBus){
      this.synth.gain+=(tSyn-this.synth.gain)*Math.min(1,dt*1.5);
      this.musicBus.gain.value=this.synth.gain;
    }
  },
  pump(){},
  /* 雨声：一条带通白噪当雨幕底噪。
     增益压得很低（0.030）—— 雨是背景音，不该盖过圣诞旋律。
     切到雨天时把雪天的风声压掉一点，免得两层噪声叠着糊。 */
  setRain(v){
    v=Math.max(0,Math.min(1,v||0));
    this.rainAmt=v;
    if(!this.ctx||!this.noiseBuf)return;
    const c=this.ctx;
    if(!this.rainGain){
      const src=c.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
      const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=430;
      const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1250;bp.Q.value=.5;
      const g=c.createGain();g.gain.value=0;
      src.connect(hp);hp.connect(bp);bp.connect(g);g.connect(this.master);
      src.start();
      this.rainGain=g;
    }
    const t=c.currentTime;
    this.rainGain.gain.cancelScheduledValues(t);
    this.rainGain.gain.setTargetAtTime(v*0.030,t,.8);
    if(this.windGain)this.windGain.gain.setTargetAtTime(v>0.02?0.003:0.010,t,1.4);
  },
  setHum(){},
  setOn(on){
    this.on=on;
    if(on){
      /* 顺序要紧：先 boot 出 AudioContext / master，再建 BGM 通道
         （createMediaElementSource 必须挂在已建好的 context 上） */
      this.boot();
      if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
      if(this.master&&this.ctx)this.master.gain.setTargetAtTime(.85,this.ctx.currentTime,.20);
      this.initBgmTracks();
      this.startSynthBgm();          // 合成圣诞乐器 BGM（主）
      this.loadPiano();               // 真实钢琴采样（异步预载，没好就先用合成音）
      this.loadHarp();                // 真实竖琴采样（同上）
    }else{
      if(this.master&&this.ctx)this.master.gain.setTargetAtTime(0,this.ctx.currentTime,.20);
      this.stopSynthBgm();

    }
  },
  blip(f,dur,vol){
    if(!this.ctx||!this.on)return;
    const c=this.ctx,t=c.currentTime,d=dur||.12,v=(vol||.085)*.55,freq=f||740;
    const o1=c.createOscillator();o1.type='sine';o1.frequency.setValueAtTime(freq,t);
    const g1=c.createGain();
    g1.gain.setValueAtTime(0,t);g1.gain.linearRampToValueAtTime(v,t+.012);g1.gain.exponentialRampToValueAtTime(.0001,t+d);
    o1.connect(g1);g1.connect(this.master);
    o1.start(t);o1.stop(t+d+.04);
  },
  /* 观众鼓掌欢呼：底噪人群 + 几声拍手（用现成噪声缓冲，不另外下载素材） */
  cheer(vol=.6){
    if(!this.ctx||!this.on||!this.noiseBuf)return;
    const c=this.ctx,t=c.currentTime,v=Math.max(.05,vol);
    const src=c.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1450;bp.Q.value=.8;
    const g=c.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.052*v,t+.14);
    g.gain.exponentialRampToValueAtTime(.0006,t+1.5);
    src.connect(bp);bp.connect(g);g.connect(this.master);
    src.start(t);src.stop(t+1.6);
    for(let i=0;i<9;i++){
      const tt=t+.06+Math.random()*1.15;
      const s2=c.createBufferSource();s2.buffer=this.noiseBuf;s2.loop=true;
      const f2=c.createBiquadFilter();f2.type='bandpass';
      f2.frequency.value=2400+Math.random()*1900;f2.Q.value=1.7;
      const g2=c.createGain();
      g2.gain.setValueAtTime(0,tt);
      g2.gain.linearRampToValueAtTime(.030*v,tt+.006);
      g2.gain.exponentialRampToValueAtTime(.0003,tt+.085);
      s2.connect(f2);f2.connect(g2);g2.connect(this.master);
      s2.start(tt);s2.stop(tt+.11);
    }
  },
  carPass(){
    if(!this.ctx||!this.on||!this.noiseBuf)return;
    const c=this.ctx,t=c.currentTime,dir=Math.random()>.5?1:-1;
    const src=c.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.4;
    bp.frequency.setValueAtTime(340,t);bp.frequency.exponentialRampToValueAtTime(120,t+2.8);
    const g=c.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.032,t+.6);g.gain.exponentialRampToValueAtTime(.0004,t+3.1);
    src.connect(bp);bp.connect(g);
    const out=c.createStereoPanner?c.createStereoPanner():null;
    if(out){out.pan.setValueAtTime(-.85*dir,t);out.pan.linearRampToValueAtTime(.85*dir,t+3.1);g.connect(out);out.connect(this.master);}
    else g.connect(this.master);
    src.start(t);src.stop(t+3.2);
  },
  horn(){
    if(!this.ctx||!this.on)return;
    const c=this.ctx,t=c.currentTime;
    for(const f of [392,494]){
      const o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f,t);
      const g=c.createGain();
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.015);
      g.gain.setValueAtTime(.045,t+.12);g.gain.exponentialRampToValueAtTime(.0003,t+.24);
      o.connect(g);g.connect(this.master);
      o.start(t);o.stop(t+.26);
    }
  }

const PUFF_N=96;
const _puffMesh=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.082,0),M(0xf2f7fc,{roughness:.88}),PUFF_N);
_puffMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
_puffMesh.frustumCulled=false;_puffMesh.castShadow=false;_puffMesh.receiveShadow=false;
scene.add(_puffMesh);
const _pData=Array.from({length:PUFF_N},()=>({alive:false,life:0,max:1,x:0,y:-20,z:0,vx:0,vy:0,vz:0,sc:1}));
let _pCursor=0;
function spawnSnowPuff(x,y,z,vx,vy,vz,sc=.9,life=.62){
  const p=_pData[_pCursor];_pCursor=(_pCursor+1)%PUFF_N;
  p.alive=true;p.life=0;p.max=life;
  p.x=x;p.y=y;p.z=z;p.vx=vx;p.vy=vy;p.vz=vz;p.sc=sc;
}
function updateSnowPuffs(dt){
  const m=_rMat,s=_rScale;
  for(let i=0;i<PUFF_N;i++){
    const p=_pData[i];
    if(!p.alive){m.makeTranslation(0,-40,0);s.set(.001,.001,.001);m.scale(s);_puffMesh.setMatrixAt(i,m);continue;}
    p.life+=dt;
    if(p.life>=p.max){p.alive=false;m.makeTranslation(0,-40,0);s.set(.001,.001,.001);m.scale(s);_puffMesh.setMatrixAt(i,m);continue;}
    p.vy-=6.8*dt;p.vx*=.95;p.vz*=.95;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.y<.02){p.y=.02;p.vy*=-.28;p.vx*=.7;p.vz*=.7;}
    const k=1-p.life/p.max, sz=Math.max(.02,p.sc*k);
    m.makeTranslation(p.x,p.y,p.z);s.set(sz,sz,sz);m.scale(s);
    _puffMesh.setMatrixAt(i,m);
  }
  _puffMesh.instanceMatrix.needsUpdate=true;
}

function pickTag(){
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){
    let o=h.object;
    while(o){
      if(o.userData&&o.userData.tag)return o.userData.tag;
      o=o.parent;
    }
  }
  return null;
}
function pickPhys(){
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){
    let o=h.object;
    while(o){
      if(o.userData&&o.userData.physObj)return{phys:o.userData.physObj,pt:h.point};
      o=o.parent;
    }
  }
  return null;
}

/* ══ 点光源池：把 20 多盏点光收敛成固定数量的"槽位" ═════════════════
   实测（本机 1280×860 广场机位，静止 2 秒取帧率）：
     点光 23 盏 → 19 fps ｜ 19 盏 → 28 ｜ 15 盏 → 34 ｜ 11 盏 → 42 ｜ 0 盏 → 52
   每一盏点光都要在**每个片元**里跑一次光照循环，灯越多整场越慢。
   这才是"越改越卡"的真正原因（draw call 只占小头）。

   做法：大部分点光降级成"候选"（不进渲染状态），场景里只留固定数量的槽位灯，
   每 8 帧按「离相机近 + 亮」挑 K 个候选填进槽位，其余槽位强度归零。
   槽位数量恒定 → shader 里的灯循环长度恒定 → 不会触发着色器重编译卡顿。

   为什么不是把灯删掉：删了就真的黑了；槽位是"谁离你近谁负责亮"，
   走位的时候画面照样有光，只是不再同时点亮二十多个光源。 */
const LP={on:false,slots:[],cands:[],K:8,cd:0,cur:[],
  probe:new THREE.Vector3(),dir:new THREE.Vector3()};
function initLightPool(){
  if(LP.on)return;
  const all=[];
  scene.traverse(o=>{ if(o.isPointLight) all.push(o); });
  for(const l of all){
    /* 馆内主灯和玩家身前的随行补光常驻（玩家大部分时间就在馆里），
       判定：直接挂在场景根下、且就在馆子附近。
       另外 userData.lpFixed 的灯也常驻 —— 马戏团帐篷内的柔光属于
       「这个场景本来就该亮」的照明，不能被灯池降级成候选灯，
       否则站在帐篷外看，里面就是一团黑。 */
    const fixed=(l.parent===scene)&&(Math.hypot(l.position.x,l.position.z)<20);
    if(fixed||l.userData.lpFixed)continue;
    LP.cands.push({l,wp:new THREE.Vector3(),score:-1});
    l.visible=false;          // 候选灯不进渲染状态，但矩阵照常更新，位置照样跟得住
  }
  for(let i=0;i<LP.K;i++){
    const s=new THREE.PointLight(0xffffff,0,20,1.5);
    s.userData.lpSlot=true;
    scene.add(s);
    LP.slots.push(s);
  }
  LP.on=true;
}
function updateLightPool(){
  if(!LP.on)return;
  /* 打分探针：取相机前方 4m 的地面点，而不是相机本身。
     相机在 60m 高的沙盘位时，量相机位置会选出一堆"离得远但很亮"的灯，
     结果脚下这一片反而没人照 —— 探针落在地面才准。 */
  camera.getWorldDirection(LP.dir);
  LP.probe.set(camera.position.x+LP.dir.x*4,.8,camera.position.z+LP.dir.z*4);
  const cp=LP.probe;
  /* 归属每 8 帧换一次，亮度每帧都抄（候选灯的强度在跳） */
  if((LP.cd++%8)===0){
    for(const c of LP.cands){
      c.l.getWorldPosition(c.wp);
      const d=c.wp.distanceTo(cp);
      const dist=c.l.distance||10;
      let sc=0;
      if(d<dist){
        const q=1-Math.pow(d/dist,4);
        sc=c.l.intensity/(d*d+1)*q*q;    // 和 three 的物理衰减同口径
      }
      c.score=sc;
    }
    LP.cands.sort((a,b)=>b.score-a.score);
    const best=LP.cands.length?LP.cands[0].score:0;
    /* 上次占位的灯只要还不太弱就留着，避免走位时灯一盏盏闪 */
    const keep=[],used=new Set();
    for(const c of LP.cur){
      if(c&&c.score>best*0.12){keep.push(c);used.add(c);}
    }
    for(const c of LP.cands){
      if(keep.length>=LP.K)break;
      if(used.has(c))continue;
      if(c.score<=0)break;
      keep.push(c);used.add(c);
    }
    LP.cur=keep;
  }
  for(let i=0;i<LP.K;i++){
    const s=LP.slots[i],c=LP.cur[i];
    if(!c){s.intensity=0;continue;}
    c.l.getWorldPosition(c.wp);
    s.position.copy(c.wp);
    s.color.copy(c.l.color);
    s.intensity=c.l.intensity;
    s.distance=c.l.distance;
    s.decay=c.l.decay;
  }
}

const TIMES=[
  {k:'dawn', name:'晨',h:6.7, weather:'雪晓',sky:['#1e2d48','#6a6180','#c98c88','rgba(255,182,158,.28)'],fog:0x3b4054,fogD:.0064,
   rainSky:['#3c4a5e','#66758a','#939fb0','rgba(190,206,222,.30)'],rainFog:0x5a6678,rainFogD:.0116},
  {k:'noon', name:'昼',h:13.2,weather:'晴雪',sky:['#3a72b0','#78aad8','#cde2f2','rgba(255,244,215,.55)'],fog:0xb2c8da,fogD:.0068,
   rainSky:['#93a0ab','#aeb9c2','#c6ced5','rgba(224,232,238,.40)'],rainFog:0xaab4be,rainFogD:.0084},
  {k:'dusk', name:'暮',h:17.5,weather:'雪霞',sky:['#263b68','#995878','#f0a46c','rgba(255,170,110,.40)'],fog:0x6e5661,fogD:.0048,
   rainSky:['#46485c','#716676','#998385','rgba(214,180,154,.38)'],rainFog:0x7e7075,rainFogD:.0100},
  {k:'night',name:'夜',h:21.5,weather:'雪夜',sky:WINTER_SKY,fog:WINTER_FOG,fogD:WINTER_FOG_D,
   rainSky:['#1c2735','#2b3848','#3e4c5c','rgba(150,170,196,.22)'],rainFog:0x2c3846,rainFogD:.0118}
];
/* 移动端默认开高画质档：低画质档会关掉 uHQ 抗闪烁柔光和 Bloom，
   在低像素比下远处路灯会闪成噪点，整屏发脏。桌面维持原样。 */
const state={timeKey:'night',hour:21.5,lights:true,quality:IS_TOUCH_DEV,envDirty:true,stars:true,clean:true,weather:'snow'};
let rainLevel=0,resetPerf=true;
/* 白膜总控：屋顶蒸汽云团 / 地标体积光雾的浓度（随时段 + 天气变）。
   傍晚是全场最暗的时候，任何"白色半透明团"都会在暗背景上变成白膜，
   所以这两个系数必须随时段收，夜里也不开满。 */
let mistK=1,steamK=1,steamCol=0xf0f4fa;
/* 蒸汽白膜总控：云团不能是死白。
   纯白半透明 sprite 在暗背景上会糊成一片"白膜"（实测傍晚 17:30 屋顶那团
   白斑就是它，不是灯、不是雾）。所以颜色要跟着环境光走，浓度要跟着时段走。 */
function setSteamLook(k,col){
  steamK=k;steamCol=col;
  if(window._roofSteamPuffs)for(const p of window._roofSteamPuffs)p.mat.color.setHex(col);
}
const rSeason=document.getElementById('r-season'),rWeather=document.getElementById('r-weather'),
      rTime=document.getElementById('r-time'),rTemp=document.getElementById('r-temp'),
      seasonW=document.getElementById('season-weather'),hourLbl=document.getElementById('hour-label'),
      hourInput=document.getElementById('hour');

function fmtHour(h){
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);
  return String(hh).padStart(2,'0')+':'+String(mm%60).padStart(2,'0');
}
function timeSlotFor(h){
  if(h>=5.3&&h<8.5)return TIMES[0];
  if(h>=8.5&&h<16.3)return TIMES[1];
  if(h>=16.3&&h<19.2)return TIMES[2];
  return TIMES[3];
}
function updateBrand(){
  const el=document.getElementById('railState');
  const slot=timeSlotFor(state.hour);
  if(el)el.title='CHRISTMAS WONDERLAND · '+slot.weather+' · '+fmtHour(state.hour);
}
function initWinter(){
  rSeason.textContent='圣诞';
  ground.material.userData.noToon=true;
  road.material.color.setHex(0x8e99a4);road.material.roughness=.62;
  roadFar.material.color.setHex(0x8e99a4);roadFar.material.roughness=.62;
  clouds.forEach(c=>{c.material.opacity=.22;});
  lampPools.forEach(p=>{p.material.opacity=.30;});
  /* 雪/雨两套地表参数交给 setWeather 统一处理，别在这里再写一份 */
  setWeather(state.weather||'snow');
}
function applyTime(h){
  state.hour=h;
  if(hourInput&&Math.abs(parseFloat(hourInput.value)-h)>.05)hourInput.value=String(h);
  const slot=timeSlotFor(h);
  state.timeKey=slot.k;
  const rainy=state.weather==='rain';
  const snowy=state.weather==='snow';
  const sky   =rainy?slot.rainSky:slot.sky;
  const fogC  =rainy?slot.rainFog:slot.fog;
  const fogD  =rainy?slot.rainFogD:slot.fogD;
  const wxTxt=rainy?slot.name+'雨':(snowy?slot.weather:slot.name+'晴');
  rWeather.textContent=wxTxt;
  if(seasonW)seasonW.textContent=wxTxt;
  rTime.textContent=fmtHour(h);if(hourLbl)hourLbl.textContent=fmtHour(h);
  /* 纯净模式下常驻的时间牌：一眼看见现在几点、什么天气，也告诉用户还能切 */
  const cc=document.getElementById('cleanClock');
  if(cc)cc.textContent=slot.name+' '+fmtHour(h)+(rainy?' 雨':(snowy?' 雪':' 晴'));
  document.querySelectorAll('#seasons button').forEach(b=>b.classList.toggle('on',b.dataset.k===slot.k));

  const elev=Math.sin(((h-6)/12)*Math.PI);
  const day=elev>0.03;
  const az=((h-6)/12)*Math.PI;
  const dawn=h>=5.3&&h<8.5;
  const sunset=h>=16.3&&h<=19.2;
  if(day){
    const warm=1-Math.abs(elev)*.55;
    key.color.setHSL(sunset?.06:dawn?.04:(.09-warm*.04), (sunset||dawn)?.72:.45, (sunset||dawn)?.60:(.60+elev*.14));
    key.intensity=(sunset||dawn)?(1.90+elev*1.15):(1.15+elev*1.35);
    key.position.set(Math.cos(az)*40,12+elev*46,26);
    /* 雨天是阴天：方向光砍到四成，环境光抬一点 —— 有方向没阴影 = 阴天 */
    if(rainy){key.color.setHex(0xc2cdd8);key.intensity*=.72;}
    moon.intensity=0;
    ambient.color.setHex(rainy?0xa9b7c4:(sunset?0x6f5c78:dawn?0x6e6478:0xb5cde3));
    ambient.intensity=rainy?1.16:((sunset||dawn)?.56:.88);
    hemi.color.setHex(rainy?0xbcc8d4:(sunset?0xc47c66:dawn?0xbe8792:0xafd0f0));
    hemi.groundColor.setHex(rainy?0x606a74:(sunset?0x3a2f3c:(dawn?0x4a5462:0x788a9a)));
    hemi.intensity=rainy?1.24:.66;
    paintSky(sky[0],sky[1],sky[2],sky[3]);
    scene.fog.color.setHex(fogC);scene.fog.density=fogD;
    scene.userData.baseFogD=fogD;scene.userData.baseFogCol=fogC;
    skylineMats.forEach(m=>{m.emissiveIntensity=rainy?.22:((sunset||dawn)?.15:.08);});
    GZU_EMI.forEach(it=>{it.m.emissiveIntensity=rainy?it.d*.35:((sunset||dawn)?it.n*.38:it.d);});
  }else{
    key.color.setHex(rainy?0x9fb2c8:0xa8ccf0);key.intensity=rainy?.26:.38;
    key.position.set(-Math.cos(az)*36,40,-18);
    moon.intensity=rainy?.30:.40;moon.color.setHex(0x86aee8);
    /* 夜里的环境光压低、压冷：暖色实用光源有 20 多盏，环境光再高就把暗部洗成灰，
       夜景会显脏。压下去之后暖光才跳得出来，暗部也才有冷调层次。 */
    ambient.color.setHex(rainy?0x38485c:0x2d4160);ambient.intensity=rainy?.78:.47;
    hemi.color.setHex(rainy?0x5c7288:0x46668c);hemi.groundColor.setHex(rainy?0x222a33:0x16202c);
    hemi.intensity=rainy?.88:.52;
    paintSky(sky[0],sky[1],sky[2],sky[3]);
    scene.fog.color.setHex(fogC);scene.fog.density=fogD;
    scene.userData.baseFogD=fogD;scene.userData.baseFogCol=fogC;
    skylineMats.forEach(m=>{m.emissiveIntensity=rainy?.42:.62;});
    GZU_EMI.forEach(it=>{it.m.emissiveIntensity=rainy?it.n*.45:it.n;});
  }
  /* ── 白膜总闸 ──
     蒸汽云团和地标光雾是画面里仅有的两块"大面积白色半透明"，
     傍晚（最暗）必须收着放，否则整片天就是白膜；
     白天可以满开，夜里留一点（夜里要有暖光跳出来，不能被白雾洗平）。 */
  if(slot.k==='noon'){setSteamLook(1.00,0xf2f6fb);mistK=1.00;}
  else if(slot.k==='dawn'){setSteamLook(.80,0xe9eff7);mistK=.85;}
  else if(slot.k==='dusk'){setSteamLook(.42,0xd8ccce);mistK=.55;}
  else{setSteamLook(.30,0xa7b7c9);mistK=.70;}
  if(rainy){steamK*=.55;mistK*=.70;}

  key.target.position.set(0,2,0);
  state.envDirty=true;
  updateBrand();
}

/* ── 天气切换：雪 / 雨 ─────────────────────────────────────────
   雨不是"把雪换成雨"这么简单，四件事必须一起换：
     1) 粒子：关掉两层飞雪，打开雨丝 + 地面涟漪
     2) 地面：雪白地 → 湿灰地（镜面感来自 roughness 压低 + 环境反射）
     3) 天空：每个时段配一套阴雨天的天色和更浓的雾
     4) 灯：雨天光被水汽散开，夜里灯晕压暗一截，不然整场发闷还刺眼 */
function setWeather(w){
  w=(w==='rain')?'rain':(w==='none'?'none':'snow');
  const rainy=w==='rain', snowy=w==='snow';
  state.weather=w;
  rainLevel=rainy?1:0;
  if(snow)snow.visible=snowy;
  if(snowFar)snowFar.visible=snowy;
  if(rain)rain.visible=rainy;
  if(rainRipples)rainRipples.visible=rainy;
  ground.material.color.setHex(rainy?0xa7b1bc:(snowy?0xd0ddeb:0xc7d4e4));
  ground.material.roughness=rainy?.38:.88;
  ground.material.metalness=rainy?.14:.03;
  ground.material.envMapIntensity=rainy?1.55:.85;
  road.material.color.setHex(rainy?0x7f8791:0x8e99a4);
  road.material.roughness=rainy?.22:.62;
  /* 湿度：雪天 12%（几乎干），雨天 92%（整片湿透）；uMarkAmt 是积水变暗量 */
  wetRegistry.forEach(r=>{
    const u=r.m.userData.u;
    u.uWetAmt.value=r.base*(rainy?.92:(snowy?.12:0));
    u.uMarkAmt.value=rainy?.50:0;
  });
  lampPools.forEach(p=>{p.material.opacity=rainy?.24:.30;});
  const bs=document.getElementById('t-snow'),br=document.getElementById('t-rain');
  if(bs)bs.classList.toggle('on',snowy);
  if(br)br.classList.toggle('on',rainy);
  sfx.setRain(rainy?1:0);
  renderer.toneMappingExposure=(state.quality?(IS_TOUCH_DEV?1.14:1.12):1.06)*(rainy?1.10:1);
  applyTime(state.hour);      // 天空/雾/灯光随天气一起换
}

/* ════════════════════════════════════════════════════════════
   14.4 开场：像"解算"一样逐层把场景搭出来（远景推进 + 分区点灯）
   ════════════════════════════════════════════════════════════ */
const intro={active:true,t:0,dur:4.0,p0:new THREE.Vector3(42,31,44),t0:new THREE.Vector3(0,1.5,0)};
controls.enabled=true;
renderer.domElement.addEventListener('pointerdown',()=>{
  if(!intro.active)return;
  intro.active=false;intro.t=intro.dur;
  if(!fp.on){
    controls.enabled=true;
    camera.position.copy(HOME.pos);controls.target.copy(HOME.tgt);controls.update();
  }
},{capture:true});
function introUpdate(dt){
  if(!intro.active)return;
  intro.t+=dt;
  const k=Math.min(1,intro.t/intro.dur);
  if(!fp.on){                       // 沉浸模式由第一人称接管镜头
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(intro.p0,HOME.pos,e);
    controls.target.lerpVectors(intro.t0,HOME.tgt,e);
  }
  if(k>=1){intro.active=false;if(!fp.on)controls.enabled=true;}
}

/* ════════════════════════════════════════════════════════════
   14.5 沉浸式第一人称漫游
   ════════════════════════════════════════════════════════════ */
const fp={on:false,locked:false,yaw:0,pitch:0,vx:0,vz:0,x:0,z:0,y:0,jumpY:0,jumpVy:0,stepCd:0,keys:{},wasAuto:false};
const FP_EYE=1.62;
const STAIR={x0:9.55,x1:11.9,zBot:5.05,zTop:-0.35,y0:0.5,y1:4.7};
const STAIR2={x0:9.85,x1:11.85,zBot:-4.9,zTop:0.3,y0:4.7,y1:8.95};
function stairY(z){
  const t=Math.max(0,Math.min(1,(STAIR.zBot-z)/(STAIR.zBot-STAIR.zTop)));
  return STAIR.y0+t*(STAIR.y1-STAIR.y0);
}
function stair2Y(z){
  const t=Math.max(0,Math.min(1,(z-STAIR2.zBot)/(STAIR2.zTop-STAIR2.zBot)));
  return STAIR2.y0+t*(STAIR2.y1-STAIR2.y0);
}
/* 挡路的展品（圆） */
const BLK1=[[-4.9,.4,1.5],[4.6,-.6,1.5],[-5.4,-10.15,1.45],[-2.7,-10.15,1.45],[0,-10.15,1.45],
  [-8.7,5.15,1.2],[-7.0,5.0,1.2],[-4.25,5.25,1.35],[6.2,-2.4,1.0],[9.4,-9.0,1.6],[2.8,-9.6,1.0],[10.55,-2.8,1.5],[7.8,-5.8,.85]];
const BLK2=[[-5.6,4.1,1.8],[-7.5,-6.2,.95],[-4.8,-6.4,.9],[-7.5,-2.2,.95],[-4.6,-2.0,.9],[-3.6,1.4,.9],[6.8,-6.4,.95],
  [-7.8,-10.5,1.2],[-5.95,-10.5,1.2],[-4.1,-10.5,1.2],[-2.25,-10.5,1.2],[5.4,-10.3,1.5],
  [2.4,-3.4,1.1],[4.9,-1.5,1.1],[1.5,2.4,1.2],[-.6,4.5,.85],[-1.0,-3.4,1.45],[4.2,4.8,.85]];
function hitBlock(x,z,list){
  for(let i=0;i<list.length;i++){
    const b=list[i],dx=x-b[0],dz=z-b[1];
    if(dx*dx+dz*dz<b[2]*b[2])return true;
  }
  return false;
}
/* 室外地面高度：人行道 / 停车场出口道 / 闭合环路 / 停车场 / 空地 */
function groundY(x,z){
  if(x>-16.0&&x<-11.2&&z>7.6&&z<11.9)return .02;  // 停车场驶出坡道
  if(z>8.2&&z<11.9&&Math.abs(x)<43.5)return .26;    // 前门人行道
  if(LOOP.distToCenter(x,z)<LOOP.halfW)return .02;  // 闭合环路沥青面
  if(x>-17.4&&x<-9.8&&z>-7.8&&z<8.2)return .02;     // 西侧停车场
  return 0;
}
/* 站在某点会落到哪个高度；ok=0 表示走不过去 */
function fpFloorAt(x,z,curY){
  const roof=curY>6.9;
  const up=curY>2.7&&curY<=6.9;
  // 1F <-> 2F 钢梯（大幅放宽下口迎坡漏斗与高度容差，上下极顺滑）
  if(x>STAIR.x0-.25&&x<STAIR.x1+.15&&z>=STAIR.zTop-.35&&z<=STAIR.zBot+.65&&curY<=5.8){
    const sy=stairY(z);
    if(Math.abs(curY-sy)<1.65)return{y:sy,stair:1};
    if(!up&&sy>1.15)return{ok:0};
  }
  // 2F <-> 屋顶露台钢梯
  if(x>STAIR2.x0-.12&&x<STAIR2.x1+.12&&z>STAIR2.zBot-.35&&z<STAIR2.zTop+.35&&curY>3.6){
    const sy2=stair2Y(z);
    if(Math.abs(curY-sy2)<1.55)return{y:sy2,stair:2};
    if(up&&sy2>STAIR2.y0+1.15)return{ok:0};
  }
  if(x>-9.35&&x<11.85&&z>-11.35&&z<7.35){
    if(roof){
      if(x>9.65&&x<11.95&&z>-5.25&&z<0.35)return{ok:0};     // 二楼到天台楼梯洞
      return{y:8.95};
    }
    if(up){
      if(x>9.40&&x<12.0&&z>-0.50&&z<5.20)return{ok:0};       // 一楼到二楼楼梯洞
      if(hitBlock(x,z,BLK2))return{ok:0};
      return{y:4.7};
    }
    if(hitBlock(x,z,BLK1))return{ok:0};
    return{y:.5};
  }
  if(Math.abs(x)<1.85&&z>=7.20&&z<=9.35)return{y:.5};        // 门洞完全敞开直入一楼大厅
  if(x>-9.7&&x<12.2&&z>-11.7&&z<7.8)return{ok:0};           // 玻璃幕墙走不穿
  if(x>-76&&x<76&&z>-42&&z<72){
    if(hitBlock(x,z,OUTDOOR_OBS))return{ok:0};
    // 碰碰车围栏矩形阻挡 (中心7,45 尺寸24x16；外围栏已拆除，游乐园四周彻底畅通无阻)
    if(x>-5.3&&x<19.3&&z>36.7&&z<53.3)return{ok:0};
    // 左侧圣诞教堂 (-49,36) 敞开大门中央红毯通道允许走进观礼，两侧墙与圣坛保留碰撞
    if(x>-50.0&&x<-48.0&&z>=22.6&&z<=39.8)return{y:.68};
    if(x>-55.2&&x<-42.8&&z>23.5&&z<40.5)return{ok:0};
    return{y:groundY(x,z)};       // 室外随便走（含外环小火车站台）
  }
  return{ok:0};
}
function fpEnter(noLock){
  fp.on=true;fp.locked=false;
  fp.wasAuto=controls.autoRotate;controls.autoRotate=false;controls.enabled=false;
  fp.x=0;fp.z=10.2;fp.y=.26;fp.vx=fp.vz=0;fp.yaw=0;fp.pitch=-.04;
  document.body.classList.add('fp');
  if(!state.lights){state.lights=true;document.getElementById('t-lights').classList.add('on');}
  showFpHint();
}
function fpExit(){
  fp.on=false;fp.locked=false;fp.keys={};
  controls.enabled=!IS_TOUCH_DEV;   // 触屏端沙盒：OrbitControls 停用，相机走 touchCam
  controls.autoRotate=fp.wasAuto;
  document.body.classList.remove('fp');
  if(document.pointerLockElement)document.exitPointerLock();
  camera.position.copy(HOME.pos);controls.target.copy(HOME.tgt);controls.update();
}
const _physV=new THREE.Vector3();
function inIceRink(x,z){
  const rk=amusement&&amusement.rink;
  if(!rk)return false;
  const nx=(x-rk.x)/rk.rx, nz=(z-rk.z)/rk.rz;
  return (nx*nx+nz*nz)<=1.02;
}
function fpUpdate(dt){
  /* 牵手跟随中：跟随者不能自己走，位置由领队决定（MP.update 里锁）*/
  if(window.MP&&MP.hand&&MP.hand.role==='follower'){fp.vx=0;fp.vz=0;return;}
  const onIce=inIceRink(fp.x,fp.z);
  let sp=onIce
    ?((fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?9.2:5.8)
    :((fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?6.4:3.2);
  let f=0,s=0;
  if(fp.keys['KeyW']||fp.keys['ArrowUp'])f+=1;
  if(fp.keys['KeyS']||fp.keys['ArrowDown'])f-=1;
  if(fp.keys['KeyA']||fp.keys['ArrowLeft'])s-=1;
  if(fp.keys['KeyD']||fp.keys['ArrowRight'])s+=1;
  // 虚拟摇杆：上推前进、右推横移，力度越大越快
  if(joy.mag>0.02){
    f+=-joy.dy*1.15;s+=joy.dx*1.15;
    sp=onIce?(joy.mag>.78?9.0:5.8):(joy.mag>.78?6.4:3.4);
  }
  const fx=-Math.sin(fp.yaw),fz=-Math.cos(fp.yaw),rx=Math.cos(fp.yaw),rz=-Math.sin(fp.yaw);
  let dx=fx*f+rx*s,dz=fz*f+rz*s;
  const l=Math.hypot(dx,dz);
  if(l>0){dx/=l;dz/=l;}
  // 溜冰模式：超低冰面阻尼，松开按键后保持丝滑长距离惯性滑行；普通陆地保持高响应止动
  const acc=onIce?Math.min(1,dt*(l>0?3.4:0.75)):Math.min(1,dt*12);
  fp.vx+=(dx*sp*Math.min(1,l)-fp.vx)*acc;
  fp.vz+=(dz*sp*Math.min(1,l)-fp.vz)*acc;
  fpStep(fp.vx*dt,fp.vz*dt);
  // 步入/离开溜冰场 HUD 状态切换提示
  if(onIce!==!!fp._wasOnIce){
    fp._wasOnIce=onIce;
    if(onIce&&!trainSys.riding&&!wheelSys.riding&&!launchSys.active){
      hudShow('⛸️ 已进入星夜溜冰场 · 溜冰模式开启（冰面惯性滑行 · 空格键 360° 花样旋转跳 · Shift 极速冲刺）',
        '花样旋转跳 (Space)',()=>{if(fp.jumpY<=0.001){fp.jumpVy=5.8;fp.skateSpin=Math.PI*2;}});
    }else if(!onIce&&!trainSys.riding&&!wheelSys.riding&&!launchSys.active){
      hudHide();
    }
  }
  // 第一人称轻跳跃物理（冰面起跳触发 360° 阿克塞尔花样旋转跳！）
  if(fp.keys['Space']&&fp.jumpY<=0.001){
    fp.jumpVy=onIce?5.8:4.6;
    if(onIce)fp.skateSpin=Math.PI*2;
    sfx.blip(onIce?660:520,.08,.04);
  }
  if(fp.skateSpin>0){
    const dSpin=Math.min(fp.skateSpin,dt*9.5);
    fp.yaw+=dSpin;
    fp.skateSpin-=dSpin;
  }
  if(fp.jumpY>0||fp.jumpVy!==0){
    fp.jumpVy-=13.8*dt;fp.jumpY+=fp.jumpVy*dt;
    if(fp.jumpY<=0){
      if(fp.jumpVy<-1.5&&!inBuildingXZ(fp.x,fp.z)){
        for(let k=0;k<5;k++){const a=k*1.25;spawnSnowPuff(fp.x,fp.y+.06,fp.z,Math.cos(a)*1.2,R(.7,1.4),Math.sin(a)*1.2,.75);}
      }
      fp.jumpY=0;fp.jumpVy=0;
    }
  }
  const fpSpd=Math.hypot(fp.vx,fp.vz);
  if(fpSpd>1.2&&fp.jumpY<=0.01&&!inBuildingXZ(fp.x,fp.z)){
    fp.stepCd-=dt*fpSpd;
    if(fp.stepCd<=0){
      fp.stepCd=1.35;
      spawnSnowPuff(fp.x+R(-.16,.16),fp.y+.05,fp.z+R(-.16,.16),-fp.vx*.18,R(.5,.95),-fp.vz*.18,.68,.48);
    }
  }
  // 与不倒翁雪人 / 圣诞树近距离物理推挤反馈（兼容任意层级父节点）
  if(fp.y<1.2){
    for(const ps of physSnowmen){
      ps.g.getWorldPosition(_physV);
      const ddx=fp.x-_physV.x,ddz=fp.z-_physV.z,dd=Math.hypot(ddx,ddz);
      if(dd<1.15&&dd>0.01&&Math.abs(fp.y-_physV.y)<1.4){ps.vrx-=(ddz/dd)*2.4*dt*8;ps.vrz+=(ddx/dd)*2.4*dt*8;}
    }
    for(const pt of physTrees){
      pt.g.getWorldPosition(_physV);
      const ddx=fp.x-_physV.x,ddz=fp.z-_physV.z,dd=Math.hypot(ddx,ddz);
      if(dd<1.35*pt.sc&&dd>0.01&&Math.abs(fp.y-_physV.y)<1.6){pt.vrx-=(ddz/dd)*1.2*dt*8;pt.vrz+=(ddx/dd)*1.2*dt*8;}
    }
  }
  // 触屏双指推动的前后位移
  if(fp.touchFwd){
    const d=Math.max(-70,Math.min(70,fp.touchFwd))*.024;
    fp.touchFwd=0;
    const fx=-Math.sin(fp.yaw),fz=-Math.cos(fp.yaw);
    fpStep(fx*d,fz*d);
  }
  /* 走路不再带头部晃动：原来 ±3.2cm 的 headBob 在第一人称里就是持续的上下抖，
     跑起来频率还到 2.3Hz，看着像画面自己在抖。相机只跟位置和朝向，不加任何额外位移。 */
  const headBob=0;
  /* 第三人称时相机由 MP.update 接管（它把相机放在角色背后），
     这里只更新角色坐标，不写 camera —— 否则两者每帧互相覆盖。
     判断口径统一走 MP.thirdLive()：只有「第三人称真的在接管」时才让出相机，
     否则（退出联机 / 没登录 / 回到沙盘）第一人称照常写，
     不然两处都不写 → 相机没人管 → 画面冻住不动 */
  if(!(window.MP&&MP.thirdLive&&MP.thirdLive())){
    camera.position.set(fp.x,fp.y+FP_EYE+fp.jumpY+headBob,fp.z);
    camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
  }
}
function fpStep(dx,dz){
  const nx=fp.x+dx,nz=fp.z+dz;
  let r=fpFloorAt(nx,nz,fp.y);
  if(r.ok!==0){fp.x=nx;fp.z=nz;fp.y=r.y;return;}
  r=fpFloorAt(nx,fp.z,fp.y);
  if(r.ok!==0){fp.x=nx;fp.vz*=.2;return;}
  r=fpFloorAt(fp.x,nz,fp.y);
  if(r.ok!==0){fp.z=nz;fp.vx*=.2;return;}
  // 若当前位置意外卡在障碍物内，允许迈出脱困
  if(fpFloorAt(fp.x,fp.z,fp.y).ok===0){fp.x=nx;fp.z=nz;return;}
  fp.vx*=.05;fp.vz*=.05;
}

/* 材质体检：列出「没有任何贴图的大面积 MeshStandardMaterial」，
   按地面投影面积排序 —— 用来把还在裸奔的纯色块揪出来。
   微缩景观最忌讳大面积纯色：没有贴图的表面上所有光照都落在同一块颜色上，
   夜里就是一片死黑或死白，看不出体积。 */
sceneAudit:()=>{
  const out=[];
  const box=new THREE.Box3(),sz=new THREE.Vector3();
  scene.traverse(o=>{
    if(!o.isMesh)return;
    const ms=Array.isArray(o.material)?o.material:[o.material];
    for(const m of ms){
      if(!m||!m.isMeshStandardMaterial)continue;
      if(m.map||m.emissiveMap)continue;
      box.setFromObject(o);box.getSize(sz);
      const area=Math.max(0,sz.x*sz.z);
      if(area<4)continue;
      out.push({c:'#'+m.color.getHexString(),r:+m.roughness.toFixed(2),
                mt:+m.metalness.toFixed(2),area:+area.toFixed(0),
                sz:[+sz.x.toFixed(1),+sz.y.toFixed(1),+sz.z.toFixed(1)]});
      break;
    }
  });
  out.sort((a,b)=>b.area-a.area);
  return out.slice(0,40);
},

  /* 调试：集市钢琴广场状态（键发光 / 扫光 / 灯强） */  piano:()=>({x:pianoPlaza.x,z:pianoPlaza.z,px:pianoPlaza.px,pz:pianoPlaza.pz,

  /* 调试：马戏团状态（当前节目 / 各表演件位置 / 扫光角） */
  enterWalk:()=>{fpEnter(true);return !!fp.on;},

  heliWalkTo:(x,z)=>{fp.x=x;fp.z=z;fp.y=groundY(x,z);fp.vx=fp.vz=0;return [fp.x,fp.y,fp.z];},
  camPos:()=>[+camera.position.x.toFixed(1),+camera.position.y.toFixed(1),+camera.position.z.toFixed(1)],
  heli:()=>({riding:heliSys.riding,phase:heliSys.phase,rotor:+heliSys.rotor.toFixed(2),
    x:+heliSys.x.toFixed(1),y:+heliSys.y.toFixed(1),z:+heliSys.z.toFixed(1),

  heliTail:()=>{

  /* 把乘坐视角绕到机身侧面（off 弧度，±1.5）：目视核对俯仰姿态用 */
  sideView:(off)=>{const o=Math.max(-1.5,Math.min(1.5,off||0));
    heliSys.camOff=o;fp.yaw=heliSys.yaw+2.30+o;return o;},
  /* 调试用：true = 相机看机身自己（看侧影核对俯仰） */
  heliCamLook:(self)=>{heliSys.camLookSelf=!!self;return heliSys.camLookSelf;},
  /* 整架直升机真实的最低点（世界坐标 y）：判定「有没有扎进地面」的硬指标。
     逐顶点采样（每帧最多几百个点），把 matrixWorld 算进去，机身/滑橇/尾梁都算。 */
  heliMinY:()=>{
    if(!heliSys.g)return null;
    heliSys.g.updateMatrixWorld(true);
    const v=new THREE.Vector3();
    let min=1e9,part='';
    heliSys.g.traverse(o=>{
      if(!o.isMesh||!o.geometry||!o.geometry.attributes.position)return;
      const p=o.geometry.attributes.position;
      const step=Math.max(1,Math.floor(p.count/90));
      for(let i=0;i<p.count;i+=step){
        v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);
        if(v.y<min){min=v.y;part=(o.name||o.geometry.type)+''; }
      }
    });
    return {min:+min.toFixed(3),part:part};
  },

  circusLining:(on)=>{if(circus.lining)circus.lining.visible=!!on;return !!on;},

      walker:(()=>{const v=new THREE.Vector3();circus.acro.walker.getWorldPosition(v);return [+v.x.toFixed(1),+v.y.toFixed(1),+v.z.toFixed(1)];})(),
      clown:(()=>{const v=new THREE.Vector3();circus.clown.bear.getWorldPosition(v);return [+v.x.toFixed(1),+v.z.toFixed(1)];})(),
      aud0:(()=>{const v=new THREE.Vector3();circus.aud[0].p.getWorldPosition(v);return [+v.x.toFixed(1),+v.z.toFixed(1)];})()
    }}),
  /* 调试：单独关掉某片区域，做性能对照 */
  hide:(what)=>{const m={market:market,shopRow:shopRow,fair:fair,piano:pianoPlaza.g,circus:circus.g};for(const k in m){if(k===what||what==='all')m[k].visible=false;}return 'hidden';},
  show:(what)=>{const m={market:market,shopRow:shopRow,fair:fair,piano:pianoPlaza.g,circus:circus.g};for(const k in m){if(k===what||what==='all')m[k].visible=true;}return 'shown';},
  /* 调试：从 A 朝 B 打一条射线，列出命中的物体和距离
     （查共面 / z-fighting 用：两个命中距离几乎一样 = 在抢深度） */
  ray:(ox,oy,oz,tx,ty,tz)=>{
    const a=new THREE.Vector3(ox,oy,oz);
    const dir=new THREE.Vector3(tx,ty,tz).sub(a).normalize();
    const rc=new THREE.Raycaster(a,dir);
    /* 只对 mesh 打射线：sprite/点/线的 raycast 在这个场景里会直接抛异常 */
    const meshes=[];
    scene.traverse(o=>{ if(o.isMesh) meshes.push(o); });
    const hits=rc.intersectObjects(meshes,false);
    return hits.slice(0,8).map(h=>({
      d:+h.distance.toFixed(4),
      geo:h.object.geometry&&h.object.geometry.type,
      col:h.object.material&&h.object.material.color?h.object.material.color.getHexString():'',
      emi:h.object.material&&h.object.material.emissive?h.object.material.emissive.getHexString():''
    }));
  },
  /* 调试：摇杆当前输出 + 跳楼机飞行状态 */
  joy:()=>({dx:+joy.dx.toFixed(3),dy:+joy.dy.toFixed(3),mag:+joy.mag.toFixed(3),active:joy.active}),
  launch:()=>({active:launchSys.active,stage:launchSys.stage,
    x:+launchSys.x.toFixed(2),y:+launchSys.y.toFixed(2),z:+launchSys.z.toFixed(2),
    vx:+launchSys.vx.toFixed(2),vy:+launchSys.vy.toFixed(2),vz:+launchSys.vz.toFixed(2)}),
  /* 调试：直接上车（测乘车视角），返回坐上的那台车 */
  ride:(kind)=>{
    if(kind==='launch'){startLaunchRide();return null;}
    if(kind==='bumper'&&amusement.bumper.length)toggleRideFacility({kind:'bumper',car:amusement.bumper[0],label:'冰面碰碰车'});
    else toggleRideFacility({kind:kind,label:kind});
    return (wheelSys.bump&&wheelSys.bump.car)||null;
  },
  bumpers:()=>amusement.bumper,
  perf:()=>{let lights=0;scene.traverse(o=>{if((o.isPointLight||o.isSpotLight)&&o.visible)lights++;});
    return {calls:renderer.info.render.calls,tris:renderer.info.render.triangles,
            geo:renderer.info.memory.geometries,tex:renderer.info.memory.textures,lights};}
};

/* ══ 纯净模式：画面零 UI + 可走动 ══ */
const isTouch=IS_TOUCH_DEV;
const isSmall=innerWidth<820||IS_TOUCH_DEV;
function showFpHint(){
  const el=document.getElementById('fphint');
  el.textContent=(isTouch||isSmall)
    ? '左下摇杆走 · 右侧拖动转头 · 右下跳 · 右上切沙盘'
    : 'WASD 走 · 按住左键或右键拖动转头 · 空格跳 · Q 退出 · 点击盲盒拆礼物 · 按 E 上下小火车';
  if(!state.clean)return;
  el.style.opacity='1';
  clearTimeout(showFpHint._t);
  showFpHint._t=setTimeout(()=>{el.style.opacity='0';},3600);
}
/* 信息层显隐（纯净开关）与沉浸模式是两个独立维度 */
function setClean(on){
  state.clean=on;
  document.body.classList.toggle('clean',on);
  document.body.classList.remove('off');
  /* 纯净模式只收起侧栏内容，不动 #rail 本身 —— 侧栏里是晨/昼/暮/夜四个时段按钮
     和 24 小时滑块。之前 CSS 把 #rail 整体 display:none，≡ 圆钮也跟着没了，
     用户点不到任何时段入口，等于时间系统被废掉。现在保留 ≡ 圆钮 + 时间牌。 */
  document.body.classList.toggle('rail-min',on);
  const el=document.getElementById('fphint');
  if(!on)el.style.opacity='0';
  const btn=document.getElementById('t-clean');
  if(btn)btn.classList.toggle('on',on);   // 按钮已移除，保留容错
}
function toggleClean(){setClean(!state.clean);if(typeof setViewBtn==='function')setViewBtn();}
/* 进入沉浸：信息层全部藏起来，只留底部操作条 */
function enterWalk(){
  intro.active=false;intro.t=intro.dur;camTween=null;
  fpEnter(isTouch);
  document.body.classList.add('walk','rail-min');
  setClean(true);         // 沉浸默认纯净：画面只剩摇杆/跳/返回，视线不被面板挡住
  syncFpBtn();
  showFpHint();
}
/* 退出沉浸：回到等距沙盘，界面完整恢复 */
function exitWalk(){
  document.body.classList.remove('walk','off','rail-min');
  fpExit();
  setClean(true);         // 沙盒同样默认纯净，但摇杆与转头始终可用
  if(IS_TOUCH_DEV)touchCamSync();
  syncFpBtn();
}

/* ── 虚拟摇杆（左手移动）──
   统一只用 pointer 事件：触屏上浏览器本来就会派发 pointer 事件，
   再额外挂一套 touch 会让 touchmove 和 pointermove 轮流写同一个值，摇杆会自己抖回中间。 */
const joy={active:false,cx:0,cy:0,dx:0,dy:0,mag:0};
const joyEl=document.getElementById('joystick'),stickEl=document.getElementById('stick');
function joyApply(x,y){
  /* 有效行程比外圈小得多：手指推一点点就能到满舵（原来要推 40px） */
  const R=joyEl.getBoundingClientRect().width/2-34;
  let dx=x-joy.cx,dy=y-joy.cy;
  const len=Math.hypot(dx,dy);
  if(len>R){dx=dx/len*R;dy=dy/len*R;}
  joy.dx=dx/R;joy.dy=dy/R;joy.mag=Math.min(1,len/R);
  stickEl.style.transform='translate('+dx+'px,'+dy+'px)';
}
function joyReset(){joy.active=false;joy.dx=joy.dy=joy.mag=0;stickEl.style.transform='translate(0,0)';}
joyEl.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=joyEl.getBoundingClientRect();
  joy.active=true;joy.cx=r.x+r.width/2;joy.cy=r.y+r.height/2;
  joyApply(e.clientX,e.clientY);
  // 指针已释放时 setPointerCapture 会抛，包一层别把手势打断
  try{joyEl.setPointerCapture&&joyEl.setPointerCapture(e.pointerId);}catch(err){}
});
joyEl.addEventListener('pointermove',e=>{
  if(!joy.active)return;
  e.preventDefault();
  joyApply(e.clientX,e.clientY);
});
joyEl.addEventListener('pointerup',joyReset);
joyEl.addEventListener('pointercancel',joyReset);
joyEl.addEventListener('pointerleave',joyReset);

/* 触屏手势：每根手指按 pointerId 单独记账
   —— 摇杆那根手指按在 #joystick 上，不进画面的手势表，
      所以「左手推摇杆走路 + 右手拖画面转头」可以同时进行。
   —— 画面上一根手指 = 纯转视角；两根手指 = 纵向推拉前进（此时不转视角）。
   鼠标另走 document 的 mousemove（按住左键拖），两边互不重复。 */
const lookPts=new Map();          // pointerId -> {x,y,resync}
let pinchBaseY=null, pinchBaseD=0;
/* 触屏沙盒自管轨道相机：yaw 方位 / pitch 俯仰 / rad 半径 */
const touchCam={yaw:0,pitch:0.55,rad:40};
function touchCamSync(){
  // 从当前相机位置反推出轨道参数（进入沙盒时对齐一次）
  const rx=camera.position.x-controls.target.x;
  const ry=camera.position.y-controls.target.y;
  const rz=camera.position.z-controls.target.z;
  touchCam.rad=Math.max(11,Math.hypot(rx,ry,rz));
  touchCam.yaw=Math.atan2(rx,rz);
  touchCam.pitch=Math.asin(Math.max(-1,Math.min(1,ry/touchCam.rad)));
}
function touchCamApply(){
  const cp=Math.cos(touchCam.pitch),sp=Math.sin(touchCam.pitch);
  camera.position.set(
    controls.target.x+Math.sin(touchCam.yaw)*cp*touchCam.rad,
    controls.target.y+sp*touchCam.rad,
    controls.target.z+Math.cos(touchCam.yaw)*cp*touchCam.rad);
  camera.lookAt(controls.target);
}
function lookMidY(){
  let sy=0,n=0;
  lookPts.forEach(p=>{sy+=p.y;n++;});
  return n?sy/n:null;
}
/* 触屏转视角灵敏度：手机屏幕小、拇指粗，原来 .0045 明显偏钝，
   拖半天转不了多少角度。immersive（走路时转头）给更高，sandbox 轨道略低。 */
const TOUCH_LOOK=.0078, TOUCH_ORBIT=.0062;

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;   // 鼠标交给 document 的 mousemove
  // 触屏沙盒：相机旋转由 fp.yaw/pitch 接管，挡住 OrbitControls 的 pointerdown，
  // 否则两者同时转 → 视角乱跳。缩放仍交给 controls。
  lookPts.set(e.pointerId,{x:e.clientX,y:e.clientY,resync:false});
  if(lookPts.size===2){pinchBaseY=lookMidY();
    const ps=Array.from(lookPts.values());
    pinchBaseD=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);}
  // 单指旋转由 fp.yaw/pitch 接管（OrbitControls 的单指旋转已在触屏端关闭，
  // 这里额外在捕获阶段挡一道，避免它仍收到 pointer 事件）
},{passive:true});
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse')return;
  const p=lookPts.get(e.pointerId);if(!p)return;
  if(p.resync){p.x=e.clientX;p.y=e.clientY;p.resync=false;return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(lookPts.size===1){
    const _bd=wheelSys.bump;
    if(_bd&&wheelSys.riding&&wheelSys.kind==='bumper'){
      /* 开车时单指拖动 = 相对车头环顾，转向交给左手摇杆 */
      _bd.look-=dx*TOUCH_LOOK;
      fp.pitch=Math.max(-1.4,Math.min(1.4,fp.pitch-dy*TOUCH_LOOK));
    }else{
      fp.yaw-=dx*TOUCH_LOOK;fp.pitch-=dy*TOUCH_LOOK;
      fp.pitch=Math.max(-1.4,Math.min(1.4,fp.pitch));
    }
    // 触屏沙盒：沉浸之外，单指拖动改为绕沙盘 target 转镜头
    if(!fp.on&&IS_TOUCH_DEV){
      touchCam.yaw-=dx*TOUCH_ORBIT;
      touchCam.pitch=Math.max(-0.35,Math.min(1.45,touchCam.pitch+dy*TOUCH_ORBIT));
      touchCamApply();
    }
  }else if(lookPts.size===2){
    const my=lookMidY();
    if(pinchBaseY!==null&&my!==null){fp.touchFwd=(fp.touchFwd||0)+(pinchBaseY-my);pinchBaseY=my;}
    // 触屏沙盒：双指 pinch 缩放（OrbitControls 已关闭，这里自己算）
    if(IS_TOUCH_DEV&&!fp.on){
      const pts=Array.from(lookPts.values());
      if(pts.length===2){
        const dNow=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
        if(pinchBaseD>0){
          const k=pinchBaseD/Math.max(1,dNow);
          touchCam.rad=Math.max(11,Math.min(95,touchCam.rad*k));
          touchCamApply();
        }
        pinchBaseD=dNow;
      }
    }
  }
},{passive:true});
function lookEnd(e){
  if(!lookPts.has(e.pointerId))return;
  lookPts.delete(e.pointerId);
  if(lookPts.size<2)pinchBaseY=null;
  lookPts.forEach(p=>{p.resync=true;});   // 剩下的手指先同步坐标再继续，避免跳一下
}
renderer.domElement.addEventListener('pointerup',lookEnd);
renderer.domElement.addEventListener('pointercancel',lookEnd);
addEventListener('pointerup',lookEnd);          // 手指在画布外抬起也要清
addEventListener('pointercancel',lookEnd);
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ══ 触屏端：标记 body.touch，让操作控件常驻 ══ */
if(isTouch||isSmall)document.body.classList.add('touch');

/* ══ 视角切换 / 声音按钮（常驻工具条 + 沉浸内工具组，两套共用） ══ */
function setViewBtn(){
  const t=fp.on?'沙盘':'沉浸';
  for(const id of ['w-mode','w-view']){
    const b=document.getElementById(id);
    if(b){b.dataset.label=t;b.textContent='';}   // 文字走伪元素，避免被系统取词浮层圈住
  }
  /* 第三人称按钮：常驻工具条里，给一个明确的「切回第一人称」入口 */
  const tb=document.getElementById('w-third');
  if(tb){
    const on=!!(window.MP&&MP.third);
    /* 手机上按钮排得紧，标签用两字 */
    tb.dataset.label = on ? (IS_TOUCH_DEV?'一人':'一人称') : (IS_TOUCH_DEV?'三人':'三人称');
    tb.classList.toggle('on',on);
    tb.textContent='';
  }
  for(const id of ['w-audio','w-sound']){
    const b=document.getElementById(id);
    if(b)b.classList.toggle('on',sfx.on);
  }
}
function toggleView(){
  if(fp.on)exitWalk();else enterWalk();
  sfx.blip(640,.08,.05);
  setViewBtn();
}
function toggleAudio(){
  sfx.setOn(!sfx.on);
  setViewBtn();
}
(function bindViewBtns(){
  for(const id of ['w-mode','w-view']){
    const b=document.getElementById(id);
    if(b)b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleView();};
  }
  /* 第三人称开关：未登录也能用（单机也能切）*/
  const tb=document.getElementById('w-third');
  if(tb)tb.onclick=e=>{
    e.preventDefault();e.stopPropagation();
    if(window.MP&&MP.toggleThird)MP.toggleThird();
