          d.x=nx-vx*.06+R(-.9,.9);d.y=ny+R(-.3,.6);d.z=nz-vz*.06+R(-.9,.9);
        }
        d.y+=d.vy*dt;
        const s=Math.max(0.01,(1-d.life)*1.4);
        m.makeTranslation(d.x,d.y,d.z);sc.set(s,s,s);m.scale(sc);
        sleighDustMesh.setMatrixAt(i,m);
      }
      sleighDustMesh.instanceMatrix.needsUpdate=true;
    }
  }
  /* 共享圣诞彩灯材质池高速律动 + 树顶金星自转
     ⚠ 原来幅度 .64~1.0、频率 3.2rad/s（约 0.5Hz 全幅摆动），
       门楣上那一排灯看起来就是在「闪」。改成慢半拍 + 幅度收窄的呼吸感。 */
  {
    const lOn=state.lights?1.0:0.12;
    const glowScale=(nightNow?1.0:(state.timeKey==='dusk'||state.timeKey==='dawn'?.78:.40))*lOn;
    /* 雪地上的假灯光：夜里全开；黄昏黎明留一点；白天全灭 */
    MUL_GLOW_K=state.lights?(nightNow?1.0:(state.timeKey==='dusk'||state.timeKey==='dawn'?.55:0.0)):0;
    /* 雨天光被水汽散开：灯晕压到六成，否则雨夜会又亮又刺 */
    if(rainLevel>0)MUL_GLOW_K*=.78;
    for(let i=0;i<MUL_GLOW_POOL.length;i++){
      const it=MUL_GLOW_POOL[i];
      it.mat.opacity=it.base*MUL_GLOW_K;
    }
    for(let i=0;i<xmasBulbPool.length;i++){
      const p=xmasBulbPool[i];
      const pulse=(.84+.16*Math.sin(t*1.5+p.phase))*glowScale;
      p.mat.color.copy(p.base).multiplyScalar(pulse);
      /* 白天灯是关着的：只把亮度压下来（外壳还是自己的颜色），
         不要往灰黑里推 —— 推成灰黑就是雪地里一排黑点，像挖了一排坑。
         地埋灯是半球嵌在雪里的，白天本来就该只露出一点点暗色玻璃。 */
      if(glowScale<.72)p.mat.color.multiplyScalar(.82);
    }
    for(let i=0;i<xmasStars.length;i++){
      xmasStars[i].rotation.y=t*.9+i;
    }
  }

  /* 西侧花坛动态喷泉水珠 + 水波纹 + 夜间圣诞金星流萤 */
  if(fountainDrops){
    const m=_rMat,sc=_rScale;
    for(let i=0;i<fountainDropData.length;i++){
      const d=fountainDropData[i];
      d.p+=dt*d.spd;if(d.p>1)d.p-=1;
      const u=d.p, r=d.r0+(d.r1-d.r0)*u;
      const y=d.y0+(d.y1-d.y0)*u+Math.sin(u*Math.PI)*d.h;
      const sz=.75+.55*Math.sin(u*Math.PI);
      m.makeTranslation(-24.4+Math.cos(d.ang)*r,y,0.2+Math.sin(d.ang)*r);
      sc.set(sz,sz,sz);m.scale(sc);
      fountainDrops.setMatrixAt(i,m);
    }
    fountainDrops.instanceMatrix.needsUpdate=true;
  }
  for(const fr of fountainRings){
    fr.userData.phase=(fr.userData.phase+dt*.55)%1;
    const u=fr.userData.phase;
    fr.scale.setScalar(1+u*4.2);
    fr.material.opacity=(1-u)*.55;
  }
  if(fireflyMat){
    fireflyMat.uniforms.uTime.value=tLocal;
    const dusk=(state.hour>=16.8||state.hour<=7.2);
    fireflyMat.uniforms.uOpacity.value=dusk?1:0;
  }

  /* 雪地狐狸、名犬与小花猫物理转向引擎（个体分离防重叠、躲避行人车辆、弹性跳跃、脚步踩雪溅尘） */
  for(let i=0;i<liveAnimals.length;i++){
    const a=liveAnimals[i], u=a.m.userData;
    if(a.excited>0)a.excited-=dt;
    if(a.puffCd>0)a.puffCd-=dt;
    let gx=a.cx, gz=a.cz;
    if(a.roam){
      const ang=t*a.spd+a.ph;
      gx=a.cx+Math.cos(ang)*a.rx; gz=a.cz+Math.sin(ang)*a.rz;
    }
    let fx=(gx-a.x)*5.2, fz=(gz-a.z)*5.2;
    // 同伴软排斥力：避免彼此穿模
    for(let j=0;j<liveAnimals.length;j++){
      if(i===j)continue;
      const o=liveAnimals[j], dx=a.x-o.x, dz=a.z-o.z, d=Math.hypot(dx,dz);
      if(d<.92&&d>.001){const push=(.92-d)/.92*8.5;fx+=dx/d*push;fz+=dz/d*push;}
    }
    // 第一人称走近时好奇回头 / 近身轻跳让行
    let nearPlayer=false;
    if(fp.on&&fp.y<.9){
      const px=a.x-fp.x, pz=a.z-fp.z, pd=Math.hypot(px,pz);
      if(pd<4.5)nearPlayer=true;
      if(pd<1.38&&pd>.001){
        const push=(1.38-pd)*12.0;fx+=px/pd*push;fz+=pz/pd*push;
        if(a.jumpY<=.01){a.vy=2.55;a.squash=-.20;a.excited=1.5;}
      }
    }
    a.vx+=(fx-a.vx*4.2)*dt; a.vz+=(fz-a.vz*4.2)*dt;
    const sp=Math.hypot(a.vx,a.vz);
    if(sp>3.6){a.vx=a.vx/sp*3.6;a.vz=a.vz/sp*3.6;}
    a.x+=a.vx*dt; a.z+=a.vz*dt;

    // 跳跃重力与落地软萌回弹形变
    if(a.jumpY>0||a.vy!==0){
      a.vy-=13.5*dt;a.jumpY+=a.vy*dt;
      if(a.jumpY<=0){
        if(a.vy<-1.0){
          a.squash=.24;
          spawnSnowPuff(a.x,.06,a.z,R(-.6,.6),.75,R(-.6,.6),.78,.42);
        }
        a.jumpY=0;a.vy=0;
      }
    }
    a.squashV+=(0-a.squash)*115*dt-a.squashV*10*dt;a.squash+=a.squashV*dt;
    const sy=a.baseSc*(1-a.squash), sxz=a.baseSc*(1+a.squash*.52);
    a.m.scale.set(sxz,sy,sxz);

    if(sp>.18){
      const wantYaw=Math.atan2(a.vx,a.vz);
      let dy=wantYaw-a.rotY;
      while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
      a.rotY+=dy*Math.min(1,dt*8.5);
      a.stepPh+=sp*dt*5.8;
      if(a.jumpY<=.02&&sp>1.1&&a.puffCd<=0){
        a.puffCd=.24;
        spawnSnowPuff(a.x+R(-.12,.12),.04,a.z+R(-.12,.12),-a.vx*.22,R(.45,.85),-a.vz*.22,.52,.38);
      }
    }else if(!a.roam){
      const wantYaw=nearPlayer?Math.atan2(fp.x-a.x,fp.z-a.z):a.ry;
      let dy=wantYaw-a.rotY;
      while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
      a.rotY+=dy*Math.min(1,dt*3.5);
    }
    const gaitMag=Math.min(.42,sp*.26);
    const sw=Math.sin(a.stepPh)*gaitMag;
    const bob=a.roam?Math.abs(Math.sin(a.stepPh))*Math.min(.032,sp*.018):Math.abs(Math.sin(t*2.4+a.ph))*.016;
    a.m.position.set(a.x,bob+a.jumpY,a.z);
    a.m.rotation.y=a.rotY;
    u.legs[0].rotation.x=sw; u.legs[1].rotation.x=-sw;
    u.legs[2].rotation.x=-sw*.85; u.legs[3].rotation.x=sw*.85;
    const wagBoost=a.excited>0?2.1:(nearPlayer?1.5:1.0);
    u.tailG.rotation.y=Math.sin(t*7.8*wagBoost+a.ph)*(a.roam?.34:.42);
    u.headG.rotation.y=Math.sin(t*1.6+a.ph)*.18;
    u.headG.rotation.z=Math.sin(t*1.3+a.ph)*(a.excited>0?.16:.07);
  }

  /* 全地图不倒翁雪人 / 弹性风吹圣诞树 / 室内悬吊装饰物理弹簧模拟 */
  for(const ps of physSnowmen){
    if(ps.baseY===undefined)ps.baseY=ps.g.position.y;
    ps.vrx+=(-ps.rx*74-ps.vrx*5.2)*dt;ps.rx+=ps.vrx*dt;
    ps.vrz+=(-ps.rz*74-ps.vrz*5.2)*dt;ps.rz+=ps.vrz*dt;
    if(ps.by>0||ps.vby!==0){
      ps.vby-=14*dt;ps.by+=ps.vby*dt;
      if(ps.by<=0){ps.by=0;ps.vby=-ps.vby*.32;if(Math.abs(ps.vby)<.15)ps.vby=0;}
    }
    ps.g.rotation.x=ps.rx;ps.g.rotation.z=ps.rz;
    ps.g.position.y=ps.baseY+ps.by*ps.sc*.22;
  }
  for(const pt of physTrees){
    const gust=Math.sin(t*.9+pt.ph)*.012+Math.sin(t*2.1+pt.ph*1.7)*.005;
    pt.vrx+=(gust-pt.rx)*52*dt-pt.vrx*4.8*dt;pt.rx+=pt.vrx*dt;
    pt.vrz+=(-gust*.7-pt.rz)*52*dt-pt.vrz*4.8*dt;pt.rz+=pt.vrz*dt;
    pt.g.rotation.x=pt.rx;pt.g.rotation.z=pt.rz;
  }
  updateSnowPuffs(dt);
  updateSaltlinePhysics(dt);

  /* 远方驶过车辆环境音效调度 */
  // 已移除随机 carPass 白噪音扫频，避免干扰背景音乐
  /* 云漂移 */
  clouds.forEach((c,i)=>{c.position.x+=dt*(.35+i*.08);if(c.position.x>130)c.position.x=-130;});

  /* 店内灯 / 圣诞灯 / 路灯（默认全开） */
  const night=Math.sin(((state.hour-6)/12)*Math.PI)<=0.03;
  const lampK=state.lights?(night?1:.32):0;
  shopLights.forEach(s=>{
    let k=s.street?(state.lights?(night?1:.18):0):lampK;
    if(intro.active&&!s.street)k*=Math.max(0,Math.min(1,(intro.t-s.delay)/.9));
    s.l.intensity=s.base*k;
  });
  /* 点光源池：把候选灯的当前亮度抄进槽位（候选灯的强度是上面这行在跳的） */
  if(!LP.on)initLightPool();
  updateLightPool();
  /* 龙猫自发光：跟同一套昼夜/入场系数走 —— 夜里从暗部里透出来，白天几乎不发光 */
  {
    const gK=lampK*(intro.active?Math.max(0,Math.min(1,(intro.t-2.4)/1.2)):1);
    for(const it of TOTORO_GLOW) it.m.emissiveIntensity=it.b*gK;
  }
  signMat.emissiveIntensity=(state.lights?(night?1.55:.42):.08)*(intro.active?Math.max(0,Math.min(1,(intro.t-1.9)/1.2)):1);
  winGlow.material.opacity=state.lights?(night?.07:.02):0;

  /* 展品微动：悬挂雕塑轻摆 + 云朵浮动 */
  rigs.forEach((r,i)=>{
    r.mob.rotation.y=Math.sin(t*.32+i*1.7)*.55;
    r.mob.rotation.z=Math.sin(t*.26+i)*.14;
    r.hang.rotation.z=Math.sin(t*.21+i*2.1)*.05;
  });
  cloudArt.position.y=D.f1top+2.15+Math.sin(t*.6)*.09;
  cloudArt.rotation.y=t*.12;
  if(cloudArt.userData.core)cloudArt.userData.core.material.opacity=.32+.22*Math.sin(t*1.6);
  if(_shopFan)_shopFan.rotation.y=phaseOf(.8976)*7;
  // 绿植轻摆
  plants.forEach(p=>{p.leaf.rotation.z=Math.sin(t*.7+p.ph)*.05;});
  // 店内吊灯摇曳
  lampShades.forEach((s,i)=>{s.rotation.z=Math.sin(t*.6+i)*.035;});
  // 一楼咖啡吧台旁两位喝咖啡畅谈的小熊动态交互（抬杯抿饮 + 点头聊天手势 + 咖啡热气袅袅）
  for(const cb of coffeeBears){
    const sip=Math.max(0,Math.sin(t*.85+cb.sipBias));
    const sipLift=Math.pow(sip,4);
    cb.armR.rotation.x=-.18-sipLift*.52;
    cb.armR.rotation.z=sipLift*.12;
    cb.headG.rotation.y=Math.sin(t*1.6+cb.ph)*.18;
    cb.headG.rotation.x=Math.sin(t*3.2+cb.ph)*.08-sipLift*.16;
    cb.headG.rotation.z=Math.sin(t*1.1+cb.ph)*.06;
    cb.armL.rotation.x=-.25-Math.abs(Math.sin(t*2.4+cb.ph))*.35;
    cb.armL.rotation.z=Math.sin(t*2.0+cb.ph)*.14;
  }
  for(const sw of steamWisps){
    const u=((t*.42+sw.ph)%1);
    sw.m.position.set(sw.x0+Math.sin(t*2.2+sw.ph*3)*.06,.92+u*.42,sw.z0+Math.cos(t*1.8+sw.ph)*.04);
    sw.m.scale.setScalar((.45+u*.85)*(1-u*.7));
  }
  // 艺术馆楼顶烧热水般翻滚升腾的浓密白蒸汽云团
  if(window._roofSteamPuffs){
    for(let i=0;i<window._roofSteamPuffs.length;i++){
      const p=window._roofSteamPuffs[i];
      const u=((t*p.spd+p.ph)%1);
      // 喷口处急促冲出，随后翻滚膨胀并随冬夜微风向东北飘散
      const lift=Math.pow(u,.82)*p.h;
      const driftX=u*1.25+Math.sin(t*2.6+p.wob+u*4.2)*.26*u;
      const driftZ=-u*.55+Math.cos(t*2.1+p.wob+u*3.6)*.22*u;
      p.sp.position.set(p.x0+driftX, p.y0+lift, p.z0+driftZ);
      const radius=(0.30+Math.pow(u,.75)*1.72)*p.sc;
      p.sp.scale.set(radius, radius*(0.88+0.24*u), 1);
      const fadeIn=Math.min(1,u/.12);
      const fadeOut=Math.pow(1-u,1.35);
      p.mat.opacity=0.62*fadeIn*fadeOut*steamK;
    }
  }

  /* NPC 维尼小熊群物理运动引擎（视距+室内外剔除、避障分离、礼让玩家与车流、弹性跳跃） */
  const camX=camera.position.x, camZ=camera.position.z;
  const camNearMuseum=Math.abs(camX)<18&&camZ>-15&&camZ<15;
  const maxNpcD2=((wheelSys.riding&&wheelSys.kind==='coaster')||trainSys.riding)?1444:1681; // 全局41m / 乘车38m视距裁剪
  for(let ni=0;ni<npcs.length;ni++){
    const n=npcs[ni];
    const cdx=n.p.position.x-camX, cdz=n.p.position.z-camZ;
    const vis=n.indoor?camNearMuseum:((cdx*cdx+cdz*cdz)<maxNpcD2);
    if(n.p.visible!==vis)n.p.visible=vis;
    if(!vis)continue;
    if(n.happyT>0)n.happyT-=dt;
    if(n.puffCd>0)n.puffCd-=dt;
    if(n.jumpY>0||n.vy!==0){
      n.vy-=13.8*dt;n.jumpY+=n.vy*dt;
      if(n.jumpY<=0){
        if(n.vy<-1.2){
          n.squash=.25;
          if(!n.indoor)spawnSnowPuff(n.p.position.x,n.baseY+.08,n.p.position.z,R(-.7,.7),.85,R(-.7,.7),.85,.45);
        }
        n.jumpY=0;n.vy=0;
      }
    }
    n.squashV+=(0-n.squash)*120*dt-n.squashV*10.5*dt;n.squash+=n.squashV*dt;
    const sy=n.baseSc*(1-n.squash), sxz=n.baseSc*(1+n.squash*.5);
    n.p.scale.set(sxz,sy,sxz);
    /* 名字牌不参与压扁弹跳（否则字会跟着变小看不清），
       并且只在 26m 内显示 —— 远了就是一堆看不清的小白点，反而碍眼 */
    if(n.tag){
      const sc=1/n.baseSc;
      n.tag.scale.set(.86*sc,.296*sc,1);
      n.tag.position.y=1.30*sc;
      const tdx=n.p.position.x-camX,tdz=n.p.position.z-camZ;
      n.tag.visible=(tdx*tdx+tdz*tdz)<900;
    }

    // 停步观赏或原地开心挥爪
    if(n.wait>0){
      n.wait-=dt;
      let lookAng=n.p.rotation.y;
      if(fp.on&&Math.hypot(fp.x-n.p.position.x,fp.z-n.p.position.z)<3.0&&Math.abs(fp.y-n.baseY)<1.2){
        lookAng=Math.atan2(fp.x-n.p.position.x,fp.z-n.p.position.z);
      }else if(n.look){
        lookAng=Math.atan2(n.look[0]-n.p.position.x,n.look[1]-n.p.position.z);
      }
      let dAng=lookAng-n.p.rotation.y;
      while(dAng>Math.PI)dAng-=Math.PI*2;while(dAng<-Math.PI)dAng+=Math.PI*2;
      n.p.rotation.y+=dAng*Math.min(1,dt*2.8);
      n.p.userData.legL.rotation.x*=.82;n.p.userData.legR.rotation.x*=.82;
      if(n.happyT>0){
        n.p.userData.armL.rotation.x=-2.2+Math.sin(t*14)*.35;
        n.p.userData.armR.rotation.x=-2.2-Math.sin(t*14)*.35;
      }else{
        n.p.userData.armL.rotation.x*=.84;n.p.userData.armR.rotation.x*=.84;
      }
      n.p.rotation.z=Math.sin(t*2.1+ni)*.025;
      n.p.position.y=n.baseY+Math.sin(t*3.2+ni)*.012+n.jumpY;
      continue;
    }

    const tgt=n.path[(n.i+1)%n.path.length];
    const dx=tgt[0]-n.p.position.x, dz=tgt[2]-n.p.position.z;
    const d=Math.hypot(dx,dz);
    if(d<.18){
      n.i=(n.i+1)%n.path.length;
      n.wait=R(1.6,4.0);
      n.look=n.indoor?ART[RI(0,ART.length-1)]:null;
      continue;
    }
    let fx=(dx/d)*n.speed*3.5, fz=(dz/d)*n.speed*3.5;
    // 同楼层小熊相互碰撞分离（分帧节流 + 距离平方粗剔除，大幅减少 CPU 平方根计算）
    if(((ni+_reflTick)&3)===0){
      for(let nj=0;nj<npcs.length;nj++){
        if(ni===nj)continue;
        const o=npcs[nj];
        if(Math.abs(o.baseY-n.baseY)>.8)continue;
        const sx=n.p.position.x-o.p.position.x, sz=n.p.position.z-o.p.position.z, d2=sx*sx+sz*sz;
        if(d2<.92&&d2>1e-5){const sd=Math.sqrt(d2),p=(.96-sd)/.96*6.0;fx+=sx/sd*p;fz+=sz/sd*p;}
      }
    }
    // 第一人称走近互动避让与轻弹
    if(fp.on&&Math.abs(fp.y-n.baseY)<1.2){
      const px=n.p.position.x-fp.x, pz=n.p.position.z-fp.z, pd=Math.hypot(px,pz);
      if(pd<1.25&&pd>.001){
        const p=(1.25-pd)*9.0;fx+=px/pd*p;fz+=pz/pd*p;
        if(pd<.85&&n.jumpY<=.01){n.vy=2.7;n.squash=-.2;n.happyT=1.0;}
      }
    }
    // 室外小熊主动避让来车与静态障碍物（分帧+平方剔除，省去 75% 无效算力）
    if(!n.indoor){
      for(const tr of traffic){
        const cx=n.p.position.x-tr.c.position.x, cz=n.p.position.z-tr.c.position.z, cd2=cx*cx+cz*cz;
        if(cd2<17.6&&cd2>1e-5){const cd=Math.sqrt(cd2),p=(4.2-cd)*3.5;fx+=cx/cd*p;fz+=cz/cd*p;}
      }
      if(((ni+_reflTick)&1)===0){
        for(let oi=0;oi<OUTDOOR_OBS.length;oi++){
          const [ox,oz,orad]=OUTDOOR_OBS[oi];
          const ux=n.p.position.x-ox, uz=n.p.position.z-oz, d2=ux*ux+uz*uz;
          const safeR=orad+0.42, lim=safeR+1.05;
          if(d2<lim*lim&&d2>1e-5){
            const ud=Math.sqrt(d2);
          const rx=ux/ud, rz=uz/ud;
          const k=Math.max(0,(safeR+1.05-ud)/1.05);
          // 径向推离力 + 顺势沿切线绕行推力（避免顶在路灯正前方卡住）
          fx+=rx*k*11.0; fz+=rz*k*11.0;
          const tx=-rz, tz=rx;
          const sign=(tx*dx+tz*dz)>=0?1:-1;
          fx+=tx*sign*k*6.5; fz+=tz*sign*k*6.5;
        }
      }
      }
    }
    n.vx+=(fx-n.vx*3.5)*dt; n.vz+=(fz-n.vz*3.5)*dt;
    const sp=Math.hypot(n.vx,n.vz);
    if(sp>n.speed*1.65){n.vx=n.vx/sp*n.speed*1.65;n.vz=n.vz/sp*n.speed*1.65;}
    n.p.position.x+=n.vx*dt;n.p.position.z+=n.vz*dt;
    // 硬边界约束：室外禁止穿入任何路灯/树坑/雕塑半径，也不得穿进建筑玻璃幕墙
    if(!n.indoor){
      for(let oi=0;oi<OUTDOOR_OBS.length;oi++){
        const [ox,oz,orad]=OUTDOOR_OBS[oi];
        const ux=n.p.position.x-ox, uz=n.p.position.z-oz, ud=Math.hypot(ux,uz);
        const minR=orad+0.36;
        if(ud<minR&&ud>.001){
          n.p.position.x=ox+(ux/ud)*minR;
          n.p.position.z=oz+(uz/ud)*minR;
        }
      }
      if(n.p.position.x>-9.85&&n.p.position.x<12.35&&n.p.position.z>-11.85&&n.p.position.z<7.95){
        n.p.position.z=7.95;
      }
    }
    if(sp>.08){
      let dy=Math.atan2(n.vx,n.vz)-n.p.rotation.y;
      while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
      n.p.rotation.y+=dy*Math.min(1,dt*8.0);
    }
    n.phase+=Math.max(.3,sp)*dt*8.2;
    const sw=Math.sin(n.phase)*Math.min(.52,sp*.62);
    n.p.userData.legL.rotation.x=sw;n.p.userData.legR.rotation.x=-sw;
    if(n.happyT>0){
      n.p.userData.armL.rotation.x=-2.1+Math.sin(t*14)*.4;
      n.p.userData.armR.rotation.x=-2.1-Math.sin(t*14)*.4;
    }else{
      n.p.userData.armL.rotation.x=-sw*.65;n.p.userData.armR.rotation.x=sw*.65;
    }
    n.p.rotation.z=Math.sin(n.phase)*.052;
    n.p.position.y=n.baseY+Math.abs(Math.sin(n.phase))*.028+n.jumpY;
    if(!n.indoor&&n.jumpY<=.02&&sp>.35&&n.puffCd<=0){
      n.puffCd=.34;
      spawnSnowPuff(n.p.position.x+R(-.14,.14),n.baseY+.05,n.p.position.z+R(-.14,.14),-n.vx*.25,R(.45,.8),-n.vz*.25,.58,.4);
    }
  }

  /* 交通灯 */
  trafficLight.t+=dt;
  const ph=trafficLight.t%12;
  const gi=ph<5?0:(ph<9?1:2);
  trafficLight.lamps.forEach((l,i)=>{
    l.material.color.setHex(i===gi?[0xff3b30,0xffcc00,0x33d17a][i]:0x1a1f24);
  });

  /* 环境贴图重建（防抖） */
  if(state.envDirty){state.envDirty=false;rebuildEnv();}

  /* 草浪风场 + 雪地干燥材质参数 */
  sharedStyle.uWindTime.value=t;
  wetShared.uTime.value=tLocal;
  wetShared.uRain.value=rainLevel;      // 雨天：地面湿度/雨痕扰动/反射扰动全部由它驱动
  wetShared.uReflOn.value=0;
  /* 雨丝与涟漪：全部参数在 shader 里，CPU 每帧只推时间 */
  if(rainMat&&rainLevel>0){
    rainMat.uniforms.uTime.value=tLocal;
    rainMat.uniforms.uOpacity.value=rainLevel*.90;
  }
  if(rippleMat&&rainLevel>0){
    rippleMat.uniforms.uTime.value=tLocal;
    rippleMat.uniforms.uOpacity.value=rainLevel*.85;
    rippleMat.uniforms.uCenter.value.set(camera.position.x,camera.position.z);
  }

  /* 游乐园：摩天轮 / 海盗船 / 旋转木马 / 雪地飞索 / 碰碰车 */
  if(amusement.wheel){
    amusement.wheel.rotation.z-=dt*.10;
    /* 吊舱重力垂挂 + 微风阻尼轻晃（不再僵硬焊死） */
    amusement.cabs.forEach((cab,ci)=>{
      const sway=(wheelSys.riding&&wheelSys.cab===cab)?.010:.032;
      cab.rotation.z=-amusement.wheel.rotation.z+Math.sin(t*1.35+ci*.9)*sway;
    });
  }
  /* 木马转速：原来 0.45 rad/s（14 秒一圈），远看几乎像静止 → 提到 0.72（约 8.7 秒一圈）*/
  if(amusement.carousel)amusement.carousel.rotation.y=phaseOf(8.7266)*.72;   // 0.72 rad/s → 8.73 秒一圈，纯相位=全服同进度
  if(amusement.horses){for(const h of amusement.horses)h.g.position.y=h.baseY+Math.sin(t*2.8+h.ph)*.26;}
  if(amusement.skaters){
    for(const sk of amusement.skaters){
      const p=sk.p, u=p.userData;
      let x=0, z=0, y=.08, yaw=0, pitch=0, roll=0;
      if(sk.role==='pairA'||sk.role==='pairB'){
        // 双人冰舞华尔兹组合：绕中庭圆心同步公转 + 手拉手面对面高速华尔兹对旋
        const w=t*1.15, cx=Math.cos(w*.45)*2.4, cz=Math.sin(w*.45)*3.6;
        const pairAng=w*2.6+sk.ph;
        x=cx+Math.cos(pairAng)*.65;
        z=cz+Math.sin(pairAng)*.65;
        yaw=Math.atan2(-Math.cos(pairAng),-Math.sin(pairAng));
        roll=(sk.role==='pairA'?1:-1)*.16;
        if(u.armL&&u.armR){
          u.armL.rotation.set(-1.35,0,.35);
          u.armR.rotation.set(-1.35,0,-.35);
          u.legL.rotation.x=.12;
          u.legR.rotation.x=-.78+Math.sin(w*2)*.22; // 外侧腿优雅后扬
        }
      }else if(sk.role==='spiral'){
        // 大 8 字燕式平衡大师（Arabesque Spiral）：单腿滑行、后腿高高平举、双臂展翅
        const s=t*.75+sk.ph;
        x=Math.sin(s)*7.2;
        z=Math.sin(s*2)*10.2;
        const vx=Math.cos(s)*7.2, vz=Math.cos(s*2)*20.4;
        yaw=Math.atan2(vx,vz);
        pitch=.34;
        roll=-Math.cos(s)*.24;
        if(u.armL&&u.armR){
          u.armL.rotation.set(-1.45,0,.78);
          u.armR.rotation.set(-1.45,0,-.78);
          u.legL.rotation.x=-.18;
          u.legR.rotation.x=1.22; // 燕式平衡高抬后腿
        }
      }else if(sk.role==='axel'){
        // 阿克塞尔三周跳大师（Triple Axel）：大椭圆助滑 + 每 3.2s 腾空跃起高速三周自转
        const s=t*1.02+sk.ph;
        x=Math.cos(s)*7.8;
        z=Math.sin(s)*11.2;
        const vx=-Math.sin(s)*7.8, vz=Math.cos(s)*11.2;
        const cyc=(t+sk.ph)%3.2;
        if(cyc<0.82){
          const jp=cyc/0.82;
          y=.08+Math.sin(jp*Math.PI)*.92;
          yaw=Math.atan2(vx,vz)+jp*Math.PI*6; // 空中高速三周跳
          if(u.armL&&u.armR){
            u.armL.rotation.set(-.95,0,-.28);
            u.armR.rotation.set(-.95,0,.28);
            u.legL.rotation.x=.15;u.legR.rotation.x=-.25;
          }
        }else{
          yaw=Math.atan2(vx,vz);
          roll=.26;
          if(u.armL&&u.armR){
            const sw=Math.sin(t*4.8)*.65;
            u.armL.rotation.set(sw,0,.25);u.armR.rotation.set(-sw,0,-.25);
            u.legL.rotation.x=-sw*.85;u.legR.rotation.x=sw*.85;
          }
        }
      }else if(sk.role==='spin'){
        // 贝尔曼高速原地旋转大师（Pirouette Spin）：滑行与每秒 2.8 圈高速芭蕾立转交替
        const cyc=(t+sk.ph)%4.0;
        const s=t*.65+sk.ph;
        x=Math.cos(s)*4.6;
        z=-5.2+Math.sin(s)*4.6;
        if(cyc<2.2){
          sk.spinAng+=dt*17.5;
          yaw=sk.spinAng;
          if(u.armL&&u.armR){
            u.armL.rotation.set(-2.65,0,.18);
            u.armR.rotation.set(-2.65,0,-.18);
            u.legL.rotation.x=0;u.legR.rotation.x=.95;
          }
        }else{
          const vx=-Math.sin(s)*4.6, vz=Math.cos(s)*4.6;
          yaw=Math.atan2(vx,vz);
          sk.spinAng=yaw;
          if(u.armL&&u.armR){
            u.armL.rotation.set(-1.2,0,.55);u.armR.rotation.set(-1.2,0,-.55);
            u.legL.rotation.x=Math.sin(t*4)*.45;u.legR.rotation.x=-Math.sin(t*4)*.45;
          }
        }
      }else{
        // 外圈极速交叉压步大师：沿巨型椭圆外圈反向压弯疾驰
        const s=-t*1.18+sk.ph;
        x=Math.cos(s)*9.2;
        z=Math.sin(s)*12.6;
        const vx=Math.sin(s)*9.2, vz=-Math.cos(s)*12.6;
        yaw=Math.atan2(vx,vz);
        pitch=.18;
        roll=-.28;
        if(u.armL&&u.armR){
          const sw=Math.sin(t*6.2)*.75;
          u.armL.rotation.set(sw-.3,0,.18);u.armR.rotation.set(-sw-.3,0,-.18);
          u.legL.rotation.x=-sw*.92;u.legR.rotation.x=sw*.92;
        }
      }
      p.position.set(x,y,z);
      p.rotation.set(pitch,yaw,roll,'YXZ');
    }
  }
  if(amusement.coaster){
    const co=amusement.coaster;
    if(!co._vP){co._vP=new THREE.Vector3();co._vT=new THREE.Vector3();co._vL=new THREE.Vector3();co._vU=new THREE.Vector3();}
    co.curve.getPointAt(co.t%1,co._vP);
    const spd=Math.max(.028,.058+(7.0-co._vP.y)*.0048); // 正常物理高低势能变速，高处自然略慢、下坡加速，不刻意延迟
    co.t=(co.t+spd*dt)%1;
    for(let ci=0;ci<co.cars.length;ci++){
      const u=(co.t-ci*.019+1)%1;
      co.curve.getPointAt(u,co._vP);
      co.curve.getTangentAt(u,co._vT);
      co.sampleTrackUp(u,co._vU);
      co.cars[ci].up.copy(co._vU);
      co.cars[ci].position.copy(co._vP);
      co.cars[ci].lookAt(co._vL.copy(co._vP).add(co._vT));
    }
  }
  for(const car of amusement.bumper){
    const st=car.userData.st;
    if(st.driven)continue;                  // 玩家接管的这辆由驾驶逻辑管
    st.ang+=st.spd*dt;
    const wob=Math.sin(t*1.6+st.ph)*.38;
    const rx=st.rx+wob, rz=st.rz+wob*.6;
    const nx=Math.cos(st.ang)*rx, nz=Math.sin(st.ang)*rz;
    const vx=-Math.sin(st.ang)*rx*st.spd, vz=Math.cos(st.ang)*rz*st.spd;
    /* 被玩家撞开后残留的位移，撞开的一瞬间推开，慢慢滑回原轨道 */
    if(st.kx||st.kz){
      const kf=Math.exp(-2.4*dt);
      st.kx*=kf;st.kz*=kf;
      if(Math.abs(st.kx)<.01)st.kx=0;
      if(Math.abs(st.kz)<.01)st.kz=0;
    }
    st.vx=vx+(st.kx||0);st.vz=vz+(st.kz||0);
    car.position.set(nx+(st.kx||0),.12,nz+(st.kz||0));
    car.rotation.y=Math.atan2(vx,vz);
  }
  /* 碰碰车互撞：两台车真的会弹开（原来 NPC 车之间直接穿过去）*/
  {
    const bl=amusement.bumper;
    for(let i=0;i<bl.length;i++){
      const A=bl[i],sa=A.userData.st;
      for(let j=i+1;j<bl.length;j++){
        const B=bl[j],sb=B.userData.st;
        if(sa.driven||sb.driven)continue;    // 玩家的车由驾驶逻辑处理
        const dx=B.position.x-A.position.x, dz=B.position.z-A.position.z;
        const d=Math.hypot(dx,dz), rr=BUMPER.carR*2;
        if(d>=rr||d<1e-4)continue;
        const nx=dx/d, nz=dz/d, push=(rr-d)*.5;
        A.position.x-=nx*push; A.position.z-=nz*push;
        B.position.x+=nx*push; B.position.z+=nz*push;
        const rel=((sa.vx||0)-(sb.vx||0))*nx+((sa.vz||0)-(sb.vz||0))*nz;
        const power=Math.max(.3,-rel*.6+.3);
        bumperBump(A,-nx,-nz,power);
        bumperBump(B,nx,nz,power);
        sa.kx-=nx*power*.42;sa.kz-=nz*power*.42;
        sb.kx+=nx*power*.42;sb.kz+=nz*power*.42;
        const cx=(A.position.x+B.position.x)*.5, cz=(A.position.z+B.position.z)*.5;
        const dd=Math.hypot(cx-camera.position.x,cz-camera.position.z);
        if(dd<28){ bumperClash(power,dd); }
      }
    }
  }
  for(const car of amusement.bumper){
    const st=car.userData.st;
    if(st.driven)continue;
    bumperBumpAnim(car,dt);
  }
  updateBumperDrive(dt);
  /* 镜头飞行 */
  if(camTween){
    camTween.t+=dt;
    const k=Math.min(1,camTween.t/camTween.dur);
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(camTween.p0,camTween.p1,e);
    controls.target.lerpVectors(camTween.t0,camTween.t1,e);
    if(k>=1)camTween=null;
  }

  if(intro.active)introUpdate(dt);
  updateSnowballFight(dt);
  updateGiftMountain(dt);
  if(fpvSys.active){
    updateFpvDrone(dt);
  }else if(fp.on){
    if(!trainSys.riding&&!wheelSys.riding&&!launchSys.active&&!balloonSys.riding&&!heliSys.riding)fpUpdate(dt);
  }else{
    let f=0,s=0;
    if(fp.keys['KeyW']||fp.keys['ArrowUp'])f+=1;
    if(fp.keys['KeyS']||fp.keys['ArrowDown'])f-=1;
    if(fp.keys['KeyA']||fp.keys['ArrowLeft'])s-=1;
    if(fp.keys['KeyD']||fp.keys['ArrowRight'])s+=1;
    // 触屏沙盒：虚拟摇杆也能平移沙盘视角（上推前进 / 右推横移）
    if(joy.mag>0.02){f+=-joy.dy*1.15;s+=joy.dx*1.15;}
    if(f||s){
      intro.active=false;camTween=null;
      const fwd=new THREE.Vector3();
      camera.getWorldDirection(fwd);fwd.y=0;
      if(fwd.lengthSq()>1e-6)fwd.normalize();else fwd.set(0,0,-1);
      const right=new THREE.Vector3(-fwd.z,0,fwd.x);
      const move=new THREE.Vector3().addScaledVector(fwd,f).addScaledVector(right,s);
      if(move.lengthSq()>0){
        const spd=(fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?28:14;
        move.normalize().multiplyScalar(spd*dt);
        if(IS_TOUCH_DEV){
          // 触屏沙盒：平移 orbit 中心，再重新贴回相机
          controls.target.add(move);
          touchCamApply();
        }else{
          controls.enabled=true;
          camera.position.add(move);
          controls.target.add(move);
        }
      }
    }
    if(IS_TOUCH_DEV){ if(!fp.on)touchCamApply(); }
    else controls.update();
  }
  /* 多人联机：远端玩家插值 + 推本地位置 + 第三人称相机
     —— 必须放在 fpUpdate 之后：fpUpdate 每帧把 camera 写回第一人称位姿，
        第三人称要在它后面把相机挪到角色背后 */
  if(window.MP)MP.update(dt);
  updateTrain(dt);
  updateWheelRide(dt);
  updateBalloonRide(dt);
  updateHeliRide(dt);
  updateLaunchRide(dt);
  updatePianoPlaza(dt,t);
  updateCircus(dt,t);
  /* 大本钟：指针走服务器权威时间（纯函数，无本地累加）*/
  updateBigClock();
  updateHelis(dt);
  updateFireworks(dt);
  updateAerialHaze(dt,t);
  const ridingFast=fpvSys.active||(wheelSys.riding&&wheelSys.kind==='coaster')||trainSys.riding||heliSys.riding;
  if(!ridingFast||(_reflTick&1)===0)updateOuterCrowd(ridingFast?dt*2:dt,t);
  _reflTick++;
  // 乘车高速俯瞰时冻结阴影重绘避免瞬时卡顿，平地走动时每 36 帧轻刷一次
  if(!ridingFast&&(_reflTick%36)===0)renderer.shadowMap.needsUpdate=true;
  // 乘车期间或高空远景稳定隐藏 1F 室内细碎展品，避免俯冲穿过 9.5m 临界高度时反复切换引发帧率抖动
  const hide1F=fpvSys.active||(wheelSys.riding&&wheelSys.kind==='coaster')||(camera.position.z>22&&camera.position.y>14&&!inBuildingXZ(camera.position.x,camera.position.z));
  if(typeof shop1!=='undefined')shop1.visible=!hide1F;

  directorUpdate(dt);                    // XM Studio：导演机位（覆盖玩家视角）
  composer.render();
  if(director.recTrack&&director.recTrack.requestFrame)director.recTrack.requestFrame();
  /* UI 录制走自己的轨道（captureStream(0) 是手动逐帧模式），
     不调 requestFrame 的话整段视频只会剩一帧 —— 这里每帧补一发并计数。 */
  if(window._uiRecTrack&&window._uiRecTrack.requestFrame){
    window._uiRecTrack.requestFrame();
    window._uiRecFrames=(window._uiRecFrames||0)+1;
  }

  /* FPS + 全局自适应 DPR 稳帧控制器（任意视角掉帧自动降像素比保流畅，回稳后自动恢复高清） */
  fpsFrames++;
  const nowMs=performance.now();
  if(nowMs-fpsT0>500){
    const f=Math.round(fpsFrames*1000/(nowMs-fpsT0));
    fpsEl.textContent=f+' FPS';
    /* 移动端：掉帧连续 3 次降到低分辨率档，回稳后连续 6 次升回高清档
       （旧逻辑只降不升，掉一次帧就永久留在低分辨率，越看越糊）。
       桌面：只有低画质档才允许自动调节，高画质档用户点了就不动。 */
    if(!ridingFast&&IS_TOUCH_DEV&&!window._recording){
      if(f<36){
        window._lowFpsStreak=(window._lowFpsStreak||0)+1;window._hiFpsStreak=0;
        if(window._lowFpsStreak>=3&&renderer.getPixelRatio()>LO_DPR+.05)applyDpr(LO_DPR);
      }else if(f>54&&renderer.getPixelRatio()<HI_DPR-.05){
        window._hiFpsStreak=(window._hiFpsStreak||0)+1;window._lowFpsStreak=0;
        if(window._hiFpsStreak>=6)applyDpr(HI_DPR);
      }
    }else if(!ridingFast&&!state.quality&&!window._recording){
      if(f<36){
        window._lowFpsStreak=(window._lowFpsStreak||0)+1;window._hiFpsStreak=0;
        if(window._lowFpsStreak>=3&&renderer.getPixelRatio()>LO_DPR+.05)applyDpr(LO_DPR);
      }
    }
    fpsFrames=0;fpsT0=nowMs;
  }
}

const director={
  active:false, shot:null, init:false,
  pos:new THREE.Vector3(), look:new THREE.Vector3(),
  recTrack:null, recBusy:false
};
const _dmPos=new THREE.Vector3(),_dmLook=new THREE.Vector3(),_dmP=new THREE.Vector3(),_dmT=new THREE.Vector3();

/* ── 动态机位：算目标位置 / 目标注视点 ── */
function directorChase(ride,outPos,outLook){
  const P=outPos,L=outLook;
  if(ride==='coaster'&&amusement.coaster){
    const co=amusement.coaster;
    if(!co.cars||!co.cars.length)return false;
    co.cars[0].updateMatrixWorld(true);
    co.cars[0].getWorldPosition(_dmP);
    co.curve.getTangentAt(co.t%1,_dmT);
    /* 斜后方侧移跟拍：把切线拆成「水平前进方向」和「水平侧向」，
       相机落在车后 + 侧方，视线保持水平 —— 过山车俯冲时不会变成鸟瞰，
       也不会像车头第一人称那样跟着轨道翻滚。 */
    const th=_dmT.clone(); th.y=0;
    if(th.lengthSq()<1e-6)th.set(0,0,1); else th.normalize();
    const side=new THREE.Vector3(-th.z,0,th.x);
    P.copy(_dmP).addScaledVector(th,-6.2).addScaledVector(side,4.2); P.y=_dmP.y+1.0;
    L.copy(_dmP).addScaledVector(th,0.6); L.y=_dmP.y+0.8;
    return true;
  }
  if(ride==='fpv'&&fpvSys.active){
    const s=fpvSys;
    /* 穿越机在游戏里是第一人称玩法，场景里没有机体模型可跟 ——
       这个机位直接给「机头视角」：镜头架在穿越机上沿航线朝前看。
       相机 up 恒为世界竖直（不继承压弯 / 桶滚），画面又冲又不歪。 */
    s.curve.getPointAt(s.u,_dmP);
    P.set(_dmP.x,_dmP.y+0.26,_dmP.z);
    s.curve.getPointAt((s.u+0.012)%1,_dmLook);      // 前瞻点：飞手看的方向
    _dmLook.y+=0.10;
    return true;
  }
  if(ride==='train'&&trainCars&&trainCars.length){
    const c=trainCars[0]; c.updateMatrixWorld(true);
    c.getWorldPosition(_dmP);
    c.getWorldDirection(_dmT);            // 车头朝向
    P.copy(_dmP).addScaledVector(_dmT,-6.6); P.y+=2.0;
    L.copy(_dmP).addScaledVector(_dmT,8.0);  L.y+=1.0;
    return true;
  }
  if(ride==='carousel'&&amusement.horses&&amusement.horses.length){
    _dmP.set(0,.98,.05).applyMatrix4(amusement.horses[0].g.matrixWorld);
    P.set(_dmP.x+4.2,2.4,_dmP.z+4.2);
    L.copy(_dmP); L.y+=1.0;
    return true;
  }
  if(ride==='wheel'&&amusement.wheel){
    const w=amusement.wheel;
    w.updateMatrixWorld(true);
    _dmP.set(0,0,0).applyMatrix4(w.matrixWorld);
    P.set(_dmP.x+6.0,3.0,_dmP.z+6.0);
    L.copy(_dmP); L.y+=2.0;
    return true;
  }
  if(ride==='sleigh'&&flyingSleigh){
    flyingSleigh.updateMatrixWorld(true);
    _dmP.set(0,1.4,0).applyMatrix4(flyingSleigh.matrixWorld);
    P.copy(_dmP); P.z-=7.0; P.y+=1.6;
    L.copy(_dmP); L.z+=4.0;
    return true;
  }
  if(ride==='balloon'&&balloons&&balloons.length){
    const b=balloons[0];
    b.g.updateMatrixWorld(true);
    b.g.getWorldPosition(_dmP);
    /* 站到球的正北方向（后场最北的空旷带，无树阵），缓慢左右扫；
       视线压着球体中段 —— 升空过程中整个园区会在画面下方铺开。 */
    const a=Math.PI*.5+Math.sin((director.t||0)*.17)*.40;
    P.set(_dmP.x+Math.cos(a)*12.5,_dmP.y-1.4,_dmP.z+Math.sin(a)*12.5);
    L.set(_dmP.x,_dmP.y+2.2,_dmP.z);
    return true;
  }
  return false;
}

/* ── 每帧：导演机位覆写 camera（位置在 composer.render() 之前） ── */
function directorUpdate(dt){
  if(!director.active||!director.shot)return;
  director.t=(director.t||0)+dt;
  const sh=director.shot;
  let fov=sh.fov||55;
  let got=false;
  if(sh.kind==='chase'){
    got=directorChase(sh.ride,_dmPos,_dmLook);
    if(!got){_dmPos.set(0,4,0);_dmLook.set(0,2,0);}
  }else{
    _dmPos.set(sh.pos[0],sh.pos[1],sh.pos[2]);
    _dmLook.set(sh.look[0],sh.look[1],sh.look[2]);
    got=true;
    /* 机位微动：缓慢环绕 / 平移 / 推近 / 呼吸浮动，全部保持水平稳定 */
    if(sh.move){
      const t=director.t||0;
      if(sh.move==='orbit'){
        const a=t*.055,r=Math.hypot(sh.pos[0]-sh.look[0],sh.pos[2]-sh.look[2]);
        _dmPos.x=sh.look[0]+Math.cos(a)*r;
        _dmPos.z=sh.look[2]+Math.sin(a)*r;
      }else if(sh.move==='drift'){
        _dmPos.x+=Math.sin(t*.21)*1.6; _dmPos.y+=Math.sin(t*.17)*.35;
      }else if(sh.move==='push'){
        const k=Math.min(1,(t%14)/14)*.28;
        _dmPos.lerpVectors(new THREE.Vector3(sh.pos[0],sh.pos[1],sh.pos[2]),_dmLook,k);
      }else if(sh.move==='sway'){
        _dmPos.x+=Math.sin(t*.26)*.45; _dmPos.y+=Math.sin(t*.19)*.18;
      }
    }
  }
  if(!director.init){director.pos.copy(_dmPos);director.look.copy(_dmLook);director.init=true;}
  /* 分轴平滑：水平跟得快（不脱靶），高度跟得慢（不上下颠） */
  const kXZ=1-Math.exp(-dt*(sh.kind==='chase'?5.6:2.4));
  const kY =1-Math.exp(-dt*(sh.kind==='chase'?1.6:1.8));
  const kL =1-Math.exp(-dt*(sh.kind==='chase'?3.4:2.2));
  director.pos.x+=(_dmPos.x-director.pos.x)*kXZ;
  director.pos.z+=(_dmPos.z-director.pos.z)*kXZ;
  director.pos.y+=(_dmPos.y-director.pos.y)*kY;
  director.look.x+=(_dmLook.x-director.look.x)*kL;
  director.look.y+=(_dmLook.y-director.look.y)*kL;
  director.look.z+=(_dmLook.z-director.look.z)*kL;
  camera.position.copy(director.pos);
  camera.up.set(0,1,0);                 // 恒定世界竖直：过山车翻转不带动镜头
  camera.lookAt(director.look);
  if(Math.abs(camera.fov-fov)>.05){camera.fov=fov;camera.updateProjectionMatrix();}
  /* 穿越机在导演跟拍时禁用压弯与桶滚，保证画面水平 */
  if(fpvSys.active){
    fpvSys.rollVel=0;fpvSys.manualRoll=0;fpvSys.rollExtra=0;fpvSys.bank=0;
  }
}

/* ── 切换机位（含自动启动对应设施） ── */
function xmSetShot(id){
  const sh=XM_SHOTS.find(s=>s.id===id);
  if(!sh)return{ok:false,error:'unknown shot: '+id};
  /* 收尾上一个设施 */
  if(fpvSys.active)toggleFpvMode(false);
  if(wheelSys.riding)stopFacilityRide();
  if(trainSys.riding)toggleRideTrain();
  if(balloonSys.riding)stopBalloonRide();
  if(heliSys.riding)endHeliRide();
  intro.active=false;intro.t=intro.dur;camTween=null;
  if(!fp.on)fpEnter(true);
  if(sh.kind==='chase'){
    if(sh.ride==='fpv'){toggleFpvMode(true);}
    else if(sh.ride==='coaster'){toggleRideFacility({kind:'coaster',label:'云霄飞车'});}
    else if(sh.ride==='train'){toggleRideTrain();}
    else if(sh.ride==='carousel'){toggleRideFacility({kind:'carousel',label:'旋转木马'});}
    else if(sh.ride==='wheel'){toggleRideWheel(null);}
    else if(sh.ride==='sleigh'){toggleRideFacility({kind:'sleigh',label:'空中圣诞驯鹿雪橇'});}
    else if(sh.ride==='balloon'){
      fp.x=balloons[0].x;fp.z=balloons[0].z;fp.y=balloons[0].y;
      toggleBalloonRide(0);
    }
  }
  director.active=true;director.shot=sh;director.init=false;director.t=0;
  applyDpr(HI_DPR);                       // 录制优先画质
  return{ok:true,shot:id};
}

/* ── 录制 ── */
function xmB64(buf){
  const bytes=new Uint8Array(buf);let s='';const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
}
async function xmRecord(opts){
  if(director.recBusy)return{ok:false,error:'recording in progress'};
  opts=opts||{};
  const dur=Math.max(1,Math.min(180,Number(opts.duration)||6));
  const shotId=opts.shot||(director.shot&&director.shot.id)||XM_SHOTS[0].id;
  if(opts.quality!==false)applyQualityMode(true);
  const _sat=(opts.saturation!=null&&opts.saturation>0)?Number(opts.saturation):1.0;
  if(animePass&&animePass.uniforms)animePass.uniforms.uSat.value=_sat;
  const sw=xmSetShot(shotId);
  if(!sw.ok)return sw;
  await new Promise(r=>setTimeout(r,opts.warmup?Math.max(200,opts.warmup):1400));  // 等镜头稳定
  const fps=Math.min(60,Number(opts.fps)||30);
  let mime='video/webm';
  if(window.MediaRecorder&&MediaRecorder.isTypeSupported){
    mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4']
      .find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
  }
  if(!window.MediaRecorder)return{ok:false,error:'MediaRecorder unsupported'};
  director.recBusy=true;
  try{
    /* ── 先「真录着」探帧率，再决定成片分辨率 ──
       xmSetShot 会把像素比拉到画质档（Retina 上就是 1.55 → 300 多万像素），
       实测这个场景在 420 万像素只有 11fps，录出来就是幻灯片。
       现在每一档都开着采集录 18 帧测帧率，跑不到 24fps 就丢掉换低一档，
       帧率优先于分辨率（用户诉求：录全景时帧率太低）。 */
    let rec=null,chunks=[],stream=null,track=null,recFps=0;
    const cands=_recDprCandidates(renderer.getPixelRatio());
    for(let i=0;i<cands.length;i++){
      const dpr=_recEvenDpr(cands[i]);
      applyDpr(dpr);
      await new Promise(r=>setTimeout(r,260));
      try{ stream=renderer.domElement.captureStream(0); }
      catch(e){ return{ok:false,error:'captureStream unsupported'}; }
      track=stream.getVideoTracks()[0];
      director.recTrack=track;
      const r2=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.min(20e6,Math.max(8e6,Math.round(innerWidth*dpr)*Math.round(innerHeight*dpr)*3))});
      chunks=[];
      r2.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      r2.start(200);
      const fps=await _recProbeFps(14);
      const last=(i===cands.length-1);
      if(fps>=_REC_FPS_GOOD||fps>=_REC_FPS_OK||last){rec=r2;recFps=fps;break;}
      try{r2.stop();}catch(e){}
      r2.ondataavailable=null;
      try{track.stop();}catch(e){}
      director.recTrack=null;
      await new Promise(r=>setTimeout(r,140));
    }
    if(!rec)return{ok:false,error:'recorder start failed'};
    const stopped=new Promise(r=>{rec.onstop=r});
    await new Promise(r=>setTimeout(r,dur*1000));
    rec.stop();
    await stopped;
    director.recTrack=null;
    const blob=new Blob(chunks,{type:mime});
    const buf=await blob.arrayBuffer();
    return{ok:true,shot:shotId,mime,size:blob.size,duration:dur,fps,recFps:recFps,dpr:+renderer.getPixelRatio().toFixed(2),base64:xmB64(buf)};
  }catch(e){
    director.recTrack=null;
    return{ok:false,error:String(e&&e.message||e)};
  }finally{
    director.recBusy=false;
    if(animePass&&animePass.uniforms)animePass.uniforms.uSat.value=1.0;   // 提色只作用在本次录制，不留残留在页面上
  }
}

/* ══════════════════════════════════════════════════════════════════════
   页面原生录制按钮（右上角「● 录制」）
   ──────────────────────────────────────────────────────────────────────
   点一下开始录，再点一下停止；录完自动下载到本机 ——
   电脑 → 浏览器「下载」文件夹；手机 → 「文件」/「照片」。

   要点：
   · MediaRecorder 只能录 canvas 的当前像素尺寸，所以「更清晰」的做法是
     先把像素比临时提上去 → 等两帧让新画布尺寸生效 → 再 captureStream，
     录完再把像素比还原。
   · 录制期间锁死自适应降档（window._recording），否则掉帧时分辨率会在
     视频中途偷偷跳变，成片看着像卡带。
   · 手机 Safari 对 download 属性支持不稳：优先走系统分享（存到「文件」），
     失败再退回 <a download>，最后兜一个可长按保存的预览层。
   ══════════════════════════════════════════════════════════════════════ */
const _rec={on:false,rec:null,chunks:[],t0:0,timer:0,dpr0:1,ratio:1,mime:'',msgT:0};

function _recPad(n){return String(n).padStart(2,'0')}
function _recStamp(){
  const d=new Date();
  return d.getFullYear()+_recPad(d.getMonth()+1)+_recPad(d.getDate())+'-'+_recPad(d.getHours())+_recPad(d.getMinutes())+_recPad(d.getSeconds());
}
function _recIsIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
/* 手机端（安卓/苹果都算）一律走「保存卡片」：
   手机浏览器一律要求下载动作发生在用户手势里（Chrome 会报
   "Download is disallowed because the user gesture is required"），
   在录制结束的异步回调里自动下载必然被拦，用户看不到任何东西存下来。 */
function _recIsMobile(){
  return IS_TOUCH_DEV||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}
function _recMsg(t,ms){
  const el=document.getElementById('xmsg');
  if(!el)return;
  el.textContent=t;el.classList.add('show');
  clearTimeout(_rec.msgT);
  _rec.msgT=setTimeout(()=>el.classList.remove('show'),ms||2800);
}
function _recLabel(t){
  const b=document.getElementById('w-rec');
  if(!b)return;
  b.dataset.label=t;
}
/* 录制分辨率：改成「开着采集真录着，再量帧率」。
   之前是在**没开采集**的时候探帧率 —— captureStream(0) + 每帧 requestFrame() 的
   逐帧拷贝开销完全没算进去，于是「预览 50fps，一按录制就掉到 12fps」，
   成片全是卡顿（用户实测：录全景明显卡，录起来更卡）。
   现在每一档分辨率都真录着探 18 帧，跑不到 24fps 就丢掉这一段、换更低一档。
   帧率跟像素量强相关（约 136 万像素 40fps、420 万像素 11fps），
   所以宁可降档也要流畅 —— 流畅优先。 */
function _recProbeFps(n){
  return new Promise(res=>{
    const t0=performance.now();let i=0;
    const tick=()=>{ i++; if(i>=n)return res(+(n*1000/(performance.now()-t0)).toFixed(1)); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
/* 候选分辨率：从高到低
   录制时的像素预算上限约 2.8M（手机 2.4M）：
   1440×900 屏幕按 1.55 倍像素比就是 3.1M 像素，超预算 → 自动降到 1.47 倍。
   帧率跟像素量强相关，所以宁可降分辨率也要流畅。 */
function _recDprCandidates(dpr0){
  const w=innerWidth,h=innerHeight;
  const budget=IS_TOUCH_DEV?2.4e6:2.8e6;          // 录制时的像素上限
  const cap=Math.sqrt(budget/Math.max(1,w*h));
  const hi=Math.min(cap,Math.max(dpr0,HI_DPR));
  const list=[hi];                                  // 先试画质档
  if(dpr0<hi-0.01)list.push(dpr0);                 // 当前档比画质档低就补一档
  list.push(Math.max(.62,hi*.82));                  // 再降一档
  list.push(Math.max(.52,hi*.68));                  // 再降一档
  return list.filter((v,i,a)=>v>=.5&&a.indexOf(v)===i);
}
/* 录制帧率门槛：≥28 算流畅（直接用）；≥20 勉强能用（不再往下砍分辨率）；
   低于 20 就丢掉这一段、换更低一档分辨率重试。 */
const _REC_FPS_GOOD=28,_REC_FPS_OK=20;
/* H.264 要求宽高都是偶数，把画布宽度对齐到偶数 */
function _recEvenDpr(d){
  const evenW=Math.max(2,Math.round(innerWidth*d)&~1);
  return evenW/innerWidth;
}
/* 建一个采集器（不 start，交给调用方） */
function _recMakeRecorder(dpr){
  let mime='video/webm';
  if(MediaRecorder.isTypeSupported){
    /* 手机上没有本机服务帮忙转 mp4，能录 mp4(H.264) 就优先录 mp4：
       存进「下载」后相册能直接播、长按能「存到相册」；webm 小米相册打不开。 */
    const cand=_recIsPhone()
      ? ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
      : ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
    mime=cand.find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
  }
  let stream=null;
  try{stream=renderer.domElement.captureStream(0);}catch(e){return null;}
  const track=stream.getVideoTracks()[0];
  const cw=Math.round(innerWidth*dpr),ch=Math.round(innerHeight*dpr);
  /* 码率：录制时每帧还要把画布整张拷进编码器，码率越高越吃 CPU。
     1080p 给 8~20Mbps 已经够看（4Mbps 一档的差别肉眼看不出来），
     但编码压力小一大截 —— 流畅优先。 */
  const bps=Math.min(20e6,Math.max(8e6,cw*ch*30*0.10));
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bps});
  return {rec,stream,track,mime,cw,ch,bps,chunks:[]};
}
function _recPreview(url){
  const box=document.getElementById('recpv');
  const v=document.getElementById('recpv-video');
  if(!box||!v)return;
  v.src=url;
  box.classList.add('show');
}
async function _recSave(blob){
  const name='xiongmeng-'+_recStamp()+(_rec.mime.indexOf('mp4')>=0?'.mp4':'.webm');
  let outBlob=blob,outName=name;
  /* 本机 XM Studio 服务在跑的话，顺便让 ffmpeg 转一份 mp4 ——
     Chrome 的 MediaRecorder 只能出 webm，剪辑软件里 mp4 省事得多。 */
  try{
    const ac=new AbortController();
    const to=setTimeout(()=>ac.abort(),8000);
    const q='?fps='+(_rec.fps||30)+'&frames='+(_rec.frames||0);
    const r=await fetch('http://127.0.0.1:8789/convert'+q,{method:'POST',body:blob,signal:ac.signal});
    clearTimeout(to);
    if(r.ok&&(r.headers.get('content-type')||'').indexOf('video/mp4')>=0){
      outBlob=await r.blob();
      outName=name.replace(/\.webm$/,'.mp4');
    }
  }catch(e){ /* 服务没开就算了，直接存原格式 */ }
  if(_recIsMobile()){
    /* 手机上「保存」必须发生在用户手势里：安卓 Chrome 和 iOS Safari 都会
       拦掉异步回调里的自动下载。所以弹一张显眼的保存卡片，
       真正的保存动作交给用户点按钮触发。 */
    _recSaveCard(outBlob,outName);
    return;
  }
  const url=URL.createObjectURL(outBlob);
  _recSaveFallback(url,outName);
}
/* 手机端保存卡片：视频 + 「保存到本机」按钮 + 明确告诉用户文件会去哪
   踩过的坑（小米安卓）：点「保存到本机」后页面一点反馈都没有 =
   ① 全局提示条 #xmsg 的 z-index(60) 比保存卡片遮罩(#recpv,70) 低，提示被盖在下面看不见；
   ② 部分安卓浏览器（微信内置、小米自带浏览器）根本不执行 blob 下载，静默失败。
   所以：状态写在卡片自己里面（#recpv-status），并额外给「新标签打开」这条兜底路。 */
function _recIsPhone(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}
function _recSaveCard(blob,name){
  const box=document.getElementById('recpv');
  const v=document.getElementById('recpv-video');
  const tip=document.getElementById('recpv-tip');
  const st=document.getElementById('recpv-status');
  const btn=document.getElementById('recpv-save');
  if(!box||!v||!btn)return;
  const url=URL.createObjectURL(blob);
  box._url=url;
  v.src=url;
  const ios=_recIsIOS();
  const wechat=/MicroMessenger/i.test(navigator.userAgent);
  const file=()=>new File([blob],name,{type:blob.type||'video/mp4'});
  const say=(t)=>{ if(st){st.innerHTML=t;st.classList.add('on');} };
  tip.innerHTML=ios
    ? '点「保存到本机」→ 在系统面板里选 <b>存储到文件</b>，存好后到「文件」App 里找。<br>'
      +'也可以 <b>长按上面的视频</b> → 存储到照片。'
    : '点「保存到本机」→ 视频存进手机 <b>下载</b> 文件夹（小米：文件管理 → Download）。<br>'
      +'没动静就点 <b>新标签打开</b> → 右上角「…」→ 下载，或用 <b>系统分享</b> 存到文件管理器。<br>'
      +'（微信里打开的话，先点右上角「…」→ 在浏览器中打开再录）';
  if(wechat)say('你现在是在<b>微信里</b>打开的，微信会拦下载动作。请点右上角「…」→ <b>在浏览器中打开</b>，回到这个页面再录一次。');
  btn.textContent='保存到本机';
  btn.onclick=()=>{
    /* iOS 走系统分享（面板里选「存储到文件」），安卓走浏览器下载（存进「下载」目录）——
       两者都必须在用户手势里触发。 */
    if(ios&&navigator.canShare&&navigator.canShare({files:[file()]})){
      navigator.share({files:[file()],title:name})
        .then(()=>say('已调起系统分享，选 <b>存储到文件</b> 即可。'))
        .catch(()=>{_recDl(url,name);say('分享被取消，已改为触发下载：<b>'+name+'</b>。');});
      return;
    }
    _recDl(url,name);
    say('已触发下载：<b>'+name+'</b>。到手机「下载」文件夹里找。<br>'
      +'如果浏览器没弹下载条、文件夹里也没有，就点下面 <b>新标签打开</b>，用右上角「…」→ 下载。');
  };
  const sh=document.getElementById('recpv-share');
  if(sh){
    sh.style.display=(ios||!navigator.canShare)?'none':'inline-block';
    sh.onclick=()=>{
      if(navigator.canShare&&navigator.canShare({files:[file()]})){
        navigator.share({files:[file()],title:name})
          .then(()=>say('已调起系统分享，选 <b>文件管理 / 保存到手机</b> 即可。'))
          .catch(()=>say('分享被取消了，可以点「保存到本机」再试一次。'));
      }else say('这个浏览器不支持系统分享，请点「保存到本机」或「新标签打开」。');
    };
  }
  const tb=document.getElementById('recpv-tab');
  if(tb){
    tb.style.display=ios?'none':'inline-block';
    tb.onclick=()=>{
      const w=window.open(url,'_blank');
      if(w)say('已在新标签打开视频：点浏览器右上角「…」→ <b>下载</b>，就能存到手机。');
      else say('浏览器把新标签拦了，请改用「系统分享」，或长按上面的视频另存。');
    };
  }
  box.classList.add('show');
}
/* 在用户手势里触发下载（iOS 这时才不会被拦） */
function _recDl(url,name){
  const a=document.createElement('a');
  a.href=url;a.download=name;a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>a.remove(),2000);
  /* 保存卡片开着的时候，卡片里那行状态已经把话说清楚了，
     再弹一次全局提示条反而压在状态行上（提示条是 fixed 在屏幕底部的）。 */
  const card=document.getElementById('recpv');
  if(!(card&&card.classList.contains('show')))_recMsg('已开始下载：'+name);
}
function _recSizeText(b){
  return b>=1048576?Math.round(b/1048576)+'MB':Math.max(1,Math.round(b/1024))+'KB';
}
function _recSaveFallback(url,name){
  const a=document.createElement('a');
  a.href=url;a.download=name;a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},10000);
  if(_recIsIOS())_recPreview(url);      // iOS 上再给一个可长按保存的入口
}
async function _recStart(){
  if(_rec.on)return;
  if(!window.MediaRecorder){_recMsg('这个浏览器不支持画面录制');return;}
  const dpr0=renderer.getPixelRatio();                 // 先记下原值，录完还原
  _recMsg('准备中…正在挑分辨率');
  /* ── 逐档试：每一档都「真开着采集」录 18 帧测帧率 ──
     captureStream(0) 是手动逐帧模式，不调 requestFrame() 就不产生任何拷贝，
     所以探帧率期间必须把 track 挂上（主循环每帧会 requestFrame），
     这样量到的才是「一边渲染一边采集」的真实帧率。 */
  const cands=_recDprCandidates(dpr0);
  let chosen=null,fallback=null;
  for(let i=0;i<cands.length;i++){
    const dpr=_recEvenDpr(cands[i]);
    applyDpr(dpr);
    await new Promise(r=>setTimeout(r,260));            // 等新画布尺寸稳定再捕获
    const t=_recMakeRecorder(dpr);
    if(!t){applyDpr(dpr0);_recMsg('这个浏览器不支持画面录制');return;}
    t.rec.ondataavailable=e=>{if(e.data&&e.data.size)t.chunks.push(e.data)};
    window._uiRecTrack=t.track;window._uiRecFrames=0;  // 探帧率期间也要真的在采集
    t.rec.start(200);
    const fps=await _recProbeFps(14);
    const last=(i===cands.length-1);
    if(fps>=_REC_FPS_GOOD){chosen=t;chosen.fps=fps;chosen.dpr=dpr;break;}
    if(fps>=_REC_FPS_OK){fallback=t;fallback.fps=fps;fallback.dpr=dpr;break;}
    if(last){chosen=t;chosen.fps=fps;chosen.dpr=dpr;break;}
    /* 跑不动：这一段作废（丢弃分片、停掉轨道），换更低一档重来 */
    try{t.rec.stop();}catch(e){}
    t.rec.ondataavailable=null;
    try{t.track.stop();}catch(e){}
    await new Promise(r=>setTimeout(r,140));
  }
  if(!chosen&&fallback)chosen=fallback;
  if(!chosen){applyDpr(dpr0);_recMsg('录制启动失败，请重试');return;}
  const rec=chosen.rec,mime=chosen.mime,cw=chosen.cw,ch=chosen.ch,dpr=chosen.dpr;
  _rec.dpr0=dpr0;
  _rec.ratio=dpr;
  _rec.chunks=chosen.chunks;_rec.mime=mime;
  rec.ondataavailable=e=>{if(e.data&&e.data.size)_rec.chunks.push(e.data)};
  rec.onstop=()=>{
    const blob=new Blob(_rec.chunks,{type:mime});
    const frames=window._uiRecFrames||0;
    _rec.frames=frames;
    const secs=(performance.now()-_rec.t0)/1000;
    _rec.fps=secs>0.2?Math.round(frames/secs):30;
    window._uiRecTrack=null;
    _rec.chunks=[];_rec.on=false;_rec.rec=null;
    window._recording=false;
    applyDpr(_rec.dpr0);
    clearInterval(_rec.timer);
    const b=document.getElementById('w-rec');
    if(b)b.classList.remove('rec');
    _recLabel('录制');
    if(blob.size>2048){
      _recSave(blob);
      /* 手机上此刻还没存，只是弹了保存卡片 —— 别在这里说「已保存」 */
      _recMsg(_recIsMobile()
        ? '录制完成 · '+cw+'×'+ch+' · '+_recSizeText(blob.size)+' · 下面点「保存到本机」存进手机'
        : '已保存到本机 · '+cw+'×'+ch+' · '+_recSizeText(blob.size)+' · '+(_rec.fps||30)+'fps');
    }else _recMsg('录制失败，画面是空的');
  };
  rec.onerror=()=>{_recMsg('录制出错，请重试')};
  /* rec 已经在探帧率时 start 了，这里不能再 start */
  _rec.rec=rec;_rec.on=true;window._recording=true;_rec.t0=performance.now();
  const b=document.getElementById('w-rec');
  if(b)b.classList.add('rec');
  _rec.timer=setInterval(()=>{
    const s=Math.floor((performance.now()-_rec.t0)/1000);
    _recLabel('● '+_recPad(Math.floor(s/60))+':'+_recPad(s%60));
  },400);
  _recMsg('录制中 · '+cw+'×'+ch+' · 实测 '+(chosen.fps||0)+'fps · 再点一次停止');
}
function _recStop(){
  if(!_rec.rec)return;
  try{_rec.rec.stop()}catch(e){}
}

/* ── 盖楼回复的本地存储 ──
   平台侧的留言板 API 只认 author / content / client_token 三个字段，
   没有 parent_id，回复没法落到服务器上。所以楼中楼存在浏览器本地：
   结构是 {主帖id:[{id,author,content,created_at,parentId}]}，
   parentId 为空 = 一级楼，指向某条回复 = 二级楼（盖楼里的盖楼）。
   代价要说清楚：换一台设备看不到别人写的回复。 */
const GB_REPLY_KEY='xm_gb_replies';
const GB_NICK_KEY='xm_gb_nick';
const gbReplyStore=(()=>{
  let m={};
  try{const raw=localStorage.getItem(GB_REPLY_KEY);if(raw)m=JSON.parse(raw)||{};}catch(e){m={};}
  const save=()=>{try{localStorage.setItem(GB_REPLY_KEY,JSON.stringify(m));}catch(e){}};
  return{
    of:id=>(Array.isArray(m[id])?m[id]:[]),
    count:id=>((m[id]||[]).length),
    add:(id,r)=>{if(!Array.isArray(m[id]))m[id]=[];m[id].push(r);save();},
    drop:(id,rid)=>{if(!Array.isArray(m[id]))return;m[id]=m[id].filter(x=>x.id!==rid);save();},
    clear:id=>{delete m[id];save();}
  };
})();
const gbNick=()=>{try{return localStorage.getItem(GB_NICK_KEY)||'';}catch(e){return '';}};
const gbSetNick=v=>{try{localStorage.setItem(GB_NICK_KEY,v||'');}catch(e){}};
async function gbLoad(selectId){
  gbState.loading=true;gbState.err='';gbRender();
  try{
    const r=await fetch(GB_API,{cache:'no-store'});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'加载失败');
    gbState.items=d.items||[];
    if(selectId)gbState.selId=selectId;
    else if(!gbState.items.some(x=>x.id===gbState.selId)){
      gbState.selId=gbState.items.length?gbState.items[0].id:null;
    }
  }catch(e){gbState.err='连接留言服务失败：'+(e.message||e);}
  gbState.loading=false;gbRender();
}
/* 盖楼：一级楼平铺，二级楼缩进挂在对应楼层下面 */
function gbThreadHTML(pid){
  const list=gbReplyStore.of(pid).slice().sort((a,b)=>a.created_at<b.created_at?-1:1);
  if(!list.length)return '';
  const kids=parent=>list.filter(r=>r.parentId===parent);
  let floor=0;
  const one=r=>{
    floor++;
    const n=floor;
    const sub=kids(r.id).map(one).join('');
    return '<div class="gb-rl'+(r.parentId?' child':'')+'">'+
      '<div class="hd"><b>'+escHtml(r.author)+'</b>'+
        '<span class="fl">'+n+' 楼'+(r.parentAuthor?' · 回 '+escHtml(r.parentAuthor):'')+'</span>'+
        '<span class="act" data-rid="'+r.id+'" data-ra="'+escHtml(r.author)+'">回复</span></div>'+
      '<div class="bd">'+escHtml(r.content)+'</div>'+
      (sub?'<div class="kids">'+sub+'</div>':'')+
    '</div>';
  };
  const roots=list.filter(r=>!r.parentId).map(one).join('');
  const orphans=list.filter(r=>r.parentId&&!list.some(x=>x.id===r.parentId)).map(one).join('');
  return '<div class="gb-thread"><div class="ttl"><span>盖楼回复</span>'+
    '<span class="hint">'+list.length+' 条 · 点楼层可再回一层</span></div>'+
    (roots||orphans)+'</div>';
}

/* ══ 全场 NPC 打雪仗系统（超过一半 NPC 自动结对互丢雪球，被砸中蹦跳欢呼） ══ */
const npcSnowballs=[];
const npcSbGeo=new THREE.SphereGeometry(.11,8,6);
const npcSbMat=new THREE.MeshBasicMaterial({color:0xf4f9ff});
for(let i=0;i<npcs.length;i++){
  if(i%4===0){ // 25% 室外 NPC 参与打雪仗（平衡气氛与 CPU/粒子开销）
    npcs[i].snowFight=true;
    npcs[i].throwCd=R(.8,3.6);
  }
}
function updateSnowballFight(dt){
  for(let i=0;i<npcs.length;i++){
    const n=npcs[i];
    if(!n.snowFight)continue;
    n.throwCd-=dt;
    if(n.throwCd<=0){
      n.throwCd=R(2.2,4.2);
      if(npcSnowballs.length>=10)continue;
      // 找附近 16m 内的其他室外 NPC 作为目标
      let tgt=null,bestD=16;
      const nx=n.p.position.x,nz=n.p.position.z;
      for(let j=0;j<npcs.length;j++){
        if(j===i||npcs[j].indoor)continue;
        const d=Math.hypot(npcs[j].p.position.x-nx,npcs[j].p.position.z-nz);
        if(d>2.2&&d<bestD){bestD=d;tgt=npcs[j];}
      }
      if(!tgt||n.indoor)continue;
      const tx=tgt.p.position.x,tz=tgt.p.position.z;
      n.p.rotation.y=Math.atan2(tx-nx,tz-nz);
      const flightT=Math.max(.35,bestD/12.5);
      const vx=(tx-nx)/flightT, vz=(tz-nz)/flightT;
      const vy=(tgt.baseY+.8-(n.baseY+.95))/flightT+0.5*9.8*flightT;
      const sb=new THREE.Mesh(npcSbGeo,npcSbMat);
      sb.position.set(nx,n.baseY+.95,nz);
      scene.add(sb);
      npcSnowballs.push({m:sb,vx,vy,vz,life:flightT+.35,owner:n});
    }
  }
  for(let i=npcSnowballs.length-1;i>=0;i--){
    const b=npcSnowballs[i];
    b.life-=dt;b.vy-=9.8*dt;
    b.m.position.x+=b.vx*dt;b.m.position.y+=b.vy*dt;b.m.position.z+=b.vz*dt;
    let hit=false;
    for(const n of npcs){
      if(n===b.owner||n.indoor)continue;
      const dx=b.m.position.x-n.p.position.x,dy=b.m.position.y-(n.baseY+.7),dz=b.m.position.z-n.p.position.z;
      if(dx*dx+dy*dy+dz*dz<.52){
        hit=true;n.vy=2.5;n.squash=-.20;n.happyT=.9;
        for(let k=0;k<5;k++){const a=k*1.25;spawnSnowPuff(n.p.position.x,n.baseY+.75,n.p.position.z,Math.cos(a)*1.3,R(.8,1.8),Math.sin(a)*1.3,.85,.45);}
        break;
      }
    }
    if(hit||b.m.position.y<=.05||b.life<=0){
      if(!hit&&b.m.position.y<=.05){
        for(let k=0;k<3;k++){const a=k*2.1;spawnSnowPuff(b.m.position.x,.08,b.m.position.z,Math.cos(a)*.9,R(.5,1.1),Math.sin(a)*.9,.65,.35);}
      }
      scene.remove(b.m);npcSnowballs.splice(i,1);
    }
  }
}

function stopFacilityRide(){
  if(wheelSys.cab&&wheelSys.cab.userData.rods)wheelSys.cab.userData.rods.forEach(r=>r.visible=true);
  if(wheelSys.kind==='coaster'){camera.up.set(0,1,0);applyDpr(HI_DPR);}
  if(wheelSys.kind==='bumper'&&wheelSys.bump){
    const c=wheelSys.bump.car,st=c.userData.st;
    if(c.userData.driver)c.userData.driver.visible=true;      // 小熊驾驶员回到车上
    st.driven=false;
    /* 把车的当前位置换算回椭圆轨道相位，接回自动环绕时不会瞬移 */
    const nx=st.rx?c.position.x/st.rx:0,nz=st.rz?c.position.z/st.rz:0;
    st.ang=Math.atan2(nz,nx);
    st.spd=st.spd0||st.spd||.52;
    st.kx=0;st.kz=0;
  }
  wheelSys.bump=null;
  if(window.MP)MP.popFirstPerson();
  const ex=RIDE_EXITS[wheelSys.kind]||[4,24];
  wheelSys.riding=false;wheelSys.cab=null;wheelSys.kind=null;wheelSys.car=null;
  fp.x=ex[0];fp.z=ex[1];fp.y=0;fp.vx=fp.vz=0;
  sfx.blip(520,.1,.06);

function toggleRideFacility(info){

  wheelSys.riding=true;

    /* 坐上碰碰车 = 玩家接管：车上那只小熊驾驶员先收起来，换成玩家自己开。 */
    const c=info.car;

/* ══ 圣诞高空弹射跳伞（弹射冲上 42m+ 高空，自动开伞滑翔，WASD 全程可控降落方向） ══ */
const launchSys={active:false,stage:'idle',timer:0,x:27.5,y:1.5,z:52.5,vx:0,vy:0,vz:0,openK:0};
const chuteGrp=(()=>{
  const g=new THREE.Group();g.visible=false;scene.add(g);
  const redC=M(0xd62828,{roughness:.55,side:THREE.DoubleSide});
  const whiteC=M(0xfafcff,{roughness:.65,side:THREE.DoubleSide});
  const cordM=M(0xe6edf5,{roughness:.8});
  // 8 瓣红白相间大型圣诞降落伞伞盖
  for(let i=0;i<8;i++){
    const a0=(i/8)*Math.PI*2, aLen=(1/8)*Math.PI*2;
    const seg=new THREE.SphereGeometry(2.3,6,8,a0,aLen,.05,Math.PI*.42);
    g.add(new THREE.Mesh(seg,i%2===0?redC:whiteC));
  }
  // 8 根伞绳连接到下方吊带
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2;
    const cx=Math.cos(a)*1.95, cz=Math.sin(a)*1.95;
    const cord=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,2.8,5),cordM);
    cord.position.set(cx*.52,-1.1,cz*.52);
    cord.rotation.z=Math.atan2(cx,2.4);
    cord.rotation.x=-Math.atan2(cz,2.4);
    g.add(cord);
  }
  return g;
})();

function startLaunchRide(){
  if(launchSys.active)return;
  if(trainSys.riding)trainSys.riding=false;
  if(wheelSys.riding)stopFacilityRide();
  if(!fp.on)fpEnter(true);
  launchSys.active=true;
  if(window.MP)MP.pushFirstPerson();
  launchSys.stage='charge';
  launchSys.timer=0.65;
  launchSys.x=27.5;launchSys.y=1.4;launchSys.z=53.0;
  launchSys.vx=0;launchSys.vy=0;launchSys.vz=0;
  launchSys.openK=0;
  chuteGrp.visible=false;
  fp.x=launchSys.x;fp.y=launchSys.y;fp.z=launchSys.z;
  /* 默认视角反转朝向北侧 (-z) 动漫园区与游乐园全景（前向 = (-sin yaw, -cos yaw) = (0, -1)） */
  fp.yaw=0;fp.pitch=-.15;
  sfx.blip(660,.15,.08);
}
function stopLaunchRide(){
  if(!launchSys.active)return;
  launchSys.active=false;launchSys.stage='idle';
  if(window.MP)MP.popFirstPerson();
  chuteGrp.visible=false;
  fp.x=Math.max(-72,Math.min(72,launchSys.x));
  fp.z=Math.max(-38,Math.min(68,launchSys.z));
  fp.y=Math.max(0,groundY(fp.x,fp.z));
  fp.vx=0;fp.vz=0;
  hudHide();
}
function updateLaunchRide(dt){
  if(!launchSys.active)return;
  if(!fp.on){stopLaunchRide();return;}
  if(launchSys.stage==='charge'){
    launchSys.timer-=dt;
    const shk=Math.sin(t*55)*.035;
    camera.position.set(launchSys.x+shk,launchSys.y+FP_EYE+shk*.5,launchSys.z);
    camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
    hudShow('蓄力准备弹射升空…（'+Math.max(0,launchSys.timer).toFixed(1)+'s）','取消',stopLaunchRide);
    if(launchSys.timer<=0){
      launchSys.stage='launch';
      launchSys.vy=32.5; // 直冲 ~51m 高空，稳稳高于 21.5~25m 巡逻直升机
      sfx.blip(1046,.22,.11);
    }
    return;
  }
  if(launchSys.stage==='launch'){
    launchSys.vy-=10.4*dt;
    launchSys.y+=launchSys.vy*dt;
    /* 冲上去的时候也能瞄方向（手机推摇杆 / 键盘 WASD），
       否则只能眼睁睁看着自己被弹到没风的地方再飘回来 */
    {
      let lf=0,ls=0;
      if(fp.keys['KeyW']||fp.keys['ArrowUp'])lf+=1;
      if(fp.keys['KeyS']||fp.keys['ArrowDown'])lf-=1;
      if(fp.keys['KeyA']||fp.keys['ArrowLeft'])ls-=1;
      if(fp.keys['KeyD']||fp.keys['ArrowRight'])ls+=1;
      if(joy.mag>0.02){lf+=-joy.dy*1.2;ls+=joy.dx*1.2;}
      const ltx=-Math.sin(fp.yaw)*lf+Math.cos(fp.yaw)*ls;
      const ltz=-Math.cos(fp.yaw)*lf-Math.sin(fp.yaw)*ls;
      const lLen=Math.hypot(ltx,ltz);
      const tgtVx=lLen>0.01?(ltx/lLen)*7:0;
      const tgtVz=lLen>0.01?(ltz/lLen)*7:0;
      launchSys.vx+=(tgtVx-launchSys.vx)*Math.min(1,dt*2.2);
      launchSys.vz+=(tgtVz-launchSys.vz)*Math.min(1,dt*2.2);
      launchSys.x=Math.max(-72,Math.min(72,launchSys.x+launchSys.vx*dt));
      launchSys.z=Math.max(-38,Math.min(68,launchSys.z+launchSys.vz*dt));
    }
    camera.position.set(launchSys.x,launchSys.y+FP_EYE,launchSys.z);
    camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');
    hudShow('','直接落地',stopLaunchRide,true);
    if(launchSys.vy<=0.5){
      launchSys.stage='chute';
      launchSys.vy=-1.2;
      chuteGrp.visible=true;
      sfx.blip(880,.18,.09);
    }
    return;
  }
  // 降落伞可控滑翔降落阶段
  let f=0,s=0;
  if(fp.keys['KeyW']||fp.keys['ArrowUp'])f+=1;
  if(fp.keys['KeyS']||fp.keys['ArrowDown'])f-=1;
  if(fp.keys['KeyA']||fp.keys['ArrowLeft'])s-=1;
  if(fp.keys['KeyD']||fp.keys['ArrowRight'])s+=1;
  /* 手机：左边摇杆推方向（原来只读键盘，触屏上根本控不了方向） */
  if(joy.mag>0.02){f+=-joy.dy*1.25;s+=joy.dx*1.35;}
  const sinY=Math.sin(fp.yaw), cosY=Math.cos(fp.yaw);
  const fwdX=-sinY, fwdZ=-cosY, rgtX=cosY, rgtZ=-sinY;
  const maxGlide=(fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?18.5:13.5;
  let tx=fwdX*f+rgtX*s, tz=fwdZ*f+rgtZ*s;
  const tLen=Math.hypot(tx,tz);
  if(tLen>0.01){tx=tx/tLen*maxGlide;tz=tz/tLen*maxGlide;}
  launchSys.vx+=(tx-launchSys.vx)*Math.min(1,dt*3.8);
  launchSys.vz+=(tz-launchSys.vz)*Math.min(1,dt*3.8);
  const tgtVy=(fp.keys['ShiftLeft']||fp.keys['ShiftRight'])?-5.6:-3.4;
  launchSys.vy+=(tgtVy-launchSys.vy)*Math.min(1,dt*4.5);

  launchSys.x=Math.max(-72,Math.min(72,launchSys.x+launchSys.vx*dt));
  launchSys.z=Math.max(-38,Math.min(68,launchSys.z+launchSys.vz*dt));
  launchSys.y+=launchSys.vy*dt;

  // 降落伞展开与随滑翔方向轻柔倾转
  launchSys.openK=Math.min(1,launchSys.openK+dt*2.8);
  const easeK=1-Math.pow(1-launchSys.openK,3);
  chuteGrp.scale.set(easeK,0.4+0.6*easeK,easeK);
  chuteGrp.position.set(launchSys.x,launchSys.y+FP_EYE+2.65,launchSys.z);
  chuteGrp.rotation.y=fp.yaw;
  chuteGrp.rotation.x=-launchSys.vz*.014;
  chuteGrp.rotation.z=launchSys.vx*.014;

  fp.x=launchSys.x;fp.y=launchSys.y;fp.z=launchSys.z;
  camera.position.set(launchSys.x,launchSys.y+FP_EYE,launchSys.z);
  camera.rotation.set(fp.pitch,fp.yaw,0,'YXZ');

  hudShow('','收伞落地',stopLaunchRide,true);

  const floorY=groundY(launchSys.x,launchSys.z);
  if(launchSys.y<=floorY+0.05){
    stopLaunchRide();
    sfx.blip(520,.1,.06);
  }
}

    sfx.blip(520,.10,.05);
  }
}

function updateFpvDrone(dt){
  const s=fpvSys;
  // W/S 或 Shift 控制穿越机油门推力，A/D 控制手动副翼横滚
  const shiftBoost=!!(fp.keys['ShiftLeft']||fp.keys['ShiftRight']||s.boost);
  let throttle=shiftBoost?1.48:1.0;
  if(fp.keys['KeyW']||fp.keys['ArrowUp'])throttle*=1.28;
  if(fp.keys['KeyS']||fp.keys['ArrowDown'])throttle*=0.65;

  // 先取当前高度计算重力俯冲加成（下坡更快、爬坡略收，更具真实穿越机动力感）
  s.curve.getPointAt(s.u,s.p);
  s.curve.getTangentAt(s.u,s.t1);
  const diveBoost=clamp(1.0-s.t1.y*0.32,0.75,1.42);
  const prevU=s.u;
  s.u=(s.u+s.baseSpd*throttle*diveBoost*dt)%1;

  // 检查是否经过自动特技桶滚触发点
  for(let i=0;i<s.AUTO_TRICKS.length;i++){
    const tk=s.AUTO_TRICKS[i];
    if(prevU<tk.u&&s.u>=tk.u&&Math.abs(s.rollVel)<0.1){
      triggerFpvBarrelRoll(tk.dir,tk.name);
    }
  }

  // 长跨度前瞻切线采样 (du=0.018) 解算稳定大弯道离心压弯角，消除短距离拐点抖动
  const du=0.018;
  s.curve.getPointAt(s.u,s.p);
  s.curve.getPointAt((s.u+0.012)%1,s.pLook); // 真实飞手前瞻视线点（提前盯住门洞与弯心）
  s.curve.getTangentAt((s.u-du+1)%1,s.t0);
  s.curve.getTangentAt(s.u,s.t1);
  s.curve.getTangentAt((s.u+du)%1,s.t2);
  const turnRate=(s.t0.z*s.t2.x-s.t0.x*s.t2.z)*18.0;
  const tgtBank=clamp(turnRate,-0.95,0.95); // 稳定顺滑的电影级压弯侧倾（最高 ~54°）
  s.bank+=(tgtBank-s.bank)*Math.min(1,dt*4.2);

  // 手动 A/D 横滚叠加
  let mRollInput=0;
  if(fp.keys['KeyA']||fp.keys['ArrowLeft'])mRollInput-=1;
  if(fp.keys['KeyD']||fp.keys['ArrowRight'])mRollInput+=1;
  if(joy.mag>0.05)mRollInput+=joy.dx;
  s.manualRoll+=(mRollInput*0.85-s.manualRoll)*Math.min(1,dt*7);

  // 360° 极速桶滚角积分
  if(Math.abs(s.rollVel)>0.01){
    const step=s.rollVel*dt*1.55;
    s.rollExtra+=step;
    if(Math.abs(s.rollExtra)>=Math.PI*2){
      s.rollExtra=0;s.rollVel=0;
    }
  }
  if(s.trickBannerT>0){
    s.trickBannerT-=dt;
    if(s.trickBannerT<=0){
      const trEl=document.getElementById('fpv-trick');
      if(trEl)trEl.textContent='🚁 FPV 穿越机特技巡航';
    }
  }

  // 动态广角 FOV（随空速与特技桶滚自动在 78°~90° 间呼吸伸缩）
  const tgtFov=78+(throttle*diveBoost-1)*14+(Math.abs(s.rollVel)>0.1?6:0);
  s.fov+=(clamp(tgtFov,75,92)-s.fov)*Math.min(1,dt*5);
  if(Math.abs(camera.fov-s.fov)>0.08){
    camera.fov=s.fov;
    camera.updateProjectionMatrix();
  }

  // 无万向锁 6-DOF 相机姿态：围绕前瞻视线方向 lookDir 旋转 (稳定压弯角 + 手动横滚 + 360° 桶滚)
  s.lookDir.subVectors(s.pLook,s.p).normalize();
  const totalRoll=s.bank+s.manualRoll+s.rollExtra;
  s.up.set(0,1,0);
  s.right.crossVectors(s.lookDir,s.up);
  if(s.right.lengthSq()<1e-5)s.right.set(1,0,0);else s.right.normalize();
  s.up.crossVectors(s.right,s.lookDir).normalize();
  s.up.applyAxisAngle(s.lookDir,totalRoll);

  camera.position.copy(s.p);
  camera.up.copy(s.up);
  camera.lookAt(s.pLook);

  // 更新 FPV OSD 眼镜遥测数据与人工地平线
  if((_reflTick&1)===0){
    const kmh=Math.round(74*throttle*diveBoost);
    const rollDeg=Math.round((totalRoll*180/Math.PI)%360);
    const pitchDeg=Math.round(Math.asin(clamp(s.t1.y,-1,1))*180/Math.PI);
    const spdEl=document.getElementById('fpv-spd');
    const altEl=document.getElementById('fpv-alt');
    const attEl=document.getElementById('fpv-att');
    const stgEl=document.getElementById('fpv-stage');
    const hbar=document.getElementById('fpv-hbar');
    if(spdEl)spdEl.textContent='SPD '+kmh+' KM/H'+(shiftBoost?' [BOOST]':'');
    if(altEl)altEl.textContent='ALT '+s.p.y.toFixed(1)+' M';
    if(attEl)attEl.textContent='ROLL '+(rollDeg>=0?'+':'')+rollDeg+'° · PITCH '+(pitchDeg>=0?'+':'')+pitchDeg+'°';
    if(hbar)hbar.style.transform='rotate('+(-totalRoll*180/Math.PI).toFixed(1)+'deg) translateY('+(pitchDeg*0.45).toFixed(1)+'px)';
    if(stgEl){
      let curStage=s.STAGES[0][1];
      for(let i=0;i<s.STAGES.length;i++){
        if(s.u>=s.STAGES[i][0])curStage=s.STAGES[i][1];
      }
      stgEl.textContent=curStage;
    }
  }
}
