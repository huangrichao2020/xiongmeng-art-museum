<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>江南百景图 · 古村</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
  :root{
    --han:"Songti SC","STSong","Noto Serif SC",serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
    --accent:#d9b463;          /* 暖金 */
    --accent-warm:#c96a4a;     /* 朱 */
    --muted:#a9b6c2;
    --line:rgba(255,255,255,.13);
    --line-strong:rgba(255,255,255,.28);
    --glass:rgba(9,16,24,.82);
    --glass-soft:rgba(9,16,24,.66);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1116;
    font-family:var(--han);color:#e6edf3}
  canvas{display:block;touch-action:none}
  #app{position:fixed;inset:0}

  /* ── 左上：窄边栏（默认收成 ≡ + 时辰牌，点开才有内容）── */
  #rail{
    position:fixed;left:12px;top:14px;z-index:29;
    display:flex;flex-direction:column;gap:7px;align-items:flex-start;
    user-select:none;max-width:calc(100vw - 24px);
  }
  #railToggle{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
    background:var(--glass);color:var(--muted);font-family:var(--mono);font-size:15px;line-height:1;
    cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  #railToggle:hover{color:var(--accent);border-color:var(--line-strong)}
  #jnClock{
    display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.10em;
    color:var(--muted);padding:5px 9px;background:var(--glass-soft);border:1px solid var(--line);
    border-radius:2px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #jnClock:hover{color:var(--accent);border-color:var(--line-strong)}
  #jnClock b{color:var(--accent);font-weight:600}
  #railBody{
    display:flex;flex-direction:column;gap:8px;align-items:flex-start;
    transition:opacity .22s,transform .22s;
  }
  body.rail-min #railBody{opacity:0;pointer-events:none;transform:translateX(-160px)}
  #railName{font-size:15px;letter-spacing:.12em;color:#e8eef4;padding:5px 10px;
    background:var(--glass-soft);border:1px solid var(--line);border-radius:2px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
  #railName small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
    color:var(--muted);margin-top:2px}
  #rail .seasons{display:grid;grid-template-columns:repeat(4,40px);gap:5px}
  #rail .seasons button{
    height:28px;border-radius:2px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--muted);cursor:pointer;font-family:var(--han);font-size:12px;letter-spacing:.08em;
  }
  #rail .seasons button.on{color:#101820;background:var(--accent);border-color:var(--accent);font-weight:600}
  #rail #jnHour{width:172px;accent-color:var(--accent)}
  #rail .toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;width:172px}
  #rail .toggles button{
    height:29px;border-radius:2px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--muted);cursor:pointer;font-family:var(--han);font-size:12px;letter-spacing:.06em;
  }
  #rail .toggles button:hover{color:#e8eef4;border-color:var(--line-strong)}
  #rail .toggles button.on{color:#101820;background:var(--accent);border-color:var(--accent);font-weight:600}
  #rail .seedrow{display:flex;gap:6px;width:172px}
  #rail .seedrow input{
    flex:1;min-width:0;height:29px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    border-radius:2px;padding:0 8px;font-family:var(--mono);font-size:11px;color:#e6edf3;
  }
  #rail .seedrow button{
    height:29px;padding:0 10px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    border-radius:2px;color:var(--muted);font-family:var(--han);font-size:12px;cursor:pointer;
  }
  #rail .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px 3px;width:172px;
    padding:9px 8px;border:1px solid var(--line);border-radius:2px;background:var(--glass-soft);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #rail .stats div{text-align:center}
  #rail .stats b{display:block;font-size:15px;font-weight:600;color:#e8eef4}
  #rail .stats span{font-size:9.5px;color:var(--muted);letter-spacing:.1em}

  /* ── 右下：视角圆钮组（拇指区，最常用的操作放这儿）── */
  #viewbar{
    position:fixed;right:14px;bottom:22px;z-index:29;
    display:grid;grid-template-columns:repeat(2,52px);gap:8px;
  }
  #viewbar button{
    width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
    background:var(--glass);color:var(--muted);font-family:var(--han);font-size:13px;letter-spacing:.04em;
    cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  #viewbar button:hover{color:var(--accent);border-color:var(--line-strong)}
  #viewbar button.on{color:#101820;background:var(--accent);border-color:var(--accent);font-weight:600}
  body.immersive #viewbar{display:none}

  /* ── 底部提示条 ── */
  #hintbar{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:28;
    padding:8px 18px;border-radius:2px;background:var(--glass-soft);
    border:1px solid var(--line);color:#cfdae4;font-size:12px;letter-spacing:.10em;
    white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  #hintbar b{color:var(--accent);font-weight:600}

  /* ── 沉浸模式的手机控件 ── */
  #joystick{position:fixed;left:14px;bottom:20px;z-index:29;display:none;width:130px;height:130px;
    border-radius:50%;border:1.5px solid rgba(160,210,240,.3);
    background:radial-gradient(circle,rgba(12,22,32,.42) 40%,rgba(12,22,32,.16) 100%);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
  #stick{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
    background:rgba(190,225,245,.34);border:1.5px solid rgba(210,240,255,.55);pointer-events:none}
  body.immersive #joystick{display:block}
  #walk-tip{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:29;display:none;
    padding:8px 16px;border-radius:2px;background:var(--glass);color:#d6ecf8;
    font-size:12px;letter-spacing:.1em;pointer-events:none;white-space:nowrap}
  #walk-tip.on{display:block}
  #walkbar{position:fixed;right:16px;bottom:20px;z-index:29;display:none;gap:8px}
  body.immersive #walkbar{display:flex}
  #walkbar button{width:64px;height:64px;border-radius:50%;border:1.5px solid rgba(160,210,240,.4);
    background:rgba(14,24,34,.62);color:#d6ecf8;font-family:var(--han);font-size:12px;letter-spacing:.06em;cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  body.immersive #hintbar{display:none}

  #loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0d1116;
    color:#e8dcc2;font-size:13px;letter-spacing:.3em;transition:opacity .5s}
  #loading.gone{opacity:0;pointer-events:none}

  @media (max-width:720px){
    /* 手机优先：左上收成一条，右下圆钮缩一档，都不挡村子 */
    #rail{left:10px;top:12px}

    #rail #jnHour,#rail .toggles,#rail .seedrow,#rail .stats{width:178px}
    #rail .toggles button{font-size:12px;padding:7px 4px;letter-spacing:.04em;white-space:nowrap}
    #rail .seasons{grid-template-columns:repeat(4,40px);gap:5px}
    #rail .seasons button{font-size:13px;padding:6px 0}
    #viewbar{right:10px;bottom:16px;grid-template-columns:repeat(2,46px);gap:7px}
    #viewbar button{width:46px;height:46px;font-size:12px}
    #hintbar{font-size:10.5px;bottom:10px;padding:6px 12px}
  }
  @media (max-width:720px) and (orientation:landscape){
    #rail{top:10px}
    #viewbar{grid-template-columns:repeat(4,40px);bottom:12px}
    #viewbar button{width:40px;height:40px;font-size:11px}
  }
</style>
</head>
<body class="rail-min">
<div id="app"></div>

<aside id="rail">
  <button id="railToggle" title="展开 / 收起">≡</button>
  <button id="jnClock" title="时段 / 天色"><b>12:00</b> 昼</button>
  <div id="railBody">
    <div id="railName">竹海茶山<small>JIANGNAN VILLAGE</small></div>
    <div class="seasons" id="jnHours">
      <button data-hour="6.4">晨</button>
      <button data-hour="12">昼</button>
      <button data-hour="17.7">昏</button>
      <button data-hour="21">夜</button>
    </div>
    <input id="jnHour" type="range" min="0" max="24" step="0.1" value="12">
    <div class="toggles">
      <button id="btn-q">画质 高</button>
      <button id="btn-new">换图景</button>
      <button id="btn-stats">村志</button>
      <button id="btn-reset">回机位</button>
    </div>
    <div class="seedrow">
      <input id="seed" inputmode="numeric" placeholder="种子">
      <button id="btn-seed">载入</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</aside>

<div id="viewbar">
  <button data-mode="over">俯瞰</button>
  <button data-mode="close">近观</button>
  <button data-mode="orbit">环绕</button>
  <button data-mode="walk">沉浸</button>
</div>

<div id="hintbar">载入图景 · 清点完成 · <b>右下角</b> 切视角 · <b>左上 ≡</b> 换图景 · 拖动旋转 · 滚轮缩放</div>

<div id="joystick"><i id="stick"></i></div>
<div id="walk-tip"></div>
<div id="walkbar"><button id="wb-back">沙盘</button></div>

<div id="loading">正在铺展图卷…</div>

<script type="importmap">
{"imports":{"three":"./three.module.js","three/addons/":"./addons/"}}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
